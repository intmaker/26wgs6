<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>순서 맞추기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2e1065, #7c3aed, #f472b6);
      color: white;
      font-family: Arial, sans-serif;
    }
    .game {
      width: min(92vw, 700px);
      background: rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.22);
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); }
    .badge { background: rgba(255,255,255,0.12); padding: 8px 12px; border-radius: 999px; font-weight: 800; }
    .sequence { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 18px; }
    .chip {
      width: 90px; height: 90px;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 900;
      background: rgba(255,255,255,0.15);
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
    }
    .message {
      text-align: center;
      margin-top: 18px;
      min-height: 28px;
      font-weight: 700;
    }
    .goal { text-align: center; font-size: 1.1rem; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="game">
    <div class="top">
      <h1>🔢 순서 맞추기</h1>
      <div class="badge">점수: <span id="score">0</span></div>
    </div>
    <div class="goal" id="goal">1 → 2 → 3 → 4</div>
    <div class="sequence" id="sequence"></div>
    <div class="message" id="message">숫자를 순서대로 눌러보세요!</div>
  </div>

  <script>
    const sequenceEl = document.getElementById('sequence');
    const goalEl = document.getElementById('goal');
    const scoreEl = document.getElementById('score');
    const messageEl = document.getElementById('message');

    let target = [1,2,3,4];
    let answer = [];
    let score = 0;

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function renderSequence() {
      const arr = shuffle(target);
      answer = [];
      sequenceEl.innerHTML = '';
      arr.forEach((num) => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = num;
        chip.addEventListener('click', () => {
          answer.push(num);
          if (answer[answer.length - 1] !== target[answer.length - 1]) {
            score = Math.max(0, score - 1);
            answer = [];
            messageEl.textContent = '다시 시작! 순서를 다시 맞춰보세요.';
          } else if (answer.length === target.length) {
            score += 1;
            messageEl.textContent = '정답! 다음 단계로!';
            const nextLength = Math.min(9, target.length + 1);
            target = Array.from({ length: nextLength }, (_, i) => i + 1);
            goalEl.textContent = target.join(' → ');
            renderSequence();
          } else {
            messageEl.textContent = `좋아요! ${answer.length}개 맞았어요.`;
          }
          scoreEl.textContent = score;
        });
        sequenceEl.appendChild(chip);
      });
    }

    goalEl.textContent = target.join(' → ');
    renderSequence();
    scoreEl.textContent = score;
  </script>
</body>
</html>
