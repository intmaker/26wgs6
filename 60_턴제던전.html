<body>

<main class="app">

    <div class="stat"><small>골드</small><b id="gold">0</b></div>
    <div class="stat"><small>열쇠</small><b id="key">❌</b></div>

</header>

<section class="stage" id="stage">

<div class="dungeon">

  <div class="floorTitle" id="floorTitle">지하 1층</div>

  <div class="dungeon-grid" id="dungeonGrid"></div>

  <div class="dungeon-pad">
    <button class="up" data-d="U">▲</button>
    <button class="left" data-d="L">◀</button>
    <button class="down" data-d="D">▼</button>
    <button class="right" data-d="R">▶</button>
    <button id="potionBtn">🧪 회복<br><span id="potionCount">1</span></button>
    <button id="spellBtn">✨ 마법<br><span id="manaCount">2</span></button>

    <p id="resultText">
      한 칸 움직이면 몬스터도 한 턴 행동합니다.<br><br>
      🗝️ 열쇠를 찾아 출구를 열고<br>
      👾 몬스터를 쓰러뜨려 경험치를 얻으세요.<br>
      🎁 보물상자와 함정을 조심하며 5층 보스를 물리치세요.
    </p>

    </div>
  </div>
</div>

</section>

<div class="tip">
이동도 1턴 · 공격도 1턴 · 🧪 회복 · ✨ 범위마법 · 5층 보스 처치
</div>

</main>

<script>
const $=s=>document.querySelector(s);

const stage=$('#stage');
const overlay=$('#overlay');
const startBtn=$('#startBtn');

const gridEl=$('#dungeonGrid');
const msg=$('#dungeonMsg');
const toast=$('#toast');

const N=8;

const dirs={
  U:[0,-1],
  D:[0,1],
  L:[-1,0],
  R:[1,0]
};

const idx=(x,y)=>y*N+x;

let floor=1;
let player;
let walls;
let enemies=[];
let keyPos;
let exitPos;
let potionPos;
let chestPos;
let trapSet;

let hasKey=false;

let hp=10;
let maxHp=10;

let potions=1;
let mana=2;

let level=1;
let exp=0;
let gold=0;

let playing=false;
let difficulty=1;

const difficultyNames=['쉬움','보통','어려움'];

function showToast(text){
  toast.textContent=text;
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');

  clearTimeout(showToast.timer);

  showToast.timer=setTimeout(()=>{
    toast.classList.remove('show');
  },650);
}

function shake(){
  stage.classList.remove('shake');
  void stage.offsetWidth;
  stage.classList.add('shake');
}

function reachable(start,target,set){
  const q=[start];
  const seen=new Set([idx(...start)]);

  while(q.length){
    const [x,y]=q.shift();

    if(x===target[0]&&y===target[1]){
      return true;
    }

    for(const [dx,dy] of Object.values(dirs)){
      const nx=x+dx;
      const ny=y+dy;
      const k=idx(nx,ny);

      if(
        nx>=0&&nx<N&&
        ny>=0&&ny<N&&
        !set.has(k)&&
        !seen.has(k)
      ){
        seen.add(k);
        q.push([nx,ny]);
      }
    }
  }

  return false;
}

function randomFreeCell(){
  for(let guard=0;guard<500;guard++){
    const x=Math.floor(Math.random()*N);
    const y=Math.floor(Math.random()*N);
    const k=idx(x,y);

    if(walls.has(k))continue;
    if(x===player.x&&y===player.y)continue;
    if(keyPos&&x===keyPos[0]&&y===keyPos[1])continue;
    if(exitPos&&x===exitPos[0]&&y===exitPos[1])continue;
    if(enemies.some(e=>e.x===x&&e.y===y))continue;

    return [x,y];
  }

  return [3,3];
}

function generate(){

  for(let tries=0;tries<300;tries++){

    player={x:0,y:N-1};

    exitPos=[N-1,0];

    keyPos=[
      Math.floor(Math.random()*(N-2))+1,
      Math.floor(Math.random()*(N-3))+2
    ];

    walls=new Set();

    const wallCount=
      Math.min(18,8+floor*2);

    while(walls.size<wallCount){
      walls.add(
        Math.floor(Math.random()*N*N)
      );
    }

    [
      idx(player.x,player.y),
      idx(...keyPos),
      idx(...exitPos)
    ].forEach(k=>walls.delete(k));

    if(
      reachable([player.x,player.y],keyPos,walls)&&
      reachable(keyPos,exitPos,walls)
    ){
      break;
    }
  }

  enemies=[];

  const enemyCount=
    floor===5
      ?3
      :Math.min(7,2+floor);

  for(let i=0;i<enemyCount;i++){

    const pos=randomFreeCell();

    const boss=
      floor===5&&i===0;

    enemies.push({
      x:pos[0],
      y:pos[1],
      hp:boss?9+level:2+Math.floor(floor/2),
      maxHp:boss?9+level:2+Math.floor(floor/2),
      atk:boss?2:1,
      boss
    });
  }

  potionPos=randomFreeCell();
  chestPos=randomFreeCell();

  trapSet=new Set();

  const traps=
    Math.max(1,floor-1);

  while(trapSet.size<traps){
    const [x,y]=randomFreeCell();
    trapSet.add(idx(x,y));
  }
}

function startGame(){
  floor=1;

  maxHp=
    difficulty===0?12:
    difficulty===1?10:8;

  hp=maxHp;

  potions=
    difficulty===0?2:1;

  mana=
    difficulty===2?1:2;

  level=1;
  exp=0;
  gold=0;
  hasKey=false;

  playing=true;

  generate();

  overlay.classList.add('hide');

  msg.textContent=
    '🗝️ 열쇠를 찾은 뒤 오른쪽 위 출구로 이동하세요.';

  updateHud();
  render();
}

function updateHud(){
  $('#floor').textContent=floor;
  $('#hp').textContent=`${hp}/${maxHp}`;
  $('#lv').textContent=level;
  $('#exp').textContent=exp;
  $('#gold').textContent=gold;
  $('#key').textContent=hasKey?'✅':'❌';

  $('#potionCount').textContent=potions;
  $('#manaCount').textContent=mana;

  $('#floorTitle').textContent=
    floor===5
      ?'🔥 지하 5층 · 보스의 방'
      :`지하 ${floor}층`;
}

function render(){
  gridEl.innerHTML='';

  for(let y=0;y<N;y++){
    for(let x=0;x<N;x++){

      const c=document.createElement('div');
      const k=idx(x,y);

      const enemy=
        enemies.find(
          e=>e.x===x&&e.y===y
        );

      c.className='dcell';

      if(walls.has(k)){
        c.classList.add('wall');
      }

      if(trapSet.has(k)){
        c.classList.add('trap');
      }

      if(
        exitPos[0]===x &&
        exitPos[1]===y
      ){
        c.classList.add('exit');
      }

      if(
        player.x===x &&
        player.y===y
      ){
        c.classList.add('player');
      }

      if(walls.has(k)){
        c.textContent='';
      }
      else if(player.x===x&&player.y===y){
        c.textContent='🧙';
      }
      else if(enemy){
        c.textContent=
          enemy.boss?'👹':'👾';

        const hpbar=
          document.createElement('span');

        hpbar.className='enemyHp';

        hpbar.innerHTML=
          `<i style="width:${enemy.hp/enemy.maxHp*100}%"></i>`;

        c.appendChild(hpbar);
      }
      else if(
        !hasKey &&
        keyPos[0]===x &&
        keyPos[1]===y
      ){
        c.textContent='🗝️';
      }
      else if(
        exitPos[0]===x &&
        exitPos[1]===y
      ){
        c.textContent='🌀';
      }
      else if(
        potionPos &&
        potionPos[0]===x &&
        potionPos[1]===y
      ){
        c.textContent='🧪';
      }
      else if(
        chestPos &&
        chestPos[0]===x &&
        chestPos[1]===y
      ){
        c.textContent='🎁';
      }
      else if(trapSet.has(k)){
        c.textContent='⚠️';
      }

      gridEl.appendChild(c);
    }
  }
}

function gainExp(amount){
  exp+=amount;

  const need=
    level*4;

  if(exp>=need){
    exp-=need;
    level++;

    maxHp+=2;
    hp=Math.min(maxHp,hp+3);

    mana++;

    showToast(`⬆️ LEVEL ${level}!`);

    msg.textContent=
      `레벨 업! 최대 체력 증가 · 마법 +1`;
  }
}

function attackEnemy(e){

  const damage=
    1+
    Math.floor((level-1)/2);

  e.hp-=damage;

  msg.textContent=
    `⚔️ 마법 공격! ${damage} 피해`;

  if(e.hp<=0){

    const expGain=
      e.boss?6:2;

    const goldGain=
      e.boss?50:10+Math.floor(Math.random()*10);

    gold+=goldGain;

    enemies=
      enemies.filter(x=>x!==e);

    gainExp(expGain);

    showToast(
      e.boss
        ?'👹 보스 격파!'
        :`👾 처치 +${goldGain}G`
    );

    if(e.boss){
      hasKey=true;
      msg.textContent=
        '👑 보스를 쓰러뜨렸습니다! 출구가 열렸습니다.';
    }
  }
}

function move(d){
  if(!playing)return;

  const [dx,dy]=dirs[d];

  const nx=player.x+dx;
  const ny=player.y+dy;

  if(
    nx<0||nx>=N||
    ny<0||ny>=N||
    walls.has(idx(nx,ny))
  ){
    return;
  }

  const enemy=
    enemies.find(
      e=>e.x===nx&&e.y===ny
    );

  if(enemy){

    attackEnemy(enemy);

  }else{

    player.x=nx;
    player.y=ny;

    if(
      !hasKey &&
      nx===keyPos[0] &&
      ny===keyPos[1]
    ){
      hasKey=true;
      showToast('🗝️ 열쇠 획득!');
      msg.textContent='던전 열쇠를 찾았습니다.';
    }

    if(
      potionPos &&
      nx===potionPos[0] &&
      ny===potionPos[1]
    ){
      potions++;
      potionPos=null;

      showToast('🧪 물약 +1');
      msg.textContent='회복 물약을 발견했습니다.';
    }

    if(
      chestPos &&
      nx===chestPos[0] &&
      ny===chestPos[1]
    ){
      const reward=
        Math.random()<.5
          ?20+floor*5
          :30+floor*8;

      gold+=reward;
      chestPos=null;

      if(Math.random()<.35){
        potions++;
        showToast(`🎁 ${reward}G + 물약`);
      }else{
        showToast(`🎁 ${reward}G`);
      }

      msg.textContent=
        '보물상자를 열었습니다!';
    }

    const k=idx(nx,ny);

    if(trapSet.has(k)){
      trapSet.delete(k);

      const damage=
        difficulty===2?2:1;

      hp-=damage;

      showToast(`⚠️ 함정 -${damage} HP`);
      msg.textContent='바닥 함정을 밟았습니다!';
      shake();
    }

    if(
      nx===exitPos[0] &&
      ny===exitPos[1]
    ){
      if(hasKey){
        nextFloor();
        return;
      }

      msg.textContent=
        '🔒 출구가 잠겨 있습니다. 열쇠가 필요합니다.';
    }
  }

  enemyTurn();

  updateHud();
  render();

  if(hp<=0){
    end(false);
  }
}

function enemyTurn(){

  for(const e of enemies){

    const dist=
      Math.abs(e.x-player.x)+
      Math.abs(e.y-player.y);

    if(dist===1){

      hp-=e.atk;

      msg.textContent=
        e.boss
          ?'👹 보스의 강력한 공격!'
          :'👾 몬스터에게 공격받았습니다!';

      shake();

    }else if(dist<6){

      const choices=
        Object.values(dirs)
        .map(([dx,dy])=>({
          x:e.x+dx,
          y:e.y+dy
        }))
        .filter(p=>
          p.x>=0&&p.x<N&&
          p.y>=0&&p.y<N&&
          !walls.has(idx(p.x,p.y))&&
          !(p.x===player.x&&p.y===player.y)&&
          !enemies.some(q=>
            q!==e&&
            q.x===p.x&&
            q.y===p.y
          )
        )
        .sort((a,b)=>
          (
            Math.abs(a.x-player.x)+
            Math.abs(a.y-player.y)
          )-
          (
            Math.abs(b.x-player.x)+
            Math.abs(b.y-player.y)
          )
        );

      if(
        choices[0] &&
        Math.random()<
        (e.boss?.9:.72)
      ){
        e.x=choices[0].x;
        e.y=choices[0].y;
      }
    }
  }
}

function heal(){
  if(!playing)return;

  if(potions<=0){
    showToast('물약이 없습니다.');
    return;
  }

  if(hp>=maxHp){
    showToast('체력이 가득 찼습니다.');
    return;
  }

  potions--;

  hp=Math.min(
    maxHp,
    hp+5
  );

  msg.textContent=
    '🧪 회복 물약 사용! HP +5';

  showToast('❤️ HP 회복');

  enemyTurn();

  updateHud();
  render();

  if(hp<=0){
    end(false);
  }
}

function spell(){
  if(!playing)return;

  if(mana<=0){
    showToast('마법 횟수가 없습니다.');
    return;
  }

  mana--;

  const targets=
    enemies.filter(e=>
      Math.abs(e.x-player.x)<=1 &&
      Math.abs(e.y-player.y)<=1
    );

  if(targets.length===0){

    msg.textContent=
      '✨ 마법을 사용했지만 주변에 적이 없습니다.';

    showToast('마법 빗나감');

  }else{

    let kills=0;

    for(const e of [...targets]){

      e.hp-=3+Math.floor(level/2);

      if(e.hp<=0){
        kills++;

        const g=
          e.boss?50:15;

        gold+=g;

        enemies=
          enemies.filter(x=>x!==e);

        gainExp(e.boss?6:2);

        if(e.boss){
          hasKey=true;
        }
      }
    }

    msg.textContent=
      `✨ 범위 마법! ${targets.length}마리 공격`;

    showToast(
      kills
        ?`✨ ${kills}마리 처치!`
        :`✨ ${targets.length}마리 명중`
    );
  }

  enemyTurn();

  updateHud();
  render();

  if(hp<=0){
    end(false);
  }
}

function nextFloor(){

  if(floor>=5){
    end(true);
    return;
  }

  floor++;

  hasKey=false;

  hp=Math.min(
    maxHp,
    hp+2
  );

  if(floor===5){
    hasKey=false;
  }

  generate();

  msg.textContent=
    floor===5
      ?'👹 최종층! 보스를 처치하고 출구를 여세요.'
      :`지하 ${floor}층 진입! 몬스터가 더 강해졌습니다.`;

  showToast(`⬇️ 지하 ${floor}층`);

  updateHud();
  render();
}

function end(win){
  if(!playing)return;

  playing=false;

  $('#resultEmoji').textContent=
    win?'🏆':'💀';

  $('#resultTitle').textContent=
    win
      ?'던전 완전 정복!'
      :'모험 실패';

  if(win){

    let stars=1;

    if(hp>=maxHp*.5){
      stars=2;
    }

    if(
      hp>=maxHp*.7 &&
      gold>=100
    ){
      stars=3;
    }

    const rating=
      '⭐'.repeat(stars)+
      '☆'.repeat(3-stars);

    $('#resultText').innerHTML=
      `${rating}<br><br>`+
      `5개 층을 모두 탈출했습니다.<br>`+
      `최종 레벨 <b>${level}</b><br>`+
      `남은 체력 <b>${hp}/${maxHp}</b><br>`+
      `획득 골드 <b>${gold}G</b><br>`+
      `남은 물약 <b>${potions}</b>개`;

  }else{

    $('#resultText').innerHTML=
      `지하 <b>${floor}층</b>에서 쓰러졌습니다.<br><br>`+
      `최종 레벨 ${level}<br>`+
      `획득 골드 ${gold}G<br><br>`+
      `몬스터와 거리를 유지하고<br>`+
      `여러 적이 모였을 때 ✨ 마법을 사용해보세요.`;
  }

  startBtn.textContent='다시 모험';
  startBtn.onclick=startGame;

  setTimeout(()=>{
    overlay.classList.remove('hide');
  },400);
}

document
.querySelectorAll('[data-d]')
.forEach(b=>{
  b.onclick=()=>move(b.dataset.d);
});

addEventListener('keydown',e=>{

  const d={
    ArrowUp:'U',
    ArrowDown:'D',
    ArrowLeft:'L',
    ArrowRight:'R',
    w:'U',W:'U',
    s:'D',S:'D',
    a:'L',A:'L',
    d:'R',D:'R'
  }[e.key];

  if(d){
    e.preventDefault();
    move(d);
  }

  if(e.key===' '){
    e.preventDefault();
    spell();
  }
});

$('#potionBtn').onclick=heal;
$('#spellBtn').onclick=spell;

difficultyBtn.onclick=()=>{
  difficulty=(difficulty+1)%3;

  difficultyBtn.textContent=
    `난이도 : ${difficultyNames[difficulty]}`;
};

startBtn.onclick=startGame;
</script>

</body>
</html>
