<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"><title>🧙 턴제 던전</title><style>
:root{--c1:#3f3f46;--c2:#c4b5fd}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 18% 10%,var(--c1),#11162e 52%,#030712);user-select:none;-webkit-user-select:none}.app{width:min(95vw,720px);height:min(95vh,860px);display:flex;flex-direction:column;gap:11px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 4px}.brand small{display:block;color:#cbd5e1;font-size:10px;font-weight:900;letter-spacing:.2em}.brand h1{margin:2px 0 0;font-size:clamp(25px,5vw,38px);letter-spacing:-.05em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:67px;padding:7px 10px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#0f172ac7}.stat small{display:block;color:#cbd5e1;font-size:9px}.stat b{font-size:19px}.stage{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff27;border-radius:25px;background:linear-gradient(145deg,#14203b,#090e21);box-shadow:0 25px 70px #0009;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#050916e9}.overlay.hide{display:none}.card{width:min(100%,410px);padding:28px 24px;text-align:center;border:1px solid #ffffff25;border-radius:23px;background:#111a36ee;box-shadow:0 20px 55px #0008}.card .emoji{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{margin:0 0 19px;color:#cbd5e1;font-size:14px;line-height:1.72;word-break:keep-all}.primary{min-height:48px;width:100%;padding:12px 18px;border:0;border-radius:13px;color:#08111f;background:linear-gradient(135deg,var(--c2),#fef3c7);font:900 15px system-ui;cursor:pointer}.tip{min-height:18px;text-align:center;color:#aebbd0;font-size:12px}.hidden{display:none!important}button{font-family:inherit}.dungeon{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:11px;background:radial-gradient(circle,#312e3f,#09090b)}.dungeon-grid{width:min(96%,530px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:5px;border:3px solid #52525b;border-radius:14px;background:#030712}.dcell{display:grid;place-items:center;border-radius:6px;background:#27272a;font-size:clamp(18px,5vw,35px)}.dcell.wall{background:#09090b}.dcell.seen{box-shadow:inset 0 0 18px #000}.dungeon-pad{display:grid;grid-template-columns:repeat(4,53px);gap:5px}.dungeon-pad button{min-height:46px;border:1px solid #ffffff25;border-radius:10px;background:#3f3f46;color:#fff;font-size:18px;font-weight:900}.dungeon-pad button:first-child{grid-column:2}.dungeon-pad button:nth-child(2){grid-column:1}.dungeon-pad button:nth-child(3){grid-column:2}.dungeon-pad button:nth-child(4){grid-column:3}.dungeon-pad #potionBtn{grid-column:4;grid-row:1/3;font-size:12px}#dungeonMsg{min-height:22px;text-align:center;color:#e4e4e7;font-weight:800}
@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.stage{min-height:0;border-radius:20px}.brand h1{font-size:25px}.stat{min-width:61px;padding:6px 8px}.card{padding:24px 19px}.tip{font-size:11px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><small>TURN DUNGEON</small><h1>🧙 턴제 던전</h1></div><div class="hud" id="hud"></div></header><section class="stage" id="stage"><div class="dungeon"><div class="dungeon-grid" id="dungeonGrid"></div><div class="dungeon-pad"><button data-d="U">▲</button><button data-d="L">◀</button><button data-d="D">▼</button><button data-d="R">▶</button><button id="potionBtn">🧪 회복</button></div><div id="dungeonMsg">열쇠를 찾고 출구 계단으로 이동하세요.</div></div><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="resultEmoji">🧙</div><h2 id="resultTitle">턴제 던전</h2><p id="resultText">한 칸 움직일 때마다 적도 행동하는 던전에서 열쇠를 찾고 5개 층을 탈출하세요.</p><button class="primary" id="startBtn">게임 시작</button></div></div></section><div class="tip">한 칸 움직일 때마다 적도 행동하는 던전에서 열쇠를 찾고 5개 층을 탈출하세요.</div></main><script>
const $=s=>document.querySelector(s),stage=$('#stage'),overlay=$('#overlay'),startBtn=$('#startBtn');
const safeGet=(k,d=0)=>{try{return Number(localStorage.getItem(k))||d}catch(e){return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function showResult(icon,title,text,button='다시 하기'){ $('#resultEmoji').textContent=icon;$('#resultTitle').textContent=title;$('#resultText').innerHTML=text;startBtn.textContent=button;overlay.classList.remove('hide') }
const N=8,gridEl=$('#dungeonGrid'),msg=$('#dungeonMsg'),hud=$('#hud');let floor=1,player,walls,enemies,keyPos,exitPos,potionPos,hasKey=false,hp=8,potions=1,playing=false;hud.innerHTML='<div class="stat"><small>층</small><b id="floor">1</b></div><div class="stat"><small>체력</small><b id="hp">8</b></div><div class="stat"><small>열쇠</small><b id="key">❌</b></div>';const idx=(x,y)=>y*N+x,dirs={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
function reachable(start,target,set){const q=[start],seen=new Set([idx(...start)]);while(q.length){const[x,y]=q.shift();if(x===target[0]&&y===target[1])return true;for(const[dx,dy]of Object.values(dirs)){const nx=x+dx,ny=y+dy,k=idx(nx,ny);if(nx>=0&&nx<N&&ny>=0&&ny<N&&!set.has(k)&&!seen.has(k)){seen.add(k);q.push([nx,ny])}}}return false}
function generate(){for(let tries=0;tries<200;tries++){player={x:0,y:N-1};keyPos=[Math.floor(Math.random()*N),Math.floor(Math.random()*N/2)+2];exitPos=[N-1,0];potionPos=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)];walls=new Set;while(walls.size<9+floor)walls.add(Math.floor(Math.random()*N*N));[idx(player.x,player.y),idx(...keyPos),idx(...exitPos),idx(...potionPos)].forEach(k=>walls.delete(k));if(reachable([player.x,player.y],keyPos,walls)&&reachable(keyPos,exitPos,walls))break}enemies=[];while(enemies.length<Math.min(6,2+floor)){const e={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N),hp:2};if(!walls.has(idx(e.x,e.y))&&Math.abs(e.x-player.x)+Math.abs(e.y-player.y)>3&&!enemies.some(q=>q.x===e.x&&q.y===e.y))enemies.push(e)}}
function startGame(){floor=1;hp=8;potions=1;hasKey=false;playing=true;generate();overlay.classList.add('hide');updateHud();render();msg.textContent='열쇠를 얻은 뒤 오른쪽 위 계단으로 탈출하세요.'}function updateHud(){$('#floor').textContent=floor;$('#hp').textContent=hp;$('#key').textContent=hasKey?'✅':'❌'}
function render(){gridEl.innerHTML='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=document.createElement('div'),enemy=enemies.find(e=>e.x===x&&e.y===y);c.className='dcell'+(walls.has(idx(x,y))?' wall':'');c.textContent=walls.has(idx(x,y))?'':player.x===x&&player.y===y?'🧙':enemy?'👾':!hasKey&&keyPos[0]===x&&keyPos[1]===y?'🗝️':exitPos[0]===x&&exitPos[1]===y?'🌀':potionPos&&potionPos[0]===x&&potionPos[1]===y?'🧪':'';gridEl.appendChild(c)}}
function move(d){if(!playing)return;const[dx,dy]=dirs[d],nx=player.x+dx,ny=player.y+dy;if(nx<0||nx>=N||ny<0||ny>=N||walls.has(idx(nx,ny)))return;const ei=enemies.findIndex(e=>e.x===nx&&e.y===ny);if(ei>=0){enemies[ei].hp--;msg.textContent='마법 공격! 몬스터 체력 -1';if(enemies[ei].hp<=0)enemies.splice(ei,1)}else{player.x=nx;player.y=ny;if(!hasKey&&nx===keyPos[0]&&ny===keyPos[1]){hasKey=true;msg.textContent='던전 열쇠를 획득했습니다!'}if(potionPos&&nx===potionPos[0]&&ny===potionPos[1]){potions++;potionPos=null;msg.textContent='회복 물약을 발견했습니다.'}if(nx===exitPos[0]&&ny===exitPos[1]){if(hasKey)return nextFloor();msg.textContent='출구가 잠겨 있습니다. 열쇠가 필요해요.'}}enemyTurn();updateHud();render()}
function enemyTurn(){for(const e of enemies){const dist=Math.abs(e.x-player.x)+Math.abs(e.y-player.y);if(dist===1){hp--;msg.textContent='몬스터의 공격을 받았습니다!'}else if(dist<6){const choices=Object.values(dirs).map(([dx,dy])=>({x:e.x+dx,y:e.y+dy})).filter(p=>p.x>=0&&p.x<N&&p.y>=0&&p.y<N&&!walls.has(idx(p.x,p.y))&&!(p.x===player.x&&p.y===player.y)&&!enemies.some(q=>q!==e&&q.x===p.x&&q.y===p.y)).sort((a,b)=>(Math.abs(a.x-player.x)+Math.abs(a.y-player.y))-(Math.abs(b.x-player.x)+Math.abs(b.y-player.y)));if(choices[0]){e.x=choices[0].x;e.y=choices[0].y}}}if(hp<=0)end(false)}function heal(){if(playing&&potions>0&&hp<8){potions--;hp=Math.min(8,hp+4);msg.textContent=`물약 사용! 남은 물약 ${potions}`;enemyTurn();updateHud();render()}}
function nextFloor(){floor++;if(floor>5)return end(true);hasKey=false;hp=Math.min(8,hp+2);generate();updateHud();render();msg.textContent=`지하 ${floor}층 진입! 몬스터가 더 많아졌습니다.`}function end(win){playing=false;showResult(win?'🏆':'💀',win?'던전 완전 정복!':'모험 실패',win?'5개 층의 열쇠를 모아 무사히 탈출했습니다.':`지하 ${floor}층에서 쓰러졌습니다.<br>몬스터와 거리를 두고 물약을 아껴 사용하세요.`)}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));addEventListener('keydown',e=>{const d={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R'}[e.key];if(d){e.preventDefault();move(d)}});$('#potionBtn').onclick=heal;startBtn.onclick=startGame;
</script></body></html>
