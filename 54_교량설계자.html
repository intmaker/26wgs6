<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"><title>🌉 교량 설계자</title><style>
:root{--c1:#0369a1;--c2:#fbbf24}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 18% 10%,var(--c1),#11162e 52%,#030712);user-select:none;-webkit-user-select:none}.app{width:min(95vw,720px);height:min(95vh,860px);display:flex;flex-direction:column;gap:11px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 4px}.brand small{display:block;color:#cbd5e1;font-size:10px;font-weight:900;letter-spacing:.2em}.brand h1{margin:2px 0 0;font-size:clamp(25px,5vw,38px);letter-spacing:-.05em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:67px;padding:7px 10px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#0f172ac7}.stat small{display:block;color:#cbd5e1;font-size:9px}.stat b{font-size:19px}.stage{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff27;border-radius:25px;background:linear-gradient(145deg,#14203b,#090e21);box-shadow:0 25px 70px #0009;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#050916e9}.overlay.hide{display:none}.card{width:min(100%,410px);padding:28px 24px;text-align:center;border:1px solid #ffffff25;border-radius:23px;background:#111a36ee;box-shadow:0 20px 55px #0008}.card .emoji{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{margin:0 0 19px;color:#cbd5e1;font-size:14px;line-height:1.72;word-break:keep-all}.primary{min-height:48px;width:100%;padding:12px 18px;border:0;border-radius:13px;color:#08111f;background:linear-gradient(135deg,var(--c2),#fef3c7);font:900 15px system-ui;cursor:pointer}.tip{min-height:18px;text-align:center;color:#aebbd0;font-size:12px}.hidden{display:none!important}button{font-family:inherit}#bridgeCanvas{display:block;width:100%;height:100%;background:linear-gradient(#7dd3fc 0 62%,#0ea5e9 62% 100%)}.bridge-bar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:7px;padding:8px;border:1px solid #ffffff35;border-radius:13px;background:#172033d9}.bridge-bar button{min-height:45px;padding:8px 12px;border:0;border-radius:10px;background:#fbbf24;color:#422006;font-weight:900}.bridge-bar button:nth-child(2){background:#ffffff18;color:#fff}.bridge-bar span{font-size:12px;color:#e0f2fe}@media(max-width:520px){.bridge-bar{flex-wrap:wrap}.bridge-bar span{width:100%;text-align:center}}
@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.stage{min-height:0;border-radius:20px}.brand h1{font-size:25px}.stat{min-width:61px;padding:6px 8px}.card{padding:24px 19px}.tip{font-size:11px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><small>BRIDGE LAB</small><h1>🌉 교량 설계자</h1></div><div class="hud" id="hud"></div></header><section class="stage" id="stage"><canvas id="bridgeCanvas"></canvas><div class="bridge-bar"><button id="testBtn">🚚 통과 시험</button><button id="clearBtn">↺ 철거</button><span id="bridgeMsg">두 지점을 차례로 눌러 보를 설치하세요.</span></div><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="resultEmoji">🌉</div><h2 id="resultTitle">교량 설계자</h2><p id="resultText">제한된 보를 연결해 하중을 버티는 길을 만들고 트럭 통과 시험에 성공하세요.</p><button class="primary" id="startBtn">게임 시작</button></div></div></section><div class="tip">제한된 보를 연결해 하중을 버티는 길을 만들고 트럭 통과 시험에 성공하세요.</div></main><script>
const $=s=>document.querySelector(s),stage=$('#stage'),overlay=$('#overlay'),startBtn=$('#startBtn');
const safeGet=(k,d=0)=>{try{return Number(localStorage.getItem(k))||d}catch(e){return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function showResult(icon,title,text,button='다시 하기'){ $('#resultEmoji').textContent=icon;$('#resultTitle').textContent=title;$('#resultText').innerHTML=text;startBtn.textContent=button;overlay.classList.remove('hide') }
const C=$('#bridgeCanvas'),X=C.getContext('2d'),msg=$('#bridgeMsg'),hud=$('#hud');let W,H,D=1,nodes=[],beams=[],selected=-1,budget=9,testing=false,truck=null,raf,last=0,best=safeGet('bridgeBest',0);hud.innerHTML=`<div class="stat"><small>남은 보</small><b id="budget">9</b></div><div class="stat"><small>최소 기록</small><b id="best">${best||'-'}</b></div>`;
function resize(){const r=stage.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);makeNodes();draw()}function makeNodes(){nodes=[[.08,.56],[.2,.43],[.2,.68],[.36,.35],[.36,.62],[.52,.45],[.52,.7],[.68,.34],[.68,.61],[.83,.46],[.92,.56]].map(([x,y])=>({x:x*W,y:y*H}));beams=[];selected=-1;budget=9;$('#budget').textContent=9}
function startGame(){testing=false;truck=null;makeNodes();overlay.classList.add('hide');msg.textContent='두 지점을 연결하세요. 너무 긴 보는 트럭 무게를 버티지 못합니다.';draw()}
function clickNode(x,y){if(testing)return;let i=-1,d=28;nodes.forEach((n,k)=>{const q=Math.hypot(n.x-x,n.y-y);if(q<d){d=q;i=k}});if(i<0)return;if(selected<0){selected=i;msg.textContent='연결할 두 번째 지점을 선택하세요.'}else if(i===selected){selected=-1}else{const exists=beams.some(b=>b.a===Math.min(i,selected)&&b.b===Math.max(i,selected));if(!exists&&budget>0){beams.push({a:Math.min(i,selected),b:Math.max(i,selected)});budget--;$('#budget').textContent=budget}selected=-1}draw()}
function route(){const q=[[0,[0]]],seen=new Set([0]);while(q.length){const[i,path]=q.shift();if(i===nodes.length-1)return path;for(const b of beams){const n=b.a===i?b.b:b.b===i?b.a:-1;if(n>=0&&!seen.has(n)){seen.add(n);q.push([n,[...path,n]])}}}return null}
function test(){if(testing)return;const path=route();if(!path){msg.textContent='양쪽 절벽이 연결되지 않았습니다.';return}const weak=path.some((n,i)=>i&&Math.hypot(nodes[n].x-nodes[path[i-1]].x,nodes[n].y-nodes[path[i-1]].y)>W*.245);if(weak){msg.textContent='붉게 표시된 긴 보가 하중을 버티지 못합니다!';draw(true);return}testing=true;truck={path,segment:0,t:0};last=performance.now();raf=requestAnimationFrame(loop)}
function update(dt){if(!truck)return;truck.t+=dt*.7;if(truck.t>=1){truck.t=0;truck.segment++;if(truck.segment>=truck.path.length-1){testing=false;const used=beams.length;if(!best||used<best){best=used;safeSet('bridgeBest',best);$('#best').textContent=best}return showResult('🌉','교량 통과 성공!',`${used}개의 보로 안전한 경로를 만들었습니다.<br>더 적은 보를 사용해 기록을 줄여보세요.`)}}}
function draw(showWeak=false){X.clearRect(0,0,W,H);let sky=X.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#7dd3fc');sky.addColorStop(.62,'#bae6fd');sky.addColorStop(.63,'#0284c7');sky.addColorStop(1,'#075985');X.fillStyle=sky;X.fillRect(0,0,W,H);X.fillStyle='#713f12';X.fillRect(0,H*.54,W*.11,H);X.fillRect(W*.89,H*.54,W*.11,H);for(const b of beams){const a=nodes[b.a],n=nodes[b.b],len=Math.hypot(a.x-n.x,a.y-n.y);X.strokeStyle=showWeak&&len>W*.245?'#ef4444':'#d97706';X.lineWidth=9;X.beginPath();X.moveTo(a.x,a.y);X.lineTo(n.x,n.y);X.stroke();X.strokeStyle='#fbbf24';X.lineWidth=2;X.stroke()}nodes.forEach((n,i)=>{X.fillStyle=i===selected?'#fde047':'#e2e8f0';X.strokeStyle='#334155';X.lineWidth=3;X.beginPath();X.arc(n.x,n.y,12,0,7);X.fill();X.stroke()});if(truck){const a=nodes[truck.path[truck.segment]],b=nodes[truck.path[truck.segment+1]],x=a.x+(b.x-a.x)*truck.t,y=a.y+(b.y-a.y)*truck.t;X.font='34px sans-serif';X.fillText('🚚',x-17,y-11)}}function loop(t){if(!testing)return;const dt=Math.min(.04,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}C.onclick=e=>{const r=C.getBoundingClientRect();clickNode(e.clientX-r.left,e.clientY-r.top)};$('#testBtn').onclick=test;$('#clearBtn').onclick=()=>{if(!testing){beams=[];budget=9;selected=-1;$('#budget').textContent=9;draw()}};startBtn.onclick=startGame;addEventListener('resize',resize);resize();
</script></body></html>
