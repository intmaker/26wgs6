<script>
const $=s=>document.querySelector(s);

const stage=$('#stage');
const overlay=$('#overlay');
const startBtn=$('#startBtn');
const difficultyBtn=$('#difficultyBtn');
const C=$('#bridgeCanvas');
const X=C.getContext('2d');

const msg=$('#bridgeMsg');
const toast=$('#toast');

const budgetEl=$('#budget');
const bestEl=$('#best');
const levelEl=$('#level');
const vehicleEl=$('#vehicle');

const safeGet=(k,d=0)=>{
  try{return Number(localStorage.getItem(k))||d}
  catch{return d}
};

const safeSet=(k,v)=>{
  try{localStorage.setItem(k,v)}
  catch{}
};

let W,H,D=1;
let nodes=[];
let beams=[];
let selected=-1;

let budget=10;
let testing=false;
let truck=null;
let raf;
let last=0;

let level=1;
let difficulty=1;
let best=safeGet('bridgeChallengeBest',0);

const difficultyNames=['쉬움','보통','어려움'];

function showToast(text){
  toast.textContent=text;
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');

  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>{
    toast.classList.remove('show');
  },700);
}

function shake(){
  stage.classList.remove('shake');
  void stage.offsetWidth;
  stage.classList.add('shake');
}

function resize(){
  const r=stage.getBoundingClientRect();

  D=Math.min(2,devicePixelRatio||1);
  W=r.width;
  H=r.height;

  C.width=W*D;
  C.height=H*D;

  X.setTransform(D,0,0,D,0,0);

  makeNodes();
  draw();
}

function nodeLayout(){
  if(level===1){
    return [
      [.08,.56],[.20,.43],[.20,.68],
      [.36,.35],[.36,.62],
      [.52,.45],[.52,.70],
      [.68,.34],[.68,.61],
      [.83,.46],[.92,.56]
    ];
  }

  if(level===2){
    return [
      [.08,.56],[.18,.40],[.18,.70],
      [.31,.30],[.31,.58],[.31,.76],
      [.46,.43],[.46,.67],
      [.60,.30],[.60,.57],[.60,.75],
      [.74,.42],[.74,.68],
      [.86,.50],[.92,.56]
    ];
  }

  return [
    [.08,.56],[.17,.38],[.17,.70],
    [.28,.28],[.28,.52],[.28,.78],
    [.41,.38],[.41,.65],
    [.54,.27],[.54,.53],[.54,.78],
    [.67,.38],[.67,.66],
    [.80,.31],[.80,.58],
    [.92,.56]
  ];
}

function maxBeams(){
  const base=
    difficulty===0?13:
    difficulty===1?11:9;

  return Math.max(
    7,
    base-Math.floor((level-1)*.5)
  );
}

function vehicleInfo(){
  if(level<=2){
    return {emoji:'🚚',weight:1};
  }
  if(level<=4){
    return {emoji:'🚌',weight:1.18};
  }
  return {emoji:'🚛',weight:1.35};
}

function makeNodes(){
  nodes=nodeLayout().map(([x,y])=>({
    x:x*W,
    y:y*H
  }));

  beams=[];
  selected=-1;
  budget=maxBeams();

  budgetEl.textContent=budget;
  levelEl.textContent=level;
  vehicleEl.textContent=vehicleInfo().emoji;
  bestEl.textContent=best||'-';
}

function startGame(){
  testing=false;
  truck=null;

  makeNodes();

  overlay.classList.add('hide');

  msg.textContent=
    '두 지점을 연결하세요. 너무 긴 보는 쉽게 붕괴합니다.';

  draw();
}

function clickNode(x,y){
  if(testing)return;

  let i=-1;
  let d=30;

  nodes.forEach((n,k)=>{
    const q=Math.hypot(n.x-x,n.y-y);

    if(q<d){
      d=q;
      i=k;
    }
  });

  if(i<0)return;

  if(selected<0){
    selected=i;
    msg.textContent='연결할 두 번째 지점을 선택하세요.';
  }else if(i===selected){
    selected=-1;
    msg.textContent='선택이 취소되었습니다.';
  }else{
    const a=Math.min(i,selected);
    const b=Math.max(i,selected);

    const exists=
      beams.some(v=>v.a===a&&v.b===b);

    if(exists){
      showToast('이미 설치된 보입니다.');
      selected=-1;
      draw();
      return;
    }

    if(budget<=0){
      showToast('남은 보가 없습니다!');
      selected=-1;
      draw();
      return;
    }

    const len=
      Math.hypot(
        nodes[a].x-nodes[b].x,
        nodes[a].y-nodes[b].y
      );

    beams.push({
      a,b,
      health:1,
      broken:false,
      len
    });

    budget--;
    budgetEl.textContent=budget;

    if(len<W*.19){
      showToast('🔩 튼튼한 짧은 보');
    }else if(len<W*.255){
      showToast('⚠️ 보통 강도');
    }else{
      showToast('🔴 너무 긴 보!');
    }

    selected=-1;
  }

  draw();
}

function route(){
  const q=[[0,[0]]];
  const seen=new Set([0]);

  while(q.length){
    const [i,path]=q.shift();

    if(i===nodes.length-1){
      return path;
    }

    for(const b of beams){
      if(b.broken)continue;

      const n=
        b.a===i?b.b:
        b.b===i?b.a:-1;

      if(n>=0&&!seen.has(n)){
        seen.add(n);
        q.push([n,[...path,n]]);
      }
    }
  }

  return null;
}

function pathBeams(path){
  const arr=[];

  for(let i=1;i<path.length;i++){
    const a=Math.min(path[i-1],path[i]);
    const b=Math.max(path[i-1],path[i]);

    const beam=
      beams.find(v=>v.a===a&&v.b===b);

    if(beam)arr.push(beam);
  }

  return arr;
}

function supportCount(beam){
  let count=0;

  for(const n of [beam.a,beam.b]){
    const linked=
      beams.filter(
        b=>!b.broken&&(b.a===n||b.b===n)
      ).length;

    if(linked>=3)count++;
  }

  return count;
}

function beamStrength(beam){
  let strength=1;

  const ratio=beam.len/W;

  if(ratio<.18){
    strength=1.45;
  }else if(ratio<.23){
    strength=1.12;
  }else if(ratio<.27){
    strength=.88;
  }else{
    strength=.58;
  }

  strength+=supportCount(beam)*.17;

  return strength;
}

function test(){
  if(testing)return;

  const path=route();

  if(!path){
    msg.textContent='❌ 양쪽 절벽이 연결되지 않았습니다.';
    showToast('경로 없음');
    return;
  }

  testing=true;

  truck={
    path,
    segment:0,
    t:0,
    failed:false
  };

  msg.textContent='🚚 하중 시험 중...';

  last=performance.now();

  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

function failBeam(beam){
  beam.broken=true;

  testing=false;
  truck.failed=true;

  shake();

  msg.textContent='💥 교량이 하중을 버티지 못하고 붕괴했습니다!';

  draw();

  setTimeout(()=>{
    $('#resultEmoji').textContent='💥';
    $('#resultTitle').textContent='교량 붕괴';

    $('#resultText').innerHTML=
      `차량 하중을 버티지 못했습니다.<br><br>`+
      `긴 보를 짧게 나누고,<br>`+
      `여러 보가 만나는 <b>삼각형 구조</b>를 만들어보세요.`;

    startBtn.textContent='다시 설계';
    startBtn.onclick=startGame;

    overlay.classList.remove('hide');
  },500);
}

function update(dt){
  if(!truck)return;

  truck.t+=dt*.62;

  const a=
    nodes[truck.path[truck.segment]];

  const b=
    nodes[truck.path[truck.segment+1]];

  const aa=Math.min(
    truck.path[truck.segment],
    truck.path[truck.segment+1]
  );

  const bb=Math.max(
    truck.path[truck.segment],
    truck.path[truck.segment+1]
  );

  const beam=
    beams.find(v=>v.a===aa&&v.b===bb);

  if(beam){
    const vehicle=vehicleInfo();

    const force=
      vehicle.weight*
      (
        difficulty===0?.82:
        difficulty===1?1:1.13
      );

    const strength=
      beamStrength(beam);

    beam.health-=dt*
      Math.max(
        0,
        force-strength+.25
      )*.8;

    if(beam.health<=0){
      failBeam(beam);
      return;
    }
  }

  if(truck.t>=1){
    truck.t=0;
    truck.segment++;

    if(
      truck.segment>=
      truck.path.length-1
    ){
      success();
    }
  }
}

function success(){
  testing=false;

  const used=beams.length;

  if(!best||used<best){
    best=used;
    safeSet('bridgeChallengeBest',best);
    bestEl.textContent=best;
  }

  let stars=1;

  if(used<=maxBeams()-2){
    stars=2;
  }

  if(used<=maxBeams()-4){
    stars=3;
  }

  const rating=
    '⭐'.repeat(stars)+
    '☆'.repeat(3-stars);

  $('#resultEmoji').textContent='🌉';
  $('#resultTitle').textContent='교량 통과 성공!';

  $('#resultText').innerHTML=
    `${rating}<br><br>`+
    `${vehicleInfo().emoji} 차량이 안전하게 통과했습니다.<br>`+
    `사용한 보 <b>${used}</b>개<br>`+
    `남은 보 <b>${budget}</b>개<br>`+
    `최소 기록 <b>${best}</b>개<br><br>`+
    `다음 단계에서는 더 무거운 차량이 등장합니다.`;

  startBtn.textContent='다음 단계';

  startBtn.onclick=()=>{
    level++;
    startGame();
  };

  setTimeout(()=>{
    overlay.classList.remove('hide');
  },450);
}

function undo(){
  if(testing||beams.length===0)return;

  beams.pop();
  budget++;
  budgetEl.textContent=budget;
  selected=-1;

  msg.textContent='마지막 보를 제거했습니다.';
  draw();
}

function clearAll(){
  if(testing)return;

  beams=[];
  selected=-1;
  budget=maxBeams();

  budgetEl.textContent=budget;

  msg.textContent='모든 보를 철거했습니다.';
  draw();
}

function drawBackground(){
  const sky=X.createLinearGradient(0,0,0,H);

  sky.addColorStop(0,'#7dd3fc');
  sky.addColorStop(.62,'#bae6fd');
  sky.addColorStop(.63,'#0284c7');
  sky.addColorStop(1,'#075985');

  X.fillStyle=sky;
  X.fillRect(0,0,W,H);

  X.fillStyle='#fff8';

  for(let i=0;i<7;i++){
    const x=(i*137)%W;
    const y=35+(i*53)%(H*.28);

    X.beginPath();
    X.arc(x,y,18,0,Math.PI*2);
    X.arc(x+18,y+3,15,0,Math.PI*2);
    X.arc(x-15,y+4,13,0,Math.PI*2);
    X.fill();
  }

  X.fillStyle='#713f12';

  X.fillRect(
    0,
    H*.54,
    W*.11,
    H
  );

  X.fillRect(
    W*.89,
    H*.54,
    W*.11,
    H
  );

  X.fillStyle='#854d0e';

  X.beginPath();
  X.moveTo(0,H*.54);
  X.lineTo(W*.11,H*.54);
  X.lineTo(W*.08,H*.62);
  X.lineTo(0,H*.66);
  X.fill();

  X.beginPath();
  X.moveTo(W,H*.54);
  X.lineTo(W*.89,H*.54);
  X.lineTo(W*.92,H*.63);
  X.lineTo(W,H*.67);
  X.fill();
}

function drawBeam(b){
  const a=nodes[b.a];
  const n=nodes[b.b];

  if(b.broken){
    X.strokeStyle='#7f1d1d';
  }else{
    const strength=beamStrength(b);

    X.strokeStyle=
      strength>=1.2?'#16a34a':
      strength>=.9?'#d97706':
      '#dc2626';
  }

  X.lineWidth=9;
  X.beginPath();
  X.moveTo(a.x,a.y);
  X.lineTo(n.x,n.y);
  X.stroke();

  X.strokeStyle='#fde68a';
  X.lineWidth=2;
  X.beginPath();
  X.moveTo(a.x,a.y);
  X.lineTo(n.x,n.y);
  X.stroke();

  if(testing&&!b.broken){
    const hp=Math.max(0,b.health);

    if(hp<.7){
      X.strokeStyle='#ef4444';
      X.lineWidth=3;
      X.setLineDash([5,5]);
      X.beginPath();
      X.moveTo(a.x,a.y);
      X.lineTo(n.x,n.y);
      X.stroke();
      X.setLineDash([]);
    }
  }
}

function drawNodes(){
  nodes.forEach((n,i)=>{
    X.fillStyle=
      i===selected
        ?'#fde047'
        :'#e2e8f0';

    X.strokeStyle='#334155';
    X.lineWidth=3;

    X.beginPath();
    X.arc(n.x,n.y,12,0,Math.PI*2);
    X.fill();
    X.stroke();

    if(i===0||i===nodes.length-1){
      X.fillStyle='#0f172a';
      X.font='bold 10px sans-serif';
      X.textAlign='center';
      X.fillText(
        i===0?'START':'GOAL',
        n.x,
        n.y-18
      );
    }
  });
}

function drawTruck(){
  if(!truck||truck.failed)return;

  const a=
    nodes[truck.path[truck.segment]];

  const b=
    nodes[truck.path[truck.segment+1]];

  const x=
    a.x+(b.x-a.x)*truck.t;

  const y=
    a.y+(b.y-a.y)*truck.t;

  X.font='34px sans-serif';
  X.textAlign='center';

  X.fillText(
    vehicleInfo().emoji,
    x,
    y-11
  );
}

function draw(){
  X.clearRect(0,0,W,H);

  drawBackground();

  for(const b of beams){
    drawBeam(b);
  }

  drawNodes();
  drawTruck();
}

function loop(t){
  if(!testing)return;

  const dt=Math.min(
    .04,
    (t-last)/1000
  );

  last=t;

  update(dt);
  draw();

  if(testing){
    raf=requestAnimationFrame(loop);
  }
}

C.addEventListener('pointerdown',e=>{
  const r=C.getBoundingClientRect();

  clickNode(
    e.clientX-r.left,
    e.clientY-r.top
  );
});

$('#testBtn').onclick=test;
$('#undoBtn').onclick=undo;
$('#clearBtn').onclick=clearAll;

difficultyBtn.onclick=()=>{
  difficulty=(difficulty+1)%3;

  difficultyBtn.textContent=
    `난이도 : ${difficultyNames[difficulty]}`;
};

startBtn.onclick=startGame;

addEventListener('resize',resize);

resize();
</script>
</body>
</html>
