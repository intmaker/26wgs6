<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>💣 지뢰찾기</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 10%,#334155,#111827 55%,#030712);color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(95vw,680px);height:min(95vh,820px);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#fca5a5;font-weight:900}h1{margin:2px 0;font-size:clamp(26px,5vw,38px)}.hud{display:flex;gap:7px}.stat{min-width:68px;padding:7px 10px;text-align:center;border:1px solid #ffffff22;border-radius:13px;background:#111827cc}.stat small{display:block;color:#94a3b8;font-size:9px}.stat b{font-size:19px}.game{position:relative;flex:1;min-height:400px;display:grid;place-items:center;padding:14px;border:1px solid #ffffff24;border-radius:24px;background:linear-gradient(145deg,#1e293b,#0f172a);box-shadow:0 24px 65px #0009;touch-action:manipulation}.board{width:min(100%,530px);aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);gap:3px}.cell{border:0;border-radius:7px;color:#fff;background:linear-gradient(145deg,#64748b,#334155);font:900 clamp(13px,3vw,20px) system-ui;cursor:pointer;box-shadow:inset 1px 1px #ffffff28,0 2px 3px #0005}.cell.open{background:#dce7f3;color:#1e293b;box-shadow:inset 0 0 0 1px #94a3b8}.cell.flag{background:#7c3aed}.cell.mine{background:#dc2626}.n1{color:#2563eb!important}.n2{color:#16a34a!important}.n3{color:#dc2626!important}.n4{color:#7c3aed!important}.mode{display:flex;gap:7px;justify-content:center}.mode button{border:1px solid #ffffff26;border-radius:10px;padding:8px 13px;background:#ffffff0d;color:#dbeafe;font-weight:800;cursor:pointer}.mode button.active{background:#7c3aed;color:#fff}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;border-radius:inherit;background:#070d1be8;z-index:4}.overlay.hide{display:none}.card{max-width:390px;text-align:center;padding:28px 24px;border:1px solid #ffffff24;border-radius:22px;background:#182235}.ico{font-size:54px}.card h2{margin:8px;font-size:28px}.card p{color:#cbd5e1;line-height:1.7;font-size:14px}.card>button{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,#fca5a5,#fcd34d);font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#94a3b8;font-size:12px}@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.game{border-radius:20px;padding:8px}.board{gap:2px}.cell{border-radius:5px}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">MINE FIELD</div><h1>💣 지뢰찾기</h1></div><div class="hud"><div class="stat"><small>지뢰</small><b id="left">12</b></div><div class="stat"><small>시간</small><b id="time">0</b></div></div></header><div class="mode"><button id="openMode" class="active">👆 칸 열기</button><button id="flagMode">🚩 깃발</button></div><section class="game"><div class="board" id="board"></div><div class="overlay" id="over"><div class="card"><div class="ico" id="ico">💣</div><h2 id="title">진짜 지뢰찾기</h2><p id="desc">첫 칸은 언제나 안전합니다.<br>숫자는 주변 8칸에 숨은 지뢰 개수예요.<br>모바일은 위 버튼으로 열기·깃발 모드를 바꾸세요.</p><button id="start">게임 시작</button></div></div></section><div class="tip">클릭: 열기 · 우클릭: 깃발 · 모바일: 모드 버튼</div></main><script>
(()=>{const N=9,MINES=12,board=document.querySelector('#board'),over=document.querySelector('#over'),leftEl=document.querySelector('#left'),timeEl=document.querySelector('#time');let cells=[],started=false,playing=false,flagMode=false,timer=null,seconds=0;
const around=i=>{const x=i%N,y=Math.floor(i/N),a=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let nx=x+dx,ny=y+dy;if((dx||dy)&&nx>=0&&nx<N&&ny>=0&&ny<N)a.push(ny*N+nx)}return a};
function reset(){clearInterval(timer);cells=Array.from({length:N*N},()=>({mine:false,open:false,flag:false,n:0}));started=false;playing=true;seconds=0;timeEl.textContent=0;leftEl.textContent=MINES;over.classList.add('hide');render()}
function plant(safe){const banned=new Set([safe,...around(safe)]);let placed=0;while(placed<MINES){const i=Math.floor(Math.random()*cells.length);if(!banned.has(i)&&!cells[i].mine){cells[i].mine=true;placed++}}cells.forEach((c,i)=>c.n=around(i).filter(j=>cells[j].mine).length);started=true;timer=setInterval(()=>timeEl.textContent=++seconds,1000)}
function open(i){if(!playing||cells[i].flag||cells[i].open)return;if(!started)plant(i);const c=cells[i];if(c.mine){c.open=true;return finish(false)}const q=[i];while(q.length){const k=q.shift(),z=cells[k];if(z.open||z.flag)continue;z.open=true;if(z.n===0)around(k).forEach(j=>{if(!cells[j].mine&&!cells[j].open)q.push(j)})}render();if(cells.filter(c=>c.open).length===N*N-MINES)finish(true)}
function flag(i){if(!playing||cells[i].open)return;cells[i].flag=!cells[i].flag;leftEl.textContent=MINES-cells.filter(c=>c.flag).length;render()}
function render(){board.innerHTML='';cells.forEach((c,i)=>{const b=document.createElement('button');b.className='cell'+(c.open?' open':'')+(c.flag?' flag':'')+(c.open&&c.mine?' mine':'')+(c.open&&c.n?` n${Math.min(c.n,4)}`:'');b.textContent=c.flag?'🚩':c.open?(c.mine?'💥':c.n||''):'';b.onclick=()=>flagMode?flag(i):open(i);b.oncontextmenu=e=>{e.preventDefault();flag(i)};board.appendChild(b)})}
function finish(win){playing=false;clearInterval(timer);if(!win)cells.forEach(c=>{if(c.mine)c.open=true});render();document.querySelector('#ico').textContent=win?'🏆':'💥';document.querySelector('#title').textContent=win?'지뢰 제거 완료!':'지뢰 폭발!';document.querySelector('#desc').innerHTML=win?`${seconds}초 만에 모든 안전 칸을 찾았어요.`:'숫자와 깃발을 이용해 다시 찾아보세요.';document.querySelector('#start').textContent='다시 하기';setTimeout(()=>over.classList.remove('hide'),350)}
document.querySelector('#openMode').onclick=()=>setMode(false);document.querySelector('#flagMode').onclick=()=>setMode(true);function setMode(v){flagMode=v;document.querySelector('#openMode').classList.toggle('active',!v);document.querySelector('#flagMode').classList.toggle('active',v)}document.querySelector('#start').onclick=reset;render()})();</script></body></html>
