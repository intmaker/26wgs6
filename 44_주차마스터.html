<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🅿️ 주차 마스터</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 10%,#075985,#172033 50%,#07111f);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(94vw,700px);height:min(95vh,840px);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#7dd3fc;font-weight:900}h1{margin:2px 0;font-size:clamp(26px,5vw,38px)}.stats{display:flex;gap:7px}.stat{min-width:70px;padding:8px;text-align:center;border:1px solid #ffffff24;border-radius:14px;background:#10213dcc}.stat small{display:block;color:#bae6fd;font-size:9px}.stat b{font-size:20px}.game{position:relative;flex:1;min-height:410px;overflow:hidden;border:1px solid #ffffff25;border-radius:25px;background:#263442;box-shadow:0 25px 70px #0009;touch-action:none}canvas{display:block;width:100%;height:100%}.pad{position:absolute;left:14px;bottom:14px;z-index:3;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px);gap:4px}.pad button{padding:0;border:1px solid #ffffff42;border-radius:10px;color:#fff;background:#0f2945c9;font-size:19px;touch-action:none}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#07111fe8}.overlay.hide{display:none}.card{max-width:390px;padding:28px 24px;text-align:center;border:1px solid #ffffff24;border-radius:23px;background:#102a46}.ico{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{color:#dbeafe;font-size:14px;line-height:1.7}.card>button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#7dd3fc,#a7f3d0);color:#082f49;font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#bae6fd;font-size:12px}@media(min-width:700px){.pad{opacity:.3}}@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.game{border-radius:20px}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">PARKING TEST</div><h1>🅿️ 주차 마스터</h1></div><div class="stats"><div class="stat"><small>시간</small><b id="time">0.0</b></div><div class="stat"><small>충돌</small><b id="hits">0</b></div></div></header><section class="game" id="game"><canvas id="canvas"></canvas><div class="pad"><button class="up" data-k="ArrowUp">▲</button><button class="left" data-k="ArrowLeft">◀</button><button class="down" data-k="ArrowDown">▼</button><button class="right" data-k="ArrowRight">▶</button></div><div class="overlay" id="over"><div class="card"><div class="ico" id="ico">🅿️</div><h2 id="title">후진 주차에 도전하세요</h2><p id="desc">위·아래 키로 전진과 후진,<br>좌우 키로 핸들을 조작합니다.<br>벽과 주차된 차를 피해 초록 주차 칸에 멈추세요.</p><button id="start">운전 시작</button></div></div></section><div class="tip">↑↓ 전진·후진 · ←→ 핸들 · 초록 칸 안에서 정지</div></main><script>
(()=>{const C=document.querySelector('#canvas'),X=C.getContext('2d'),G=document.querySelector('#game'),O=document.querySelector('#over'),TE=document.querySelector('#time'),HE=document.querySelector('#hits');let W,H,D=1,on=false,last=0,elapsed=0,hits=0,car,keys={},walls=[],spot;
function resize(){const r=G.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);layout();draw()}function layout(){spot={x:W-120,y:32,w:82,h:130};walls=[{x:W*.25,y:H*.17,w:65,h:H*.48},{x:W*.55,y:H*.42,w:70,h:H*.48},{x:W-125,y:H*.62,w:90,h:50}]}
function start(){car={x:55,y:H-75,a:0,v:0,w:34,h:58};elapsed=0;hits=0;TE.textContent='0.0';HE.textContent=0;on=true;O.classList.add('hide');last=performance.now();requestAnimationFrame(loop)}
function corners(c,x=c.x,y=c.y,a=c.a){const ca=Math.cos(a),sa=Math.sin(a),pts=[];for(const [dx,dy] of [[-c.w/2,-c.h/2],[c.w/2,-c.h/2],[c.w/2,c.h/2],[-c.w/2,c.h/2]])pts.push({x:x+dx*ca-dy*sa,y:y+dx*sa+dy*ca});return pts}function pointRect(p,r){return p.x>r.x&&p.x<r.x+r.w&&p.y>r.y&&p.y<r.y+r.h}function collides(x,y,a){const pts=corners(car,x,y,a);return pts.some(p=>p.x<5||p.x>W-5||p.y<5||p.y>H-5||walls.some(r=>pointRect(p,r)))}
function update(dt){elapsed+=dt;TE.textContent=elapsed.toFixed(1);const throttle=(keys.ArrowUp?1:0)-(keys.ArrowDown?1:0);car.v+=throttle*170*dt;car.v*=Math.pow(.2,dt);car.v=Math.max(-95,Math.min(145,car.v));if(Math.abs(car.v)>4){const steer=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);car.a+=steer*car.v/145*2.1*dt}const nx=car.x+Math.sin(car.a)*car.v*dt,ny=car.y-Math.cos(car.a)*car.v*dt;if(collides(nx,ny,car.a)){car.v*=-.25;hits++;HE.textContent=hits}else{car.x=nx;car.y=ny}const pts=corners(car);if(pts.every(p=>pointRect(p,spot))&&Math.abs(car.v)<10)finish(true)}
function draw(){X.clearRect(0,0,W,H);X.fillStyle='#334155';X.fillRect(0,0,W,H);X.strokeStyle='#ffffff17';X.lineWidth=2;X.setLineDash([12,14]);for(let y=80;y<H;y+=120){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}X.setLineDash([]);X.fillStyle='#22c55e42';X.fillRect(spot.x,spot.y,spot.w,spot.h);X.strokeStyle='#86efac';X.lineWidth=4;X.strokeRect(spot.x,spot.y,spot.w,spot.h);X.fillStyle='#fff';X.font='bold 24px sans-serif';X.fillText('P',spot.x+32,spot.y+72);for(const r of walls){X.fillStyle='#111827';X.fillRect(r.x,r.y,r.w,r.h);X.fillStyle='#64748b';X.fillRect(r.x+7,r.y+7,r.w-14,r.h-14)}if(car){X.save();X.translate(car.x,car.y);X.rotate(car.a);X.shadowColor='#000';X.shadowBlur=12;X.fillStyle='#38bdf8';X.beginPath();X.roundRect(-car.w/2,-car.h/2,car.w,car.h,9);X.fill();X.fillStyle='#bae6fd';X.fillRect(-car.w*.32,-car.h*.2,car.w*.64,car.h*.25);X.fillStyle='#fb7185';X.fillRect(-car.w*.32,car.h*.37,7,5);X.fillRect(car.w*.32-7,car.h*.37,7,5);X.restore()}}
function finish(win){if(!on)return;on=false;document.querySelector('#ico').textContent='🏁';document.querySelector('#title').textContent='주차 성공!';document.querySelector('#desc').innerHTML=`${elapsed.toFixed(1)}초, 충돌 ${hits}회로 주차했습니다.<br>더 깨끗한 주차 기록에 도전해 보세요.`;document.querySelector('#start').textContent='다시 운전';setTimeout(()=>O.classList.remove('hide'),400)}function loop(t){if(!on)return;const dt=Math.min(.03,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){keys[e.key]=true;e.preventDefault()}});addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{keys[k]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[k]=false});document.querySelector('#start').onclick=start;addEventListener('resize',resize);resize()})();</script></body></html>
