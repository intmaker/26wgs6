<script>
(()=>{
const C=document.querySelector('#canvas');
const X=C.getContext('2d');
const G=document.querySelector('#game');
const O=document.querySelector('#over');

const TE=document.querySelector('#time');
const HE=document.querySelector('#hits');
const SE=document.querySelector('#score');
const ST=document.querySelector('#stage');
const toast=document.querySelector('#toast');

let W,H,D=1;
let on=false;
let last=0;
let remain=45;
let hits=0;
let score=0;
let stage=1;
let difficulty=1;
let car;
let keys={};
let walls=[];
let spot;
let stars=[];
let particles=[];
let movingCars=[];

const difficultyNames=['쉬움','보통','어려움'];

function resize(){
  const r=G.getBoundingClientRect();
  D=Math.min(2,devicePixelRatio||1);
  W=r.width;
  H=r.height;
  C.width=W*D;
  C.height=H*D;
  X.setTransform(D,0,0,D,0,0);
  if(!on) layout();
  draw();
}

function layout(){
  spot={
    x:W-115,
    y:28,
    w:78,
    h:125
  };

  walls=[
    {x:W*.23,y:H*.17,w:66,h:H*.44},
    {x:W*.52,y:H*.46,w:72,h:H*.40}
  ];

  if(stage>=2){
    walls.push({
      x:W-132,
      y:H*.63,
      w:95,
      h:48
    });
  }

  if(stage>=3){
    walls.push({
      x:W*.05,
      y:H*.28,
      w:80,
      h:44
    });
  }

  stars=[
    {x:W*.20,y:H*.78,taken:false},
    {x:W*.48,y:H*.25,taken:false},
    {x:W*.76,y:H*.48,taken:false}
  ];

  movingCars=[];

  if(stage>=2){
    movingCars.push({
      x:W*.15,
      y:H*.42,
      w:34,
      h:60,
      dir:1,
      speed:40+stage*6
    });
  }

  if(stage>=3){
    movingCars.push({
      x:W*.72,
      y:H*.74,
      w:34,
      h:60,
      dir:-1,
      speed:48+stage*7
    });
  }
}

function start(){
  layout();

  car={
    x:55,
    y:H-75,
    a:0,
    v:0,
    w:34,
    h:58
  };

  remain=Math.max(24,48-stage*3-difficulty*3);
  hits=0;
  score=0;
  particles=[];

  TE.textContent=Math.ceil(remain);
  HE.textContent=0;
  SE.textContent=0;
  ST.textContent=stage;

  on=true;
  O.classList.add('hide');
  last=performance.now();
  requestAnimationFrame(loop);
}

function corners(c,x=c.x,y=c.y,a=c.a){
  const ca=Math.cos(a);
  const sa=Math.sin(a);
  const pts=[];

  for(const [dx,dy] of [
    [-c.w/2,-c.h/2],
    [ c.w/2,-c.h/2],
    [ c.w/2, c.h/2],
    [-c.w/2, c.h/2]
  ]){
    pts.push({
      x:x+dx*ca-dy*sa,
      y:y+dx*sa+dy*ca
    });
  }
  return pts;
}

function pointRect(p,r){
  return p.x>r.x &&
         p.x<r.x+r.w &&
         p.y>r.y &&
         p.y<r.y+r.h;
}

function rectHit(a,b){
  return !(
    a.x+a.w/2 < b.x-b.w/2 ||
    a.x-a.w/2 > b.x+b.w/2 ||
    a.y+a.h/2 < b.y-b.h/2 ||
    a.y-a.h/2 > b.y+b.h/2
  );
}

function collides(x,y,a){
  const pts=corners(car,x,y,a);

  if(
    pts.some(p=>
      p.x<5 ||
      p.x>W-5 ||
      p.y<5 ||
      p.y>H-5
    )
  ) return true;

  if(
    pts.some(p=>
      walls.some(r=>pointRect(p,r))
    )
  ) return true;

  for(const mc of movingCars){
    if(rectHit(
      {x,y,w:car.w,h:car.h},
      mc
    )) return true;
  }

  return false;
}

function crash(){
  car.v*=-.32;
  hits++;
  score=Math.max(0,score-35);

  HE.textContent=hits;
  SE.textContent=score;

  G.classList.remove('shake');
  void G.offsetWidth;
  G.classList.add('shake');

  showToast('💥 충돌 -35');
}

function showToast(txt){
  toast.textContent=txt;
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');

  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>{
    toast.classList.remove('show');
  },650);
}

function starParticles(x,y){
  for(let i=0;i<12;i++){
    particles.push({
      x,y,
      vx:(Math.random()-.5)*120,
      vy:(Math.random()-.5)*120,
      life:1
    });
  }
}

function update(dt){
  remain-=dt;

  if(remain<=0){
    remain=0;
    TE.textContent='0';
    finish(false,'시간 초과!');
    return;
  }

  TE.textContent=Math.ceil(remain);

  const throttle=
    (keys.ArrowUp?1:0)-
    (keys.ArrowDown?1:0);

  const accel=175+difficulty*15;

  car.v+=throttle*accel*dt;
  car.v*=Math.pow(.2,dt);

  const maxForward=150+difficulty*12;
  const maxReverse=100+difficulty*8;

  car.v=Math.max(
    -maxReverse,
    Math.min(maxForward,car.v)
  );

  if(Math.abs(car.v)>4){
    const steer=
      (keys.ArrowRight?1:0)-
      (keys.ArrowLeft?1:0);

    car.a+=
      steer*
      car.v/maxForward*
      2.15*
      dt;
  }

  const nx=
    car.x+
    Math.sin(car.a)*
    car.v*
    dt;

  const ny=
    car.y-
    Math.cos(car.a)*
    car.v*
    dt;

  if(collides(nx,ny,car.a)){
    crash();
  }else{
    car.x=nx;
    car.y=ny;
  }

  for(const mc of movingCars){
    mc.y+=mc.dir*mc.speed*dt;

    if(mc.y<70){
      mc.y=70;
      mc.dir=1;
    }

    if(mc.y>H-70){
      mc.y=H-70;
      mc.dir=-1;
    }
  }

  for(const s of stars){
    if(s.taken) continue;

    const dist=Math.hypot(
      car.x-s.x,
      car.y-s.y
    );

    if(dist<32){
      s.taken=true;
      score+=100;
      SE.textContent=score;
      showToast('⭐ 별 획득 +100');
      starParticles(s.x,s.y);
    }
  }

  for(const p of particles){
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=90*dt;
    p.life-=dt*1.8;
  }

  particles=particles.filter(
    p=>p.life>0
  );

  checkParking();
}

function checkParking(){
  const pts=corners(car);

  const inside=
    pts.every(p=>pointRect(p,spot));

  if(!inside) return;

  if(Math.abs(car.v)>9) return;

  let normalized=
    ((car.a%(Math.PI*2))+
      Math.PI*2)%
      (Math.PI*2);

  const angleDiff=Math.min(
    Math.abs(normalized),
    Math.abs(Math.PI*2-normalized),
    Math.abs(normalized-Math.PI)
  );

  if(angleDiff>.34){
    showToast('↔ 차를 주차선과 맞추세요');
    return;
  }

  finish(true);
}

function drawRoad(){
  X.fillStyle='#334155';
  X.fillRect(0,0,W,H);

  X.fillStyle='#263340';

  for(let x=0;x<W;x+=80){
    X.fillRect(x,0,1,H);
  }

  X.strokeStyle='#ffffff18';
  X.lineWidth=2;
  X.setLineDash([12,14]);

  for(let y=85;y<H;y+=120){
    X.beginPath();
    X.moveTo(0,y);
    X.lineTo(W,y);
    X.stroke();
  }

  X.setLineDash([]);
}

function drawParking(){
  X.fillStyle='#22c55e38';
  X.fillRect(
    spot.x,
    spot.y,
    spot.w,
    spot.h
  );

  X.strokeStyle='#86efac';
  X.lineWidth=4;
  X.strokeRect(
    spot.x,
    spot.y,
    spot.w,
    spot.h
  );

  X.fillStyle='#fff';
  X.font='bold 24px sans-serif';
  X.fillText(
    'P',
    spot.x+29,
    spot.y+70
  );

  X.font='10px sans-serif';
  X.fillStyle='#bbf7d0';
  X.fillText(
    'PARK HERE',
    spot.x+9,
    spot.y+103
  );
}

function drawObstacle(r){
  X.fillStyle='#111827';
  X.fillRect(
    r.x,
    r.y,
    r.w,
    r.h
  );

  X.fillStyle='#64748b';
  X.fillRect(
    r.x+7,
    r.y+7,
    r.w-14,
    r.h-14
  );

  X.fillStyle='#94a3b8';

  for(let y=r.y+15;
      y<r.y+r.h-10;
      y+=20){
    X.fillRect(
      r.x+4,
      y,
      4,
      8
    );
    X.fillRect(
      r.x+r.w-8,
      y,
      4,
      8
    );
  }
}

function drawCar(c,color='#38bdf8'){
  X.save();

  X.translate(c.x,c.y);
  X.rotate(c.a||0);

  X.shadowColor='#000';
  X.shadowBlur=12;

  X.fillStyle=color;
  X.beginPath();

  if(X.roundRect){
    X.roundRect(
      -c.w/2,
      -c.h/2,
      c.w,
      c.h,
      9
    );
  }else{
    X.rect(
      -c.w/2,
      -c.h/2,
      c.w,
      c.h
    );
  }

  X.fill();

  X.fillStyle='#bae6fd';
  X.fillRect(
    -c.w*.32,
    -c.h*.2,
    c.w*.64,
    c.h*.25
  );

  X.fillStyle='#0f172a';
  X.fillRect(
    -c.w*.34,
    c.h*.05,
    c.w*.68,
    c.h*.14
  );

  X.fillStyle='#fef08a';
  X.fillRect(
    -c.w*.31,
    -c.h*.45,
    7,
    5
  );

  X.fillRect(
    c.w*.31-7,
    -c.h*.45,
    7,
    5
  );

  X.fillStyle='#fb7185';
  X.fillRect(
    -c.w*.31,
    c.h*.37,
    7,
    5
  );

  X.fillRect(
    c.w*.31-7,
    c.h*.37,
    7,
    5
  );

  X.restore();
}

function drawStars(){
  X.font='25px sans-serif';

  for(const s of stars){
    if(s.taken) continue;

    const pulse=
      1+
      Math.sin(
        performance.now()/180
      )*.12;

    X.save();
    X.translate(s.x,s.y);
    X.scale(pulse,pulse);
    X.fillText('⭐',-13,10);
    X.restore();
  }
}

function drawMovingCars(){
  for(const mc of movingCars){
    drawCar({
      x:mc.x,
      y:mc.y,
      w:mc.w,
      h:mc.h,
      a:0
    },'#f97316');
  }
}

function drawParticles(){
  for(const p of particles){
    X.globalAlpha=p.life;
    X.fillStyle='#fde047';
    X.beginPath();
    X.arc(
      p.x,
      p.y,
      4,
      0,
      Math.PI*2
    );
    X.fill();
  }

  X.globalAlpha=1;
}

function draw(){
  X.clearRect(0,0,W,H);

  drawRoad();
  drawParking();

  for(const r of walls){
    drawObstacle(r);
  }

  drawStars();
  drawMovingCars();
  drawParticles();

  if(car){
    drawCar(car);
  }
}

function finish(win,reason=''){
  if(!on) return;

  on=false;

  let resultScore=score;

  if(win){
    resultScore+=
      Math.floor(remain*10);

    resultScore+=
      Math.max(0,300-hits*60);

    score=resultScore;
    SE.textContent=score;

    let starsWon=1;

    if(hits<=2) starsWon=2;
    if(hits===0 && remain>10) starsWon=3;

    const starText=
      '⭐'.repeat(starsWon)+
      '☆'.repeat(3-starsWon);

    document.querySelector('#ico')
      .textContent='🏁';

    document.querySelector('#title')
      .textContent='주차 성공!';

    document.querySelector('#desc')
      .innerHTML=
      `${starText}<br><br>`+
      `점수 <b>${score}</b>점<br>`+
      `충돌 ${hits}회 · 남은 시간 ${Math.ceil(remain)}초<br><br>`+
      `다음 스테이지는 더 어려워집니다.`;

    document.querySelector('#start')
      .textContent='다음 스테이지';

    document.querySelector('#start')
      .onclick=()=>{
        stage++;
        start();
      };

  }else{

    document.querySelector('#ico')
      .textContent='⏰';

    document.querySelector('#title')
      .textContent=reason || '도전 실패';

    document.querySelector('#desc')
      .innerHTML=
      `시간 안에 주차하지 못했습니다.<br>`+
      `현재 점수 ${score}점<br><br>`+
      `장애물을 피하고 별을 먹은 뒤<br>`+
      `주차선 안에서 천천히 멈춰보세요.`;

    document.querySelector('#start')
      .textContent='다시 도전';

    document.querySelector('#start')
      .onclick=start;
  }

  setTimeout(()=>{
    O.classList.remove('hide');
  },400);
}

function loop(t){
  if(!on) return;

  const dt=
    Math.min(
      .03,
      (t-last)/1000
    );

  last=t;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

addEventListener(
  'keydown',
  e=>{
    if(
