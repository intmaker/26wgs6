<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🎣 심해 낚시</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 0,#0369a1,#082f49 48%,#020617);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(94vw,680px);height:min(95vh,830px);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#67e8f9;font-weight:900}h1{margin:2px 0;font-size:clamp(26px,5vw,38px)}.stats{display:flex;gap:7px}.stat{min-width:70px;padding:8px;text-align:center;border:1px solid #ffffff24;border-radius:14px;background:#082f49cc}.stat small{display:block;color:#a5f3fc;font-size:9px}.stat b{font-size:20px}.game{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff25;border-radius:25px;background:linear-gradient(#0284c7,#075985 35%,#082f49 72%,#06152b);box-shadow:0 25px 70px #0009;touch-action:none}.bubbles{position:absolute;inset:0;background-image:radial-gradient(circle,#ffffff4d 0 2px,transparent 3px);background-size:73px 91px;opacity:.45}.meter{position:absolute;left:50%;top:12%;bottom:15%;width:82px;transform:translateX(-50%);border:5px solid #dbeafe;border-radius:40px;background:#031d35aa;overflow:hidden}.catch{position:absolute;left:7px;right:7px;height:95px;border-radius:30px;background:#4ade8060;border:3px solid #86efac;box-shadow:0 0 18px #22c55e;transition:bottom .03s}.fish{position:absolute;left:50%;font-size:45px;transform:translate(-50%,50%);filter:drop-shadow(0 6px 7px #0008)}.progress{position:absolute;left:20px;right:20px;bottom:18px;height:18px;border-radius:10px;background:#02061799;overflow:hidden;border:1px solid #ffffff25}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#22d3ee,#4ade80,#fde047);transition:width .08s}.instruction{position:absolute;left:50%;top:5%;transform:translateX(-50%);white-space:nowrap;padding:7px 12px;border-radius:999px;background:#03182cbf;font-size:12px;font-weight:800}.reel{position:absolute;right:20px;bottom:58px;width:105px;height:60px;border:1px solid #ffffff40;border-radius:16px;background:#0c4a6ec7;color:#fff;font-weight:900;font-size:16px;touch-action:none}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#03182ce8}.overlay.hide{display:none}.card{max-width:390px;padding:28px 24px;text-align:center;border:1px solid #ffffff24;border-radius:23px;background:#073b5b}.ico{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{color:#cffafe;font-size:14px;line-height:1.7}.card>button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#67e8f9,#fde68a);color:#083344;font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#a5f3fc;font-size:12px}@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.game{border-radius:20px}.meter{width:74px}.reel{right:12px}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">DEEP SEA</div><h1>🎣 심해 낚시</h1></div><div class="stats"><div class="stat"><small>잡은 물고기</small><b id="score">0</b></div><div class="stat"><small>남은 시간</small><b id="time">45</b></div></div></header><section class="game" id="game"><div class="bubbles"></div><div class="instruction">물고기를 초록 바 안에 유지하세요</div><div class="meter" id="meter"><div class="catch" id="catch"></div><div class="fish" id="fish">🐟</div></div><div class="progress"><i id="progress"></i></div><button class="reel" id="reel">줄 감기 ↑</button><div class="overlay" id="over"><div class="card"><div class="ico" id="ico">🎣</div><h2 id="title">심해의 물고기를 낚아요</h2><p id="desc"><b>버튼이나 스페이스를 누르면</b> 초록 바가 올라가고<br>놓으면 천천히 내려옵니다.<br>움직이는 물고기를 바 안에 유지해 포획 게이지를 채우세요.</p><button id="start">낚시 시작</button></div></div></section><div class="tip">누르고 있으면 상승 · 놓으면 하강 · 물고기를 초록 영역 안에 유지</div></main><script>
(()=>{const meter=document.querySelector('#meter'),catchEl=document.querySelector('#catch'),fishEl=document.querySelector('#fish'),prog=document.querySelector('#progress'),over=document.querySelector('#over'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),reel=document.querySelector('#reel');let on=false,held=false,last=0,left=45,score=0,bar=.25,bv=0,fish=.65,fv=.1,progress=0,timer;
function start(){clearInterval(timer);score=0;left=45;bar=.2;bv=0;fish=.7;fv=-.08;progress=0;scoreEl.textContent=0;timeEl.textContent=45;over.classList.add('hide');on=true;last=performance.now();timer=setInterval(()=>{timeEl.textContent=--left;if(left<=0)finish()},1000);requestAnimationFrame(loop)}
function update(dt){bv+=(held?.9:-.72)*dt;bv*=Math.pow(.09,dt);bar+=bv*dt;if(bar<0){bar=0;bv=0}if(bar>.83){bar=.83;bv=0}fv+=(Math.random()-.5)*.85*dt;fv*=Math.pow(.6,dt);fish+=fv*dt;if(fish<.04){fish=.04;fv=Math.abs(fv)}if(fish>.96){fish=.96;fv=-Math.abs(fv)}const inside=fish>bar&&fish<bar+.17;progress+=dt*(inside?30:-16);progress=Math.max(0,Math.min(100,progress));if(progress>=100){score++;scoreEl.textContent=score;progress=0;fish=Math.random()*.7+.15;fv=(Math.random()-.5)*.5;fishEl.textContent=['🐟','🐠','🐡','🦑'][score%4]}}
function draw(){catchEl.style.bottom=(bar*100)+'%';fishEl.style.bottom=(fish*100)+'%';prog.style.width=progress+'%'}function loop(t){if(!on)return;const dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}function finish(){if(!on)return;on=false;clearInterval(timer);document.querySelector('#ico').textContent=score>=5?'🏆':'🐟';document.querySelector('#title').textContent=`물고기 ${score}마리!`;document.querySelector('#desc').innerHTML='버튼을 계속 누르기보다 물고기 움직임에 맞춰<br>짧게 눌렀다 놓는 것이 핵심입니다.';document.querySelector('#start').textContent='다시 낚시';over.classList.remove('hide')}function down(e){e?.preventDefault();held=true}function up(){held=false}reel.onpointerdown=e=>{down(e);reel.setPointerCapture(e.pointerId)};reel.onpointerup=reel.onpointercancel=up;addEventListener('keydown',e=>{if(e.code==='Space'){down(e)}});addEventListener('keyup',e=>{if(e.code==='Space')up()});document.querySelector('#start').onclick=start;
})();</script></body></html>
