<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>같은 소리 찾기</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui;background:radial-gradient(circle,#c4b5fd,#60a5fa);color:#1e1b4b;user-select:none;touch-action:manipulation}.app{max-width:760px;height:100%;margin:auto;padding:8px;display:flex;flex-direction:column;gap:7px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hud b{background:#fff;padding:7px 10px;border-radius:99px}.arena{flex:1;min-height:320px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;border-radius:50px;background:#ffffffaa}.target{padding:15px 25px;border-radius:20px;background:#8b5cf6;color:#fff;text-align:center}.target i{font-style:normal;font-size:60px}.target b{display:block;font-size:30px}.question{font-size:21px;font-weight:900}.answers{display:flex;width:94%;gap:9px;justify-content:center}.answers button{flex:1;max-width:180px;min-height:105px;border:0;border-radius:20px;background:#fff;color:#312e81;font-weight:900}.answers i{display:block;font-style:normal;font-size:43px}.answers b{font-size:17px}.msg{min-height:26px;font-weight:800}.tip{text-align:center}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#312e81cc;padding:15px}.hide{display:none}.card{width:min(410px,100%);padding:24px;text-align:center;background:#fff;border-radius:22px}.card div{font-size:55px}.card button{width:100%;min-height:50px;border:0;border-radius:13px;background:#a78bfa;font-weight:900}</style></head><body><main class="app"><h1>🎯 같은 소리 단어 찾기</h1><div class="hud"><b>⏱ <span id="time">60</span></b><b>점수 <span id="score">100</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div><section class="arena"><div class="target"><i id="te">🐱</i><b id="tw">CAT</b></div><div class="question">같은 첫소리 단어는?</div><div class="answers" id="answers"></div><div class="msg" id="msg"></div></section><div class="tip">두 단어의 맨 앞 소리를 비교해요.</div></main><div class="overlay" id="overlay"><div class="card"><div>🐱 🚗</div><h2 id="title">같은 소리 찾기</h2><p id="text">CAT과 CAR는 C 소리로 함께 시작해요!</p><button id="start">게임 시작</button></div></div><script>const $=s=>document.querySelector(s);const groups={B:[['⚽','BALL'],['🍌','BANANA'],['🚌','BUS']],C:[['🐱','CAT'],['🚗','CAR'],['🥤','CUP']],D:[['🐶','DOG'],['🦆','DUCK'],['🥁','DRUM']],F:[['🐟','FISH'],['🪭','FAN'],['🌸','FLOWER']],S:[['☀️','SUN'],['🧦','SOCK'],['⭐','STAR']],M:[['🌙','MOON'],['🐭','MOUSE'],['🥛','MILK']],P:[['🐷','PIG'],['✏️','PEN'],['🍕','PIZZA']],T:[['🐯','TIGER'],['🌳','TREE'],['🚆','TRAIN']],H:[['🎩','HAT'],['🏠','HOUSE'],['🐴','HORSE']],G:[['🐐','GOAT'],['🎁','GIFT'],['🍇','GRAPE']]};let time,score,combo,maxCombo,correct,timer,on,answer,best=0;try{best=+(localStorage.getItem('engSoundBest')||0)}catch(e){}$('#best').textContent=best;function ui(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo}function next(){let keys=Object.keys(groups).slice(0,time>45?5:time>25?8:10),key=keys[Math.floor(Math.random()*keys.length)],g=groups[key],target=g[Math.floor(Math.random()*g.length)],right=g.find(x=>x!==target),others=keys.filter(k=>k!==key).sort(()=>Math.random()-.5).slice(0,2).map(k=>groups[k][Math.floor(Math.random()*3)]);answer=right[1];$('#te').textContent=target[0];$('#tw').textContent=target[1];$('#answers').innerHTML=[right,...others].sort(()=>Math.random()-.5).map(x=>`<button data-w="${x[1]}"><i>${x[0]}</i><b>${x[1]}</b></button>`).join('');$('#msg').textContent=''}$('#answers').onclick=e=>{let b=e.target.closest('[data-w]');if(!on||!b)return;if(b.dataset.w===answer){score+=10+Math.min(combo*2,8);combo++;correct++;maxCombo=Math.max(maxCombo,combo);$('#msg').textContent='🌟 같은 소리예요!';b.animate([{scale:1},{scale:1.12},{scale:1}],{duration:280})}else{score=Math.max(0,score-5);combo=0;$('#msg').textContent='다시 들어보듯 첫 글자를 봐요!'}ui();if(!score)return end();setTimeout(next,380)};function start(){time=60;score=100;combo=maxCombo=correct=0;on=true;$('#overlay').classList.add('hide');ui();next();clearInterval(timer);timer=setInterval(()=>{time--;ui();if(!time)end()},1000)}function end(){if(!on)return;on=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('engSoundBest',best)}catch(e){}$('#title').textContent='🎵 소리 찾기 완료!';$('#text').innerHTML=`점수 ${score}<br>정답 ${correct}개 · 최고 콤보 ${maxCombo}<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;</script></body></html>
