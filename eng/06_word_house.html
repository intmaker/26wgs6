<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>영어 단어 집</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui;background:linear-gradient(#93c5fd,#bbf7d0);color:#1e3a8a;user-select:none;touch-action:manipulation}.app{max-width:740px;height:100%;margin:auto;padding:8px;display:flex;flex-direction:column;gap:7px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hud b{background:#fff;padding:7px 10px;border-radius:99px}.yard{position:relative;flex:1;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:24px;background:#ffffff55}.house{position:relative;font-size:100px}.decor{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:22px}.word{padding:8px 25px;border-radius:15px;background:#fff;font-size:clamp(31px,8vw,48px);font-weight:1000}.answers{display:flex;width:92%;gap:10px;justify-content:center}.answers button{flex:1;max-width:155px;min-height:90px;border:0;border-radius:20px;background:#fef3c7;font-size:50px}.answers button.home{animation:home .45s}@keyframes home{to{translate:0 -100px;scale:.3;opacity:0}}.msg{min-height:26px;font-weight:800}.tip{text-align:center}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#1e40afcc;padding:15px}.hide{display:none}.card{width:min(410px,100%);padding:24px;text-align:center;background:#fff;border-radius:22px}.card div{font-size:55px}.card button{width:100%;min-height:50px;border:0;border-radius:13px;background:#60a5fa;font-weight:900}</style></head><body><main class="app"><h1>🏠 영어 단어 집</h1><div class="hud"><b>⏱ <span id="time">60</span></b><b>점수 <span id="score">100</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div><section class="yard"><div class="house"><span class="decor" id="decor"></span>🏠</div><div class="word" id="word">CAT</div><div class="answers" id="answers"></div><div class="msg" id="msg">맞는 그림의 집을 찾아요!</div></section><div class="tip">영어 단어와 같은 그림을 눌러요.</div></main><div class="overlay" id="overlay"><div class="card"><div>🏠🐱</div><h2 id="title">영어 단어 집</h2><p id="text">CAT을 보고 🐱 그림을 찾아요!</p><button id="start">게임 시작</button></div></div><script>const $=s=>document.querySelector(s);const words=[['CAT','🐱'],['DOG','🐶'],['PIG','🐷'],['FISH','🐟'],['BIRD','🐦'],['APPLE','🍎'],['BANANA','🍌'],['SUN','☀️'],['MOON','🌙'],['STAR','⭐'],['CAR','🚗'],['BUS','🚌'],['BOOK','📘'],['BALL','⚽'],['HAT','🎩'],['CUP','🥤'],['TREE','🌳'],['FLOWER','🌸']];let time,score,combo,maxCombo,correct,timer,on,answer,best=0;try{best=+(localStorage.getItem('engHouseBest')||0)}catch(e){}$('#best').textContent=best;function ui(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo;$('#decor').textContent='⭐'.repeat(Math.min(5,Math.floor(combo/3)))}function next(){let max=time>45?8:time>25?13:18,w=words[Math.floor(Math.random()*max)];answer=w[1];$('#word').textContent=w[0];let s=new Set([answer]);while(s.size<3)s.add(words[Math.floor(Math.random()*max)][1]);$('#answers').innerHTML=[...s].sort(()=>Math.random()-.5).map(x=>`<button data-e="${x}">${x}</button>`).join('');$('#msg').textContent='맞는 그림의 집을 찾아요!'}$('#answers').onclick=e=>{if(!on||!e.target.dataset.e)return;if(e.target.dataset.e===answer){score+=10+Math.min(combo*2,8);combo++;correct++;maxCombo=Math.max(maxCombo,combo);e.target.classList.add('home');$('#msg').textContent='🏠 집을 잘 찾았어요!'}else{score=Math.max(0,score-5);combo=0;$('#msg').textContent='괜찮아요! 단어를 다시 봐요.';e.target.animate([{rotate:'-5deg'},{rotate:'5deg'}],{duration:200})}ui();if(!score)return end();setTimeout(next,430)};function start(){time=60;score=100;combo=maxCombo=correct=0;on=true;$('#overlay').classList.add('hide');ui();next();clearInterval(timer);timer=setInterval(()=>{time--;ui();if(!time)end()},1000)}function end(){if(!on)return;on=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('engHouseBest',best)}catch(e){}$('#title').textContent='🌟 단어 집 완성!';$('#text').innerHTML=`점수 ${score}<br>정답 ${correct}개 · 최고 콤보 ${maxCombo}<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;</script></body></html>
