<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>파닉스 첫소리</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui;background:linear-gradient(145deg,#fef08a,#bbf7d0);color:#365314;user-select:none;touch-action:manipulation}.app{max-width:700px;height:100%;margin:auto;padding:8px;display:flex;flex-direction:column;gap:8px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hud b{background:#fff;padding:7px 10px;border-radius:99px}.garden{flex:1;min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:25px;background:#fff9}.bee{font-size:55px;animation:bee 1s ease-in-out infinite}@keyframes bee{50%{translate:12px -8px}}.word{font-size:clamp(30px,8vw,50px);font-weight:1000}.emoji{font-size:75px}.question{font-size:20px;font-weight:800}.answers{display:flex;width:90%;gap:11px;justify-content:center}.answers button{flex:1;max-width:145px;min-height:70px;border:0;border-radius:50%;background:#facc15;color:#713f12;font:1000 33px system-ui}.msg{min-height:28px;font-weight:800}.tip{text-align:center}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#3f6212cc;padding:15px}.hide{display:none}.card{width:min(410px,100%);padding:24px;text-align:center;background:#fff;border-radius:22px}.card div{font-size:55px}.card button{width:100%;min-height:50px;border:0;border-radius:13px;background:#fde047;font-weight:900}</style></head><body><main class="app"><h1>🐝 파닉스 첫소리</h1><div class="hud"><b>⏱ <span id="time">60</span></b><b>점수 <span id="score">100</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div><section class="garden"><div class="bee">🐝</div><div class="emoji" id="emoji">🍎</div><div class="word" id="word">APPLE</div><div class="question">첫소리는 어떤 알파벳일까요?</div><div class="answers" id="answers"></div><div class="msg" id="msg"></div></section><div class="tip">단어의 맨 앞 글자를 찾아요.</div></main><div class="overlay" id="overlay"><div class="card"><div>🐝 A</div><h2 id="title">파닉스 첫소리</h2><p id="text">🍎 APPLE은 A 소리로 시작해요!</p><button id="start">게임 시작</button></div></div><script>const $=s=>document.querySelector(s);const words=[['🍎','APPLE'],['⚽','BALL'],['🐱','CAT'],['🐶','DOG'],['🥚','EGG'],['🐟','FISH'],['🐐','GOAT'],['🎩','HAT'],['🧊','ICE'],['🧃','JUICE'],['🪁','KITE'],['🦁','LION'],['🌙','MOON'],['👃','NOSE'],['🍊','ORANGE'],['🐷','PIG'],['👸','QUEEN'],['🐰','RABBIT'],['☀️','SUN'],['🐯','TIGER']];let time,score,combo,maxCombo,correct,timer,on,answer,best=0;try{best=+(localStorage.getItem('engPhonicsBest')||0)}catch(e){}$('#best').textContent=best;function ui(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo}function next(){let max=time>45?8:time>25?14:20,w=words[Math.floor(Math.random()*max)];answer=w[1][0];$('#emoji').textContent=w[0];$('#word').textContent=w[1];let s=new Set([answer]);while(s.size<3)s.add(words[Math.floor(Math.random()*max)][1][0]);$('#answers').innerHTML=[...s].sort(()=>Math.random()-.5).map(c=>`<button data-c="${c}">${c}</button>`).join('');$('#msg').textContent=''}$('#answers').onclick=e=>{if(!on||!e.target.dataset.c)return;if(e.target.dataset.c===answer){score+=10+Math.min(combo*2,8);combo++;correct++;maxCombo=Math.max(maxCombo,combo);$('#msg').textContent='✨ 맞아요! 첫소리를 찾았어요.';$('.bee').animate([{scale:1},{scale:1.3},{scale:1}],{duration:300})}else{score=Math.max(0,score-5);combo=0;$('#msg').textContent='괜찮아요! 단어의 첫 글자를 봐요.'}ui();if(!score)return end();setTimeout(next,380)};function start(){time=60;score=100;combo=maxCombo=correct=0;on=true;$('#overlay').classList.add('hide');ui();next();clearInterval(timer);timer=setInterval(()=>{time--;ui();if(!time)end()},1000)}function end(){if(!on)return;on=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('engPhonicsBest',best)}catch(e){}$('#title').textContent='🍯 파닉스 놀이 끝!';$('#text').innerHTML=`점수 ${score}<br>정답 ${correct}개 · 최고 콤보 ${maxCombo}<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;</script></body></html>
