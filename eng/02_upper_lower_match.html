<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>대소문자 짝맞추기</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui;background:linear-gradient(145deg,#ede9fe,#fbcfe8);color:#4c1d95;user-select:none;touch-action:manipulation}.app{max-width:700px;height:100%;margin:auto;padding:8px;display:flex;flex-direction:column;gap:8px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hud b{background:#fff;padding:7px 10px;border-radius:99px}.play{flex:1;min-height:310px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;border-radius:24px;background:#fff8}.letter{display:grid;place-items:center;width:150px;height:150px;border-radius:50%;background:#a78bfa;color:#fff;font-size:90px;font-weight:1000;box-shadow:0 15px 30px #6d28d940}.answers{display:flex;gap:12px;width:90%;justify-content:center}.answers button{flex:1;max-width:150px;min-height:75px;border:0;border-radius:20px;background:#f9a8d4;color:#701a75;font:1000 42px system-ui}.link{min-height:35px;font-size:25px;font-weight:900}.heart{animation:heart .4s}@keyframes heart{50%{scale:1.3}}.tip{text-align:center}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#581c87cc;padding:15px}.hide{display:none}.card{width:min(410px,100%);padding:24px;text-align:center;background:#fff;border-radius:22px}.card div{font-size:55px}.card button{width:100%;min-height:50px;border:0;border-radius:13px;background:#c4b5fd;font-weight:900}</style></head><body><main class="app"><h1>🔠 대소문자 짝맞추기</h1><div class="hud"><b>⏱ <span id="time">60</span></b><b>점수 <span id="score">100</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div><section class="play"><div class="letter" id="letter">A</div><div class="link" id="msg">짝을 찾아요!</div><div class="answers" id="answers"></div></section><div class="tip">대문자와 소문자는 서로 짝꿍이에요.</div></main><div class="overlay" id="overlay"><div class="card"><div>🔠💕</div><h2 id="title">대소문자 짝맞추기</h2><p id="text">A의 짝 a를 찾아보세요!</p><button id="start">게임 시작</button></div></div><script>const $=s=>document.querySelector(s);let time,score,combo,maxCombo,correct,timer,on,answer,best=0;try{best=+(localStorage.getItem('engCaseBest')||0)}catch(e){}$('#best').textContent=best;const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';function ui(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo}function next(){let range=time>45?8:time>25?16:26,i=Math.floor(Math.random()*range),reverse=time<35&&Math.random()<.4,shown=reverse?A[i].toLowerCase():A[i];answer=reverse?A[i]:A[i].toLowerCase();$('#letter').textContent=shown;let s=new Set([answer]);while(s.size<3){let c=A[Math.floor(Math.random()*range)];s.add(reverse?c:c.toLowerCase())}$('#answers').innerHTML=[...s].sort(()=>Math.random()-.5).map(c=>`<button data-c="${c}">${c}</button>`).join('');$('#msg').textContent='짝을 찾아요!'}$('#answers').onclick=e=>{if(!on||!e.target.dataset.c)return;if(e.target.dataset.c===answer){score+=10+Math.min(combo*2,8);combo++;correct++;maxCombo=Math.max(maxCombo,combo);$('#msg').textContent=`${$('#letter').textContent} 💕 ${answer}`;$('#msg').classList.add('heart');setTimeout(next,350)}else{score=Math.max(0,score-5);combo=0;$('#msg').textContent='다시 살펴봐요!';e.target.animate([{rotate:'-5deg'},{rotate:'5deg'}],{duration:200})}ui();if(!score)end()};function start(){time=60;score=100;combo=maxCombo=correct=0;on=true;$('#overlay').classList.add('hide');ui();next();clearInterval(timer);timer=setInterval(()=>{time--;ui();if(!time)end()},1000)}function end(){if(!on)return;on=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('engCaseBest',best)}catch(e){}$('#title').textContent='💖 짝맞추기 완료!';$('#text').innerHTML=`점수 ${score}<br>정답 ${correct}개 · 최고 콤보 ${maxCombo}<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;</script></body></html>
