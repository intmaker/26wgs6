<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>문장 순서 맞추기</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui;background:linear-gradient(#bae6fd,#ddd6fe);color:#312e81;user-select:none;touch-action:manipulation}.app{max-width:760px;height:100%;margin:auto;padding:7px;display:flex;flex-direction:column;gap:7px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hud b{background:#fff;padding:6px 9px;border-radius:99px}.room{flex:1;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;border-radius:24px;background:#fff9}.character{font-size:55px}.sentence{width:92%;min-height:68px;padding:12px;border:3px dashed #8b5cf6;border-radius:16px;text-align:center;font-size:22px;font-weight:900}.words{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;width:94%}.words button{min-height:50px;padding:8px 14px;border:0;border-radius:13px;background:#60a5fa;color:#172554;font-weight:900}.actions button{min-height:46px;border:0;border-radius:12px;padding:8px 18px;background:#c4b5fd;font-weight:900}.bubble{min-height:30px;font-weight:800}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#312e81dd;padding:15px}.hide{display:none}.card{width:min(420px,100%);padding:24px;text-align:center;background:#fff;border-radius:22px}.card div{font-size:55px}.card button{width:100%;min-height:50px;border:0;border-radius:13px;background:#60a5fa;font-weight:900}</style></head><body><main class="app"><h1>💬 문장 순서 맞추기</h1><div class="hud"><b>⏱ <span id="time">100</span></b><b>점수 <span id="score">200</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div><section class="room"><div class="character">🧒💭</div><div class="sentence" id="sentence">단어를 순서대로 눌러요</div><div class="words" id="words"></div><div class="actions"><button id="undo">↶ 지우기</button></div><div class="bubble" id="msg"></div></section></main><div class="overlay" id="overlay"><div class="card"><div>💬 ABC</div><h2 id="title">문장 순서 맞추기</h2><p id="text">I / like / apples. 를 순서대로 눌러요!</p><button id="start">게임 시작</button></div></div><script>const $=s=>document.querySelector(s);const sentences=['I am happy.','I like apples.','I have a dog.','This is my book.','It is sunny.','He is tall.','She is kind.','We play soccer.','I can swim.','I can read.','This is a red ball.','We play in the park.','She has a blue bag.'];let time,score,combo,maxCombo,ok,bad,timer,on,target,picked,best=0;try{best=+(localStorage.getItem('sentenceOrderBest')||0)}catch(e){}$('#best').textContent=best;function ui(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo}function render(){$('#sentence').textContent=picked.map(x=>x.word).join(' ')||'단어를 순서대로 눌러요';document.querySelectorAll('[data-i]').forEach(b=>b.disabled=picked.some(x=>x.i==b.dataset.i))}function next(){let max=time>80?7:time>40?10:13;target=sentences[Math.floor(Math.random()*max)].split(' ');picked=[];$('#words').innerHTML=target.map((w,i)=>({w,i})).sort(()=>Math.random()-.5).map(x=>`<button data-i="${x.i}" data-w="${x.w}">${x.w}</button>`).join('');$('#msg').textContent='';render()}$('#words').onclick=e=>{if(!on||e.target.dataset.i===undefined)return;picked.push({i:e.target.dataset.i,word:e.target.dataset.w});render();if(picked.length===target.length){let made=picked.map(x=>x.word).join(' '),right=target.join(' ');if(made===right){score+=15+Math.min(combo,10);combo++;ok++;maxCombo=Math.max(maxCombo,combo);$('#msg').textContent='💬 '+right}else{score=Math.max(0,score-7);combo=0;bad++;$('#msg').textContent='순서를 다시 생각해 봐요!'}ui();if(!score)return end();setTimeout(next,600)}};$('#undo').onclick=()=>{picked.pop();render()};function start(){time=100;score=200;combo=maxCombo=ok=bad=0;on=true;$('#overlay').classList.add('hide');ui();next();clearInterval(timer);timer=setInterval(()=>{time--;ui();if(!time)end()},1000)}function end(){if(!on)return;on=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('sentenceOrderBest',best)}catch(e){}$('#title').textContent='💬 문장 만들기 완료!';$('#text').innerHTML=`점수 ${score} · 정답 ${ok} · 오답 ${bad}<br>최고 콤보 ${maxCombo} · 정확도 ${Math.round(ok/(ok+bad||1)*100)}%<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;</script></body></html>
