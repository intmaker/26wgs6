<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>알파벳 기차</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui;background:linear-gradient(#bae6fd,#fef3c7);color:#1e3a8a;user-select:none;touch-action:manipulation}.app{max-width:800px;height:100%;margin:auto;padding:8px;display:flex;flex-direction:column;gap:7px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hud b{background:#fff;padding:7px 10px;border-radius:99px}.scene{position:relative;flex:1;min-height:310px;overflow:hidden;border-radius:23px;background:linear-gradient(#7dd3fc 0 63%,#84cc16 64% 79%,#78716c 80%)}.train{position:absolute;left:50%;top:43%;translate:-50%;display:flex;align-items:end;gap:4px;width:96%;justify-content:center}.train.go{animation:go .5s}@keyframes go{50%{translate:-42% -8px}}.engine{font-size:62px}.car{position:relative;display:grid;place-items:center;width:80px;height:66px;border:4px solid #92400e;border-radius:11px;background:#fb923c;font-size:32px;font-weight:1000}.car:after{content:'● ●';position:absolute;bottom:-19px}.answers{position:absolute;bottom:7%;left:6%;right:6%;display:flex;gap:10px;justify-content:center}.answers button{flex:1;max-width:150px;min-height:60px;border:0;border-radius:16px;background:#fef08a;font:1000 28px system-ui}.msg{position:absolute;top:14%;width:100%;text-align:center;font-size:25px;font-weight:900}.tip{text-align:center}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#1e3a8acc;padding:15px}.hide{display:none}.cardbox{width:min(410px,100%);padding:24px;text-align:center;background:#fff;border-radius:22px}.cardbox div{font-size:55px}.cardbox button{width:100%;min-height:50px;border:0;border-radius:13px;background:#facc15;font-weight:900}@media(max-width:500px){.car{width:58px;height:56px}.engine{font-size:48px}}</style></head><body><main class="app"><h1>🚂 알파벳 기차</h1><div class="hud"><b>⏱ <span id="time">60</span></b><b>점수 <span id="score">100</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div><section class="scene"><div class="msg" id="msg">빠진 알파벳은?</div><div class="train" id="train"></div><div class="answers" id="answers"></div></section><div class="tip">알파벳 순서를 보고 빈 기차 칸을 채워요.</div></main><div class="overlay" id="overlay"><div class="cardbox"><div>🚂🔤</div><h2 id="title">알파벳 기차</h2><p id="text">A, B, ?, D에서 빠진 알파벳을 찾아요!</p><button id="start">출발하기</button></div></div><script>const $=s=>document.querySelector(s);let time,score,combo,maxCombo,correct,timer,on,answer,best=0;try{best=+(localStorage.getItem('engTrainBest')||0)}catch(e){}$('#best').textContent=best;const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';function ui(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo}function next(){let max=time>45?10:time>25?18:26,start=Math.floor(Math.random()*(max-3)),hole=Math.floor(Math.random()*4);answer=A[start+hole];$('#train').innerHTML='<span class="engine">🚂</span>'+[0,1,2,3].map(i=>`<span class="car">${i===hole?'?':A[start+i]}</span>`).join('');let s=new Set([answer]);while(s.size<3)s.add(A[Math.floor(Math.random()*max)]);$('#answers').innerHTML=[...s].sort(()=>Math.random()-.5).map(c=>`<button data-c="${c}">${c}</button>`).join('');$('#msg').textContent='빠진 알파벳은?'}$('#answers').onclick=e=>{if(!on||!e.target.dataset.c)return;if(e.target.dataset.c===answer){score+=10+(combo%5===4?10:0);combo++;correct++;maxCombo=Math.max(maxCombo,combo);$('#train').classList.add('go');$('#msg').textContent=combo%5===0?'⭐ SUPER TRAIN!':'칙칙폭폭! 정답!'}else{score=Math.max(0,score-5);combo=0;$('#msg').textContent='앞뒤 알파벳을 다시 봐요!'}ui();if(!score)return end();setTimeout(()=>{$('#train').classList.remove('go');next()},400)};function start(){time=60;score=100;combo=maxCombo=correct=0;on=true;$('#overlay').classList.add('hide');ui();next();clearInterval(timer);timer=setInterval(()=>{time--;ui();if(!time)end()},1000)}function end(){if(!on)return;on=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('engTrainBest',best)}catch(e){}$('#title').textContent='🏁 기차 여행 완료!';$('#text').innerHTML=`점수 ${score}<br>정답 ${correct}개 · 최고 콤보 ${maxCombo}<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;</script></body></html>
