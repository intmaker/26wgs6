<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>알파벳 풍선</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui;background:linear-gradient(#7dd3fc,#fef3c7);color:#164e63;user-select:none;touch-action:manipulation}.app{max-width:760px;height:100%;margin:auto;padding:7px;display:flex;flex-direction:column;gap:6px}h1,.goal{text-align:center;margin:2px}.goal{font-size:clamp(28px,8vw,48px);font-weight:1000}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hud b{background:#fff;padding:6px 10px;border-radius:99px}.field{position:relative;flex:1;min-height:300px;overflow:hidden;border-radius:22px;background:#ffffff55}.balloon{position:absolute;width:65px;height:78px;border:0;border-radius:50%;color:#fff;font:1000 25px system-ui;box-shadow:inset -8px -8px #0001;animation:float 2.8s ease-in-out infinite}.balloon:after{content:'▼';position:absolute;bottom:-13px;left:25px}.bonus{background:#facc15!important}@keyframes float{50%{translate:0 -17px}}.tip{text-align:center;font-weight:700}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#075985cc;padding:15px}.hide{display:none}.card{width:min(410px,100%);padding:24px;text-align:center;background:#fff;border-radius:22px}.card div{font-size:55px}.card button{width:100%;min-height:50px;border:0;border-radius:13px;background:#38bdf8;font-weight:900}</style></head><body><main class="app"><h1>🔤 알파벳 풍선</h1><div class="hud"><b>⏱ <span id="time">60</span></b><b>점수 <span id="score">100</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div><div class="goal">Find <span id="goal">A</span>!</div><section class="field" id="field"></section><div class="tip">같은 알파벳 풍선을 톡 터뜨려요!</div></main><div class="overlay" id="overlay"><div class="card"><div>🎈</div><h2 id="title">알파벳 풍선</h2><p id="text">Find A! 목표 알파벳을 찾아요.</p><button id="start">게임 시작</button></div></div><script>const $=s=>document.querySelector(s);let time,score,combo,maxCombo,correct,timer,on,target,best=0;try{best=+(localStorage.getItem('engBalloonBest')||0)}catch(e){}$('#best').textContent=best;const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';function ui(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo}function next(){let range=time>45?6:time>25?13:26,targetUpper=letters[Math.floor(Math.random()*range)];target=time<25&&Math.random()<.35?targetUpper.toLowerCase():targetUpper;$('#goal').textContent=target;let arr=[target];while(arr.length<(time>25?6:8)){let c=letters[Math.floor(Math.random()*range)];if(time<25&&Math.random()<.3)c=c.toLowerCase();arr.push(c)}$('#field').innerHTML=arr.sort(()=>Math.random()-.5).map((c,i)=>`<button class="balloon" data-c="${c}" style="left:${5+Math.random()*82}%;top:${7+Math.random()*68}%;background:hsl(${i*55} 76% 58%);animation-delay:-${Math.random()*3}s">${c}</button>`).join('')+(Math.random()<.18?'<button class="balloon bonus" data-b="1" style="left:45%;top:35%">⭐</button>':'')}$('#field').onclick=e=>{if(!on||!e.target.matches('.balloon'))return;if(e.target.dataset.b){score+=20;ui();return next()}if(e.target.dataset.c===target){combo++;correct++;maxCombo=Math.max(maxCombo,combo);score+=10+(combo%5===0?10:0);e.target.animate([{scale:1},{scale:1.6,opacity:0}],{duration:220});setTimeout(next,210)}else{score=Math.max(0,score-5);combo=0;e.target.animate([{translate:'-6px'},{translate:'6px'}],{duration:200})}ui();if(!score)end()};function start(){time=60;score=100;combo=maxCombo=correct=0;on=true;$('#overlay').classList.add('hide');ui();next();clearInterval(timer);timer=setInterval(()=>{time--;ui();if(!time)end()},1000)}function end(){if(!on)return;on=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('engBalloonBest',best)}catch(e){}$('#title').textContent='⭐ 풍선 놀이 끝!';$('#text').innerHTML=`점수 ${score}<br>정답 ${correct}개 · 최고 콤보 ${maxCombo}<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;</script></body></html>
