<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>영어 문장 탐정</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui;background:radial-gradient(circle,#334155,#0f172a);color:#fff;user-select:none;touch-action:manipulation}.app{max-width:760px;height:100%;margin:auto;padding:7px;display:flex;flex-direction:column;gap:7px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hud b{background:#ffffff18;padding:6px 9px;border-radius:99px}.office{flex:1;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:2px solid #facc15;border-radius:22px;background:#ffffff0b}.detective{font-size:55px}.case{width:92%;padding:13px;border-radius:15px;background:#f8fafc;color:#1e293b;text-align:center}.story{font-size:clamp(19px,5vw,27px);font-weight:900}.question{color:#475569;font-weight:800}.answers{display:grid;grid-template-columns:1fr 1fr;width:92%;gap:8px}.answers button{min-height:58px;border:0;border-radius:14px;background:#fde047;color:#422006;font-weight:900}.stamp{min-height:28px;color:#fef08a;font-size:20px;font-weight:1000}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0f172add;padding:15px}.hide{display:none}.cardbox{width:min(420px,100%);padding:24px;text-align:center;background:#fff;color:#1e293b;border-radius:22px}.cardbox div{font-size:55px}.cardbox button{width:100%;min-height:50px;border:0;border-radius:13px;background:#fde047;font-weight:900}</style></head><body><main class="app"><h1>🕵️ 영어 문장 탐정</h1><div class="hud"><b>⏱ <span id="time">100</span></b><b>점수 <span id="score">200</span></b><b>콤보 <span id="combo">0</span></b><b>사건 <span id="cases">0</span></b></div><section class="office"><div class="detective">🕵️🔎</div><div class="case"><div class="story" id="story"></div><div class="question" id="question"></div></div><div class="answers" id="answers"></div><div class="stamp" id="stamp">단서를 읽어 봐요.</div></section></main><div class="overlay" id="overlay"><div class="cardbox"><div>🕵️📜</div><h2 id="title">영어 문장 탐정</h2><p id="text">짧은 문장을 읽고 사건의 답을 찾아요!</p><button id="start">수사 시작</button></div></div><script>const $=s=>document.querySelector(s);const qs=[['Tom has a red ball.','What does Tom have?','⚽ a ball',['📕 a book','🍎 an apple','🐶 a dog']],['Jane is in the library.','Where is Jane?','📚 Library',['🌳 Park','🏫 School','🏠 Home']],['Mike has two dogs.','How many dogs?','2️⃣ two',['1️⃣ one','3️⃣ three','4️⃣ four']],['Anna likes bananas.','What does Anna like?','🍌 bananas',['🍎 apples','🍞 bread','🥛 milk']],['The cat is under the table.','Where is the cat?','⬇️ under the table',['⬆️ on the table','🏠 in the house','🌳 by the tree']],['Sam plays soccer.','What does Sam play?','⚽ soccer',['🏀 basketball','🎾 tennis','🎹 piano']],['Mina has a blue bag.','What color is the bag?','🔵 blue',['🔴 red','🟢 green','🟡 yellow']],['Ben reads a book at home.','What does Ben read?','📕 a book',['📰 a paper','✉️ a letter','🗺️ a map']],['Lucy eats three apples.','How many apples?','3️⃣ three',['2️⃣ two','4️⃣ four','5️⃣ five']]];let time,score,combo,maxCombo,ok,bad,cases,timer,on,answer,best=0;try{best=+(localStorage.getItem('detectiveBest')||0)}catch(e){}function ui(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo;$('#cases').textContent=cases}function next(){let max=time>80?4:time>40?7:9,q=qs[Math.floor(Math.random()*max)];answer=q[2];$('#story').textContent=q[0];$('#question').textContent=q[1];$('#answers').innerHTML=[q[2],...q[3]].sort(()=>Math.random()-.5).map(x=>`<button data-a="${x}">${x}</button>`).join('');$('#stamp').textContent='단서를 읽어 봐요.'}$('#answers').onclick=e=>{if(!on||!e.target.dataset.a)return;if(e.target.dataset.a===answer){score+=15+Math.min(combo,10);combo++;ok++;cases++;maxCombo=Math.max(maxCombo,combo);$('#stamp').textContent='✅ CASE SOLVED!'}else{score=Math.max(0,score-7);combo=0;bad++;$('#stamp').textContent='🔎 단서를 다시 읽어 봐요.'}ui();if(!score)return end();setTimeout(next,500)};function start(){time=100;score=200;combo=maxCombo=ok=bad=cases=0;on=true;$('#overlay').classList.add('hide');ui();next();clearInterval(timer);timer=setInterval(()=>{time--;ui();if(!time)end()},1000)}function end(){if(!on)return;on=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('detectiveBest',best)}catch(e){}$('#title').textContent='🏆 수사 완료!';$('#text').innerHTML=`점수 ${score} · 정답 ${ok} · 오답 ${bad}<br>최고 콤보 ${maxCombo} · 정확도 ${Math.round(ok/(ok+bad||1)*100)}%<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;</script></body></html>
