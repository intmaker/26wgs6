<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>단어 완성</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui;background:radial-gradient(circle,#fef08a,#f9a8d4);color:#701a75;user-select:none;touch-action:manipulation}.app{max-width:700px;height:100%;margin:auto;padding:7px;display:flex;flex-direction:column;gap:7px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hud b{background:#fff;padding:6px 9px;border-radius:99px}.desk{flex:1;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;border-radius:24px;background:#fff9}.emoji{font-size:65px}.pattern{font-size:clamp(34px,9vw,58px);font-weight:1000;letter-spacing:9px}.answers{display:flex;gap:9px;width:92%;justify-content:center;flex-wrap:wrap}.answers button{min-width:65px;min-height:65px;border:0;border-radius:16px;background:#f472b6;color:#500724;font:1000 28px system-ui}.fly{animation:fly .4s}@keyframes fly{50%{translate:0 -35px;scale:1.2}}.msg{min-height:25px;font-weight:800}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#831843dd;padding:15px}.hide{display:none}.card{width:min(420px,100%);padding:24px;text-align:center;background:#fff;border-radius:22px}.card div{font-size:55px}.card button{width:100%;min-height:50px;border:0;border-radius:13px;background:#f9a8d4;font-weight:900}</style></head><body><main class="app"><h1>✏️ 빈칸 단어 완성</h1><div class="hud"><b>⏱ <span id="time">100</span></b><b>점수 <span id="score">200</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div><section class="desk"><div class="emoji" id="emoji">🐱</div><div class="pattern" id="pattern">C _ T</div><div class="answers" id="answers"></div><div class="msg" id="msg">빠진 글자를 순서대로 눌러요.</div></section></main><div class="overlay" id="overlay"><div class="card"><div>✏️🔤</div><h2 id="title">단어 완성</h2><p id="text">C _ T에 A를 넣어 CAT을 완성해요!</p><button id="start">게임 시작</button></div></div><script>const $=s=>document.querySelector(s);const words=[['🐱','CAT'],['🐶','DOG'],['☀️','SUN'],['📘','BOOK'],['🐟','FISH'],['🌳','TREE'],['🥛','MILK'],['✋','HAND'],['🐦','BIRD'],['⭐','STAR'],['🌙','MOON'],['🌧️','RAIN'],['🍰','CAKE'],['🏠','HOME'],['🏫','SCHOOL']];let time,score,combo,maxCombo,ok,bad,timer,on,word,holes,input,best=0;try{best=+(localStorage.getItem('wordSpellBest')||0)}catch(e){}$('#best').textContent=best;function ui(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo}function show(){let a=[...word];holes.forEach((p,i)=>a[p]=input[i]||'_');$('#pattern').textContent=a.join(' ')}function next(){let max=time>80?6:time>40?11:15,w=words[Math.floor(Math.random()*max)];word=w[1];let count=time<40&&word.length>3?2:1,positions=[...Array(word.length).keys()].sort(()=>Math.random()-.5).slice(0,count).sort((a,b)=>a-b);holes=positions;input=[];$('#emoji').textContent=w[0];show();let letters=new Set(positions.map(p=>word[p]));while(letters.size<4)letters.add('ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random()*26)]);$('#answers').innerHTML=[...letters].sort(()=>Math.random()-.5).map(c=>`<button data-c="${c}">${c}</button>`).join('')}$('#answers').onclick=e=>{if(!on||!e.target.dataset.c)return;let expected=word[holes[input.length]];if(e.target.dataset.c===expected){input.push(expected);show();e.target.classList.add('fly');if(input.length===holes.length){score+=15+Math.min(combo,10);combo++;ok++;maxCombo=Math.max(maxCombo,combo);$('#msg').textContent=`✨ ${word} 완성!`;ui();return setTimeout(next,500)}}else{score=Math.max(0,score-7);combo=0;bad++;$('#msg').textContent='다시 철자를 생각해 봐요.'}ui();if(!score)end()};function start(){time=100;score=200;combo=maxCombo=ok=bad=0;on=true;$('#overlay').classList.add('hide');ui();next();clearInterval(timer);timer=setInterval(()=>{time--;ui();if(!time)end()},1000)}function end(){if(!on)return;on=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('wordSpellBest',best)}catch(e){}$('#title').textContent='✏️ 단어 완성 끝!';$('#text').innerHTML=`점수 ${score} · 정답 ${ok} · 오답 ${bad}<br>최고 콤보 ${maxCombo} · 정확도 ${Math.round(ok/(ok+bad||1)*100)}%<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;</script></body></html>
