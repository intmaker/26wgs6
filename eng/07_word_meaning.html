<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>단어 뜻 맞히기</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui;background:linear-gradient(145deg,#c4b5fd,#bfdbfe);color:#312e81;user-select:none;touch-action:manipulation}.app{max-width:740px;height:100%;margin:auto;padding:7px;display:flex;flex-direction:column;gap:7px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hud b{background:#fff;padding:6px 9px;border-radius:99px}.library{flex:1;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;border-radius:24px;background:#fff9}.book{font-size:60px}.word{font-size:clamp(35px,9vw,58px);font-weight:1000;color:#6d28d9}.hint{font-size:45px;min-height:50px}.answers{display:grid;grid-template-columns:1fr 1fr;width:92%;gap:9px}.answers button{min-height:60px;border:0;border-radius:15px;background:#ddd6fe;font:900 18px system-ui}.msg{min-height:25px;font-weight:800}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#312e81dd;padding:15px}.hide{display:none}.card{width:min(420px,100%);padding:24px;text-align:center;background:#fff;border-radius:22px}.card div{font-size:55px}.card button{width:100%;min-height:50px;border:0;border-radius:13px;background:#a78bfa;font-weight:900}</style></head><body><main class="app"><h1>📚 단어 뜻 맞히기</h1><div class="hud"><b>⏱ <span id="time">100</span></b><b>점수 <span id="score">200</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div><section class="library"><div class="book">📖</div><div class="hint" id="hint">😊</div><div class="word" id="word">HAPPY</div><div class="answers" id="answers"></div><div class="msg" id="msg">알맞은 뜻을 골라요.</div></section></main><div class="overlay" id="overlay"><div class="card"><div>📚✨</div><h2 id="title">단어 뜻 맞히기</h2><p id="text">영어 단어와 알맞은 한글 뜻을 찾아요!</p><button id="start">게임 시작</button></div></div><script>const $=s=>document.querySelector(s);const words=[['HAPPY','😊 행복한'],['SAD','😢 슬픈'],['ANGRY','😡 화난'],['TIRED','😴 피곤한'],['SCHOOL','🏫 학교'],['TEACHER','🧑‍🏫 선생님'],['FRIEND','🧒 친구'],['FAMILY','👨‍👩‍👧 가족'],['MOTHER','👩 어머니'],['FATHER','👨 아버지'],['RABBIT','🐰 토끼'],['TIGER','🐯 호랑이'],['BREAD','🍞 빵'],['WATER','💧 물'],['CLOUD','☁️ 구름'],['RAIN','🌧️ 비'],['SUNNY','☀️ 맑은'],['RUN','🏃 달리다'],['JUMP','🤸 뛰다'],['READ','📖 읽다'],['WRITE','✏️ 쓰다'],['PLAY','🎮 놀다'],['SLEEP','🛏️ 자다']];let time,score,combo,maxCombo,ok,bad,timer,on,answer,best=0;try{best=+(localStorage.getItem('wordMeaningBest')||0)}catch(e){}$('#best').textContent=best;function ui(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo}function next(){let max=time>80?9:time>40?16:23,w=words[Math.floor(Math.random()*max)];answer=w[1];$('#word').textContent=w[0];$('#hint').textContent=time>40?w[1].split(' ')[0]:'❓';let s=new Set([answer]);while(s.size<4)s.add(words[Math.floor(Math.random()*max)][1]);$('#answers').innerHTML=[...s].sort(()=>Math.random()-.5).map(x=>`<button data-a="${x}">${x}</button>`).join('')}$('#answers').onclick=e=>{if(!on||!e.target.dataset.a)return;if(e.target.dataset.a===answer){score+=15+Math.min(combo,10);combo++;ok++;maxCombo=Math.max(maxCombo,combo);$('#msg').textContent='⭐ 뜻을 잘 찾았어요!'}else{score=Math.max(0,score-7);combo=0;bad++;$('#msg').textContent='괜찮아요! 다시 기억해 봐요.'}ui();if(!score)return end();setTimeout(next,380)};function start(){time=100;score=200;combo=maxCombo=ok=bad=0;on=true;$('#overlay').classList.add('hide');ui();next();clearInterval(timer);timer=setInterval(()=>{time--;ui();if(!time)end()},1000)}function end(){if(!on)return;on=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('wordMeaningBest',best)}catch(e){}$('#title').textContent='📚 단어 여행 완료!';$('#text').innerHTML=`점수 ${score} · 정답 ${ok} · 오답 ${bad}<br>최고 콤보 ${maxCombo} · 정확도 ${Math.round(ok/(ok+bad||1)*100)}%<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;</script></body></html>
