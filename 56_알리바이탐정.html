<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"><title>🕵️ 알리바이 탐정</title><style>
:root{--c1:#44403c;--c2:#fbbf24}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 18% 10%,var(--c1),#11162e 52%,#030712);user-select:none;-webkit-user-select:none}.app{width:min(95vw,720px);height:min(95vh,860px);display:flex;flex-direction:column;gap:11px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 4px}.brand small{display:block;color:#cbd5e1;font-size:10px;font-weight:900;letter-spacing:.2em}.brand h1{margin:2px 0 0;font-size:clamp(25px,5vw,38px);letter-spacing:-.05em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:67px;padding:7px 10px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#0f172ac7}.stat small{display:block;color:#cbd5e1;font-size:9px}.stat b{font-size:19px}.stage{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff27;border-radius:25px;background:linear-gradient(145deg,#14203b,#090e21);box-shadow:0 25px 70px #0009;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#050916e9}.overlay.hide{display:none}.card{width:min(100%,410px);padding:28px 24px;text-align:center;border:1px solid #ffffff25;border-radius:23px;background:#111a36ee;box-shadow:0 20px 55px #0008}.card .emoji{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{margin:0 0 19px;color:#cbd5e1;font-size:14px;line-height:1.72;word-break:keep-all}.primary{min-height:48px;width:100%;padding:12px 18px;border:0;border-radius:13px;color:#08111f;background:linear-gradient(135deg,var(--c2),#fef3c7);font:900 15px system-ui;cursor:pointer}.tip{min-height:18px;text-align:center;color:#aebbd0;font-size:12px}.hidden{display:none!important}button{font-family:inherit}.detective{height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;background:linear-gradient(145deg,#292524,#0c0a09)}.case{font:900 20px Georgia,serif;color:#fde68a}.clues{width:min(100%,570px);min-height:105px;display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid #ffffff20;border-radius:13px;background:#fef3c712;color:#fef3c7}.clue{padding:5px 8px;border-left:4px solid #fbbf24;background:#0003}.suspects{width:min(100%,570px);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.suspect{min-height:118px;padding:9px 5px;border:1px solid #ffffff20;border-radius:13px;color:#fff;background:#ffffff0b;cursor:pointer}.suspect:hover{background:#ffffff18}.suspect .face{font-size:34px}.suspect b,.suspect small{display:block}.suspect small{color:#d6d3d1;font-size:10px;line-height:1.4}.suspect.out{opacity:.32;text-decoration:line-through}.reveal{min-height:46px;padding:9px 17px;border:0;border-radius:11px;background:#fbbf24;color:#422006;font-weight:900}#detectiveMsg{color:#fde68a;font-weight:800;text-align:center}@media(max-width:430px){.suspects{grid-template-columns:repeat(2,1fr)}.suspect{min-height:97px}}
@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.stage{min-height:0;border-radius:20px}.brand h1{font-size:25px}.stat{min-width:61px;padding:6px 8px}.card{padding:24px 19px}.tip{font-size:11px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><small>CASE FILE</small><h1>🕵️ 알리바이 탐정</h1></div><div class="hud" id="hud"></div></header><section class="stage" id="stage"><div class="detective"><div class="case" id="caseTitle">사건 파일</div><div class="clues" id="clues"></div><div class="suspects" id="suspects"></div><button class="reveal" id="revealBtn">🔎 다음 단서 확인</button><div id="detectiveMsg">단서를 읽고 범인을 선택하세요.</div></div><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="resultEmoji">🕵️</div><h2 id="resultTitle">알리바이 탐정</h2><p id="resultText">용의자의 옷·장소·소지품과 단서를 비교해 최소한의 정보로 범인을 추리하세요.</p><button class="primary" id="startBtn">게임 시작</button></div></div></section><div class="tip">용의자의 옷·장소·소지품과 단서를 비교해 최소한의 정보로 범인을 추리하세요.</div></main><script>
const $=s=>document.querySelector(s),stage=$('#stage'),overlay=$('#overlay'),startBtn=$('#startBtn');
const safeGet=(k,d=0)=>{try{return Number(localStorage.getItem(k))||d}catch(e){return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function showResult(icon,title,text,button='다시 하기'){ $('#resultEmoji').textContent=icon;$('#resultTitle').textContent=title;$('#resultText').innerHTML=text;startBtn.textContent=button;overlay.classList.remove('hide') }
const faces=['🧔','👩‍🔬','👨‍🍳','👩‍🎨','👨‍🚀','🧙'],names=['민준','서연','도윤','지아','현우','하린'],colors=['빨간','파란','초록'],places=['도서관','정원','주방'],items=['열쇠','우산','손전등'],cluesEl=$('#clues'),suspectsEl=$('#suspects'),msg=$('#detectiveMsg'),hud=$('#hud');let people=[],culprit,shown=1,score=0,streak=0,playing=false;hud.innerHTML='<div class="stat"><small>점수</small><b id="score">0</b></div><div class="stat"><small>연속 해결</small><b id="streak">0</b></div>';
function makeCase(){const combos=[];for(let c=0;c<3;c++)for(let p=0;p<3;p++)for(let i=0;i<3;i++)combos.push([c,p,i]);combos.sort(()=>Math.random()-.5);people=names.map((n,k)=>({name:n,face:faces[k],color:colors[combos[k][0]],place:places[combos[k][1]],item:items[combos[k][2]]}));culprit=Math.floor(Math.random()*people.length);shown=1;playing=true;overlay.classList.add('hide');render();msg.textContent='단서와 일치하는 용의자를 선택하세요.'}
function clueTexts(){const c=people[culprit],wrongColor=colors.find(x=>x!==c.color),wrongPlace=places.find(x=>x!==c.place);return[`범인은 ${c.color} 옷을 입고 있었습니다.`,`범인은 사건 당시 ${c.place}에 있었습니다.`,`범인은 ${c.item}을 가지고 있었습니다.`,`범인은 ${wrongColor} 옷도 아니고 ${wrongPlace}에도 없었습니다.`]}
function render(){cluesEl.innerHTML=clueTexts().slice(0,shown).map((t,i)=>`<div class="clue">단서 ${i+1}. ${t}</div>`).join('');suspectsEl.innerHTML='';people.forEach((p,i)=>{const b=document.createElement('button');b.className='suspect';b.innerHTML=`<span class="face">${p.face}</span><b>${p.name}</b><small>${p.color} 옷 · ${p.place}<br>${p.item} 소지</small>`;b.onclick=()=>accuse(i);suspectsEl.appendChild(b)});$('#revealBtn').disabled=shown>=4}
function accuse(i){if(!playing)return;if(i===culprit){playing=false;streak++;score+=Math.max(20,100-shown*15)+streak*5;$('#score').textContent=score;$('#streak').textContent=streak;showResult('🕵️','사건 해결!',`${shown}개의 단서만으로 ${people[i].name}이 범인임을 밝혔습니다.<br>적은 단서로 해결할수록 높은 점수를 얻습니다.`,'다음 사건')}else{streak=0;$('#streak').textContent=0;suspectsEl.children[i].classList.add('out');msg.textContent=`${people[i].name}은(는) 범인이 아닙니다. 단서를 다시 비교하세요.`}}$('#revealBtn').onclick=()=>{if(playing&&shown<4){shown++;render()}};startBtn.onclick=makeCase;
</script></body></html>
