<body>
<main class="app">

<header class="top">
  <div class="brand">
    <small>CASE FILE CHALLENGE</small>
    <h1>🕵️ 알리바이 탐정</h1>
  </div>

  <div class="hud">
    <div class="stat">
      <small>사건</small>
      <b id="caseNo">1</b>
    </div>
    <div class="stat">
      <small>시간</small>
      <b id="time">60</b>
    </div>
    <div class="stat">
      <small>점수</small>
      <b id="score">0</b>
    </div>
    <div class="stat">
      <small>연속</small>
      <b id="streak">0</b>
    </div>
  </div>
</header>

<section class="stage" id="stage">

<div class="detective">

  <div class="case" id="caseTitle">사건 파일</div>
  <div class="caseSub" id="caseSub">용의자들의 진술을 비교하세요.</div>

  <div class="timerWrap">
    <div class="timer" id="timerBar"></div>
  </div>

  <div class="clues" id="clues"></div>

  <div class="suspects" id="suspects"></div>

  <div class="tools">
    <button class="primaryTool" id="revealBtn">🔎 다음 단서</button>
    <button id="hintBtn">💡 힌트 -20</button>
    <button id="interrogateBtn">💬 심문</button>
  </div>

  <div id="detectiveMsg">단서를 읽고 범인을 선택하세요.</div>

</div>

<div class="toast" id="toast">단서 추가!</div>

<div class="overlay" id="overlay">
  <div class="card">
    <div class="emoji" id="resultEmoji">🕵️</div>
    <h2 id="resultTitle">알리바이 탐정</h2>

    <p id="resultText">
      사건 단서와 용의자 정보를 비교해 범인을 찾아내세요.<br><br>
      🔎 단서를 많이 볼수록 점수는 줄어듭니다.<br>
      💬 심문으로 추가 정보를 얻을 수 있습니다.<br>
      어려운 사건에는 <b>거짓 단서</b>도 섞일 수 있습니다.
    </p>

    <div class="buttons">
      <button class="primary" id="startBtn">수사 시작</button>
      <button class="secondary" id="difficultyBtn">난이도 : 보통</button>
    </div>
  </div>
</div>

</section>

<div class="tip">
단서 비교 · 최소 단서로 추리 · 심문 활용 · 거짓 단서에 주의
</div>

</main>

<script>
const $=s=>document.querySelector(s);

const overlay=$('#overlay');
const startBtn=$('#startBtn');
const difficultyBtn=$('#difficultyBtn');

const cluesEl=$('#clues');
const suspectsEl=$('#suspects');
const msg=$('#detectiveMsg');
const toast=$('#toast');

const caseNoEl=$('#caseNo');
const timeEl=$('#time');
const scoreEl=$('#score');
const streakEl=$('#streak');
const timerBar=$('#timerBar');

const faces=['🧔','👩‍🔬','👨‍🍳','👩‍🎨','👨‍🚀','🧙'];
const names=['민준','서연','도윤','지아','현우','하린'];

const colors=['빨간','파란','초록','검은'];
const places=['도서관','정원','주방','옥상'];
const items=['열쇠','우산','손전등','노트'];

const caseTypes=[
  ['💎','사라진 보석 사건'],
  ['🖼️','미술관 그림 도난 사건'],
  ['🔑','교장실 열쇠 분실 사건'],
  ['📱','사라진 휴대폰 사건'],
  ['📦','창고 물품 도난 사건']
];

let people=[];
let culprit=0;
let clues=[];

let shown=1;
let playing=false;

let score=0;
let streak=0;
let caseNo=1;

let difficulty=1;
let duration=60;
let remain=60;
let last=0;
let raf;

let questioned=new Set();
let eliminated=new Set();

const difficultyNames=['쉬움','보통','어려움'];

function showToast(text){
  toast.textContent=text;
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');

  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>{
    toast.classList.remove('show');
  },650);
}

function randomDifferent(arr,value){
  const choices=arr.filter(x=>x!==value);
  return choices[Math.floor(Math.random()*choices.length)];
}

function makePeople(){
  const combos=[];

  for(const color of colors){
    for(const place of places){
      for(const item of items){
        combos.push({color,place,item});
      }
    }
  }

  combos.sort(()=>Math.random()-.5);

  people=names.map((name,i)=>({
    name,
    face:faces[i],
    color:combos[i].color,
    place:combos[i].place,
    item:combos[i].item
  }));
}

function buildClues(){
  const c=people[culprit];

  const trueClues=[
    {
      text:`범인은 ${c.color} 옷을 입고 있었습니다.`,
      truth:true,
      key:'color'
    },
    {
      text:`범인은 사건 당시 ${c.place}에 있었습니다.`,
      truth:true,
      key:'place'
    },
    {
      text:`범인은 ${c.item}을 가지고 있었습니다.`,
      truth:true,
      key:'item'
    }
  ];

  const negative=[
    {
      text:`범인은 ${randomDifferent(colors,c.color)} 옷을 입은 사람이 아닙니다.`,
      truth:true
    },
    {
      text:`범인은 사건 당시 ${randomDifferent(places,c.place)}에 있지 않았습니다.`,
      truth:true
    }
  ];

  clues=[
    trueClues[0],
    negative[0],
    trueClues[1],
    negative[1],
    trueClues[2]
  ];

  if(difficulty===2){
    const fakeType=Math.floor(Math.random()*3);

    let fake;

    if(fakeType===0){
      fake={
        text:`한 목격자는 범인이 ${randomDifferent(colors,c.color)} 옷이었다고 주장했습니다.`,
        truth:false
      };
    }

    if(fakeType===1){
      fake={
        text:`익명의 제보자는 범인이 ${randomDifferent(places,c.place)}에 있었다고 말했습니다.`,
        truth:false
      };
    }

    if(fakeType===2){
      fake={
        text:`누군가는 범인이 ${randomDifferent(items,c.item)}을 들고 있었다고 진술했습니다.`,
        truth:false
      };
    }

    clues.splice(
      2,
      0,
      fake
    );
  }
}

function startCase(){
  makePeople();

  culprit=Math.floor(Math.random()*people.length);

  buildClues();

  shown=1;
  questioned.clear();
  eliminated.clear();

  duration=
    difficulty===0?75:
    difficulty===1?60:48;

  remain=duration;
  playing=true;

  const [icon,title]=
    caseTypes[(caseNo-1)%caseTypes.length];

  $('#caseTitle').textContent=
    `${icon} ${title}`;

  $('#caseSub').textContent=
    difficulty===2
      ?'주의: 진술 중 하나는 거짓일 수 있습니다.'
      :'용의자의 정보와 단서를 비교하세요.';

  caseNoEl.textContent=caseNo;

  msg.textContent=
    '단서를 비교해 범인을 선택하세요.';

  overlay.classList.add('hide');

  render();

  last=performance.now();
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

function render(){
  cluesEl.innerHTML='';

  clues
    .slice(0,shown)
    .forEach((clue,i)=>{
      const div=document.createElement('div');

      div.className=
        'clue'+
        (
          difficulty===2 &&
          !clue.truth &&
          shown===clues.length
            ?' false'
            :''
        );

      div.textContent=
        `단서 ${i+1}. ${clue.text}`;

      cluesEl.appendChild(div);
    });

  suspectsEl.innerHTML='';

  people.forEach((p,i)=>{
    const b=document.createElement('button');

    b.className='suspect';

    if(eliminated.has(i)){
      b.classList.add('out');
    }

    if(questioned.has(i)){
      b.classList.add('questioned');
    }

    b.innerHTML=
      `<span class="face">${p.face}</span>`+
      `<b>${p.name}</b>`+
      `<small>${p.color} 옷 · ${p.place}<br>${p.item} 소지</small>`;

    b.onclick=()=>{
      if(!eliminated.has(i)){
        accuse(i);
      }
    };

    suspectsEl.appendChild(b);
  });

  $('#revealBtn').disabled=
    shown>=clues.length;
}

function accuse(i){
  if(!playing)return;

  if(i===culprit){

    playing=false;
    cancelAnimationFrame(raf);

    streak++;

    const clueBonus=
      Math.max(
        20,
        130-shown*18
      );

    const timeBonus=
      Math.round(remain*2);

    const streakBonus=
      streak*12;

    const gain=
      clueBonus+
      timeBonus+
      streakBonus;

    score+=gain;

    scoreEl.textContent=score;
    streakEl.textContent=streak;

    let stars=1;

    if(shown<=3){
      stars=2;
    }

    if(
      shown<=2 &&
      remain>duration*.4
    ){
      stars=3;
    }

    const rating=
      '⭐'.repeat(stars)+
      '☆'.repeat(3-stars);

    $('#resultEmoji').textContent='🕵️';
    $('#resultTitle').textContent='사건 해결!';

    $('#resultText').innerHTML=
      `${rating}<br><br>`+
      `범인은 <b>${people[i].name}</b>이었습니다.<br>`+
      `확인한 단서 <b>${shown}</b>개<br>`+
      `남은 시간 <b>${Math.ceil(remain)}</b>초<br>`+
      `획득 점수 <b>+${gain}</b><br><br>`+
      `적은 단서로 빠르게 해결할수록 높은 점수를 얻습니다.`;

    startBtn.textContent='다음 사건';

    startBtn.onclick=()=>{
      caseNo++;
      startCase();
    };

    setTimeout(()=>{
      overlay.classList.remove('hide');
    },400);

  }else{

    eliminated.add(i);

    streak=0;
    streakEl.textContent=0;

    score=Math.max(0,score-25);
    scoreEl.textContent=score;

    msg.textContent=
      `${people[i].name}은(는) 범인이 아닙니다. -25점`;

    showToast('❌ 잘못된 지목 -25');

    render();
  }
}

function revealClue(){
  if(!playing)return;

  if(shown>=clues.length)return;

  shown++;

  score=Math.max(0,score-5);
  scoreEl.textContent=score;

  showToast('🔎 새로운 단서');

  render();
}

function useHint(){
  if(!playing)return;

  score=Math.max(0,score-20);
  scoreEl.textContent=score;

  const possible=
    people
      .map((_,i)=>i)
      .filter(i=>
        i!==culprit &&
        !eliminated.has(i)
      );

  if(possible.length===0){
    msg.textContent='더 이상 제외할 용의자가 없습니다.';
    return;
  }

  const target=
    possible[Math.floor(Math.random()*possible.length)];

  eliminated.add(target);

  msg.textContent=
    `💡 조사 결과 ${people[target].name}은(는) 용의선상에서 제외되었습니다.`;

  showToast('💡 용의자 1명 제외');

  render();
}

function interrogate(){
  if(!playing)return;

  const candidates=
    people
      .map((_,i)=>i)
      .filter(i=>
        !eliminated.has(i) &&
        !questioned.has(i)
      );

  if(candidates.length===0){
    msg.textContent='모든 용의자를 이미 심문했습니다.';
    return;
  }

  let target;

  if(candidates.includes(culprit) && Math.random()<.35){
    target=culprit;
  }else{
    target=
      candidates[
        Math.floor(Math.random()*candidates.length)
      ];
  }

  questioned.add(target);

  const p=people[target];

  let statement;

  if(target===culprit){
    const choices=[
      `"저는 ${p.place}에 있었지만 자세한 건 기억나지 않습니다."`,
      `"${p.item}? 제가 가지고 있었던 건 맞습니다."`,
      `"제 옷 색깔이 중요한가요?"`
    ];

    statement=
      choices[Math.floor(Math.random()*choices.length)];
  }else{
    const choices=[
      `"저는 ${p.place}에 있었습니다. 확인해 보세요."`,
      `"제가 가진 건 ${p.item}뿐이었습니다."`,
      `"제 옷은 ${p.color}색이었습니다."`
    ];

    statement=
      choices[Math.floor(Math.random()*choices.length)];
  }

  score=Math.max(0,score-8);
  scoreEl.textContent=score;

  msg.textContent=
    `💬 ${p.name}: ${statement}`;

  showToast('💬 심문 -8점');

  render();
}

function timeOut(){
  if(!playing)return;

  playing=false;
  streak=0;

  streakEl.textContent=0;

  $('#resultEmoji').textContent='⏰';
  $('#resultTitle').textContent='수사 시간 종료';

  $('#resultText').innerHTML=
    `범인은 <b>${people[culprit].name}</b>이었습니다.<br><br>`+
    `${people[culprit].color} 옷 · ${people[culprit].place}<br>`+
    `${people[culprit].item} 소지<br><br>`+
    `단서의 공통점을 하나씩 비교해보세요.`;

  startBtn.textContent='다시 수사';
  startBtn.onclick=startCase;

  overlay.classList.remove('hide');
}

function loop(t){
  if(!playing)return;

  const dt=
    Math.min(
      .05,
      (t-last)/1000
    );

  last=t;

  remain-=dt;

  if(remain<=0){
    remain=0;
    timeEl.textContent=0;
    timerBar.style.width='0%';
    timeOut();
    return;
  }

  timeEl.textContent=
    Math.ceil(remain);

  timerBar.style.width=
    `${remain/duration*100}%`;

  raf=requestAnimationFrame(loop);
}

$('#revealBtn').onclick=revealClue;
$('#hintBtn').onclick=useHint;
$('#interrogateBtn').onclick=interrogate;

difficultyBtn.onclick=()=>{
  difficulty=
    (difficulty+1)%3;

  difficultyBtn.textContent=
    `난이도 : ${difficultyNames[difficulty]}`;
};

startBtn.onclick=startCase;
</script>
