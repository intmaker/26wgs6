<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>반복문 공장</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#fff4c9 0 28%,#ffd36d 28% 31%,#273246 31%);font-family:Arial,"Noto Sans KR",sans-serif;color:#182238;user-select:none}.app{width:min(980px,100%);margin:auto;padding:10px}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stat{background:#fff9;border:2px solid #26344a;border-radius:12px;padding:7px;text-align:center;font-size:11px}.stat b{display:block;font-size:18px;color:#e64e2d}.factory{margin-top:10px;background:#f5f0df;border:4px solid #26344a;border-radius:20px;overflow:hidden;box-shadow:0 12px 0 #131b27}.head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#f59f35;border-bottom:4px solid #26344a}.head h1{font-size:clamp(20px,5vw,31px);margin:0}.target{text-align:center;padding:10px;background:#fff}.target strong{display:block;color:#596274;font-size:13px}.pattern{font-size:clamp(25px,7vw,42px);letter-spacing:7px;min-height:50px}.floor{position:relative;height:190px;background:linear-gradient(#c8e8ef 0 65%,#76828c 65%);overflow:hidden}.arm{position:absolute;left:12%;top:0;width:16px;height:75px;background:#4c5967;border:3px solid #222;transform-origin:top;transition:.25s}.arm:after{content:'🦾';font-size:45px;position:absolute;left:-15px;bottom:-35px}.arm.work{animation:work .45s}@keyframes work{50%{transform:rotate(18deg) translateY(20px)}}.belt{position:absolute;left:0;right:0;bottom:16px;height:55px;background:repeating-linear-gradient(90deg,#252d36 0 28px,#485462 28px 55px);border-block:7px solid #17202b;animation:belt .8s linear infinite paused}.belt.go{animation-play-state:running}@keyframes belt{to{background-position:55px 0}}.products{position:absolute;left:25%;right:2%;bottom:68px;height:55px;display:flex;align-items:end;gap:12px;font-size:34px;overflow:hidden}.item{animation:arrive .5s}@keyframes arrive{from{transform:translate(-90px,-70px) rotate(-90deg);opacity:0}}.workspace{padding:10px}.program{min-height:62px;padding:8px;background:#202b3e;border-radius:12px;display:flex;gap:7px;align-items:center;overflow:auto}.block{flex:0 0 auto;background:#5c68e8;color:#fff;border-radius:10px;padding:9px;font-weight:bold;border-bottom:4px solid #343da5}.block.loop{background:#e55487;border-color:#a82959}.controls{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:8px}button{min-height:48px;border:0;border-radius:11px;background:#fff;border:2px solid #344156;font-weight:900;font-size:15px;touch-action:manipulation;cursor:pointer}button:active{transform:scale(.96)}.exec{background:#2ac58b;color:#062d20}.reset{background:#ef6c57;color:white}.message{text-align:center;height:28px;font-weight:900;color:#d33c43;padding:6px}.lesson{text-align:center;font-size:13px;color:#5b6575}.overlay{position:fixed;inset:0;background:#142033ed;display:grid;place-items:center;z-index:9;padding:18px}.card{width:min(480px,100%);padding:25px;text-align:center;background:#fff6d8;border:5px solid #f5a43e;border-radius:24px}.card h1{font-size:clamp(29px,8vw,44px);margin:0}.card p{line-height:1.6}.card button{width:100%;background:#ffb13d;font-size:19px}.hidden{display:none}@media(max-width:600px){.app{padding:6px}.stat{padding:5px 1px;font-size:10px}.stat b{font-size:15px}.floor{height:155px}.controls{grid-template-columns:repeat(3,1fr)}.head{padding:8px}.workspace{padding:7px}}
</style></head><body><main class="app"><div class="hud"><div class="stat">레벨<b id="level">1</b></div><div class="stat">점수<b id="score">0</b></div><div class="stat">콤보<b id="combo">0</b></div><div class="stat">시간<b id="time">100</b></div><div class="stat">최고<b id="best">0</b></div></div><section class="factory"><div class="head"><h1>🔁 반복문 공장</h1><span>🏭 PACK-O-MATIC</span></div><div class="target"><strong>오늘의 포장 주문</strong><div id="target" class="pattern"></div></div><div class="floor"><div id="arm" class="arm"></div><div id="products" class="products"></div><div id="belt" class="belt"></div></div><div class="workspace"><div id="program" class="program"><span style="color:#9ca8bb">명령 블록을 담으세요…</span></div><div class="controls"><button data-item="🔩">🔩 넣기</button><button data-item="🔴">🔴 넣기</button><button data-item="🔵">🔵 넣기</button><button data-loop="2">🔁 2번</button><button data-loop="3">🔁 3번</button><button data-loop="4">🔁 4번</button><button data-loop="5">🔁 5번</button><button id="undo">↶ 지우기</button><button id="clear" class="reset">🗑 초기화</button><button id="run" class="exec">▶ 공장 가동</button></div><div id="msg" class="message"></div><p class="lesson">같은 명령을 여러 번 사용할 때 반복문을 쓰면 코드가 짧아져요.</p></div></section></main><div id="start" class="overlay"><div class="card"><h1>🔁 반복문 공장</h1><p>주문과 같은 제품을 만드는 코드를 조립하세요.<br><b>반복 블록 뒤의 명령들이 함께 반복</b>돼요!</p><button id="startBtn">🏭 공장 열기</button></div></div><div id="end" class="overlay hidden"><div class="card"><h1>✨ 생산 완료!</h1><p id="result"></p><button id="again">다시 하기</button></div></div><script>
const $=s=>document.querySelector(s),items=['🔩','🔴','🔵'];let score=0,combo=0,maxCombo=0,level=1,time=100,success=0,tries=0,timer,program=[],goal=[],optimal=0,busy=false;
function order(){let difficulty=time>75?1:time>40?2:3,unit=[],repeat=2+Math.floor(Math.random()*(difficulty+1));for(let i=0;i<difficulty;i++)unit.push(items[Math.floor(Math.random()*items.length)]);goal=Array(repeat).fill(unit).flat();optimal=unit.length+1;program=[];$('#products').innerHTML='';$('#target').textContent=goal.join(' ');draw();$('#msg').textContent=difficulty==1?'같은 일을 반복하면 빨라요!':`${unit.length}개 묶음을 찾아보세요!`}
function draw(){let p=$('#program');p.innerHTML=program.length?'':'<span style="color:#9ca8bb">명령 블록을 담으세요…</span>';program.forEach(v=>{let e=document.createElement('span');e.className='block '+(typeof v==='number'?'loop':'');e.textContent=typeof v==='number'?`🔁 ${v}번`:v+' 넣기';p.append(e)})}
document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{if(!busy&&program.length<12){program.push(b.dataset.item);draw()}});document.querySelectorAll('[data-loop]').forEach(b=>b.onclick=()=>{if(!busy&&program.length<12){program.push(+b.dataset.loop);draw()}});$('#undo').onclick=()=>{if(!busy){program.pop();draw()}};$('#clear').onclick=()=>{if(!busy){program=[];draw()}};
function compile(){let n=program.findIndex(v=>typeof v==='number');if(n<0)return program.slice();let count=program[n],before=program.slice(0,n).filter(v=>typeof v==='string'),body=program.slice(n+1).filter(v=>typeof v==='string');return before.concat(Array(count).fill(body).flat())}const wait=n=>new Promise(r=>setTimeout(r,n));
async function run(){if(busy||!program.length)return;busy=true;tries++;let out=compile(),box=$('#products');box.innerHTML='';$('#belt').classList.add('go');for(let v of out.slice(0,15)){let e=document.createElement('span');e.className='item';e.textContent=v;box.append(e);$('#arm').classList.remove('work');void $('#arm').offsetWidth;$('#arm').classList.add('work');await wait(230)}$('#belt').classList.remove('go');let ok=out.join('')===goal.join('');if(ok){success++;combo++;maxCombo=Math.max(maxCombo,combo);let compact=program.length<=optimal,add=compact?100:60;score+=add+combo*3;$('#msg').textContent=compact?'✨ 코드 최적화 보너스! +'+(add+combo*3):'✅ 주문 완성! 반복문이면 더 짧아져요';update();await wait(800);level++;order()}else{combo=0;$('#msg').textContent='⚠️ 주문과 달라요. 반복 범위와 횟수를 확인!';update()}busy=false}
$('#run').onclick=run;function update(){$('#level').textContent=level;$('#score').textContent=score;$('#combo').textContent=combo;$('#time').textContent=time;$('#best').textContent=Math.max(score,+(localStorage.loopFactoryBest||0))}function start(){score=combo=maxCombo=success=tries=0;level=1;time=100;busy=false;$('#start').classList.add('hidden');$('#end').classList.add('hidden');order();update();clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)finish()},1000)}function finish(){clearInterval(timer);busy=true;let best=Math.max(score,+(localStorage.loopFactoryBest||0));localStorage.loopFactoryBest=best;$('#result').innerHTML=`최종 점수 <b>${score}</b><br>성공 ${success}회 · 최고 콤보 ${maxCombo}<br>정확도 ${tries?Math.round(success/tries*100):0}% · 최고기록 ${best}`;$('#end').classList.remove('hidden')}$('#startBtn').onclick=start;$('#again').onclick=start;update();
</script></body></html>
