<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>변수 마법 연구소</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#34236b,#100d2d 65%);color:#fff;font-family:Arial,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(960px,100%);margin:auto;padding:10px}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stat{padding:7px;text-align:center;font-size:11px;border:1px solid #cf91ff;border-radius:12px;background:#17133acc}.stat b{display:block;color:#ffe66f;font-size:18px}.lab{margin-top:10px;overflow:hidden;border:2px solid #b96eff;border-radius:22px;background:#19143c;box-shadow:0 0 35px #9e54ff44}.head{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:linear-gradient(90deg,#653dc1,#a53ea0)}.head h1{margin:0;font-size:clamp(21px,5vw,32px)}.room{position:relative;height:290px;overflow:hidden;background:radial-gradient(circle at 50% 85%,#673a8c,#171537 70%)}.shelf{position:absolute;left:5%;right:5%;bottom:20px;height:18px;background:#4c286c;border-radius:8px;box-shadow:0 8px #291538}.cauldron{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);font-size:100px;filter:drop-shadow(0 0 18px #d66cff)}.cauldron.brew{animation:brew .65s}.orb{position:absolute;left:50%;bottom:155px;transform:translateX(-50%);font-size:56px;filter:drop-shadow(0 0 15px #fff);transition:.45s}.orb.pop{animation:pop .7s}@keyframes brew{25%{transform:translateX(-50%) rotate(8deg)}75%{transform:translateX(-50%) rotate(-8deg)}}@keyframes pop{50%{transform:translateX(-50%) scale(1.7) rotate(180deg)}}.spark{position:absolute;font-size:24px;animation:float 2s infinite alternate}@keyframes float{to{transform:translateY(-30px) rotate(80deg)}}.task{text-align:center;padding:10px;background:#251c51}.task small{color:#cbb7e8}.task b{display:block;margin-top:5px;font-size:clamp(17px,4vw,23px);color:#ffe979}.workspace{padding:11px}.variables{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.jar{padding:9px;border:2px solid #8d70d9;border-radius:12px;background:#27205a;text-align:center}.jar strong{display:block;color:#76f7e0;font-size:13px}.jar span{font-size:25px}.code{min-height:57px;display:flex;gap:7px;align-items:center;overflow:auto;padding:8px;border-radius:11px;background:#0d0b25}.block{flex:0 0 auto;padding:9px 12px;border-radius:9px;background:#654bd0;border-bottom:4px solid #3b288f;font-weight:bold}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}button{min-height:48px;border:0;border-radius:11px;background:#7355d7;color:#fff;font-weight:900;font-size:15px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.96)}.run{background:#17b99d}.clear{background:#c44672}.msg{text-align:center;min-height:31px;padding:7px;color:#ffe66f;font-weight:bold}.lesson{text-align:center;color:#ad9dca;font-size:13px}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:#080620f2;z-index:9}.card{width:min(470px,100%);padding:26px;text-align:center;border:2px solid #cb83ff;border-radius:24px;background:#21184b}.card h1{font-size:clamp(29px,8vw,43px);margin:0}.card p{line-height:1.65;color:#d7c9ee}.card button{width:100%;background:linear-gradient(90deg,#8d51df,#e34fa1);font-size:18px}.hidden{display:none}@media(max-width:600px){.app{padding:6px}.stat{padding:5px 1px;font-size:10px}.stat b{font-size:15px}.room{height:225px}.cauldron{font-size:78px}.orb{bottom:125px}.buttons{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="app"><div class="hud"><div class="stat">레벨<b id="level">1</b></div><div class="stat">점수<b id="score">0</b></div><div class="stat">콤보<b id="combo">0</b></div><div class="stat">시간<b id="time">100</b></div><div class="stat">최고<b id="best">0</b></div></div><section class="lab"><div class="head"><h1>🧪 변수 마법 연구소</h1><span>MAGIC://DATA</span></div><div class="task"><small>마법 주문 목표</small><b id="task"></b></div><div class="room"><i class="spark" style="left:15%;top:20%">✨</i><i class="spark" style="right:16%;top:30%;animation-delay:.7s">✦</i><div id="orb" class="orb">🔮</div><div id="pot" class="cauldron">⚗️</div><div class="shelf"></div></div><div class="workspace"><div class="variables"><div class="jar"><strong>변수: 색</strong><span id="color">⚪</span></div><div class="jar"><strong>변수: 힘</strong><span id="power">0</span></div><div class="jar"><strong>변수: 크기</strong><span id="size">1</span></div></div><div id="code" class="code"><span style="color:#776c9a">변수를 바꾸는 주문을 담으세요…</span></div><div class="buttons"><button data-cmd="color">🎨 색 바꾸기</button><button data-cmd="plus">➕ 힘 +1</button><button data-cmd="double">✖️ 크기 ×2</button><button data-cmd="reset">↺ 힘 = 0</button><button id="undo">↶ 하나 지우기</button><button id="clear" class="clear">🗑 초기화</button><button id="run" class="run">✨ 주문 실행</button></div><div id="msg" class="msg"></div><p class="lesson">변수는 숫자나 색처럼 바뀌는 값을 기억하는 상자예요.</p></div></section></main><div id="start" class="overlay"><div class="card"><h1>🧪 변수 마법 연구소</h1><p>변수 주문을 순서대로 담아 목표 마법구를 만드세요.<br>주문을 실행하면 값과 모습이 함께 변해요!</p><button id="startBtn">🔮 연구 시작</button></div></div><div id="end" class="overlay hidden"><div class="card"><h1>✨ 연구 완료!</h1><p id="result"></p><button id="again">다시 연구하기</button></div></div><script>
const $=s=>document.querySelector(s),colors=['⚪','🔴','🔵','🟢'];let score=0,combo=0,maxCombo=0,level=1,time=100,success=0,tries=0,timer,cmds=[],goal,busy=false,state;
function make(){let hard=time<65?2:1;goal={color:colors[1+Math.floor(Math.random()*3)],power:1+Math.floor(Math.random()*(hard+2)),size:time<35?(Math.random()<.5?2:4):1};cmds=[];resetState();$('#task').textContent=`색 ${goal.color} · 힘 ${goal.power} · 크기 ${goal.size}`;draw();$('#msg').textContent='어떤 값부터 바꿀까요?'}function resetState(){state={color:'⚪',power:0,size:1};paint()}function paint(){$('#color').textContent=state.color;$('#power').textContent=state.power;$('#size').textContent=state.size;$('#orb').textContent=state.color==='⚪'?'🔮':state.color;$('#orb').style.transform=`translateX(-50%) scale(${Math.min(state.size,4)*.18+.82})`}
function draw(){let c=$('#code');c.innerHTML=cmds.length?'':'<span style="color:#776c9a">변수를 바꾸는 주문을 담으세요…</span>';cmds.forEach(v=>{let e=document.createElement('span');e.className='block';e.textContent={color:'색 = 다음',plus:'힘 + 1',double:'크기 × 2',reset:'힘 = 0'}[v];c.append(e)})}document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{if(!busy&&cmds.length<10){cmds.push(b.dataset.cmd);draw()}});$('#undo').onclick=()=>{if(!busy){cmds.pop();draw()}};$('#clear').onclick=()=>{if(!busy){cmds=[];resetState();draw()}};const wait=n=>new Promise(r=>setTimeout(r,n));
async function run(){if(busy||!cmds.length)return;busy=true;tries++;resetState();for(const c of cmds){if(c==='color'){let i=(colors.indexOf(state.color)+1)%colors.length;state.color=colors[i]}if(c==='plus')state.power++;if(c==='double')state.size*=2;if(c==='reset')state.power=0;paint();$('#pot').classList.remove('brew');void $('#pot').offsetWidth;$('#pot').classList.add('brew');await wait(260)}let ok=state.color===goal.color&&state.power===goal.power&&state.size===goal.size;if(ok){success++;combo++;maxCombo=Math.max(maxCombo,combo);let add=80+combo*5+Math.max(0,30-cmds.length*2);score+=add;$('#msg').textContent=(combo===5?'🌟 5 COMBO! ':'')+'마법 성공! +'+add;$('#orb').classList.add('pop');update();await wait(850);$('#orb').classList.remove('pop');level++;make()}else{combo=0;$('#msg').textContent='💨 값이 달라요. 현재 항아리를 확인하세요!';update()}busy=false}
$('#run').onclick=run;function update(){$('#level').textContent=level;$('#score').textContent=score;$('#combo').textContent=combo;$('#time').textContent=time;$('#best').textContent=Math.max(score,+(localStorage.variableMagicBest||0))}function start(){score=combo=maxCombo=success=tries=0;level=1;time=100;busy=false;$('#start').classList.add('hidden');$('#end').classList.add('hidden');make();update();clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)finish()},1000)}function finish(){clearInterval(timer);busy=true;let best=Math.max(score,+(localStorage.variableMagicBest||0));localStorage.variableMagicBest=best;$('#result').innerHTML=`최종 점수 <b>${score}</b><br>마법 성공 ${success}회 · 최고 콤보 ${maxCombo}<br>정확도 ${tries?Math.round(success/tries*100):0}% · 레벨 ${level}<br>최고기록 <b>${best}</b>`;$('#end').classList.remove('hidden')}$('#startBtn').onclick=start;$('#again').onclick=start;update();
</script></body></html>
