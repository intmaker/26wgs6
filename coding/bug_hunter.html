<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>버그 헌터</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#060616;color:#d9fff7;font-family:Arial,"Noto Sans KR",sans-serif;user-select:none;overflow-x:hidden}.gridbg{position:fixed;inset:0;background-image:linear-gradient(#16e0ba12 1px,transparent 1px),linear-gradient(90deg,#16e0ba12 1px,transparent 1px);background-size:26px 26px;perspective:300px}.app{position:relative;width:min(1000px,100%);margin:auto;padding:10px}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stat{background:#0e1830dd;border:1px solid #25f6c2;border-radius:10px;padding:7px;text-align:center;font-size:11px}.stat b{display:block;color:#57ffd6;font-size:18px;text-shadow:0 0 8px #2cffc6}.lab{margin-top:10px;border:2px solid #20eeb7;border-radius:18px;background:#0a1127eF;box-shadow:0 0 30px #17eebe28;overflow:hidden}.head{display:flex;justify-content:space-between;padding:11px 15px;background:#112141;border-bottom:1px solid #2fffc5}.head h1{font-size:clamp(21px,5vw,31px);margin:0}.screen{display:grid;grid-template-columns:1fr 1fr;min-height:360px}.code,.output{padding:13px}.code{border-right:1px solid #24d8b877}.label{color:#57ffd6;font-size:12px;font-weight:bold;margin-bottom:8px}.goal{background:#182444;border-radius:9px;padding:9px;margin-bottom:9px}.blocks{display:grid;gap:7px}.block{min-height:46px;width:100%;border:2px solid #5577b8;border-left:7px solid #8b67ff;border-radius:10px;background:#18264c;color:#edf4ff;text-align:left;padding:8px 12px;font-weight:bold;font-size:15px;cursor:pointer;touch-action:manipulation}.block:hover,.block.selected{border-color:#ff4f9b;background:#44204a;transform:translateX(4px)}.monitor{height:245px;border:4px solid #283756;border-radius:13px;background:radial-gradient(circle,#122c46,#050a16);position:relative;overflow:hidden;display:grid;place-items:center}.actor{font-size:50px;position:absolute;left:15%;bottom:30%;transition:.6s;filter:drop-shadow(0 0 9px #55ffdf)}.actor.wrong{left:65%;transform:rotate(25deg)}.actor.correct{left:72%}.star{position:absolute;right:12%;bottom:33%;font-size:44px}.bug{position:absolute;font-size:34px;animation:crawl 3s ease-in-out infinite;filter:drop-shadow(0 0 7px #ff2e8a)}@keyframes crawl{0%,100%{transform:translate(-80px,60px) rotate(-15deg)}50%{transform:translate(90px,-50px) rotate(20deg)}}.bug.zap{animation:zap .7s forwards}@keyframes zap{40%{filter:brightness(5);transform:scale(1.8) rotate(180deg)}100%{opacity:0;transform:scale(0)}}.beam{position:absolute;width:0;height:5px;background:#60ffde;box-shadow:0 0 15px #fff;left:10%;top:50%;transition:.35s}.beam.fire{width:80%}.console{margin-top:8px;background:#020711;border-radius:8px;padding:8px;color:#58ffd0;font-family:monospace;min-height:48px}.fixer{border-top:1px solid #22e3b2;padding:11px;text-align:center}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choices button{min-height:48px;border:1px solid #24ebbb;border-radius:10px;background:#19335a;color:#fff;font-weight:bold;font-size:15px;touch-action:manipulation;cursor:pointer}.choices button:active{transform:scale(.96)}.msg{height:33px;padding:7px;color:#ffda5b;font-weight:900}.lesson{font-size:13px;color:#8eaaa7}.glitch{animation:glitch .25s 3}@keyframes glitch{25%{transform:translateX(5px);filter:hue-rotate(90deg)}75%{transform:translateX(-5px)}}.overlay{position:fixed;inset:0;background:#030510f2;display:grid;place-items:center;z-index:10;padding:18px}.card{width:min(480px,100%);padding:26px;border:2px solid #42ffd0;border-radius:22px;background:#111c36;text-align:center;box-shadow:0 0 45px #2fffc344}.card h1{font-size:clamp(30px,8vw,45px);margin:0;text-shadow:3px 0 #ff3c9d}.card p{line-height:1.6;color:#c5dcd8}.card button{width:100%;min-height:52px;border:0;border-radius:11px;background:linear-gradient(90deg,#21dbb0,#636cff);color:white;font-weight:900;font-size:18px}.hidden{display:none}@media(max-width:650px){.app{padding:6px}.stat{padding:5px 1px;font-size:10px}.stat b{font-size:15px}.screen{grid-template-columns:1fr}.code{border-right:0;border-bottom:1px solid #24d8b877}.monitor{height:180px}.choices{grid-template-columns:1fr}.block{min-height:44px}}
</style></head><body><div class="gridbg"></div><main class="app"><div class="hud"><div class="stat">레벨<b id="level">1</b></div><div class="stat">점수<b id="score">0</b></div><div class="stat">콤보<b id="combo">0</b></div><div class="stat">시간<b id="time">100</b></div><div class="stat">최고<b id="best">0</b></div></div><section id="lab" class="lab"><div class="head"><h1>🐞 버그 헌터</h1><span>DEBUG://LAB</span></div><div class="screen"><div class="code"><div class="label">◉ 감염된 코드 — 틀린 블록을 선택!</div><div id="goal" class="goal"></div><div id="blocks" class="blocks"></div></div><div class="output"><div class="label">◉ 실행 결과</div><div id="monitor" class="monitor"><span id="actor" class="actor">🤖</span><span id="star" class="star">⭐</span><span id="bug" class="bug">🐞</span><i id="beam" class="beam"></i></div><div id="console" class="console">&gt; 오류를 분석하는 중...</div></div></div><div class="fixer"><div class="label">◉ 올바른 명령으로 교체</div><div id="choices" class="choices"></div><div id="msg" class="msg"></div><p class="lesson">프로그램의 잘못된 부분을 찾아 고치는 것을 디버깅이라고 해요.</p></div></section></main><div id="start" class="overlay"><div class="card"><h1>🐞 BUG HUNTER</h1><p>코드와 이상한 실행 결과를 비교하세요.<br>잘못된 블록을 누르고 올바른 명령으로 교체해요!</p><button id="startBtn">⚡ 디버깅 시작</button></div></div><div id="end" class="overlay hidden"><div class="card"><h1>BUGS CLEARED!</h1><p id="result"></p><button id="again">다시 사냥하기</button></div></div><script>
const $=s=>document.querySelector(s);const puzzles=[
{g:'🤖 로봇이 ⭐까지 오른쪽으로 이동',c:['앞으로','앞으로','왼쪽','앞으로'],bad:2,fix:'오른쪽',opts:['오른쪽','뒤로','멈춤'],log:'로봇이 별을 지나 엉뚱한 길로 갔어요!',kind:'move'},
{g:'🐱 고양이가 “안녕!”을 3번 말하기',c:['2번 반복','“안녕!” 말하기'],bad:0,fix:'3번 반복',opts:['3번 반복','1번 반복','5번 반복'],log:'안녕! 안녕! …한 번이 부족해요.',kind:'repeat'},
{g:'현재 점수 15점이면 성공하기',c:['IF 점수 > 10','→ 실패 표시'],bad:1,fix:'→ 성공 표시',opts:['→ 성공 표시','→ 점수 지우기','→ 다시 시작'],log:'조건은 참인데 실패가 나왔어요!',kind:'if'},
{g:'🤖 앞으로 3칸 이동하기',c:['3번 반복','뒤로 1칸'],bad:1,fix:'앞으로 1칸',opts:['앞으로 1칸','왼쪽 회전','2칸 점프'],log:'반복할 명령의 방향이 반대예요!',kind:'repeat'},
{g:'빨간불일 때 자동차 멈추기',c:['IF 신호 = 초록','→ 멈춘다'],bad:0,fix:'IF 신호 = 빨강',opts:['IF 신호 = 빨강','IF 비 = ON','IF 속도 > 0'],log:'조건이 상황과 맞지 않아요!',kind:'if'},
{g:'⭐까지 순서대로 이동하기',c:['오른쪽','오른쪽','앞으로','왼쪽','오른쪽'],bad:3,fix:'앞으로',opts:['앞으로','뒤로','2번 반복'],log:'네 번째 명령에서 길을 벗어났어요!',kind:'move'}];
let score=0,combo=0,maxCombo=0,level=1,time=100,success=0,tries=0,timer,current,selected=-1,busy=false;
function load(){busy=false;selected=-1;let max=time>65?2:time>35?4:6;current=puzzles[Math.floor(Math.random()*max)];$('#goal').textContent='🎯 목표: '+current.g;$('#blocks').innerHTML='';current.c.forEach((v,i)=>{let b=document.createElement('button');b.className='block';b.textContent=(i+1)+'. '+v;b.onclick=()=>select(i,b);$('#blocks').append(b)});$('#choices').innerHTML='<span style="grid-column:1/-1;color:#718d91">먼저 의심되는 코드 블록을 선택하세요</span>';$('#console').textContent='> '+current.log;$('#msg').textContent='';$('#actor').className='actor wrong';$('#bug').className='bug';$('#beam').className='beam'}
function select(i,b){if(busy)return;selected=i;document.querySelectorAll('.block').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('#choices').innerHTML='';current.opts.slice().sort(()=>Math.random()-.5).forEach(v=>{let x=document.createElement('button');x.textContent=v;x.onclick=()=>fix(v);$('#choices').append(x)})}
function fix(v){if(busy||selected<0)return;busy=true;tries++;let ok=selected===current.bad&&v===current.fix;if(ok){success++;combo++;maxCombo=Math.max(maxCombo,combo);let add=25+combo*5;score+=add;$('#msg').textContent=combo==5?'⚡ SUPER DEBUGGER!':'🔨 BUG FIXED! +'+add;$('#beam').classList.add('fire');$('#bug').classList.add('zap');$('#actor').className='actor correct';$('#console').textContent='> 실행 성공! 오류가 사라졌습니다.'}else{combo=0;$('#msg').textContent='🐞 버그가 도망쳤어요! 다시 분석!';$('#lab').classList.add('glitch');$('#console').textContent=selected!==current.bad?'> 그 블록은 정상이에요.':' > 교체 명령이 목표와 달라요.'}level=Math.floor(success/3)+1;update();setTimeout(()=>{$('#lab').classList.remove('glitch');load()},950)}
function update(){$('#level').textContent=level;$('#score').textContent=score;$('#combo').textContent=combo;$('#time').textContent=time;$('#best').textContent=Math.max(score,+(localStorage.bugHunterBest||0))}function start(){score=combo=maxCombo=success=tries=0;level=1;time=100;$('#start').classList.add('hidden');$('#end').classList.add('hidden');load();update();clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)finish()},1000)}function finish(){clearInterval(timer);busy=true;let best=Math.max(score,+(localStorage.bugHunterBest||0));localStorage.bugHunterBest=best;$('#result').innerHTML=`최종 점수 <b>${score}</b><br>버그 제거 ${success}마리 · 최고 콤보 ${maxCombo}<br>정확도 ${tries?Math.round(success/tries*100):0}% · 레벨 ${level}<br>최고기록 <b>${best}</b>`;$('#end').classList.remove('hidden')}$('#startBtn').onclick=start;$('#again').onclick=start;update();
</script></body></html>
