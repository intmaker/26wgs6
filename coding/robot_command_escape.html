<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>명령어 로봇 탈출</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#182b57,#070b1d 65%);color:#eef7ff;font-family:Arial,"Noto Sans KR",sans-serif;user-select:none;overflow-x:hidden}.app{width:min(960px,100%);margin:auto;padding:12px}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;position:relative;z-index:2}.stat{background:#111c3bcc;border:1px solid #2eeaff55;border-radius:12px;padding:8px;text-align:center;font-size:12px}.stat b{display:block;color:#5ff6ff;font-size:18px}.bar{height:7px;background:#263251;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#57f1ff,#cb5cff);width:100%;transition:.3s}.panel{margin-top:10px;background:#0c1535dd;border:1px solid #3ae7ff55;border-radius:20px;padding:14px;box-shadow:0 0 30px #08d9ff1c}.title{text-align:center;margin:2px;font-size:clamp(22px,5vw,34px)}.mission{text-align:center;color:#b8cdec;margin:5px 0 10px}.board{width:min(64vh,520px,94vw);aspect-ratio:1;margin:auto;display:grid;gap:3px;padding:6px;border-radius:16px;background:#061025;box-shadow:inset 0 0 24px #000,0 0 22px #14dcff22}.cell{display:grid;place-items:center;position:relative;background:linear-gradient(135deg,#15244b,#0f1938);border:1px solid #2b4b7b;border-radius:7px;font-size:clamp(20px,6vw,38px)}.cell.wall{background:repeating-linear-gradient(45deg,#28314e,#28314e 7px,#171e37 7px,#171e37 14px)}.cell.goal{box-shadow:inset 0 0 20px #ffe66b99}.robot{transition:transform .25s;filter:drop-shadow(0 0 9px #58f6ff)}.robot.bump{animation:bump .3s}.robot.win{animation:win .7s}@keyframes bump{50%{transform:translateX(10px) rotate(12deg)}}@keyframes win{50%{transform:scale(1.5) rotate(360deg)}}.queue{min-height:54px;display:flex;gap:6px;align-items:center;overflow-x:auto;margin:10px 0;padding:7px;background:#070e27;border-radius:12px}.chip{flex:0 0 auto;padding:8px 11px;border-radius:9px;background:#253d75;border:1px solid #5ce9ff;font-weight:bold}.chip.active{background:#df54ff;transform:translateY(-3px)}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}button{min-height:48px;border:0;border-radius:12px;color:white;background:#254479;font-weight:900;font-size:15px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.96)}.run{background:linear-gradient(135deg,#04cbb9,#147efb)}.clear{background:#8b3657}.hint{background:#6d49a8}.toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-20px);padding:13px 22px;border-radius:99px;background:#11dcb9;color:#061229;font-weight:900;opacity:0;pointer-events:none;z-index:6}.toast.show{animation:toast .9s}@keyframes toast{20%,75%{opacity:1;transform:translate(-50%,0)}}.lesson{text-align:center;color:#91a8ce;font-size:13px;margin:10px}.overlay{position:fixed;inset:0;background:#050a18eF;display:grid;place-items:center;z-index:10;padding:18px}.card{width:min(480px,100%);background:linear-gradient(145deg,#152755,#0c1330);border:2px solid #4deaff;border-radius:25px;padding:25px;text-align:center;box-shadow:0 0 45px #37eaff38}.card h1{font-size:clamp(28px,8vw,44px);margin:0 0 12px}.card p{line-height:1.6;color:#c6d7ef}.card button{width:100%;background:linear-gradient(135deg,#17d6c3,#5577ff);font-size:19px}.hidden{display:none}.result{font-size:18px;line-height:1.8}.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:36px 36px;opacity:.12}@media(max-width:600px){.app{padding:7px}.stat{padding:6px 2px;font-size:10px}.stat b{font-size:15px}.panel{padding:8px}.controls{grid-template-columns:repeat(3,1fr)}.controls .run{grid-column:span 2}.board{width:min(52vh,94vw)}}
</style></head><body><div class="stars"></div><main class="app"><div class="hud"><div class="stat">스테이지<b id="stage">1</b></div><div class="stat">점수<b id="score">0</b></div><div class="stat">콤보<b id="combo">0</b></div><div class="stat">시간<b id="time">100</b><div class="bar"><i id="timebar"></i></div></div><div class="stat">최고<b id="best">0</b></div></div><section class="panel"><h1 class="title">🤖 명령어 로봇 탈출</h1><p class="mission" id="mission">명령을 조립해 배터리로 이동하세요!</p><div id="board" class="board"></div><div id="queue" class="queue"><span style="color:#7185aa">명령을 눌러 담으세요…</span></div><div class="controls"><button data-cmd="F">⬆️ 앞으로</button><button data-cmd="L">↩️ 왼쪽</button><button data-cmd="R">↪️ 오른쪽</button><button id="undo">↶ 하나 지우기</button><button id="clear" class="clear">🗑 초기화</button><button id="run" class="run">▶ 실행</button><button id="hint" class="hint">💡 힌트 (-10)</button></div><p class="lesson">컴퓨터는 명령을 위에서부터 순서대로 실행해요.</p></section></main><div id="toast" class="toast"></div><div id="start" class="overlay"><div class="card"><h1>🤖 명령어 로봇 탈출</h1><p>이동 명령을 미리 조립하고 실행해 우주 기지를 탈출하세요.<br>배터리가 보이면 먼저 챙겨야 해요!</p><button id="startBtn">🚀 탐험 시작</button></div></div><div id="end" class="overlay hidden"><div class="card"><h1>🌌 탐험 완료!</h1><div id="result" class="result"></div><button id="again">다시 하기</button></div></div><script>
const $=s=>document.querySelector(s),board=$('#board'),queue=$('#queue'),toast=$('#toast');let score=0,combo=0,maxCombo=0,stage=1,time=100,success=0,attempts=0,timer,running=false,commands=[],level;
const dirs=[[0,-1],[1,0],[0,1],[-1,0]],arrows=['⬆️','➡️','⬇️','⬅️'];
const maps=[
{n:5,s:[0,4],d:0,g:[3,1],w:[[1,4],[1,3],[3,3],[4,3]]},{n:5,s:[4,4],d:3,g:[1,1],w:[[2,4],[2,3],[2,1],[3,1]]},{n:6,s:[0,5],d:0,g:[5,0],w:[[1,5],[1,3],[2,3],[3,3],[4,1],[4,2],[2,0]],b:[3,2]},{n:6,s:[5,5],d:3,g:[0,0],w:[[4,4],[3,4],[1,4],[1,3],[1,2],[3,2],[4,2],[4,0]],b:[2,1]},{n:6,s:[0,5],d:0,g:[5,0],w:[[1,4],[2,4],[4,4],[4,3],[2,2],[3,2],[1,1],[4,1]],b:[3,3]}];
function setup(){level=JSON.parse(JSON.stringify(maps[(stage-1)%maps.length]));level.p=[...level.s];level.dir=level.d;level.got=!level.b;commands=[];running=false;render();drawQueue();$('#mission').textContent=level.b?'🔋 배터리를 먼저 모은 뒤 🚪 출구로!':'🔋 배터리까지 로봇을 보내세요!'}
function render(){board.style.gridTemplateColumns=`repeat(${level.n},1fr)`;board.innerHTML='';for(let y=0;y<level.n;y++)for(let x=0;x<level.n;x++){let c=document.createElement('div');c.className='cell';if(level.w.some(v=>v[0]==x&&v[1]==y))c.classList.add('wall'),c.textContent='▦';if(level.g[0]==x&&level.g[1]==y)c.classList.add('goal'),c.textContent=level.b?'🚪':'🔋';if(level.b&&!level.got&&level.b[0]==x&&level.b[1]==y)c.textContent='🔋';if(level.p[0]==x&&level.p[1]==y)c.innerHTML=`<span class="robot">🤖<small style="position:absolute">${arrows[level.dir]}</small></span>`;board.append(c)}}
function drawQueue(active=-1){queue.innerHTML=commands.length?'':'<span style="color:#7185aa">명령을 눌러 담으세요…</span>';commands.forEach((v,i)=>{let e=document.createElement('span');e.className='chip'+(i==active?' active':'');e.textContent=v=='F'?'⬆️ 앞으로':v=='L'?'↩️ 왼쪽':'↪️ 오른쪽';queue.append(e)})}
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{if(!running&&commands.length<18){commands.push(b.dataset.cmd);drawQueue()}});$('#undo').onclick=()=>{if(!running){commands.pop();drawQueue()}};$('#clear').onclick=()=>{if(!running){commands=[];level.p=[...level.s];level.dir=level.d;render();drawQueue()}};
const wait=ms=>new Promise(r=>setTimeout(r,ms));async function execute(){if(running||!commands.length)return;running=true;attempts++;level.p=[...level.s];level.dir=level.d;level.got=!level.b;render();let hit=false;for(let i=0;i<commands.length;i++){drawQueue(i);await wait(330);let c=commands[i];if(c=='L')level.dir=(level.dir+3)%4;else if(c=='R')level.dir=(level.dir+1)%4;else{let nx=level.p[0]+dirs[level.dir][0],ny=level.p[1]+dirs[level.dir][1];if(nx<0||ny<0||nx>=level.n||ny>=level.n||level.w.some(v=>v[0]==nx&&v[1]==ny)){hit=true;show('💥 벽! 명령을 고쳐보세요');}else level.p=[nx,ny]}if(level.b&&level.p[0]==level.b[0]&&level.p[1]==level.b[1])level.got=true;render()}drawQueue();if(level.p[0]==level.g[0]&&level.p[1]==level.g[1]&&level.got){success++;combo++;maxCombo=Math.max(maxCombo,combo);let bonus=Math.max(0,70-commands.length*3),gain=100+bonus+combo*5;score+=gain;show(`${combo>=5?'⚡ '+combo+' COMBO! ':''}성공 +${gain}`);$('.robot')?.classList.add('win');update();await wait(850);stage++;setup()}else{combo=0;show(hit?'🛠 순서를 바꿔 다시 실행!':'🤔 목표에 닿지 않았어요');update()}running=false}
$('#run').onclick=execute;$('#hint').onclick=()=>{if(running)return;score=Math.max(0,score-10);let target=level.b&&!level.got?level.b:level.g;show(`💡 목표는 ${target[0]+1}열 ${target[1]+1}행!`);update()};function show(t){toast.textContent=t;toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show')}function update(){$('#stage').textContent=stage;$('#score').textContent=score;$('#combo').textContent=combo;$('#time').textContent=time;$('#timebar').style.width=time+'%';$('#best').textContent=Math.max(score,+(localStorage.robotEscapeBest||0))}
function start(){score=combo=maxCombo=success=attempts=0;stage=1;time=100;$('#start').classList.add('hidden');$('#end').classList.add('hidden');setup();update();clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)finish()},1000)}function finish(){clearInterval(timer);running=true;let best=Math.max(score,+(localStorage.robotEscapeBest||0));localStorage.robotEscapeBest=best;$('#result').innerHTML=`최종 점수 <b>${score}</b><br>성공 ${success}회 · 최고 콤보 ${maxCombo}<br>클리어 스테이지 ${stage-1}<br>최고기록 <b>${best}</b>`;$('#end').classList.remove('hidden')}$('#startBtn').onclick=start;$('#again').onclick=start;update();
</script></body></html>
