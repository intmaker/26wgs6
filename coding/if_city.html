<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>조건문 신호등 도시</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#69d4ff,#d9f8ff 55%,#b9e481 55%);font-family:Arial,"Noto Sans KR",sans-serif;color:#17304a;user-select:none;overflow-x:hidden}.app{width:min(980px,100%);margin:auto;padding:10px}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stat{background:#ffffffd9;border-radius:13px;padding:8px;text-align:center;font-size:11px;box-shadow:0 3px 9px #25608028}.stat b{display:block;font-size:18px;color:#1676c5}.city{margin-top:10px;border:3px solid #fff;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 14px 35px #245d7555}.top{padding:10px 15px;background:#fff;display:flex;align-items:center;justify-content:space-between}.top h1{font-size:clamp(20px,5vw,31px);margin:0}.scene{height:280px;position:relative;overflow:hidden;background:linear-gradient(#72d7ff 0 56%,#8b919b 56% 88%,#5eb952 88%)}.sun{position:absolute;right:7%;top:15px;font-size:42px}.buildings{position:absolute;left:0;right:0;bottom:44%;height:120px;background:linear-gradient(90deg,#ffab76 0 18%,transparent 18% 22%,#69b4e8 22% 42%,transparent 42% 47%,#ffd261 47% 70%,transparent 70% 75%,#ef87a2 75%);clip-path:polygon(0 25%,12% 25%,12% 0,18% 0,18% 35%,30% 35%,30% 12%,42% 12%,42% 40%,55% 40%,55% 5%,68% 5%,68% 32%,80% 32%,80% 15%,95% 15%,95% 35%,100% 35%,100% 100%,0 100%)}.road{position:absolute;left:0;right:0;bottom:12%;height:78px;border-block:5px solid white;background:repeating-linear-gradient(90deg,transparent 0 45px,#fff 45px 78px,transparent 78px 123px);background-size:123px 6px;background-repeat:repeat-x;background-position:center}.car{position:absolute;left:12%;bottom:21%;font-size:58px;filter:drop-shadow(0 7px 3px #0004);transition:transform .7s,left .7s}.car.go{left:72%}.car.stop{animation:brake .5s}.car.turn{animation:turn .8s}.car.charge{animation:charge 1s}@keyframes brake{35%{transform:translateX(35px) rotate(-6deg)}}@keyframes turn{50%{transform:translate(80px,-25px) rotate(-18deg)}}@keyframes charge{50%{filter:drop-shadow(0 0 18px #fff000);transform:scale(1.12)}}.event{position:absolute;right:13%;bottom:42%;font-size:65px;animation:pop .4s}@keyframes pop{from{transform:scale(0) rotate(20deg)}}.cloud{position:absolute;font-size:35px;animation:cloud 12s linear infinite}@keyframes cloud{from{left:-10%}to{left:110%}}.decision{padding:11px}.condition{text-align:center;background:#e9f6ff;border-left:7px solid #2b8ce1;border-radius:12px;padding:10px;font-weight:900;font-size:clamp(16px,4vw,22px);min-height:49px}.timerline{height:6px;background:#dce8ef;margin:8px 0;border-radius:6px;overflow:hidden}.timerline i{display:block;height:100%;width:100%;background:#2dd49b}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{min-height:50px;border:0;border-radius:13px;background:#2d91e4;color:white;font-weight:900;font-size:16px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.96)}.msg{text-align:center;height:30px;padding:7px;font-weight:bold}.lesson{text-align:center;color:#607789;font-size:13px}.overlay{position:fixed;inset:0;background:#166392eF;display:grid;place-items:center;padding:18px;z-index:9}.card{width:min(470px,100%);background:white;border-radius:25px;padding:26px;text-align:center;border:5px solid #ffcc47}.card h1{font-size:clamp(28px,8vw,42px);margin:0}.card p{line-height:1.6}.card button{width:100%;background:#19b887}.hidden{display:none}@media(max-width:600px){.app{padding:6px}.stat{padding:5px 1px;font-size:10px}.stat b{font-size:15px}.scene{height:230px}.answers{grid-template-columns:1fr}.car{font-size:48px}.event{font-size:55px;bottom:45%}}
</style></head><body><main class="app"><div class="hud"><div class="stat">레벨<b id="level">1</b></div><div class="stat">점수<b id="score">0</b></div><div class="stat">콤보<b id="combo">0</b></div><div class="stat">시간<b id="time">100</b></div><div class="stat">최고<b id="best">0</b></div></div><section class="city"><div class="top"><h1>🚦 조건문 신호등 도시</h1><span>AI DRIVE</span></div><div class="scene"><span class="cloud">☁️</span><span class="sun">☀️</span><div class="buildings"></div><div class="road"></div><div id="event" class="event"></div><div id="car" class="car">🚙</div></div><div class="decision"><div id="condition" class="condition"></div><div class="timerline"><i id="think"></i></div><div id="answers" class="answers"></div><div id="msg" class="msg"></div><p class="lesson">조건문은 상황에 따라 다른 명령을 실행해요.</p></div></section></main><div id="start" class="overlay"><div class="card"><h1>🚦 조건문 신호등 도시</h1><p>도시를 달리며 나타나는 상황을 보고<br><b>IF 조건에 맞는 행동</b>을 빠르게 선택하세요!</p><button id="startBtn">🚙 드라이브 시작</button></div></div><div id="end" class="overlay hidden"><div class="card"><h1>🏁 운행 완료!</h1><p id="result"></p><button id="again">다시 달리기</button></div></div><script>
const $=s=>document.querySelector(s),cases=[
{e:'🟢',q:'IF 신호등 = 초록 → ?',a:'직진한다',o:['직진한다','멈춘다','경적을 울린다'],m:'go'},
{e:'🔴',q:'IF 신호등 = 빨강 → ?',a:'멈춘다',o:['직진한다','멈춘다','점프한다'],m:'stop'},
{e:'🚶',q:'IF 보행자 있음 → ?',a:'멈춘다',o:['속도를 높인다','멈춘다','불을 끈다'],m:'stop'},
{e:'🚧',q:'IF 앞에 장애물 → ?',a:'방향을 바꾼다',o:['방향을 바꾼다','그대로 간다','잠든다'],m:'turn'},
{e:'🌧️',q:'IF 비 = ON → ?',a:'와이퍼를 켠다',o:['와이퍼를 켠다','창문을 연다','후진한다'],m:'charge'},
{e:'🔋15%',q:'IF 배터리 < 20% → ?',a:'충전소로 간다',o:['더 빨리 달린다','충전소로 간다','경적을 울린다'],m:'charge'}];
let score=0,combo=0,maxCombo=0,level=1,time=100,success=0,tries=0,timer,current,startAt,busy=false;
function next(){busy=false;let pool=time>70?cases.slice(0,2):time>40?cases.slice(0,4):cases;current=pool[Math.floor(Math.random()*pool.length)];$('#event').textContent=current.e;$('#condition').textContent=(time<35&&current.e==='🟢')?'IF 신호등 = 초록 AND 보행자 없음 → ?':current.q;$('#answers').innerHTML='';current.o.slice().sort(()=>Math.random()-.5).forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>choose(v);$('#answers').append(b)});$('#msg').textContent='상황을 판단하세요!';$('#think').style.transition='none';$('#think').style.width='100%';requestAnimationFrame(()=>{requestAnimationFrame(()=>{$('#think').style.transition='width 6s linear';$('#think').style.width='0'})});startAt=Date.now();let car=$('#car');car.className='car';car.style.left='12%'}
function choose(v){if(busy)return;busy=true;tries++;let ok=v===current.a,car=$('#car');car.classList.add(current.m);if(ok){success++;combo++;maxCombo=Math.max(maxCombo,combo);let fast=Math.max(0,Math.round((5000-(Date.now()-startAt))/400)),add=15+fast+Math.min(combo,10);score+=add;$('#msg').textContent=(combo==5?'⚡ 5 COMBO! ':'')+'정확한 판단! +'+add}else{combo=0;car.classList.add('stop');$('#msg').textContent='💥 다시 생각해봐요! 정답: '+current.a}level=Math.floor(success/3)+1;update();setTimeout(next,900)}
function update(){$('#level').textContent=level;$('#score').textContent=score;$('#combo').textContent=combo;$('#time').textContent=time;$('#best').textContent=Math.max(score,+(localStorage.ifCityBest||0))}function start(){score=combo=maxCombo=success=tries=0;level=1;time=100;$('#start').classList.add('hidden');$('#end').classList.add('hidden');next();update();clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)finish()},1000)}function finish(){clearInterval(timer);busy=true;let best=Math.max(score,+(localStorage.ifCityBest||0));localStorage.ifCityBest=best;$('#result').innerHTML=`최종 점수 <b>${score}</b><br>성공 ${success}회 · 최고 콤보 ${maxCombo}<br>정확도 ${tries?Math.round(success/tries*100):0}% · 레벨 ${level}<br>최고기록 <b>${best}</b>`;$('#end').classList.remove('hidden')}$('#startBtn').onclick=start;$('#again').onclick=start;update();
</script></body></html>
