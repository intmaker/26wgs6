<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>
<meta name="theme-color" content="#6c63ff">

<title>✊✌️🖐️ 가위바위보 배틀!</title>

<style>
/* =========================
   기본 설정
========================= */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  touch-action: manipulation;
  font-family:
    "Arial Rounded MT Bold",
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    Arial,
    sans-serif;
}

body {
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding:
    max(10px, env(safe-area-inset-top))
    max(10px, env(safe-area-inset-right))
    max(10px, env(safe-area-inset-bottom))
    max(10px, env(safe-area-inset-left));

  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.4), transparent 22%),
    radial-gradient(circle at 80% 10%, rgba(255,255,255,.25), transparent 18%),
    linear-gradient(135deg, #72e6ff 0%, #8d7dff 48%, #ff79b9 100%);

  color: #25233c;
}

/* =========================
   전체 게임 패널
========================= */
.game {
  position: relative;
  width: min(960px, 100%);
  min-height: min(760px, calc(100dvh - 20px));
  border-radius: 32px;
  padding: 20px;

  background: rgba(255,255,255,.93);
  box-shadow:
    0 20px 60px rgba(35, 28, 99, .28),
    inset 0 0 0 3px rgba(255,255,255,.75);

  overflow: hidden;
}

.game::before {
  content: "";
  position: absolute;
  width: 220px;
  height: 220px;
  left: -80px;
  top: -90px;
  border-radius: 50%;
  background: rgba(103, 232, 249, .18);
  pointer-events: none;
}

.game::after {
  content: "";
  position: absolute;
  width: 260px;
  height: 260px;
  right: -110px;
  bottom: -130px;
  border-radius: 50%;
  background: rgba(255, 111, 169, .13);
  pointer-events: none;
}

/* =========================
   제목
========================= */
.title {
  position: relative;
  z-index: 2;
  margin: 2px 0 12px;
  text-align: center;
  font-size: clamp(25px, 5vw, 45px);
  line-height: 1.1;
  color: #4b42d6;
  text-shadow: 0 3px 0 rgba(255,255,255,.9);
}

.subtitle {
  text-align: center;
  font-size: clamp(12px, 2.5vw, 16px);
  color: #77728d;
  margin: -3px 0 12px;
}

/* =========================
   점수판
========================= */
.scoreboard {
  position: relative;
  z-index: 2;

  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: center;

  max-width: 690px;
  margin: 0 auto 12px;
  padding: 12px 16px;

  border-radius: 22px;
  background: linear-gradient(135deg, #312e81, #5b4de2);
  color: white;

  box-shadow: 0 8px 20px rgba(49, 46, 129, .22);
}

.score-side {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 0;
}

.score-name {
  font-size: clamp(12px, 3vw, 17px);
  font-weight: 900;
  white-space: nowrap;
}

.score-number {
  display: inline-flex;
  min-width: 42px;
  height: 42px;
  padding: 0 10px;
  justify-content: center;
  align-items: center;

  border-radius: 14px;
  background: white;
  color: #4338ca;

  font-size: clamp(21px, 5vw, 28px);
  font-weight: 1000;
}

.score-divider {
  font-weight: 1000;
  color: #fff59d;
  font-size: clamp(17px, 4vw, 26px);
}

/* =========================
   연승
========================= */
.streak {
  height: 32px;
  display: flex;
  justify-content: center;
  align-items: center;

  font-weight: 1000;
  font-size: clamp(15px, 3.8vw, 21px);
  color: #ef4e29;
  text-align: center;
}

/* =========================
   전투 구역
========================= */
.battle-area {
  position: relative;
  z-index: 2;

  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 14px;
  align-items: center;

  margin: 3px auto 12px;
  max-width: 780px;
}

.fighter {
  min-width: 0;
  height: 205px;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  border-radius: 26px;
  border: 3px solid rgba(90, 80, 190, .09);

  background:
    linear-gradient(145deg, rgba(255,255,255,.98), rgba(240,243,255,.96));

  box-shadow: 0 10px 24px rgba(61, 58, 116, .11);
}

.fighter-label {
  font-size: clamp(13px, 3vw, 19px);
  font-weight: 1000;
  color: #5f5b78;
  margin-bottom: 5px;
}

.hand {
  min-height: 100px;
  display: flex;
  justify-content: center;
  align-items: center;

  font-size: clamp(70px, 11vw, 110px);
  line-height: 1;
  filter: drop-shadow(0 7px 5px rgba(0,0,0,.1));
  transform-origin: center bottom;
}

.robot {
  position: absolute;
  margin-top: -92px;
  margin-left: 122px;

  font-size: clamp(30px, 6vw, 50px);
  pointer-events: none;
}

.choice-name {
  height: 26px;
  font-weight: 900;
  font-size: clamp(14px, 3vw, 18px);
  color: #5049ba;
}

.vs {
  font-size: clamp(26px, 6vw, 46px);
  font-weight: 1000;
  color: #ff477e;
  text-shadow:
    2px 2px 0 white,
    4px 4px 0 #ffd4e2;
}

/* =========================
   가운데 메시지
========================= */
.message-box {
  position: relative;
  z-index: 3;

  min-height: 74px;
  margin: 4px auto 12px;
  max-width: 740px;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  border-radius: 22px;
  text-align: center;

  background: #f7f7ff;
  border: 2px dashed #c9c5ff;

  padding: 8px 12px;
}

.main-message {
  font-size: clamp(19px, 4.5vw, 30px);
  font-weight: 1000;
  line-height: 1.2;
  color: #3c36a8;
}

.small-message {
  min-height: 20px;
  margin-top: 3px;
  font-size: clamp(12px, 2.8vw, 15px);
  color: #77728e;
  font-weight: 700;
}

/* =========================
   선택 버튼
========================= */
.choices {
  position: relative;
  z-index: 2;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;

  max-width: 760px;
  margin: 0 auto;
}

.choice-btn {
  appearance: none;
  -webkit-appearance: none;
  border: 0;

  min-width: 0;
  min-height: 126px;

  border-radius: 25px;
  padding: 10px 6px;

  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  font-family: inherit;
  color: #27233a;

  box-shadow:
    0 9px 0 rgba(39, 35, 70, .15),
    0 13px 22px rgba(45, 43, 105, .12);

  transition:
    transform .14s ease,
    filter .14s ease,
    box-shadow .14s ease,
    opacity .2s ease;
}

.choice-btn:nth-child(1) {
  background: linear-gradient(145deg, #ffe97a, #ffc84d);
}

.choice-btn:nth-child(2) {
  background: linear-gradient(145deg, #98efff, #62d5ff);
}

.choice-btn:nth-child(3) {
  background: linear-gradient(145deg, #ffb4d7, #ff82bd);
}

.choice-icon {
  font-size: clamp(47px, 9vw, 69px);
  line-height: 1;
}

.choice-text {
  margin-top: 5px;
  font-size: clamp(17px, 3.8vw, 23px);
  font-weight: 1000;
}

.choice-btn:active {
  transform: scale(.92) translateY(4px);
  box-shadow:
    0 3px 0 rgba(39, 35, 70, .14),
    0 7px 14px rgba(45, 43, 105, .1);
}

.choice-btn:disabled {
  cursor: default;
  opacity: .55;
  filter: grayscale(.15);
}

/* PC hover */
@media (hover:hover) and (pointer:fine) {
  .choice-btn:not(:disabled):hover {
    transform: scale(1.055) translateY(-4px);
    filter: brightness(1.04);
  }
}

/* =========================
   하단 컨트롤
========================= */
.footer-controls {
  position: relative;
  z-index: 2;

  margin-top: 14px;
  display: flex;
  gap: 9px;
  justify-content: center;
  flex-wrap: wrap;
}

.small-btn {
  border: 0;
  min-height: 42px;
  border-radius: 14px;

  padding: 8px 14px;

  background: #ebeaff;
  color: #4b45a4;

  font-family: inherit;
  font-size: 14px;
  font-weight: 900;

  cursor: pointer;
}

.small-btn:active {
  transform: scale(.95);
}

/* =========================
   최종 결과 오버레이
========================= */
.final-screen {
  position: absolute;
  z-index: 20;
  inset: 0;

  display: none;
  justify-content: center;
  align-items: center;

  padding: 20px;

  background: rgba(35, 29, 75, .72);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.final-screen.show {
  display: flex;
  animation: fadeIn .35s ease;
}

.final-card {
  width: min(600px, 96%);
  padding: 28px 20px;

  border-radius: 30px;
  background: white;

  box-shadow: 0 25px 80px rgba(0,0,0,.3);
  text-align: center;

  animation: finalPop .5s cubic-bezier(.2,1.7,.4,1);
}

.final-emoji {
  font-size: clamp(70px, 16vw, 120px);
  line-height: 1;
}

.final-title {
  margin: 13px 0 8px;
  font-size: clamp(27px, 7vw, 47px);
  font-weight: 1000;
  line-height: 1.16;
  color: #4438ca;
}

.final-subtitle {
  color: #69647d;
  font-size: clamp(15px, 3.5vw, 20px);
  font-weight: 700;
  margin-bottom: 21px;
}

.restart-btn {
  width: min(320px, 100%);
  min-height: 62px;

  border: 0;
  border-radius: 20px;

  font-family: inherit;
  font-size: clamp(19px, 4vw, 24px);
  font-weight: 1000;

  cursor: pointer;

  color: white;
  background: linear-gradient(135deg, #6658f5, #ff5da5);

  box-shadow: 0 9px 20px rgba(101, 88, 245, .3);
}

.restart-btn:active {
  transform: scale(.95);
}

/* =========================
   파티클
========================= */
.particle-layer {
  position: absolute;
  z-index: 30;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.particle {
  position: absolute;
  top: -20px;
  font-size: 20px;
  animation: particleFall linear forwards;
}

/* =========================
   애니메이션
========================= */
.hand.shake {
  animation: handShake .42s ease-in-out infinite;
}

.hand.reveal {
  animation: handReveal .42s cubic-bezier(.2,1.7,.4,1);
}

.robot.happy {
  animation: robotHappy .45s ease-in-out 4;
}

.robot.shocked {
  animation: robotShock .5s ease-in-out 3;
}

.robot.draw {
  animation: bounceDraw .55s ease 2;
}

.score-number.bump {
  animation: scoreBump .5s cubic-bezier(.2,1.8,.4,1);
}

.game.win-shake {
  animation: gameWin .45s ease;
}

.game.lose-shake {
  animation: gameLose .4s ease;
}

.game.draw-bounce .hand {
  animation: bounceDraw .45s ease 2;
}

.streak.special {
  animation: streakSpecial .55s ease 4;
}

.button-flash {
  animation: buttonFlash .35s ease;
}

@keyframes handShake {
  0% { transform: rotate(-8deg) translateY(0); }
  50% { transform: rotate(8deg) translateY(-9px); }
  100% { transform: rotate(-8deg) translateY(0); }
}

@keyframes handReveal {
  0% { transform: scale(.3) rotate(-25deg); opacity: .15; }
  65% { transform: scale(1.25) rotate(5deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

@keyframes robotHappy {
  0%, 100% { transform: translateY(0) rotate(0); }
  25% { transform: translateY(-12px) rotate(-12deg); }
  50% { transform: translateY(0) rotate(10deg); }
  75% { transform: translateY(-8px) rotate(-7deg); }
}

@keyframes robotShock {
  0%, 100% { transform: scale(1) rotate(0); }
  30% { transform: scale(1.2) rotate(-10deg); }
  60% { transform: scale(.93) rotate(10deg); }
}

@keyframes bounceDraw {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-18px) scale(1.08); }
}

@keyframes scoreBump {
  0% { transform: scale(1); }
  45% { transform: scale(1.7) rotate(6deg); }
  100% { transform: scale(1); }
}

@keyframes gameWin {
  0%,100% { transform: scale(1); }
  25% { transform: scale(1.012) rotate(-.5deg); }
  50% { transform: scale(1.02) rotate(.5deg); }
  75% { transform: scale(1.012) rotate(-.3deg); }
}

@keyframes gameLose {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-5px); }
}

@keyframes streakSpecial {
  0%,100% { transform: scale(1); }
  50% {
    transform: scale(1.28) rotate(-2deg);
    filter: drop-shadow(0 0 10px #ff9b24);
  }
}

@keyframes buttonFlash {
  0%,100% { filter: brightness(1); }
  50% { filter: brightness(1.3); transform: scale(.94); }
}

@keyframes particleFall {
  0% {
    transform: translate3d(0,-30px,0) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translate3d(var(--drift),110vh,0) rotate(var(--rotate));
    opacity: 0;
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes finalPop {
  0% {
    opacity: 0;
    transform: scale(.5) rotate(-5deg);
  }
  70% {
    transform: scale(1.05) rotate(1deg);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}

/* =========================
   모바일
========================= */
@media (max-width: 620px) {
  body {
    align-items: stretch;
    padding: 0;
  }

  .game {
    min-height: 100dvh;
    border-radius: 0;
    padding:
      max(10px, env(safe-area-inset-top))
      10px
      max(9px, env(safe-area-inset-bottom));

    display: flex;
    flex-direction: column;
  }

  .title {
    margin-top: 3px;
    margin-bottom: 7px;
  }

  .subtitle {
    display: none;
  }

  .scoreboard {
    width: 100%;
    padding: 8px 9px;
    gap: 5px;
    border-radius: 17px;
    margin-bottom: 4px;
  }

  .score-side {
    gap: 4px;
  }

  .score-number {
    height: 35px;
    min-width: 35px;
    border-radius: 11px;
    padding: 0 7px;
  }

  .streak {
    height: 25px;
  }

  .battle-area {
    width: 100%;
    gap: 6px;
    margin-bottom: 6px;
  }

  .fighter {
    height: min(25vh, 175px);
    min-height: 135px;
    border-radius: 19px;
  }

  .hand {
    min-height: 72px;
  }

  .robot {
    margin-left: 76px;
    margin-top: -68px;
  }

  .message-box {
    min-height: 63px;
    width: 100%;
    margin-bottom: 7px;
    padding: 5px 8px;
    border-radius: 16px;
  }

  .choices {
    width: 100%;
    gap: 7px;
  }

  .choice-btn {
    min-height: 104px;
    border-radius: 19px;
    padding: 7px 3px;
  }

  .footer-controls {
    margin-top: 8px;
  }

  .small-btn {
    min-height: 38px;
    font-size: 12px;
    padding: 6px 11px;
  }
}

/* 아주 작은 화면 */
@media (max-height: 700px) and (max-width: 620px) {
  .title {
    font-size: 23px;
  }

  .streak {
    height: 20px;
    font-size: 14px;
  }

  .fighter {
    min-height: 112px;
    height: 20vh;
  }

  .hand {
    min-height: 60px;
    font-size: 58px;
  }

  .robot {
    font-size: 27px;
  }

  .fighter-label {
    font-size: 12px;
    margin-bottom: 0;
  }

  .choice-name {
    height: 19px;
    font-size: 12px;
  }

  .message-box {
    min-height: 54px;
  }

  .main-message {
    font-size: 17px;
  }

  .small-message {
    font-size: 11px;
  }

  .choice-btn {
    min-height: 86px;
  }

  .choice-icon {
    font-size: 42px;
  }

  .choice-text {
    font-size: 15px;
    margin-top: 2px;
  }

  .footer-controls {
    margin-top: 6px;
  }
}

/* 가로 모바일 */
@media (orientation: landscape) and (max-height: 520px) {
  body {
    padding: 0;
  }

  .game {
    min-height: 100dvh;
    border-radius: 0;
    padding: 7px 12px;
  }

  .title {
    font-size: 20px;
    margin: 0 0 4px;
  }

  .subtitle {
    display: none;
  }

  .scoreboard {
    margin-bottom: 2px;
    padding: 5px 10px;
  }

  .score-number {
    height: 30px;
    min-width: 32px;
    font-size: 19px;
  }

  .streak {
    height: 20px;
    font-size: 13px;
  }

  .battle-area {
    grid-template-columns: 1fr 60px 1fr;
    margin-bottom: 3px;
  }

  .fighter {
    height: 105px;
    flex-direction: row;
    gap: 10px;
  }

  .fighter-label {
    order: 2;
  }

  .hand {
    min-height: auto;
    font-size: 55px;
  }

  .choice-name {
    display: none;
  }

  .robot {
    display: none;
  }

  .vs {
    font-size: 27px;
  }

  .message-box {
    min-height: 43px;
    margin-bottom: 5px;
  }

  .main-message {
    font-size: 17px;
  }

  .small-message {
    display: none;
  }

  .choice-btn {
    min-height: 72px;
    flex-direction: row;
    gap: 7px;
    border-radius: 15px;
  }

  .choice-icon {
    font-size: 37px;
  }

  .choice-text {
    font-size: 15px;
  }

  .footer-controls {
    margin-top: 4px;
  }

  .small-btn {
    min-height: 30px;
    padding: 3px 10px;
  }
}

/* 애니메이션 최소화 설정 사용자 배려 */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<main class="game" id="game">

  <div class="particle-layer" id="particleLayer"></div>

  <h1 class="title">✊✌️🖐️ 가위바위보 배틀!</h1>
  <div class="subtitle">먼저 3승을 하면 챔피언! 🏆</div>

  <!-- 점수판 -->
  <section class="scoreboard" aria-label="점수판">
    <div class="score-side">
      <span class="score-name">🏆 PLAYER</span>
      <span class="score-number" id="playerScore">0</span>
    </div>

    <div class="score-divider">:</div>

    <div class="score-side">
      <span class="score-number" id="computerScore">0</span>
      <span class="score-name">COMPUTER 🤖</span>
    </div>
  </section>

  <div class="streak" id="streakDisplay">
    도전 준비 완료! 🔥
  </div>

  <!-- 전투 화면 -->
  <section class="battle-area">

    <div class="fighter" id="playerFighter">
      <div class="fighter-label">PLAYER</div>

      <div
        class="hand"
        id="playerHand"
        aria-label="플레이어 선택"
      >
        ❔
      </div>

      <div class="choice-name" id="playerChoiceName">
        선택하세요!
      </div>
    </div>

    <div class="vs">VS</div>

    <div class="fighter" id="computerFighter">
      <div class="fighter-label">COMPUTER</div>

      <div
        class="hand"
        id="computerHand"
        aria-label="컴퓨터 선택"
      >
        ❔
      </div>

      <div class="robot" id="robot">🤖</div>

      <div class="choice-name" id="computerChoiceName">
        기다리는 중
      </div>
    </div>

  </section>

  <!-- 메시지 -->
  <section class="message-box" aria-live="polite">
    <div class="main-message" id="mainMessage">
      가위, 바위, 보를 선택하세요!
    </div>

    <div class="small-message" id="smallMessage">
      먼저 3승을 하면 최종 승리합니다.
    </div>
  </section>

  <!-- 선택 버튼 -->
  <section class="choices">

    <button
      class="choice-btn"
      data-choice="rock"
      aria-label="바위 선택"
    >
      <span class="choice-icon">✊</span>
      <span class="choice-text">바위</span>
    </button>

    <button
      class="choice-btn"
      data-choice="scissors"
      aria-label="가위 선택"
    >
      <span class="choice-icon">✌️</span>
      <span class="choice-text">가위</span>
    </button>

    <button
      class="choice-btn"
      data-choice="paper"
      aria-label="보 선택"
    >
      <span class="choice-icon">🖐️</span>
      <span class="choice-text">보</span>
    </button>

  </section>

  <!-- 하단 -->
  <div class="footer-controls">
    <button class="small-btn" id="soundBtn">
      🔊 효과음 ON
    </button>

    <button class="small-btn" id="quickResetBtn">
      ↻ 점수 초기화
    </button>
  </div>

  <!-- 최종 결과 화면 -->
  <section class="final-screen" id="finalScreen">
    <div class="final-card">

      <div class="final-emoji" id="finalEmoji">🏆</div>

      <div class="final-title" id="finalTitle">
        YOU ARE THE CHAMPION!
      </div>

      <div class="final-subtitle" id="finalSubtitle">
        멋진 승리입니다!
      </div>

      <button class="restart-btn" id="restartBtn">
        🔄 다시 시작
      </button>

    </div>
  </section>

</main>


<script>
(() => {
  "use strict";

  /* =========================
     게임 데이터
  ========================= */

  const choices = {
    rock: {
      icon: "✊",
      name: "바위"
    },
    scissors: {
      icon: "✌️",
      name: "가위"
    },
    paper: {
      icon: "🖐️",
      name: "보"
    }
  };

  const choiceKeys = Object.keys(choices);

  let playerScore = 0;
  let computerScore = 0;
  let winStreak = 0;

  let gameLocked = false;
  let gameFinished = false;
  let soundOn = true;

  let audioContext = null;


  /* =========================
     DOM
  ========================= */

  const game = document.getElementById("game");

  const playerScoreEl =
    document.getElementById("playerScore");

  const computerScoreEl =
    document.getElementById("computerScore");

  const streakDisplay =
    document.getElementById("streakDisplay");

  const playerHand =
    document.getElementById("playerHand");

  const computerHand =
    document.getElementById("computerHand");

  const playerChoiceName =
    document.getElementById("playerChoiceName");

  const computerChoiceName =
    document.getElementById("computerChoiceName");

  const robot =
    document.getElementById("robot");

  const mainMessage =
    document.getElementById("mainMessage");

  const smallMessage =
    document.getElementById("smallMessage");

  const choiceButtons =
    [...document.querySelectorAll(".choice-btn")];

  const soundBtn =
    document.getElementById("soundBtn");

  const quickResetBtn =
    document.getElementById("quickResetBtn");

  const finalScreen =
    document.getElementById("finalScreen");

  const finalEmoji =
    document.getElementById("finalEmoji");

  const finalTitle =
    document.getElementById("finalTitle");

  const finalSubtitle =
    document.getElementById("finalSubtitle");

  const restartBtn =
    document.getElementById("restartBtn");

  const particleLayer =
    document.getElementById("particleLayer");


  /* =========================
     시간 지연
  ========================= */

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }


  /* =========================
     Web Audio API
  ========================= */

  function initAudio() {
    if (!soundOn) return;

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContextClass) {
      return;
    }

    if (!audioContext) {
      audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume().catch(() => {});
    }
  }


  function playTone(
    frequency,
    duration = 0.1,
    type = "sine",
    volume = 0.05,
    delay = 0
  ) {
    if (!soundOn) return;

    initAudio();

    if (!audioContext) return;

    const start =
      audioContext.currentTime + delay;

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.setValueAtTime(
      frequency,
      start
    );

    gain.gain.setValueAtTime(
      0.0001,
      start
    );

    gain.gain.exponentialRampToValueAtTime(
      Math.max(volume, 0.0001),
      start + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      start + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(start);
    oscillator.stop(start + duration + 0.03);
  }


  function soundSelect() {
    playTone(440, 0.07, "square", 0.035);
    playTone(620, 0.07, "square", 0.025, 0.06);
  }


  function soundCountdown() {
    playTone(270, 0.07, "square", 0.025);
  }


  function soundWin() {
    playTone(523, 0.12, "sine", 0.05);
    playTone(659, 0.12, "sine", 0.05, 0.1);
    playTone(784, 0.18, "sine", 0.06, 0.2);
  }


  function soundLose() {
    playTone(310, 0.15, "sawtooth", 0.035);
    playTone(230, 0.22, "sawtooth", 0.035, 0.12);
  }


  function soundDraw() {
    playTone(390, 0.09, "triangle", 0.035);
    playTone(390, 0.09, "triangle", 0.035, 0.12);
  }


  function soundChampion() {
    const notes = [
      523,
      659,
      784,
      1047
    ];

    notes.forEach((note, index) => {
      playTone(
        note,
        index === 3 ? 0.4 : 0.16,
        "sine",
        0.065,
        index * 0.13
      );
    });
  }


  /* =========================
     버튼 잠금
  ========================= */

  function setButtonsDisabled(disabled) {
    choiceButtons.forEach(button => {
      button.disabled = disabled;
    });
  }


  /* =========================
     애니메이션 초기화
  ========================= */

  function clearAnimations() {
    playerHand.classList.remove(
      "shake",
      "reveal"
    );

    computerHand.classList.remove(
      "shake",
      "reveal"
    );

    robot.classList.remove(
      "happy",
      "shocked",
      "draw"
    );

    game.classList.remove(
      "win-shake",
      "lose-shake",
      "draw-bounce"
    );

    streakDisplay.classList.remove(
      "special"
    );
  }


  function restartAnimation(element, className) {
    element.classList.remove(className);

    void element.offsetWidth;

    element.classList.add(className);
  }


  /* =========================
     파티클
  ========================= */

  function createParticles(
    amount = 35,
    special = false
  ) {
    const symbols = special
      ? ["⭐", "✨", "🔥", "🎉", "🏆", "💫"]
      : ["🎉", "⭐", "✨", "🟡", "🟣", "🔵", "🩷"];

    for (let i = 0; i < amount; i++) {
      const particle =
        document.createElement("span");

      particle.className = "particle";

      particle.textContent =
        symbols[
          Math.floor(Math.random() * symbols.length)
        ];

      particle.style.left =
        Math.random() * 100 + "%";

      particle.style.fontSize =
        (12 + Math.random() * 19) + "px";

      particle.style.animationDuration =
        (1.7 + Math.random() * 1.9) + "s";

      particle.style.animationDelay =
        (Math.random() * 0.45) + "s";

      particle.style.setProperty(
        "--drift",
        (-120 + Math.random() * 240) + "px"
      );

      particle.style.setProperty(
        "--rotate",
        (-480 + Math.random() * 960) + "deg"
      );

      particleLayer.appendChild(particle);

      setTimeout(() => {
        particle.remove();
      }, 4500);
    }
  }


  /* =========================
     점수 애니메이션
  ========================= */

  function bumpScore(element) {
    restartAnimation(element, "bump");
  }


  /* =========================
     연승 표시
  ========================= */

  function updateStreak() {
    if (winStreak <= 0) {
      streakDisplay.textContent =
        "다음 승리를 노려보세요! 🔥";

      return;
    }

    if (winStreak === 1) {
      streakDisplay.textContent =
        "🔥 1 WIN STREAK!";
    }

    if (winStreak === 2) {
      streakDisplay.textContent =
        "🔥🔥 2 WIN STREAK!";
    }

    if (winStreak >= 3) {
      streakDisplay.textContent =
        "🔥🔥🔥 3 WIN STREAK! AMAZING!";

      restartAnimation(
        streakDisplay,
        "special"
      );

      createParticles(55, true);
    }
  }


  /* =========================
     승패 판정
  ========================= */

  function getResult(player, computer) {
    if (player === computer) {
      return "draw";
    }

    if (
      (player === "rock" &&
       computer === "scissors") ||

      (player === "scissors" &&
       computer === "paper") ||

      (player === "paper" &&
       computer === "rock")
    ) {
      return "win";
    }

    return "lose";
  }


  /* =========================
     랜덤 컴퓨터 선택
  ========================= */

  function getComputerChoice() {
    return choiceKeys[
      Math.floor(
        Math.random() * choiceKeys.length
      )
    ];
  }


  /* =========================
     가위바위보 연출
  ========================= */

  async function countdownAnimation() {
    playerHand.textContent = "✊";
    computerHand.textContent = "✊";

    playerChoiceName.textContent =
      "준비!";

    computerChoiceName.textContent =
      "분석 중...";

    playerHand.classList.add("shake");
    computerHand.classList.add("shake");

    const messages = [
      "가위...",
      "바위...",
      "보!!!"
    ];

    for (let i = 0; i < messages.length; i++) {
      mainMessage.textContent =
        messages[i];

      smallMessage.textContent =
        i === 2
          ? "승부를 공개합니다!"
          : "두근두근...";

      soundCountdown();

      await sleep(
        i === 2 ? 380 : 300
      );
    }

    playerHand.classList.remove("shake");
    computerHand.classList.remove("shake");
  }


  /* =========================
     결과 공개
  ========================= */

  function revealChoices(
    playerChoice,
    computerChoice
  ) {
    playerHand.textContent =
      choices[playerChoice].icon;

    computerHand.textContent =
      choices[computerChoice].icon;

    playerChoiceName.textContent =
      choices[playerChoice].name;

    computerChoiceName.textContent =
      choices[computerChoice].name;

    restartAnimation(
      playerHand,
      "reveal"
    );

    restartAnimation(
      computerHand,
      "reveal"
    );
  }


  /* =========================
     한 판 결과 처리
  ========================= */

  async function processResult(result) {
    if (result === "win") {
      playerScore++;
      winStreak++;

      playerScoreEl.textContent =
        playerScore;

      bumpScore(playerScoreEl);

      mainMessage.textContent =
        "🎉 YOU WIN! 🎉";

      smallMessage.textContent =
        "멋져요! 플레이어 승리!";

      robot.textContent = "🤖💦";

      restartAnimation(
        robot,
        "shocked"
      );

      restartAnimation(
        game,
        "win-shake"
      );

      createParticles(
        winStreak >= 3 ? 60 : 32,
        winStreak >= 3
      );

      soundWin();

      updateStreak();
    }

    else if (result === "lose") {
      computerScore++;
      winStreak = 0;

      computerScoreEl.textContent =
        computerScore;

      bumpScore(computerScoreEl);

      mainMessage.textContent =
        "😈 COMPUTER WIN!";

      smallMessage.textContent =
        "로봇이 신나게 웃고 있어요!";

      robot.textContent = "🤖✨";

      restartAnimation(
        robot,
        "happy"
      );

      restartAnimation(
        game,
        "lose-shake"
      );

      soundLose();

      updateStreak();
    }

    else {
      mainMessage.textContent =
        "😆 DRAW! 한 번 더!";

      smallMessage.textContent =
        "똑같은 선택! 점수는 그대로입니다.";

      robot.textContent = "🤖";

      restartAnimation(
        robot,
        "draw"
      );

      restartAnimation(
        game,
        "draw-bounce"
      );

      soundDraw();
    }

    await sleep(850);
  }


  /* =========================
     최종 승자
  ========================= */

  async function checkChampion() {
    if (
      playerScore < 3 &&
      computerScore < 3
    ) {
      return false;
    }

    gameFinished = true;
    setButtonsDisabled(true);

    await sleep(250);

    if (playerScore >= 3) {
      finalEmoji.textContent =
        "🏆🎉🏆";

      finalTitle.innerHTML =
        "🏆 최종 승리!<br>YOU ARE THE CHAMPION! 🏆";

      finalSubtitle.textContent =
        "가위바위보 배틀의 새로운 챔피언입니다!";

      createParticles(90, true);

      soundChampion();
    }

    else {
      finalEmoji.textContent =
        "🤖👑";

      finalTitle.innerHTML =
        "🤖 COMPUTER CHAMPION!";

      finalSubtitle.textContent =
        "아쉽지만 괜찮아요! 다시 도전해보세요!";

      soundLose();

      setTimeout(() => {
        playTone(
          180,
          0.35,
          "sawtooth",
          0.025
        );
      }, 150);
    }

    finalScreen.classList.add("show");

    return true;
  }


  /* =========================
     한 라운드
  ========================= */

  async function playRound(playerChoice, button) {
    if (
      gameLocked ||
      gameFinished
    ) {
      return;
    }

    gameLocked = true;

    initAudio();
    soundSelect();

    setButtonsDisabled(true);
    clearAnimations();

    restartAnimation(
      button,
      "button-flash"
    );

    robot.textContent = "🤖";

    mainMessage.textContent =
      "READY...";

    smallMessage.textContent =
      "로봇과 승부를 준비합니다!";

    await sleep(220);

    await countdownAnimation();

    const computerChoice =
      getComputerChoice();

    revealChoices(
      playerChoice,
      computerChoice
    );

    const result =
      getResult(
        playerChoice,
        computerChoice
      );

    await sleep(420);

    await processResult(result);

    const finished =
      await checkChampion();

    if (!finished) {
      mainMessage.textContent =
        "다음 승부! 선택하세요!";

      smallMessage.textContent =
        `현재 점수 ${playerScore} : ${computerScore} · 먼저 3승!`;

      setButtonsDisabled(false);

      gameLocked = false;
    }
  }


  /* =========================
     게임 초기화
  ========================= */

  function resetGame() {
    playerScore = 0;
    computerScore = 0;
    winStreak = 0;

    gameLocked = false;
    gameFinished = false;

    playerScoreEl.textContent = "0";
    computerScoreEl.textContent = "0";

    playerHand.textContent = "❔";
    computerHand.textContent = "❔";

    playerChoiceName.textContent =
      "선택하세요!";

    computerChoiceName.textContent =
      "기다리는 중";

    robot.textContent = "🤖";

    mainMessage.textContent =
      "가위, 바위, 보를 선택하세요!";

    smallMessage.textContent =
      "먼저 3승을 하면 최종 승리합니다.";

    streakDisplay.textContent =
      "도전 준비 완료! 🔥";

    finalScreen.classList.remove(
      "show"
    );

    particleLayer.innerHTML = "";

    clearAnimations();

    setButtonsDisabled(false);
  }


  /* =========================
     이벤트
  ========================= */

  choiceButtons.forEach(button => {
    button.addEventListener(
      "click",
      () => {
        const choice =
          button.dataset.choice;

        playRound(choice, button);
      }
    );
  });


  restartBtn.addEventListener(
    "click",
    () => {
      initAudio();
      soundSelect();
      resetGame();
    }
  );


  quickResetBtn.addEventListener(
    "click",
    () => {
      if (gameLocked) return;

      initAudio();
      soundSelect();
      resetGame();
    }
  );


  soundBtn.addEventListener(
    "click",
    () => {
      soundOn = !soundOn;

      if (soundOn) {
        soundBtn.textContent =
          "🔊 효과음 ON";

        initAudio();

        setTimeout(
          soundSelect,
          20
        );
      }

      else {
        soundBtn.textContent =
          "🔇 효과음 OFF";
      }
    }
  );


  /* =========================
     키보드 조작
     PC 추가 지원
     1 = 바위
     2 = 가위
     3 = 보
  ========================= */

  window.addEventListener(
    "keydown",
    event => {
      if (
        gameLocked ||
        gameFinished
      ) {
        return;
      }

      let index = -1;

      if (
        event.key === "1" ||
        event.key.toLowerCase() === "r"
      ) {
        index = 0;
      }

      else if (
        event.key === "2" ||
        event.key.toLowerCase() === "s"
      ) {
        index = 1;
      }

      else if (
        event.key === "3" ||
        event.key.toLowerCase() === "p"
      ) {
        index = 2;
      }

      if (index >= 0) {
        event.preventDefault();
        choiceButtons[index].click();
      }
    }
  );


  /* =========================
     iPhone Safari 보조 처리
  ========================= */

  document.addEventListener(
    "touchstart",
    () => {
      /*
        iOS Safari에서는 사용자 터치 이후에
        AudioContext를 활성화해야 정상적으로
        효과음이 재생될 수 있습니다.
      */
    },
    {
      passive: true
    }
  );


  /* =========================
     시작
  ========================= */

  resetGame();

})();
</script>

</body>
</html>
