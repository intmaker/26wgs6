<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⌨️ 스피드 타자</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;background:linear-gradient(135deg,#062f3b,#155e75,#312e81);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif}.game{width:min(94vw,720px);padding:24px;border:1px solid #ffffff2b;border-radius:25px;background:#071b2ddd;box-shadow:0 25px 70px #0008}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;font-size:clamp(26px,5vw,38px)}.hud{display:flex;gap:7px}.badge{padding:8px 11px;text-align:center;border-radius:13px;background:#ffffff10}.badge small{display:block;color:#a5f3fc;font-size:9px}.badge b{font-size:19px}.sentence{min-height:110px;margin:22px 0 14px;padding:21px;border-radius:16px;background:#ffffff0b;font-size:clamp(20px,4vw,30px);font-weight:850;line-height:1.55;word-break:keep-all}.sentence .done{color:#67e8f9}.sentence .wrong{color:#fb7185;text-decoration:underline}.sentence .cursor{border-left:3px solid #fde047;animation:blink .7s infinite}@keyframes blink{50%{border-color:transparent}}textarea{width:100%;min-height:95px;padding:16px;border:2px solid transparent;border-radius:14px;outline:0;resize:none;font:600 19px/1.5 system-ui;background:#fff;color:#172033}textarea:focus{border-color:#67e8f9}.progress{height:8px;margin:13px 0;border-radius:5px;background:#ffffff12;overflow:hidden}.progress i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#67e8f9,#a7f3d0);transform-origin:left}.message{text-align:center;min-height:24px;color:#bae6fd;font-weight:700}.start{width:100%;margin-top:12px;padding:13px;border:0;border-radius:13px;background:linear-gradient(135deg,#67e8f9,#a7f3d0);color:#082f49;font-weight:900;font-size:15px;cursor:pointer}@media(max-width:520px){.game{width:100%;height:100%;border-radius:0;display:flex;flex-direction:column;justify-content:center;padding:15px}}
</style></head><body><main class="game"><header class="top"><h1>⌨️ 스피드 타자</h1><div class="hud"><div class="badge"><small>정확도</small><b id="accuracy">100%</b></div><div class="badge"><small>시간</small><b id="time">30</b></div></div></header><div class="sentence" id="sentence">게임 시작을 누르세요.</div><textarea id="input" disabled autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="보이는 문장을 그대로 입력하세요"></textarea><div class="progress"><i id="progress"></i></div><div class="message" id="message">30초 동안 완성한 글자 수와 정확도를 측정합니다.</div><button class="start" id="start">게임 시작</button></main><script>
(()=>{const sentences=['작은 습관이 모여 커다란 변화를 만든다.','빠르게 가는 것보다 정확하게 가는 것이 중요하다.','푸른 하늘 아래 시원한 바람이 불어온다.','오늘의 도전이 내일의 실력이 된다.','집중하는 순간 게임은 더욱 재미있어진다.','천천히 시작해도 끝까지 포기하지 않는다.'],view=document.querySelector('#sentence'),input=document.querySelector('#input'),accEl=document.querySelector('#accuracy'),timeEl=document.querySelector('#time'),bar=document.querySelector('#progress'),msg=document.querySelector('#message'),startBtn=document.querySelector('#start');let target='',on=false,startAt=0,raf,total=0,correct=0;
function start(){on=true;total=0;correct=0;startAt=performance.now();startBtn.disabled=true;startBtn.textContent='측정 중';input.disabled=false;next();input.focus();requestAnimationFrame(tick)}function next(){target=sentences[Math.floor(Math.random()*sentences.length)];input.value='';render()}
function render(){const v=input.value;let html='';for(let i=0;i<target.length;i++){const cls=i<v.length?(v[i]===target[i]?'done':'wrong'):i===v.length?'cursor':'';html+=`<span class="${cls}">${target[i]===' '?'&nbsp;':target[i]}</span>`}view.innerHTML=html;let nowCorrect=0;for(let i=0;i<v.length&&i<target.length;i++)if(v[i]===target[i])nowCorrect++;accEl.textContent=Math.round((correct+nowCorrect)/Math.max(1,total+v.length)*100)+'%';if(v===target){correct+=target.length;total+=target.length;msg.textContent='문장 완성! 다음 문장으로 넘어갑니다.';next()}}
function tick(t){if(!on)return;const left=Math.max(0,30-(t-startAt)/1000);timeEl.textContent=Math.ceil(left);bar.style.transform=`scaleX(${left/30})`;if(left<=0)return finish();raf=requestAnimationFrame(tick)}function finish(){on=false;input.disabled=true;const v=input.value;let c=0;for(let i=0;i<v.length&&i<target.length;i++)if(v[i]===target[i])c++;correct+=c;total+=v.length;const accuracy=Math.round(correct/Math.max(1,total)*100);view.textContent=`${correct}자 · 정확도 ${accuracy}%`;msg.textContent='측정 완료! 정확도를 유지하며 더 많은 문장을 완성해 보세요.';startBtn.disabled=false;startBtn.textContent='다시 측정'}input.addEventListener('input',render);startBtn.onclick=start;
})();</script></body></html>
