<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🐍 네온 스네이크</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 10%,#047857,#11252d 50%,#030712);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(94vw,680px);height:min(95vh,840px);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#6ee7b7;font-weight:900}h1{margin:2px 0;font-size:clamp(26px,5vw,38px)}.stats{display:flex;gap:7px}.stat{min-width:70px;padding:8px;text-align:center;border:1px solid #ffffff24;border-radius:14px;background:#10352dcc}.stat small{display:block;color:#a7f3d0;font-size:9px}.stat b{font-size:20px}.game{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff24;border-radius:25px;background:#061815;box-shadow:0 25px 70px #0009;touch-action:none}canvas{display:block;width:100%;height:100%}.pad{position:absolute;right:12px;bottom:12px;z-index:3;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,43px);gap:4px}.pad button{padding:0;border:1px solid #ffffff40;border-radius:10px;background:#0d3d32bd;color:#fff;font-size:19px;touch-action:none}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#041713e8}.overlay.hide{display:none}.card{max-width:390px;padding:28px 24px;text-align:center;border:1px solid #ffffff24;border-radius:23px;background:#104333}.ico{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{color:#d1fae5;font-size:14px;line-height:1.7}.card>button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#6ee7b7,#fde68a);color:#0b3a2f;font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#a7f3d0;font-size:12px}@media(min-width:700px){.pad{opacity:.38}}@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.game{border-radius:20px}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">NEON SNAKE</div><h1>🐍 네온 스네이크</h1></div><div class="stats"><div class="stat"><small>길이</small><b id="score">3</b></div><div class="stat"><small>최고</small><b id="best">3</b></div></div></header><section class="game" id="game"><canvas id="canvas"></canvas><div class="pad"><button class="up" data-x="0" data-y="-1">▲</button><button class="left" data-x="-1" data-y="0">◀</button><button class="down" data-x="0" data-y="1">▼</button><button class="right" data-x="1" data-y="0">▶</button></div><div class="overlay" id="over"><div class="card"><div class="ico" id="ico">🐍</div><h2 id="title">에너지를 먹고 성장하세요</h2><p id="desc">방향키·WASD·화면 스와이프로 뱀을 움직이세요.<br>빛나는 에너지를 먹으면 몸이 길어집니다.<br>벽이나 자신의 몸에 부딪히면 게임 종료!</p><button id="start">게임 시작</button></div></div></section><div class="tip">방향키/WASD · 스와이프 · 반대 방향으로 즉시 회전할 수 없어요</div></main><script>
(()=>{const COLS=18,ROWS=22,C=document.querySelector('#canvas'),X=C.getContext('2d'),G=document.querySelector('#game'),O=document.querySelector('#over'),SE=document.querySelector('#score'),BE=document.querySelector('#best');let W,H,D=1,on=false,snake=[],dir={x:1,y:0},queued={x:1,y:0},food,timer,best=Number(localStorage.snakeBest||3),touch=null;BE.textContent=best;
function resize(){const r=G.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);draw()}function start(){clearInterval(timer);snake=[{x:8,y:11},{x:7,y:11},{x:6,y:11}];dir=queued={x:1,y:0};spawnFood();SE.textContent=3;on=true;O.classList.add('hide');timer=setInterval(step,125);draw()}
function spawnFood(){do{food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function turn(x,y){if(!on||x===-dir.x&&y===-dir.y)return;queued={x,y}}
function step(){dir=queued;const h=snake[0],n={x:h.x+dir.x,y:h.y+dir.y};if(n.x<0||n.x>=COLS||n.y<0||n.y>=ROWS||snake.some(p=>p.x===n.x&&p.y===n.y))return finish();snake.unshift(n);if(n.x===food.x&&n.y===food.y){spawnFood();SE.textContent=snake.length;if(snake.length>best){best=snake.length;BE.textContent=best;localStorage.snakeBest=best}}else snake.pop();draw()}
function grid(){const s=Math.min(W/COLS,H/ROWS),ox=(W-s*COLS)/2,oy=(H-s*ROWS)/2;return{s,ox,oy}}function draw(){X.clearRect(0,0,W,H);const {s,ox,oy}=grid();X.fillStyle='#061815';X.fillRect(0,0,W,H);X.strokeStyle='#34d3990f';X.lineWidth=1;for(let i=0;i<=COLS;i++){X.beginPath();X.moveTo(ox+i*s,oy);X.lineTo(ox+i*s,oy+ROWS*s);X.stroke()}for(let i=0;i<=ROWS;i++){X.beginPath();X.moveTo(ox,oy+i*s);X.lineTo(ox+COLS*s,oy+i*s);X.stroke()}if(food){X.shadowColor='#fbbf24';X.shadowBlur=18;X.fillStyle='#fde047';X.beginPath();X.arc(ox+(food.x+.5)*s,oy+(food.y+.5)*s,s*.28,0,7);X.fill()}X.shadowBlur=0;snake.forEach((p,i)=>{const g=X.createLinearGradient(ox+p.x*s,oy+p.y*s,ox+(p.x+1)*s,oy+(p.y+1)*s);g.addColorStop(0,i?'#34d399':'#a7f3d0');g.addColorStop(1,i?'#059669':'#22d3ee');X.fillStyle=g;X.beginPath();X.roundRect(ox+p.x*s+2,oy+p.y*s+2,s-4,s-4,s*.28);X.fill();if(i===0){X.fillStyle='#052e16';const ex=dir.y?[-.18,.18]:[dir.x*.18,dir.x*.18],ey=dir.x?[-.18,.18]:[dir.y*.18,dir.y*.18];for(let k=0;k<2;k++){X.beginPath();X.arc(ox+(p.x+.5+ex[k])*s,oy+(p.y+.5+ey[k])*s,s*.06,0,7);X.fill()}}})}
function finish(){if(!on)return;on=false;clearInterval(timer);document.querySelector('#ico').textContent=snake.length>=15?'🏆':'🐍';document.querySelector('#title').textContent=`길이 ${snake.length}!`;document.querySelector('#desc').innerHTML='앞쪽 공간을 넓게 남기며 이동하면<br>몸이 길어진 뒤에도 빠져나갈 수 있어요.';document.querySelector('#start').textContent='다시 시작';setTimeout(()=>O.classList.remove('hide'),350)}const keyMap={ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0],ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1]};addEventListener('keydown',e=>{if(keyMap[e.key]){turn(...keyMap[e.key]);e.preventDefault()}});document.querySelectorAll('.pad button').forEach(b=>b.onpointerdown=e=>{e.preventDefault();turn(Number(b.dataset.x),Number(b.dataset.y))});C.onpointerdown=e=>touch={x:e.clientX,y:e.clientY};C.onpointerup=e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;if(Math.hypot(dx,dy)>20)Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy));touch=null};document.querySelector('#start').onclick=start;addEventListener('resize',resize);resize()})();</script></body></html>
