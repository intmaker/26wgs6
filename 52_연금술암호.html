<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"><title>⚗️ 연금술 암호</title><style>
:root{--c1:#6d28d9;--c2:#e879f9}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 18% 10%,var(--c1),#11162e 52%,#030712);user-select:none;-webkit-user-select:none}.app{width:min(95vw,720px);height:min(95vh,860px);display:flex;flex-direction:column;gap:11px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 4px}.brand small{display:block;color:#cbd5e1;font-size:10px;font-weight:900;letter-spacing:.2em}.brand h1{margin:2px 0 0;font-size:clamp(25px,5vw,38px);letter-spacing:-.05em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:67px;padding:7px 10px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#0f172ac7}.stat small{display:block;color:#cbd5e1;font-size:9px}.stat b{font-size:19px}.stage{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff27;border-radius:25px;background:linear-gradient(145deg,#14203b,#090e21);box-shadow:0 25px 70px #0009;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#050916e9}.overlay.hide{display:none}.card{width:min(100%,410px);padding:28px 24px;text-align:center;border:1px solid #ffffff25;border-radius:23px;background:#111a36ee;box-shadow:0 20px 55px #0008}.card .emoji{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{margin:0 0 19px;color:#cbd5e1;font-size:14px;line-height:1.72;word-break:keep-all}.primary{min-height:48px;width:100%;padding:12px 18px;border:0;border-radius:13px;color:#08111f;background:linear-gradient(135deg,var(--c2),#fef3c7);font:900 15px system-ui;cursor:pointer}.tip{min-height:18px;text-align:center;color:#aebbd0;font-size:12px}.hidden{display:none!important}button{font-family:inherit}.alchemy{height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:15px;background:radial-gradient(circle at 50% 30%,#4c1d95,#1e123d 62%,#0c0718)}.cauldron{width:min(100%,430px);min-height:85px;display:grid;place-items:center;border:2px solid #c084fc;border-radius:50%;background:#090512;font-size:38px;letter-spacing:.2em;box-shadow:0 0 30px #a855f755,inset 0 0 20px #a855f744}.ingredients{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;width:min(100%,500px)}.ingredient{min-height:55px;border:1px solid #ffffff24;border-radius:13px;color:#fff;background:#ffffff0d;font-size:27px;cursor:pointer}.brew-actions{display:flex;gap:8px}.brew-actions button{min-height:45px;padding:9px 15px;border:1px solid #ffffff25;border-radius:11px;color:#fff;background:#6d28d9;font-weight:900}.history{width:min(100%,500px);flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}.attempt{display:flex;justify-content:space-between;padding:8px 11px;border-radius:10px;background:#ffffff0a;color:#e9d5ff}.clue-exact{color:#4ade80}.clue-near{color:#facc15}
@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.stage{min-height:0;border-radius:20px}.brand h1{font-size:25px}.stat{min-width:61px;padding:6px 8px}.card{padding:24px 19px}.tip{font-size:11px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><small>ALCHEMY CODE</small><h1>⚗️ 연금술 암호</h1></div><div class="hud" id="hud"></div></header><section class="stage" id="stage"><div class="alchemy"><div class="cauldron" id="guess">❔ ❔ ❔</div><div class="ingredients" id="ingredients"></div><div class="brew-actions"><button id="undoBtn">↶ 지우기</button><button id="brewBtn">⚗️ 조합 실험</button></div><div class="history" id="history"></div></div><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="resultEmoji">⚗️</div><h2 id="resultTitle">연금술 암호</h2><p id="resultText">실험 결과의 위치·재료 단서를 비교해 세 칸의 비밀 레시피를 추리하세요.</p><button class="primary" id="startBtn">게임 시작</button></div></div></section><div class="tip">실험 결과의 위치·재료 단서를 비교해 세 칸의 비밀 레시피를 추리하세요.</div></main><script>
const $=s=>document.querySelector(s),stage=$('#stage'),overlay=$('#overlay'),startBtn=$('#startBtn');
const safeGet=(k,d=0)=>{try{return Number(localStorage.getItem(k))||d}catch(e){return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function showResult(icon,title,text,button='다시 하기'){ $('#resultEmoji').textContent=icon;$('#resultTitle').textContent=title;$('#resultText').innerHTML=text;startBtn.textContent=button;overlay.classList.remove('hide') }
const icons=['🌿','🔥','💧','🍄','💎','🌙'],ingredients=$('#ingredients'),guessEl=$('#guess'),history=$('#history'),hud=$('#hud');let recipe=[],guess=[],attempts=8,level=1,score=0,playing=false;hud.innerHTML='<div class="stat"><small>레벨</small><b id="level">1</b></div><div class="stat"><small>남은 실험</small><b id="attempts">8</b></div><div class="stat"><small>점수</small><b id="score">0</b></div>';icons.forEach((v,i)=>{const b=document.createElement('button');b.className='ingredient';b.textContent=v;b.onclick=()=>add(i);ingredients.appendChild(b)});
function startGame(){recipe=Array.from({length:3},()=>Math.floor(Math.random()*icons.length));guess=[];attempts=8;playing=true;history.innerHTML='';update();overlay.classList.add('hide')}function update(){guessEl.textContent=[0,1,2].map(i=>guess[i]===undefined?'❔':icons[guess[i]]).join(' ');$('#attempts').textContent=attempts;$('#level').textContent=level;$('#score').textContent=score}function add(i){if(playing&&guess.length<3){guess.push(i);update()}}$('#undoBtn').onclick=()=>{guess.pop();update()};
function clue(){let exact=0,near=0,usedR=[false,false,false],usedG=[false,false,false];for(let i=0;i<3;i++)if(guess[i]===recipe[i]){exact++;usedR[i]=usedG[i]=true}for(let i=0;i<3;i++)if(!usedG[i])for(let j=0;j<3;j++)if(!usedR[j]&&guess[i]===recipe[j]){near++;usedR[j]=true;break}return{exact,near}}
function brew(){if(!playing||guess.length<3)return;attempts--;const c=clue(),row=document.createElement('div');row.className='attempt';row.innerHTML=`<b>${guess.map(i=>icons[i]).join(' ')}</b><span><b class="clue-exact">● ${c.exact}</b> 정확 · <b class="clue-near">◆ ${c.near}</b> 재료</span>`;history.prepend(row);if(c.exact===3){playing=false;score+=100+attempts*20;level++;update();return showResult('🧪','전설의 물약 완성!',`${8-attempts}번의 실험으로 정확한 재료와 순서를 찾았습니다.<br>다음 레벨에서도 추리해 보세요.`,'다음 레시피')}guess=[];update();if(attempts<=0){playing=false;showResult('💨','실험 횟수 소진',`정답은 ${recipe.map(i=>icons[i]).join(' ')}였습니다.<br>정확한 위치와 포함된 재료 단서를 함께 비교해 보세요.`)}}$('#brewBtn').onclick=brew;startBtn.onclick=startGame;update();
</script></body></html>
