<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>💡 라이트 아웃</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 15%,#713f12,#111827 45%,#030712);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(94vw,660px);height:min(94vh,810px);display:flex;flex-direction:column;gap:12px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#fde68a;font-weight:900}h1{font-size:clamp(26px,5vw,38px);margin:2px 0}.stats{display:flex;gap:7px}.stat{min-width:70px;text-align:center;padding:8px;border:1px solid #ffffff22;border-radius:14px;background:#171717cc}.stat small{display:block;color:#a3a3a3;font-size:9px}.stat b{font-size:20px}.game{position:relative;flex:1;min-height:390px;display:grid;place-items:center;padding:20px;border:1px solid #ffffff20;border-radius:25px;background:linear-gradient(145deg,#171717,#0a0a0a);box-shadow:0 25px 70px #0009}.board{width:min(100%,500px);aspect-ratio:1;display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.light{position:relative;border:1px solid #ffffff15;border-radius:50%;background:#172033;cursor:pointer;box-shadow:inset 0 0 18px #000;transition:.16s}.light::after{content:"";position:absolute;inset:27%;border-radius:50%;background:#334155;transition:.16s}.light.on{border-color:#fef08a;background:#facc15;box-shadow:0 0 16px #facc15,0 0 36px #f59e0b,inset 0 0 12px #fff}.light.on::after{background:#fffde2}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;border-radius:inherit;background:#080808e8;z-index:4}.overlay.hide{display:none}.card{max-width:380px;padding:28px 24px;text-align:center;border:1px solid #ffffff1f;border-radius:23px;background:#1c1917}.ico{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{color:#d6d3d1;font-size:14px;line-height:1.7}.card button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#fde047,#fb923c);font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#a8a29e;font-size:12px}@media(max-width:520px){.app{height:100%;width:100%;padding:10px}.game{border-radius:20px;padding:15px}.board{gap:6px}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">LIGHTS OUT</div><h1>💡 라이트 아웃</h1></div><div class="stats"><div class="stat"><small>누른 횟수</small><b id="moves">0</b></div><div class="stat"><small>최고</small><b id="best">-</b></div></div></header><section class="game"><div class="board" id="board"></div><div class="overlay" id="over"><div class="card"><div class="ico" id="ico">💡</div><h2 id="title">모든 불을 끄세요</h2><p id="desc">전구 하나를 누르면 그 전구와<br>바로 위·아래·왼쪽·오른쪽 전구가 바뀝니다.<br>항상 풀 수 있는 퍼즐만 출제됩니다.</p><button id="start">퍼즐 시작</button></div></div></section><div class="tip">전구 클릭·터치 · 대각선 전구는 바뀌지 않아요</div></main><script>
(()=>{const N=5,board=document.querySelector('#board'),over=document.querySelector('#over'),movesEl=document.querySelector('#moves'),bestEl=document.querySelector('#best');let lights=[],moves=0,playing=false,best=Number(localStorage.lightsBest||0);bestEl.textContent=best||'-';const near=i=>{const x=i%N,y=Math.floor(i/N),a=[i];if(x>0)a.push(i-1);if(x<N-1)a.push(i+1);if(y>0)a.push(i-N);if(y<N-1)a.push(i+N);return a};const toggle=i=>near(i).forEach(j=>lights[j]^=1);
function start(){lights=Array(N*N).fill(0);let used=new Set;while(used.size<10)used.add(Math.floor(Math.random()*N*N));used.forEach(toggle);if(lights.every(v=>!v))toggle(12);moves=0;movesEl.textContent=0;playing=true;over.classList.add('hide');render()}
function render(){board.innerHTML='';lights.forEach((v,i)=>{const b=document.createElement('button');b.className='light'+(v?' on':'');b.setAttribute('aria-label',`${i+1}번 전구 ${v?'켜짐':'꺼짐'}`);b.onclick=()=>press(i);board.appendChild(b)})}
function press(i){if(!playing)return;toggle(i);movesEl.textContent=++moves;render();if(lights.every(v=>!v))win()}
function win(){playing=false;if(!best||moves<best){best=moves;bestEl.textContent=best;localStorage.lightsBest=best}document.querySelector('#ico').textContent='🌙';document.querySelector('#title').textContent='모든 불을 껐어요!';document.querySelector('#desc').innerHTML=`${moves}번 만에 밤을 되찾았습니다.<br>더 적은 횟수로 다시 도전해 보세요.`;document.querySelector('#start').textContent='새 퍼즐';setTimeout(()=>over.classList.remove('hide'),350)}document.querySelector('#start').onclick=start;
})();</script></body></html>
