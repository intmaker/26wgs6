<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🏹 바람의 궁수</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 10%,#b45309,#3f2714 48%,#16110a);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(94vw,700px);height:min(95vh,840px);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#fde68a;font-weight:900}h1{margin:2px 0;font-size:clamp(26px,5vw,38px)}.stats{display:flex;gap:7px}.stat{min-width:70px;padding:8px;text-align:center;border:1px solid #ffffff24;border-radius:14px;background:#3f2714cc}.stat small{display:block;color:#fde68a;font-size:9px}.stat b{font-size:20px}.game{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff28;border-radius:25px;background:#bae6fd;box-shadow:0 25px 70px #0009;touch-action:none}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#22180de8}.overlay.hide{display:none}.card{max-width:390px;padding:28px 24px;text-align:center;border:1px solid #ffffff24;border-radius:23px;background:#4b2c17}.ico{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{color:#fef3c7;font-size:14px;line-height:1.7}.card>button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#fde68a,#fb923c);color:#431e0a;font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#fde68a;font-size:12px}@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.game{border-radius:20px}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">WIND ARCHER</div><h1>🏹 바람의 궁수</h1></div><div class="stats"><div class="stat"><small>점수</small><b id="score">0</b></div><div class="stat"><small>남은 화살</small><b id="shots">10</b></div><div class="stat"><small>바람</small><b id="wind">0</b></div></div></header><section class="game" id="game"><canvas id="canvas"></canvas><div class="overlay" id="over"><div class="card"><div class="ico" id="ico">🏹</div><h2 id="title">바람을 읽고 과녁을 맞히세요</h2><p id="desc">마우스나 손가락으로 조준하고 놓으면 발사합니다.<br>화살은 오른쪽으로 날아가는 동안<br>화면 위의 바람 수치만큼 위아래로 휘어집니다.</p><button id="start">화살 10발 시작</button></div></div></section><div class="tip">드래그로 조준 · 손을 놓아 발사 · 바람 방향 계산</div></main><script>
(()=>{const C=document.querySelector('#canvas'),X=C.getContext('2d'),G=document.querySelector('#game'),O=document.querySelector('#over'),SE=document.querySelector('#score'),SHE=document.querySelector('#shots'),WE=document.querySelector('#wind');let W,H,D=1,on=false,last=0,score=0,shots=10,wind=0,aimY=0,targetY=0,arrow=null,drag=false,marks=[];
function resize(){const r=G.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);aimY=H/2;targetY=H/2;draw()}function newRound(){wind=Math.round((Math.random()-.5)*12);WE.textContent=(wind>0?'↓':'↑')+Math.abs(wind);targetY=100+Math.random()*(H-200);aimY=H/2}
function start(){score=0;shots=10;marks=[];arrow=null;SE.textContent=0;SHE.textContent=10;on=true;O.classList.add('hide');newRound();last=performance.now();requestAnimationFrame(loop)}function fire(){if(!on||arrow)return;arrow={x:75,y:aimY,vx:570,vy:0,r:0};shots--;SHE.textContent=shots}
function update(dt){if(arrow){arrow.vy+=wind*5*dt;arrow.x+=arrow.vx*dt;arrow.y+=arrow.vy*dt;arrow.r=Math.atan2(arrow.vy,arrow.vx);if(arrow.x>=W-100){const dist=Math.abs(arrow.y-targetY),pts=dist<12?10:dist<27?7:dist<48?4:dist<70?1:0;score+=pts;SE.textContent=score;marks.push({y:arrow.y,pts});arrow=null;if(shots<=0)setTimeout(finish,350);else newRound()}}}
function draw(){X.clearRect(0,0,W,H);let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7dd3fc');g.addColorStop(.7,'#d9f99d');g.addColorStop(.71,'#4d7c0f');g.addColorStop(1,'#365314');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle='#ffffff70';for(let i=0;i<5;i++){X.beginPath();X.ellipse((i*173)%W,60+i*41,50,16,0,0,7);X.fill()}const tx=W-100;for(const [r,c] of [[70,'#fff'],[55,'#ef4444'],[40,'#fff'],[25,'#ef4444'],[11,'#facc15']]){X.fillStyle=c;X.beginPath();X.arc(tx,targetY,r,0,7);X.fill()}X.fillStyle='#5b3418';X.fillRect(tx-5,targetY+70,10,H);marks.forEach(m=>{X.fillStyle='#111827';X.fillRect(tx-8,m.y-2,38,4)});X.font='50px sans-serif';X.fillText('🏹',25,aimY+18);X.strokeStyle='#11182799';X.setLineDash([6,7]);X.beginPath();X.moveTo(70,aimY);X.lineTo(W-120,aimY);X.stroke();X.setLineDash([]);if(arrow){X.save();X.translate(arrow.x,arrow.y);X.rotate(arrow.r);X.strokeStyle='#422006';X.lineWidth=4;X.beginPath();X.moveTo(-22,0);X.lineTo(22,0);X.stroke();X.fillStyle='#e5e7eb';X.beginPath();X.moveTo(22,0);X.lineTo(12,-6);X.lineTo(12,6);X.fill();X.restore()}}
function finish(){if(!on)return;on=false;document.querySelector('#ico').textContent=score>=70?'🏆':'🏹';document.querySelector('#title').textContent=`10발 합계 ${score}점!`;document.querySelector('#desc').innerHTML='바람 화살표가 아래면 과녁보다 위를,<br>위라면 과녁보다 아래를 조준해 보세요.';document.querySelector('#start').textContent='다시 쏘기';O.classList.remove('hide')}function loop(t){if(!on)return;const dt=Math.min(.032,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}function pos(e){const r=C.getBoundingClientRect();return Math.max(60,Math.min(H-60,e.clientY-r.top))}C.onpointerdown=e=>{if(on&&!arrow){drag=true;aimY=pos(e);C.setPointerCapture(e.pointerId)}};C.onpointermove=e=>{if(drag)aimY=pos(e)};C.onpointerup=e=>{if(drag){drag=false;aimY=pos(e);fire()}};document.querySelector('#start').onclick=start;addEventListener('resize',resize);resize()})();</script></body></html>
