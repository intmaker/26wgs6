<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>배움 탐험 게임</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,"Noto Sans KR",sans-serif}
    body{color:#fff;background:radial-gradient(circle at 15% 10%,hsl(var(--hue) 82% 48%),#10152f 48%,#050817);user-select:none;overflow-x:hidden}
    button,input{font:inherit}.app{width:min(780px,100%);min-height:100vh;margin:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
    header{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand small{display:block;color:#dbeafe;font-weight:900;letter-spacing:.14em}.brand h1{margin:2px 0;font-size:clamp(24px,5vw,38px);letter-spacing:-.04em}
    .hud{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{min-width:68px;padding:7px 10px;text-align:center;border:1px solid #ffffff2d;border-radius:14px;background:#0711269c}.pill small{display:block;color:#cbd5e1;font-size:9px}.pill b{font-size:19px}
    .levelbar{height:9px;border-radius:99px;background:#ffffff1c;overflow:hidden}.levelbar i{display:block;height:100%;width:10%;border-radius:inherit;background:linear-gradient(90deg,#67e8f9,#fde047,#fb7185);transition:.35s}
    .stage{position:relative;flex:1;min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:clamp(15px,4vw,30px);border:1px solid #ffffff2c;border-radius:26px;background:linear-gradient(150deg,#ffffff18,#ffffff08);box-shadow:0 25px 70px #0007;overflow:hidden}
    .stage:before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,#ffffff12 0 2px,transparent 3px);background-size:42px 42px;rotate:12deg;pointer-events:none}.scene{position:relative;font-size:clamp(58px,13vw,92px);filter:drop-shadow(0 12px 18px #0006);animation:float 2.4s ease-in-out infinite}@keyframes float{50%{translate:0 -8px;rotate:2deg}}
    .mission{position:relative;padding:6px 13px;border-radius:999px;color:#172554;background:#bfdbfe;font-size:12px;font-weight:1000;letter-spacing:.05em}.question{position:relative;max-width:660px;text-align:center;font-size:clamp(22px,5vw,34px);font-weight:1000;line-height:1.35;word-break:keep-all}.hint{position:relative;min-height:24px;text-align:center;color:#e2e8f0;font-size:14px}
    .answers{position:relative;width:min(620px,100%);display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.answers button,.token,.action{min-height:58px;border:1px solid #ffffff35;border-radius:16px;color:#172033;background:#f8fafc;font-weight:950;cursor:pointer;box-shadow:0 8px 18px #0003;transition:.16s}.answers button:hover,.token:hover,.action:hover{translate:0 -3px;filter:brightness(1.08)}.answers button:active,.token:active,.action:active{scale:.97}
    .builder{position:relative;width:min(650px,100%)}.selected{min-height:70px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:10px;padding:10px;border:2px dashed #ffffff55;border-radius:16px;background:#02061755}.selected span{padding:8px 11px;border-radius:10px;background:#fef3c7;color:#422006;font-weight:900}.tokens{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.token{min-height:45px;padding:8px 14px}.token:disabled{opacity:.25}.builder-actions{display:flex;gap:8px;margin-top:11px}.action{flex:1;min-height:46px;background:#a5f3fc}.action.secondary{background:#e2e8f0}
    .typebox{position:relative;width:min(560px,100%);display:flex;gap:8px}.typebox input{flex:1;min-width:0;padding:13px 16px;border:3px solid #ffffff55;border-radius:15px;background:#fff;color:#172033;font-size:21px;font-weight:900;outline:none}.typebox .action{flex:0 0 105px}
    .feedback{position:relative;min-height:28px;text-align:center;color:#fde68a;font-weight:900}.shake{animation:shake .25s}@keyframes shake{25%{translate:-7px}75%{translate:7px}}.burst{animation:burst .4s}@keyframes burst{50%{scale:1.25;filter:brightness(1.8)}}
    .overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:#030712e8;backdrop-filter:blur(10px)}.overlay.hide{display:none}.card{width:min(440px,100%);padding:28px 24px;text-align:center;border:1px solid #ffffff2f;border-radius:25px;background:linear-gradient(145deg,#172554,#312e81);box-shadow:0 28px 80px #0009}.card .big{font-size:64px}.card h2{margin:8px 0}.card p{color:#dbeafe;line-height:1.7;word-break:keep-all}.card button{width:100%;min-height:52px;border:0;border-radius:14px;background:linear-gradient(135deg,#67e8f9,#fde047);color:#172033;font-weight:1000;cursor:pointer}.tip{text-align:center;color:#cbd5e1;font-size:12px}
    .hangul-mode .mission{font-size:14px}.hangul-mode .question{font-size:clamp(29px,6vw,44px);line-height:1.45}.hangul-mode .hint{font-size:18px;line-height:1.55}.hangul-mode .answers button{min-height:68px;padding:12px;font-size:clamp(20px,4vw,27px);line-height:1.35}.hangul-mode .selected{min-height:82px;font-size:18px}.hangul-mode .selected span,.hangul-mode .token{font-size:clamp(19px,4vw,25px);line-height:1.4}.hangul-mode .token{min-height:56px}.hangul-mode .typebox input{font-size:25px}.hangul-mode .feedback{font-size:18px;line-height:1.5}.hangul-mode .tip{font-size:14px}
    @media(max-width:560px){.app{padding:8px}.stage{min-height:470px;border-radius:20px}.answers{grid-template-columns:1fr}.answers button{min-height:51px}.hud{max-width:220px}.pill{min-width:62px;padding:5px}.scene{font-size:62px}.typebox{flex-direction:column}.typebox .action{flex-basis:48px}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="brand"><small id="category">배움 탐험</small><h1 id="gameTitle">게임 불러오는 중</h1></div><div class="hud"><div class="pill"><small>단계</small><b id="level">준비</b></div><div class="pill"><small>점수</small><b id="score">0</b></div><div class="pill"><small>연속</small><b id="combo">0</b></div><div class="pill"><small>기회</small><b id="hearts">❤️❤️❤️</b></div></div></header>
  <div class="levelbar"><i id="progress"></i></div>
  <section class="stage" id="stage"><div class="scene" id="scene">🚀</div><div class="mission" id="mission">MISSION 1</div><div class="question" id="question"></div><div class="hint" id="hint"></div><div class="answers" id="answers"></div><div class="builder" id="builder" hidden><div class="selected" id="selected">순서대로 눌러 보세요</div><div class="tokens" id="tokens"></div><div class="builder-actions"><button class="action secondary" id="resetOrder">다시 놓기</button><button class="action" id="checkOrder">확인</button></div></div><form class="typebox" id="typebox" hidden><input id="typeInput" autocomplete="off" placeholder="정답을 입력하세요"><button class="action">확인</button></form><div class="feedback" id="feedback"></div></section>
  <div class="tip">문제가 점점 어려워져요 · 틀려도 설명을 보고 다시 도전해요!</div>
</main>
<div class="overlay" id="overlay"><div class="card"><div class="big" id="coverEmoji">🎮</div><h2 id="coverTitle">배움 탐험</h2><p id="coverText"></p><button id="startButton">탐험 시작</button></div></div>
<script>
const $=s=>document.querySelector(s), pick=a=>a[Math.floor(Math.random()*a.length)], shuffle=a=>[...a].sort(()=>Math.random()-.5);
const choice=(q,a,wrong,explain)=>({mode:'choice',q,a,options:shuffle([...new Set([a,...wrong])]).slice(0,4),explain});
const order=(q,answer,explain)=>({mode:'order',q,answer,items:shuffle(answer),explain});
const type=(q,answers,explain)=>({mode:'type',q,answers:Array.isArray(answers)?answers:[answers],explain});
const DATA={
  math_fraction_bridge:{category:'🧮 수학 · 도전',title:'분수 구름다리',emoji:'🌉☁️',hue:205,desc:'분수의 크기를 비교해 끊어진 구름다리를 이어 보세요.',gen:n=>{let d=pick(n<4?[3,4,5,6]:[4,6,8,10,12]),a=1+Math.floor(Math.random()*(d-1)),b=1+Math.floor(Math.random()*(d-1));if(a===b)b=b===d-1?b-1:b+1;let ans=a>b?`${a}/${d}`:`${b}/${d}`;return choice(`더 큰 분수는 어느 쪽일까요?`,ans,[a>b?`${b}/${d}`:`${a}/${d}`,'두 분수는 같아요','비교할 수 없어요'],`분모가 같으면 분자가 큰 분수가 더 커요.`)}},
  math_pattern_mine:{category:'🧮 수학 · 도전',title:'규칙 수정 광산',emoji:'💎⛏️',hue:270,desc:'숫자 광맥의 규칙을 찾아 다음 보석을 캐세요.',gen:n=>{let step=pick(n<4?[2,3,5]:[4,6,7,9]),start=1+Math.floor(Math.random()*12),seq=[0,1,2,3].map(i=>start+i*step),a=start+4*step;return choice(`${seq.join(' → ')} → ?`,String(a),[a-step+1,a+step,a+1].map(String),`앞 숫자에 ${step}씩 더하는 규칙이에요.`)}},
  math_shape_architect:{category:'🧮 수학 · 도전',title:'도형 건축 연구소',emoji:'📐🏙️',hue:185,desc:'둘레와 넓이를 계산해 미래 도시를 설계하세요.',gen:n=>{let w=2+Math.floor(Math.random()*(n<4?5:8)),h=2+Math.floor(Math.random()*(n<4?5:8)),area=n%2===0,a=area?w*h:2*(w+h);return choice(`가로 ${w}m, 세로 ${h}m 직사각형의 ${area?'넓이':'둘레'}는?`,`${a}${area?'㎡':'m'}`,[a+2,a-2,area?2*(w+h):w*h].map(x=>`${Math.max(1,x)}${area?'㎡':'m'}`),area?'넓이 = 가로 × 세로예요.':'둘레 = (가로 + 세로) × 2예요.')}},
  math_code_vault:{category:'🧮 수학 · 도전',title:'연산 암호 금고',emoji:'🔐🧮',hue:45,desc:'두 단계 계산 암호를 풀어 보물 금고를 여세요.',gen:n=>{let a=3+Math.floor(Math.random()*10),b=2+Math.floor(Math.random()*7),c=2+Math.floor(Math.random()*(n<4?4:8)),ans=a*b-c;return type(`${a} × ${b} − ${c} = ?`,String(ans),'곱셈을 먼저 하고 뺄셈을 계산해요.')}},
  math_probability_carnival:{category:'🧮 수학 · 도전',title:'확률 놀이공원',emoji:'🎡🎲',hue:330,desc:'가능성을 판단해 행운의 놀이기구를 움직이세요.',gen:n=>{const bank=[['빨간 공 5개, 파란 공 1개 중 하나를 뽑아요. 더 잘 나오는 색은?','빨간색',['파란색','똑같아요','알 수 없어요'],'개수가 많은 빨간 공이 나올 가능성이 더 커요.'],['주사위에서 7이 나올 가능성은?','불가능',['확실','반반','매우 높음'],'보통 주사위에는 1부터 6까지만 있어요.'],['동전을 한 번 던질 때 앞면과 뒷면의 가능성은?','똑같아요',['앞면이 더 커요','뒷면이 더 커요','둘 다 불가능'],'공정한 동전이라면 두 결과의 가능성은 같아요.'],['1~10 카드 중 짝수 카드는 몇 장일까요?','5장',['4장','6장','10장'],'2, 4, 6, 8, 10으로 모두 5장이에요.'],['초록 2개, 노랑 2개, 보라 6개 중 가장 드물게 뽑히는 색은?','초록과 노랑',['보라','세 색 모두 같음','알 수 없음'],'초록과 노랑은 각각 2개로 개수가 같고 가장 적어요.']];let x=bank[n%bank.length];return choice(x[0],x[1],x[2],x[3])}},
  eng_tense_machine:{category:'🔤 영어 · 도전',title:'시제 타임머신',emoji:'⏳🚀',hue:220,desc:'시간 단서를 읽고 알맞은 동사로 타임머신을 작동하세요.',gen:n=>{const b=[['Yesterday, I ___ to school.','went',['go','will go','going'],'Yesterday는 과거이므로 went가 알맞아요.'],['She ___ milk every morning.','drinks',['drank','drink','will drinking'],'반복되는 습관이며 주어가 she라서 drinks예요.'],['We will ___ soccer tomorrow.','play',['played','plays','playing'],'will 뒤에는 동사원형 play가 와요.'],['They ___ a movie now.','are watching',['watched','watch','will watch'],'now의 진행 중인 행동은 are watching이에요.'],['Tom ___ his homework last night.','finished',['finishes','finish','will finish'],'last night는 과거를 나타내요.']];let x=b[n%b.length];return choice(x[0],x[1],x[2],x[3])}},
  eng_sentence_builder:{category:'🔤 영어 · 도전',title:'문장 블록 스튜디오',emoji:'🎬🧱',hue:265,desc:'흩어진 영어 블록을 조립해 영화 속 대사를 완성하세요.',gen:n=>{const b=[[['I','like','to','read','books.'],'나는 책 읽는 것을 좋아해요.'],[['She','is','playing','the','piano.'],'그녀는 피아노를 연주하고 있어요.'],[['Where','do','you','live?'],'너는 어디에 사니?'],[['My','brother','can','swim','well.'],'내 남동생은 수영을 잘할 수 있어요.'],[['We','went','to','the','museum.'],'우리는 박물관에 갔어요.']];let x=b[n%b.length];return order(`뜻: ${x[1]}`,x[0],'영어는 주어와 동사의 자리를 먼저 찾으면 쉬워요.')}},
  eng_preposition_maze:{category:'🔤 영어 · 도전',title:'전치사 미로',emoji:'🧭🐭',hue:150,desc:'위치 단서를 해석해 미로 속 치즈를 찾아가세요.',gen:n=>{const b=[['The cat is ___ the box. (상자 안)','in',['on','under','between'],'안쪽은 in을 써요.'],['The lamp is ___ the desk. (책상 위)','on',['in','behind','under'],'표면 위에 닿아 있으면 on이에요.'],['The ball is ___ the chair. (의자 아래)','under',['above','next to','in'],'아래쪽은 under예요.'],['The bank is ___ the school and the park.','between',['into','above','through'],'두 장소 사이에는 between을 써요.'],['The dog is ___ the door. (문 뒤)','behind',['in front of','on','between'],'뒤쪽은 behind예요.']];let x=b[n%b.length];return choice(x[0],x[1],x[2],x[3])}},
  eng_reading_rescue:{category:'🔤 영어 · 도전',title:'리딩 구조대',emoji:'🚁📖',hue:10,desc:'짧은 글에서 결정적 단서를 찾아 친구들을 구조하세요.',gen:n=>{const b=[['Jisu takes an umbrella because dark clouds are coming.','Why does Jisu take an umbrella?','It may rain.',['It is sunny.','She is hungry.','She lost her bag.'],'dark clouds와 umbrella가 비가 올 수 있다는 단서예요.'],['Leo feeds his rabbit carrots every evening.','What does the rabbit eat?','Carrots',['Apples','Bread','Fish'],'feeds와 carrots를 연결해 읽어요.'],['Mina missed the bus, so she walked to school.','How did Mina go to school?','On foot',['By bus','By car','By bike'],'missed the bus 뒤에 walked라는 단서가 있어요.'],['The library closes at six. Ben arrives at five thirty.','How much time does Ben have?','30 minutes',['10 minutes','1 hour','2 hours'],'5시 30분부터 6시까지는 30분이에요.']];let x=b[n%b.length];return choice(`${x[0]}\n${x[1]}`,x[2],x[3],x[4])}},
  eng_synonym_lab:{category:'🔤 영어 · 도전',title:'뜻빛깔 연금술',emoji:'⚗️🌈',hue:290,desc:'비슷한 뜻의 영어 단어를 합성해 마법 물약을 만드세요.',gen:n=>{const b=[['happy','glad',['angry','slow','dark'],'happy와 glad는 둘 다 기쁜이라는 뜻이에요.'],['big','large',['tiny','short','quiet'],'big과 large는 둘 다 큰이라는 뜻이에요.'],['fast','quick',['late','heavy','weak'],'fast와 quick은 둘 다 빠른이라는 뜻이에요.'],['smart','clever',['empty','noisy','cold'],'smart와 clever는 영리한이라는 뜻으로 비슷해요.'],['begin','start',['finish','break','close'],'begin과 start는 둘 다 시작하다라는 뜻이에요.']];let x=b[n%b.length];return choice(`'${x[0]}'와 뜻이 가장 비슷한 단어는?`,x[1],x[2],x[3])}},
  ko_jamo_spaceship:{category:'🌱 한글',title:'자모 합체 우주선',emoji:'🚀ㄱㅏ',hue:195,desc:'자음과 모음을 합체해 우주 글자 행성을 발견하세요.',gen:n=>{const b=[['ㄱ + ㅏ','가',['거','나','고']],['ㅁ + ㅜ','무',['모','누','미']],['ㅂ + ㅣ','비',['피','바','버']],['ㅅ + ㅓ','서',['소','저','시']],['ㅈ + ㅗ','조',['주','초','자']],['ㅋ + ㅜ','쿠',['구','코','키']]];let x=b[n%b.length];return choice(`${x[0]} = ?`,x[1],x[2],'자음에 모음 소리를 이어 천천히 읽어 보세요.')}},
  ko_batchim_fishing:{category:'🌱 한글',title:'받침 낚시왕',emoji:'🎣🐟',hue:205,desc:'낱말 속 숨어 있는 받침을 낚아 올리세요.',gen:n=>{const b=[['산','ㄴ',['ㄱ','ㅁ','받침 없음']],['달','ㄹ',['ㄴ','ㄷ','받침 없음']],['밥','ㅂ',['ㅍ','ㅁ','받침 없음']],['공','ㅇ',['ㄴ','ㄱ','받침 없음']],['꽃','ㅊ',['ㅈ','ㅅ','ㅌ']],['밖','ㄲ',['ㄱ','ㅋ','ㅂ']]];let x=b[n%b.length];return choice(`‘${x[0]}’의 마지막 받침은?`,x[1],x[2],`‘${x[0]}’을 천천히 끝소리까지 읽어 보세요.`)}},
  ko_word_shadow:{category:'🌱 한글',title:'낱말 그림자 탐정',emoji:'🔦🕵️',hue:255,desc:'설명과 문맥을 단서로 숨어 있는 낱말을 찾아내세요.',gen:n=>{const b=[['비가 온 뒤 하늘에 여러 색으로 나타나요.','무지개',['번개','구름','별빛']],['책을 빌리고 조용히 읽는 곳이에요.','도서관',['운동장','정류장','놀이터']],['씨앗에서 자라 줄기와 잎을 내요.','식물',['광물','건물','선물']],['모르는 길이나 방향을 알려 주는 그림이에요.','지도',['일기','편지','표지']],['생각이나 느낌을 말과 글로 나타내는 일이에요.','표현',['발견','약속','관찰']]];let x=b[n%b.length];return choice(x[0],x[1],x[2],`설명의 핵심 단서를 연결하면 ‘${x[1]}’이에요.`)}},

  ko_proverb_map:{category:'🌱 한글',title:'속담 보물지도',emoji:'🗺️💎',hue:50,desc:'속담의 빈칸과 뜻을 풀어 숨은 지혜의 보물을 찾으세요.',gen:n=>{const b=[['티끌 모아 __','태산',['바다','구름','마을'],'작은 것도 모이면 큰 것이 된다는 뜻이에요.'],['가는 말이 고와야 __ 말이 곱다','오는',['빠른','작은','웃는'],'내가 좋게 말해야 상대도 좋게 말한다는 뜻이에요.'],['백지장도 맞들면 __','낫다',['무겁다','찢어진다','하얗다'],'쉬운 일도 함께하면 더 쉽다는 뜻이에요.'],['돌다리도 두들겨 보고 __','건너라',['달려라','만들어라','피하라'],'잘 아는 일도 조심해서 하라는 뜻이에요.'],['세 살 버릇 __까지 간다','여든',['열 살','스무 살','백 살'],'어릴 때 든 습관이 오래간다는 뜻이에요.']];let x=b[n%b.length];return choice(x[0],x[1],x[2],x[3])}},

};
Object.entries(DATA).forEach(([name,definition])=>{for(let n=0;n<10;n++){const probe=definition.gen(n);if(!probe||!probe.mode||!probe.q)throw new Error(`${name}의 ${n+1}번 문제가 올바르지 않습니다.`);if(probe.mode==='choice'&&!probe.options.includes(probe.a))throw new Error(`${name}의 정답 선택지가 없습니다.`);if(probe.mode==='order'&&(!probe.answer||!probe.items))throw new Error(`${name}의 순서 문제가 올바르지 않습니다.`);if(probe.mode==='type'&&!probe.answers.length)throw new Error(`${name}의 입력 정답이 없습니다.`)}});
const key=new URLSearchParams(location.search).get('game')||'ko_jamo_spaceship', game=DATA[key]||DATA.ko_jamo_spaceship;
if(key.startsWith('ko_'))document.body.classList.add('hangul-mode');
document.documentElement.style.setProperty('--hue',game.hue);document.title=game.title;$('#category').textContent=game.category;$('#gameTitle').textContent=game.title;$('#coverEmoji').textContent=game.emoji;$('#coverTitle').textContent=game.title;$('#coverText').textContent=game.desc;$('#scene').textContent=game.emoji;
let score=0,combo=0,hearts=3,roundNo=0,current=null,locked=false,chosen=[];
function update(){let phase=roundNo<4?'준비':roundNo<8?'도전':'마스터';$('#level').textContent=phase;$('#score').textContent=score;$('#combo').textContent=combo;$('#hearts').textContent='❤️'.repeat(hearts)+'🖤'.repeat(3-hearts);$('#progress').style.width=Math.min(100,(roundNo%10+1)*10)+'%';$('#mission').textContent=`${phase.toUpperCase()} · MISSION ${roundNo+1}`}
function render(){locked=false;chosen=[];current=game.gen(roundNo);$('#question').textContent=current.q;$('#hint').textContent='정답을 생각하고 도전해 보세요.';$('#feedback').textContent='';$('#answers').innerHTML='';$('#answers').hidden=current.mode!=='choice';$('#builder').hidden=current.mode!=='order';$('#typebox').hidden=current.mode!=='type';if(current.mode==='choice'){current.options.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>judge(v===current.a);$('#answers').appendChild(b)})}else if(current.mode==='order'){drawOrder()}else{$('#typeInput').value='';setTimeout(()=>$('#typeInput').focus(),50)}update()}
function drawOrder(){$('#selected').innerHTML=chosen.length?chosen.map(x=>`<span>${x.v}</span>`).join(''):'순서대로 눌러 보세요';$('#tokens').innerHTML='';current.items.forEach((v,i)=>{let b=document.createElement('button');b.className='token';b.textContent=v;b.disabled=chosen.some(x=>x.i===i);b.onclick=()=>{chosen.push({i,v});drawOrder()};$('#tokens').appendChild(b)})}
function judge(ok){if(locked)return;locked=true;if(ok){score+=20+Math.min(20,combo*2);combo++;$('#feedback').textContent=`✅ 정답! ${current.explain}`;$('#scene').classList.add('burst')}else{hearts--;combo=0;$('#feedback').textContent=`💡 ${current.explain}`;$('#stage').classList.add('shake')}update();setTimeout(()=>{if(hearts<=0)return finish();roundNo++;if(roundNo>=10)return finish();$('#scene').classList.remove('burst');$('#stage').classList.remove('shake');render()},1100)}
$('#resetOrder').onclick=()=>{chosen=[];drawOrder()};$('#checkOrder').onclick=()=>judge(chosen.map(x=>x.v).join('|')===current.answer.join('|'));$('#typebox').onsubmit=e=>{e.preventDefault();let v=$('#typeInput').value.trim().replace(/\s+/g,' ');judge(current.answers.some(a=>a.toLowerCase()===v.toLowerCase()))};
function start(){score=combo=roundNo=0;hearts=3;$('#overlay').classList.add('hide');render()}
function finish(){$('#coverEmoji').textContent=score>=160?'🏆🌟':'🌱💪';$('#coverTitle').textContent=score>=160?'대단한 탐험가예요!':'한 번 더 성장해 볼까요?';$('#coverText').innerHTML=`최종 점수 <b>${score}</b>점 · ${roundNo}개 미션 완료<br>설명을 떠올리며 다시 도전하면 더 쉬워져요.`;$('#startButton').textContent='다시 도전';$('#overlay').classList.remove('hide')}
$('#startButton').onclick=start;
</script>
