<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>COLOR LAND!</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:#dff5ff;
    touch-action:none;
}
#wrap{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
}
canvas{
    position:absolute;
    inset:0;
    display:block;
    width:100%;
    height:100%;
    cursor:crosshair;
}
#hud{
    position:absolute;
    top:max(10px,env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    display:flex;
    justify-content:center;
    gap:7px;
    flex-wrap:wrap;
    width:96%;
    pointer-events:none;
}
.hudItem{
    min-width:70px;
    padding:7px 11px;
    border-radius:15px;
    background:rgba(255,255,255,.92);
    box-shadow:0 4px 14px rgba(50,80,120,.16);
    text-align:center;
    color:#526575;
    font-size:11px;
    font-weight:800;
}
.hudItem strong{
    display:block;
    margin-top:1px;
    font-size:16px;
    color:#263c4c;
}
#toast{
    position:absolute;
    top:25%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:15;
    font-size:clamp(27px,7vw,54px);
    font-weight:1000;
    color:white;
    text-shadow:
        0 3px 0 rgba(30,50,70,.4),
        0 6px 18px rgba(0,0,0,.22);
    opacity:0;
    pointer-events:none;
}
#toast.show{
    animation:toastAni 1s ease;
}
@keyframes toastAni{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}
    70%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}
}
.screen{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at 15% 20%,#bcefff 0,transparent 35%),
        radial-gradient(circle at 85% 80%,#e3c8ff 0,transparent 35%),
        linear-gradient(135deg,#e8fbff,#f5eaff);
}
.panel{
    width:min(450px,92vw);
    padding:28px 22px;
    background:rgba(255,255,255,.97);
    border-radius:30px;
    text-align:center;
    box-shadow:0 20px 60px rgba(50,70,110,.22);
}
.title{
    margin:0;
    color:#526dff;
    font-size:clamp(38px,10vw,60px);
    font-weight:1000;
    line-height:1;
}
.subtitle{
    margin:15px 0;
    color:#526575;
    font-size:17px;
    line-height:1.55;
    font-weight:800;
}
.guide{
    margin:15px 0 20px;
    padding:14px;
    border-radius:18px;
    background:#f2f7ff;
    color:#607484;
    font-size:13px;
    line-height:1.8;
}
button{
    border:0;
    border-radius:18px;
    padding:15px 30px;
    background:linear-gradient(135deg,#536dfe,#925ee9);
    color:white;
    font-size:19px;
    font-weight:1000;
    box-shadow:0 7px 0 #4053bd;
    cursor:pointer;
    touch-action:manipulation;
}
button:active{
    transform:translateY(4px);
    box-shadow:0 3px 0 #4053bd;
}
.hidden{
    display:none!important;
}
#controlGuide{
    position:absolute;
    left:50%;
    bottom:max(12px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:10;
    padding:7px 13px;
    border-radius:20px;
    background:rgba(255,255,255,.88);
    color:#526575;
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
    pointer-events:none;
}
#result{
    margin:15px 0;
    padding:15px;
    background:#f4f8ff;
    border-radius:18px;
    color:#526575;
    font-weight:800;
    line-height:1.9;
}
#miniLabel{
    position:absolute;
    right:17px;
    top:92px;
    z-index:9;
    padding:3px 8px;
    border-radius:10px;
    background:rgba(255,255,255,.85);
    color:#657887;
    font-size:9px;
    font-weight:bold;
    pointer-events:none;
}
</style>
</head>

<body>
<div id="wrap">

<canvas id="canvas"></canvas>

<div id="hud" class="hidden">
    <div class="hudItem">점수<strong id="score">0</strong></div>
    <div class="hudItem">내 영역<strong id="area">0%</strong></div>
    <div class="hudItem">순위<strong id="rank">1/5</strong></div>
    <div class="hudItem">시간<strong id="time">0:00</strong></div>
</div>

<div id="toast"></div>

<div id="controlGuide" class="hidden">
🖱️ 마우스 방향 이동　⌨️ 방향키/WASD　📱 스와이프
</div>

<div id="miniLabel" class="hidden">MINI MAP</div>

<div id="startScreen" class="screen">
    <div class="panel">
        <h1 class="title">🗺️<br>COLOR LAND!</h1>

        <div class="subtitle">
            땅을 넓혀<br>
            최고의 영역왕이 되어라! 👑
        </div>

        <div class="guide">
            🔵 파란색 <b>YOU</b>가 내 캐릭터입니다.<br>
            🖱️ 마우스를 원하는 방향으로 움직여 보세요.<br>
            🟦 내 땅 밖으로 나가면 궤적이 생깁니다.<br>
            🔄 다시 내 땅으로 돌아오면 영역 획득!<br>
            ➿ 내 선을 다시 지나가도 죽지 않습니다.<br>
            ⚔️ AI의 궤적을 끊으면 상대를 제거합니다.<br>
            💥 AI가 내 궤적을 끊으면 GAME OVER!
        </div>

        <button id="startBtn">🎮 게임 시작</button>
    </div>
</div>

<div id="gameOverScreen" class="screen hidden">
    <div class="panel">
        <h1 class="title" style="font-size:43px">GAME OVER</h1>
        <div id="result"></div>
        <button id="restartBtn">🔄 다시 도전하기</button>
    </div>
</div>

</div>

<script>
(() => {

"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const hud = document.getElementById("hud");
const controlGuide = document.getElementById("controlGuide");
const miniLabel = document.getElementById("miniLabel");

const scoreEl = document.getElementById("score");
const areaEl = document.getElementById("area");
const rankEl = document.getElementById("rank");
const timeEl = document.getElementById("time");
const toast = document.getElementById("toast");

const COLS = 120;
const ROWS = 120;
const CELL = 22;

const WORLD_W = COLS * CELL;
const WORLD_H = ROWS * CELL;

const MOVE_INTERVAL = 82;

let W = innerWidth;
let H = innerHeight;

let territory = null;
let players = [];
let human = null;

let gameRunning = false;
let startTime = 0;
let lastMove = 0;

let cameraX = 0;
let cameraY = 0;

let touchStartX = 0;
let touchStartY = 0;

let particles = [];
let animationId = null;

const colors = [
    { main:"#4169e1", land:"#b7c4ff", name:"YOU" },
    { main:"#ff496d", land:"#ffc0cd", name:"RED" },
    { main:"#00ad86", land:"#9be5d1", name:"GREEN" },
    { main:"#ff9f1c", land:"#ffd69a", name:"ORANGE" },
    { main:"#9b59e6", land:"#d9b8f5", name:"PURPLE" }
];

const dirs = [
    {x:1,y:0},
    {x:0,y:1},
    {x:-1,y:0},
    {x:0,y:-1}
];

function resize(){
    W = innerWidth;
    H = innerHeight;

    const dpr = Math.min(devicePixelRatio || 1, 2);

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize", resize);
resize();

function valid(x,y){
    return x>=0 && x<COLS && y>=0 && y<ROWS;
}

function index(x,y){
    return y*COLS+x;
}

function getOwner(x,y){
    if(!valid(x,y)) return -99;
    return territory[index(x,y)];
}

function createPlayer(id,x,y,dir,isAI){
    return {
        id,
        x,
        y,
        dir,
        nextDir:dir,
        isAI,
        alive:true,
        outside:false,
        trail:[],
        kills:0,
        aiTimer:0
    };
}

function createStartLand(p){
    const radius = 5;

    for(let y=p.y-radius; y<=p.y+radius; y++){
        for(let x=p.x-radius; x<=p.x+radius; x++){

            if(!valid(x,y)) continue;

            const dx = x-p.x;
            const dy = y-p.y;

            if(Math.sqrt(dx*dx+dy*dy) <= radius+.5){
                territory[index(x,y)] = p.id;
            }
        }
    }
}

function startGame(){

    territory = new Int16Array(COLS*ROWS);
    territory.fill(-1);

    particles = [];
    players = [];

    human = createPlayer(
        0,
        60,
        60,
        0,
        false
    );

    const ai1 = createPlayer(1, 23, 24, 0, true);
    const ai2 = createPlayer(2, 96, 25, 2, true);
    const ai3 = createPlayer(3, 24, 95, 0, true);
    const ai4 = createPlayer(4, 96, 95, 2, true);

    players.push(
        human,
        ai1,
        ai2,
        ai3,
        ai4
    );

    players.forEach(createStartLand);

    cameraX = human.x*CELL - W/2;
    cameraY = human.y*CELL - H/2;

    clampCamera();

    gameRunning = true;
    startTime = performance.now();
    lastMove = startTime;

    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");

    hud.classList.remove("hidden");
    controlGuide.classList.remove("hidden");
    miniLabel.classList.remove("hidden");

    showToast("GO! 🚀");

    if(animationId){
        cancelAnimationFrame(animationId);
    }

    animationId = requestAnimationFrame(loop);
}

function clampCamera(){

    const maxX = Math.max(0, WORLD_W-W);
    const maxY = Math.max(0, WORLD_H-H);

    cameraX = Math.max(0, Math.min(maxX, cameraX));
    cameraY = Math.max(0, Math.min(maxY, cameraY));
}

function updateCamera(){

    if(!human) return;

    const targetX = human.x*CELL + CELL/2 - W/2;
    const targetY = human.y*CELL + CELL/2 - H/2;

    cameraX += (targetX-cameraX)*.13;
    cameraY += (targetY-cameraY)*.13;

    clampCamera();
}

function trailContains(p,x,y){

    for(const t of p.trail){
        if(t.x===x && t.y===y){
            return true;
        }
    }

    return false;
}

function addTrailCell(p,x,y){

    /*
        이미 자기 선에 있는 칸이라면
        중복 추가하지 않는다.

        하지만 죽지도 않는다.
    */

    if(trailContains(p,x,y)){
        return;
    }

    p.trail.push({x,y});
}

function updateAI(p){

    p.aiTimer--;

    const forward = dirs[p.dir];

    const fx = p.x + forward.x*3;
    const fy = p.y + forward.y*3;

    const nearWall = !valid(fx,fy);

    if(p.aiTimer>0 && !nearWall){
        return;
    }

    p.aiTimer = 3 + Math.floor(Math.random()*7);

    const choices=[];

    for(let d=0; d<4; d++){

        if(d === (p.dir+2)%4){
            continue;
        }

        const v = dirs[d];

        const nx = p.x+v.x;
        const ny = p.y+v.y;

        if(!valid(nx,ny)){
            continue;
        }

        let score = Math.random()*5;

        if(
            nx<5 ||
            ny<5 ||
            nx>COLS-6 ||
            ny>ROWS-6
        ){
            score -= 9;
        }

        /*
            AI도 자기 선에 닿아도 죽지 않음.
            너무 반복적으로 같은 선만 타지 않게
            약간의 감점만 준다.
        */

        if(trailContains(p,nx,ny)){
            score -= 2;
        }

        if(p.outside && p.trail.length>7){

            if(getOwner(nx,ny) === p.id){
                score += 25;
            }
        }

        if(p.outside && p.trail.length>15){

            if(getOwner(nx,ny) === p.id){
                score += 35;
            }
        }

        /*
            다른 플레이어의 선 공격
        */

        for(const other of players){

            if(other===p || !other.alive){
                continue;
            }

            if(trailContains(other,nx,ny)){
                score += 25;
            }
        }

        choices.push({
            dir:d,
            score
        });
    }

    if(!choices.length){
        return;
    }

    choices.sort((a,b)=>b.score-a.score);

    if(Math.random()<.78){
        p.nextDir = choices[0].dir;
    }else{
        p.nextDir =
            choices[
                Math.floor(
                    Math.random()*choices.length
                )
            ].dir;
    }
}

function movePlayer(p){

    if(!p.alive) return;

    if(p.isAI){
        updateAI(p);
    }

    if(p.nextDir !== (p.dir+2)%4){
        p.dir = p.nextDir;
    }

    const d = dirs[p.dir];

    const nx = p.x+d.x;
    const ny = p.y+d.y;

    /*
        맵 밖으로 나가면
    */

    if(!valid(nx,ny)){

        if(p===human){
            killPlayer(p,null);
        }else{
            p.nextDir = (p.dir+1)%4;
        }

        return;
    }

    /*
        핵심 수정:
        자기 자신의 선에 닿아도 죽지 않는다.
    */

    /*
        다른 플레이어의 궤적을 밟으면
        그 상대가 제거된다.
    */

    for(const other of players){

        if(other===p || !other.alive){
            continue;
        }

        if(trailContains(other,nx,ny)){
            killPlayer(other,p);
        }
    }

    p.x = nx;
    p.y = ny;

    const onOwnLand =
        getOwner(p.x,p.y) === p.id;

    if(!onOwnLand){

        p.outside = true;

        addTrailCell(
            p,
            p.x,
            p.y
        );

    }else if(p.outside){

        captureLand(p);
    }
}

function captureLand(p){

    const before = countLand(p.id);

    for(const t of p.trail){

        if(valid(t.x,t.y)){
            territory[index(t.x,t.y)] = p.id;
        }
    }

    const visited =
        new Uint8Array(
            COLS*ROWS
        );

    const qx =
        new Int16Array(
            COLS*ROWS
        );

    const qy =
        new Int16Array(
            COLS*ROWS
        );

    let head=0;
    let tail=0;

    function add(x,y){

        if(!valid(x,y)) return;

        const i = index(x,y);

        if(visited[i]) return;

        if(territory[i] === p.id){
            return;
        }

        visited[i]=1;

        qx[tail]=x;
        qy[tail]=y;

        tail++;
    }

    for(let x=0; x<COLS; x++){

        add(x,0);
        add(x,ROWS-1);
    }

    for(let y=0; y<ROWS; y++){

        add(0,y);
        add(COLS-1,y);
    }

    while(head<tail){

        const x = qx[head];
        const y = qy[head];

        head++;

        for(const d of dirs){
            add(
                x+d.x,
                y+d.y
            );
        }
    }

    for(let y=0; y<ROWS; y++){

        for(let x=0; x<COLS; x++){

            const i = index(x,y);

            if(
                territory[i] !== p.id &&
                !visited[i]
            ){
                territory[i]=p.id;
            }
        }
    }

    p.trail=[];
    p.outside=false;

    const after = countLand(p.id);
    const gained = after-before;

    if(p===human && gained>20){

        if(gained>100){
            showToast("BIG AREA! 🔥");
        }else{
            showToast("GOOD! ✨");
        }

        createParticles(
            p.x,
            p.y,
            colors[p.id].main
        );
    }
}

function killPlayer(victim,killer){

    if(!victim.alive){
        return;
    }

    victim.alive=false;
    victim.trail=[];

    if(killer===human){

        human.kills++;

        showToast("NICE! ⭐");

        createParticles(
            victim.x,
            victim.y,
            colors[victim.id].main
        );
    }

    if(victim===human){

        endGame();

    }else{

        setTimeout(
            ()=>respawnAI(victim),
            1200
        );
    }
}

function respawnAI(p){

    if(!gameRunning){
        return;
    }

    for(let tries=0; tries<120; tries++){

        const x =
            8+
            Math.floor(
                Math.random()*
                (COLS-16)
            );

        const y =
            8+
            Math.floor(
                Math.random()*
                (ROWS-16)
            );

        if(getOwner(x,y) === -1){

            p.x=x;
            p.y=y;

            p.dir =
                Math.floor(
                    Math.random()*4
                );

            p.nextDir=p.dir;

            p.trail=[];
            p.outside=false;
            p.alive=true;

            createStartLand(p);

            return;
        }
    }
}

function countLand(id){

    let count=0;

    for(let i=0; i<territory.length; i++){

        if(territory[i]===id){
            count++;
        }
    }

    return count;
}

/* 마우스 이동 */

canvas.addEventListener("mousemove",e=>{

    if(
        !gameRunning ||
        !human ||
        !human.alive
    ){
        return;
    }

    const playerScreenX =
        human.x*CELL+
        CELL/2-
        cameraX;

    const playerScreenY =
        human.y*CELL+
        CELL/2-
        cameraY;

    const dx =
        e.clientX-playerScreenX;

    const dy =
        e.clientY-playerScreenY;

    if(
        Math.abs(dx)<20 &&
        Math.abs(dy)<20
    ){
        return;
    }

    let newDir;

    if(Math.abs(dx)>Math.abs(dy)){
        newDir = dx>0 ? 0 : 2;
    }else{
        newDir = dy>0 ? 1 : 3;
    }

    changeHumanDirection(newDir);
});

/* 마우스 클릭 */

canvas.addEventListener("mousedown",e=>{

    if(!gameRunning || !human){
        return;
    }

    const px =
        human.x*CELL+
        CELL/2-
        cameraX;

    const py =
        human.y*CELL+
        CELL/2-
        cameraY;

    const dx=e.clientX-px;
    const dy=e.clientY-py;

    let dir;

    if(Math.abs(dx)>Math.abs(dy)){
        dir=dx>0 ? 0 : 2;
    }else{
        dir=dy>0 ? 1 : 3;
    }

    changeHumanDirection(dir);
});

/* 키보드 */

window.addEventListener("keydown",e=>{

    let dir=null;

    switch(e.key){

        case "ArrowRight":
        case "d":
        case "D":
            dir=0;
            break;

        case "ArrowDown":
        case "s":
        case "S":
            dir=1;
            break;

        case "ArrowLeft":
        case "a":
        case "A":
            dir=2;
            break;

        case "ArrowUp":
        case "w":
        case "W":
            dir=3;
            break;
    }

    if(dir!==null){

        e.preventDefault();
        changeHumanDirection(dir);
    }
});

function changeHumanDirection(dir){

    if(
        !gameRunning ||
        !human ||
        !human.alive
    ){
        return;
    }

    /*
        180도 즉시 회전은 막음
    */

    if(dir !== (human.dir+2)%4){
        human.nextDir = dir;
    }
}

/* 터치 */

canvas.addEventListener(
    "touchstart",
    e=>{

        if(!gameRunning){
            return;
        }

        const t=e.changedTouches[0];

        touchStartX=t.clientX;
        touchStartY=t.clientY;

        e.preventDefault();
    },
    {passive:false}
);

canvas.addEventListener(
    "touchend",
    e=>{

        if(!gameRunning){
            return;
        }

        const t=e.changedTouches[0];

        const dx =
            t.clientX-touchStartX;

        const dy =
            t.clientY-touchStartY;

        if(
            Math.abs(dx)<18 &&
            Math.abs(dy)<18
        ){
            return;
        }

        let dir;

        if(Math.abs(dx)>Math.abs(dy)){
            dir=dx>0 ? 0 : 2;
        }else{
            dir=dy>0 ? 1 : 3;
        }

        changeHumanDirection(dir);

        e.preventDefault();
    },
    {passive:false}
);

function createParticles(x,y,color){

    for(let i=0;i<25;i++){

        particles.push({
            x:x*CELL+CELL/2,
            y:y*CELL+CELL/2,
            vx:(Math.random()-.5)*6,
            vy:(Math.random()-.5)*6,
            life:30+Math.random()*25,
            color
        });
    }
}

function updateParticles(){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.vx*=.95;
        p.vy*=.95;

        p.life--;

        if(p.life<=0){
            particles.splice(i,1);
        }
    }
}

function draw(){

    ctx.clearRect(0,0,W,H);

    const bg =
        ctx.createLinearGradient(
            0,0,0,H
        );

    bg.addColorStop(
        0,
        "#dff6ff"
    );

    bg.addColorStop(
        1,
        "#f0eaff"
    );

    ctx.fillStyle=bg;
    ctx.fillRect(0,0,W,H);

    if(!territory){
        return;
    }

    ctx.save();

    ctx.translate(
        -cameraX,
        -cameraY
    );

    ctx.fillStyle="#f9fcff";

    ctx.fillRect(
        0,0,
        WORLD_W,
        WORLD_H
    );

    const startCol =
        Math.max(
            0,
            Math.floor(cameraX/CELL)-2
        );

    const endCol =
        Math.min(
            COLS,
            Math.ceil(
                (cameraX+W)/CELL
            )+2
        );

    const startRow =
        Math.max(
            0,
            Math.floor(cameraY/CELL)-2
        );

    const endRow =
        Math.min(
            ROWS,
            Math.ceil(
                (cameraY+H)/CELL
            )+2
        );

    /* 영역 */

    for(let y=startRow;y<endRow;y++){

        for(let x=startCol;x<endCol;x++){

            const owner=getOwner(x,y);

            if(owner>=0){

                ctx.fillStyle=
                    colors[owner].land;

                ctx.fillRect(
                    x*CELL,
                    y*CELL,
                    CELL+.5,
                    CELL+.5
                );
            }
        }
    }

    /* 격자 */

    ctx.strokeStyle=
        "rgba(80,110,140,.07)";

    ctx.lineWidth=1;

    for(let x=startCol;x<=endCol;x++){

        ctx.beginPath();

        ctx.moveTo(
            x*CELL,
            startRow*CELL
        );

        ctx.lineTo(
            x*CELL,
            endRow*CELL
        );

        ctx.stroke();
    }

    for(let y=startRow;y<=endRow;y++){

        ctx.beginPath();

        ctx.moveTo(
            startCol*CELL,
            y*CELL
        );

        ctx.lineTo(
            endCol*CELL,
            y*CELL
        );

        ctx.stroke();
    }

    /* 궤적 */

    for(const p of players){

        if(!p.alive){
            continue;
        }

        ctx.fillStyle=
            colors[p.id].main;

        for(const t of p.trail){

            ctx.fillRect(
                t.x*CELL+
                CELL*.22,

                t.y*CELL+
                CELL*.22,

                CELL*.56,
                CELL*.56
            );
        }
    }

    /* 캐릭터 */

    for(const p of players){

        if(p.alive){
            drawPlayer(p);
        }
    }

    /* 파티클 */

    for(const p of particles){

        ctx.globalAlpha=
            Math.min(
                1,
                p.life/25
            );

        ctx.fillStyle=p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;

    ctx.strokeStyle="#829baa";
    ctx.lineWidth=5;

    ctx.strokeRect(
        2,
        2,
        WORLD_W-4,
        WORLD_H-4
    );

    ctx.restore();

    drawMiniMap();
}

function drawPlayer(p){

    const cx =
        p.x*CELL+
        CELL/2;

    const cy =
        p.y*CELL+
        CELL/2;

    const radius=
        CELL*.68;

    ctx.save();

    ctx.shadowColor=
        "rgba(0,0,0,.28)";

    ctx.shadowBlur=9;
    ctx.shadowOffsetY=3;

    ctx.fillStyle=
        colors[p.id].main;

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowColor="transparent";

    ctx.strokeStyle="white";

    ctx.lineWidth=
        p===human ? 3 : 2;

    ctx.stroke();

    const d=dirs[p.dir];

    const eyeShiftX=d.x*2.5;
    const eyeShiftY=d.y*2.5;

    const eyeY=
        cy-radius*.15;

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        cx-radius*.34,
        eyeY,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        cx+radius*.34,
        eyeY,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#263238";

    ctx.beginPath();

    ctx.arc(
        cx-radius*.34+eyeShiftX,
        eyeY+eyeShiftY,
        1.7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        cx+radius*.34+eyeShiftX,
        eyeY+eyeShiftY,
        1.7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.font="bold 12px Arial";
    ctx.textAlign="center";
    ctx.fillStyle="#263b4b";

    ctx.fillText(
        colors[p.id].name,
        cx,
        cy-radius-9
    );

    ctx.restore();
}

function drawMiniMap(){

    if(!gameRunning){
        return;
    }

    const size =
        Math.min(
            120,
            W*.25
        );

    const x=W-size-15;
    const y=112;

    ctx.save();

    ctx.fillStyle=
        "rgba(255,255,255,.90)";

    ctx.fillRect(
        x-4,
        y-4,
        size+8,
        size+8
    );

    const sx=size/COLS;
    const sy=size/ROWS;

    for(let yy=0;yy<ROWS;yy+=3){

        for(let xx=0;xx<COLS;xx+=3){

            const owner=
                getOwner(xx,yy);

            if(owner>=0){

                ctx.fillStyle=
                    colors[owner].land;

                ctx.fillRect(
                    x+xx*sx,
                    y+yy*sy,
                    sx*3+.3,
                    sy*3+.3
                );
            }
        }
    }

    for(const p of players){

        if(!p.alive){
            continue;
        }

        ctx.fillStyle=
            colors[p.id].main;

        ctx.beginPath();

        ctx.arc(
            x+p.x*sx,
            y+p.y*sy,
            p===human ? 4 : 3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.strokeStyle=
        "rgba(40,60,80,.5)";

    ctx.lineWidth=1;

    ctx.strokeRect(
        x+
        cameraX/WORLD_W*size,

        y+
        cameraY/WORLD_H*size,

        Math.min(
            size,
            W/WORLD_W*size
        ),

        Math.min(
            size,
            H/WORLD_H*size
        )
    );

    ctx.strokeStyle="#8499a8";

    ctx.strokeRect(
        x,
        y,
        size,
        size
    );

    ctx.restore();
}

function updateHUD(){

    if(!human || !territory){
        return;
    }

    const humanLand=
        countLand(0);

    const percentage=
        humanLand/
        (COLS*ROWS)*
        100;

    const score=
        humanLand*3+
        human.kills*500;

    scoreEl.textContent=
        score.toLocaleString();

    areaEl.textContent=
        percentage.toFixed(1)+"%";

    const ranking=
        players
        .filter(p=>p.alive)
        .map(p=>({
            id:p.id,
            land:countLand(p.id)
        }))
        .sort(
            (a,b)=>
            b.land-a.land
        );

    let rank=
        ranking.findIndex(
            p=>p.id===0
        )+1;

    if(rank<1){
        rank=ranking.length;
    }

    rankEl.textContent=
        rank+
        "/"+
        ranking.length;

    const seconds=
        Math.floor(
            (
                performance.now()
                -
                startTime
            )/1000
        );

    const min=
        Math.floor(
            seconds/60
        );

    const sec=
        String(
            seconds%60
        ).padStart(2,"0");

    timeEl.textContent=
        min+":"+sec;
}

function showToast(text){

    toast.textContent=text;

    toast.classList.remove("show");

    void toast.offsetWidth;

    toast.classList.add("show");
}

function endGame(){

    if(!gameRunning){
        return;
    }

    gameRunning=false;

    const land=
        countLand(0);

    const percentage=
        land/
        (COLS*ROWS)*
        100;

    const score=
        land*3+
        human.kills*500;

    hud.classList.add("hidden");
    controlGuide.classList.add("hidden");
    miniLabel.classList.add("hidden");

    document.getElementById(
        "result"
    ).innerHTML=

        "⭐ 점수 : "+
        score.toLocaleString()+
        "점<br>"+

        "🗺️ 차지한 영역 : "+
        percentage.toFixed(1)+
        "%<br>"+

        "⚔️ 제거한 AI : "+
        human.kills+
        "명";

    setTimeout(
        ()=>{
            gameOverScreen
                .classList.remove(
                    "hidden"
                );
        },
        400
    );
}

function loop(time){

    if(!gameRunning){

        draw();
        return;
    }

    if(
        time-lastMove
        >=MOVE_INTERVAL
    ){

        lastMove=time;

        if(
            human &&
            human.alive
        ){
            movePlayer(human);
        }

        /*
            AI 4마리 이동
        */

        for(
            let i=1;
            i<players.length;
            i++
        ){

            if(players[i].alive){
                movePlayer(
                    players[i]
                );
            }
        }

        updateHUD();
    }

    updateCamera();
    updateParticles();
    draw();

    animationId=
        requestAnimationFrame(
            loop
        );
}

document
.getElementById("startBtn")
.addEventListener(
    "click",
    startGame
);

document
.getElementById("restartBtn")
.addEventListener(
    "click",
    startGame
);

ctx.fillStyle="#eaf8ff";
ctx.fillRect(0,0,W,H);

})();
</script>
