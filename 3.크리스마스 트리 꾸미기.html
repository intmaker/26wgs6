<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>나만의 크리스마스트리 꾸미기</title>
  <style>
    /* --- 기본 설정 및 폰트 --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      background: radial-gradient(circle at center top, #1a2a6c, #13183f, #080a1a);
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: none; /* 모바일 터치 스크롤 방지 */
    }

    /* --- 눈 내리는 배경 캔버스 --- */
    #snowCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* --- 상단 타이틀 --- */
    header {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 12px 10px 5px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffeaa7;
      text-shadow: 0 0 10px rgba(255, 234, 167, 0.8), 2px 2px 4px rgba(0,0,0,0.5);
      letter-spacing: -0.5px;
    }

    /* --- 메인 레이아웃 (반응형) --- */
    #gameArea {
      position: relative;
      z-index: 5;
      flex: 1;
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 10px;
    }

    /* --- 트리 스테이지 영역 --- */
    #treeStage {
      position: relative;
      width: 440px;
      height: 580px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    /* SVG 트리 스타일 */
    #treeSvg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 15px 20px rgba(0,0,0,0.6));
    }

    /* 전구 반짝임 애니메이션 */
    .light-bulb {
      transition: opacity 0.3s;
      opacity: 0;
    }
    .lights-on .light-bulb {
      animation: twinkle 1s infinite alternate ease-in-out;
    }
    .lights-on .light-bulb:nth-child(2n) { animation-delay: 0.2s; }
    .lights-on .light-bulb:nth-child(3n) { animation-delay: 0.5s; }
    .lights-on .light-bulb:nth-child(5n) { animation-delay: 0.7s; }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 8px currentColor); }
    }

    /* 드롭된 장식들이 들어가는 컨테이너 */
    #placedItemsContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    /* 트리 위에 올려진 장식 아이템 */
    .placed-item {
      position: absolute;
      width: 48px;
      height: 48px;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease;
      z-index: 20;
    }
    .placed-item:active {
      cursor: grabbing;
      transform: translate(-50%, -50%) scale(1.15);
    }
    .placed-item svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    /* --- 우측 장식 상자 패널 --- */
    #itemPanel {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 15px;
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      color: #ffeaa7;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
    }

    #itemGrid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      justify-items: center;
      max-height: 400px;
      overflow-y: auto;
      padding: 5px;
    }

    /* 장식 소스 슬롯 아이템 */
    .source-item {
      width: 55px;
      height: 55px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      transition: all 0.2s;
    }
    .source-item:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.08);
    }
    .source-item:active {
      cursor: grabbing;
      transform: scale(0.95);
    }
    .source-item svg {
      width: 40px;
      height: 40px;
      pointer-events: none;
    }

    .help-text {
      font-size: 0.75rem;
      text-align: center;
      color: #dfe6e9;
      line-height: 1.3;
    }

    /* --- 하단 컨트롤 버튼 바 --- */
    #controls {
      position: relative;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 10px 15px 15px;
      width: 100%;
      max-width: 800px;
    }

    button {
      background: linear-gradient(135deg, #ff7675, #d63031);
      color: white;
      border: 2px solid #fff;
      border-radius: 25px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.4);
    }
    button:active {
      transform: translateY(1px);
    }
    button.btn-green {
      background: linear-gradient(135deg, #55efc4, #00b894);
      color: #1e3799;
    }
    button.btn-yellow {
      background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
      color: #d35400;
    }
    button.btn-blue {
      background: linear-gradient(135deg, #74b9ff, #0984e3);
    }

    /* --- 축하 완성 메시지 배너 --- */
    #congratsBanner {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
      color: #d63031;
      padding: 15px 30px;
      border-radius: 50px;
      border: 4px solid #fff;
      font-size: 1.5rem;
      font-weight: 900;
      box-shadow: 0 0 30px rgba(255, 234, 167, 0.8), 0 10px 20px rgba(0,0,0,0.4);
      z-index: 100;
      pointer-events: none;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    #congratsBanner.show {
      transform: translate(-50%, -50%) scale(1);
    }

    /* --- 반짝임 이펙트 (Sparkle) --- */
    .sparkle {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffeaa7, 0 0 20px #ffeaa7;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: sparkle-anim 0.6s ease-out forwards;
      z-index: 50;
    }
    @keyframes sparkle-anim {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.5); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    }

    /* --- 모바일 & 작은 화면 반응형 최적화 --- */
    @media (max-width: 768px) {
      h1 { font-size: 1.3rem; }
      #gameArea {
        flex-direction: column;
        gap: 5px;
        padding: 5px;
      }
      #treeStage {
        width: 300px;
        height: 380px;
      }
      #itemPanel {
        width: 95%;
        max-width: 400px;
        padding: 8px 12px;
        flex-direction: column;
      }
      #itemGrid {
        display: flex;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        width: 100%;
        max-height: none;
        gap: 8px;
        padding-bottom: 5px;
      }
      .source-item {
        flex: 0 0 45px;
        height: 45px;
      }
      .source-item svg { width: 30px; height: 30px; }
      .placed-item { width: 36px; height: 36px; }
      button { padding: 8px 12px; font-size: 0.8rem; }
      .help-text { display: none; }
    }
  </style>
</head>
<body>

  <script>
    /* =========================================================================
       1. 사운드 효과음 엔진 (Web Audio API)
       ========================================================================= */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 통통 튀는 방울/실로폰 효과음 재생
    function playPopSound(freq = 523.25, type = 'sine') {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + 0.1);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch(e) {}
    }

    // 마법 팡파레 효과음 (트리 완성 시)
    function playFanfare() {
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((note, idx) => {
        setTimeout(() => playPopSound(note, 'triangle'), idx * 120);
      });
    }


    /* =========================================================================
       2. 눈 내리는 애니메이션 (Canvas)
       ========================================================================= */
    const canvas = document.getElementById('snowCanvas');
    const ctx = canvas.getContext('2d');
    let snowflakes = [];
    let isSnowing = true;
    let snowDensity = 70;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Snowflake {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.size = Math.random() * 3 + 1.5;
        this.speed = Math.random() * 1.5 + 0.8;
        this.velX = (Math.random() - 0.5) * 0.5;
        this.opacity = Math.random() * 0.6 + 0.4;
      }
      update() {
        this.y += this.speed;
        this.x += this.velX;
        if (this.y > canvas.height) {
          this.reset();
          this.y = 0;
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.fill();
      }
    }

    function initSnow() {
      snowflakes = [];
      for (let i = 0; i < snowDensity; i++) {
        const flake = new Snowflake();
        flake.y = Math.random() * canvas.height; // 처음 로드 시 화면 골고루 분산
        snowflakes.push(flake);
      }
    }
    initSnow();

    function renderSnow() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (isSnowing) {
        snowflakes.forEach(flake => {
          flake.update();
          flake.draw();
        });
      }
      requestAnimationFrame(renderSnow);
    }
    renderSnow();


    /* =========================================================================
       3. 장식 아이템 드래그 & 드롭 시스템 (Mouse & Touch 통합)
       ========================================================================= */
    const stage = document.getElementById('treeStage');
    const placedContainer = document.getElementById('placedItemsContainer');
    const sourceItems = document.querySelectorAll('.source-item');
    const congratsBanner = document.getElementById('congratsBanner');
    
    let activeDrag = null;
    let isCompleted = false;

    // SVG 템플릿 딕셔너리
    const itemSvgTemplates = {};
    sourceItems.forEach(item => {
      itemSvgTemplates[item.dataset.type] = item.querySelector('svg').outerHTML;
    });

    // 소스 패널 아이템에 대한 이벤트 등록
    sourceItems.forEach(item => {
      item.addEventListener('mousedown', (e) => startDrag(e, item.dataset.type, true));
      item.addEventListener('touchstart', (e) => startDrag(e, item.dataset.type, true), { passive: false });
    });

    function startDrag(e, type, isNew, existingElem = null) {
      e.preventDefault();
      initAudio();

      const point = getEventPoint(e);
      let elem;

      if (isNew) {
        elem = createPlacedElement(type);
        placedContainer.appendChild(elem);
      } else {
        elem = existingElem;
      }

      const rect = stage.getBoundingClientRect();
      const posX = point.x - rect.left;
      const posY = point.y - rect.top;

      elem.style.left = `${posX}px`;
      elem.style.top = `${posY}px`;

      activeDrag = {
        elem: elem,
        type: type,
        isNew: isNew
      };

      window.addEventListener('mousemove', onDragMove);
      window.addEventListener('touchmove', onDragMove, { passive: false });
      window.addEventListener('mouseup', onDragEnd);
      window.addEventListener('touchend', onDragEnd);
    }

    function onDragMove(e) {
      if (!activeDrag) return;
      e.preventDefault();

      const point = getEventPoint(e);
      const rect = stage.getBoundingClientRect();
      
      const posX = point.x - rect.left;
      const posY = point.y - rect.top;

      activeDrag.elem.style.left = `${posX}px`;
      activeDrag.elem.style.top = `${posY}px`;
    }

    function onDragEnd(e) {
      if (!activeDrag) return;

      const rect = stage.getBoundingClientRect();
      const currentX = parseFloat(activeDrag.elem.style.left);
      const currentY = parseFloat(activeDrag.elem.style.top);

      // 트리 영역 밖으로 나간 경우 삭제
      if (currentX < -20 || currentX > rect.width + 20 || currentY < -20 || currentY > rect.height + 20) {
        activeDrag.elem.remove();
        playPopSound(250, 'sawtooth');
      } else {
        // 성공적으로 트리에 장식됨
        createSparkle(currentX, currentY);
        playPopSound(500 + Math.random() * 300);
        checkCompletion();
      }

      activeDrag = null;
      window.removeEventListener('mousemove', onDragMove);
      window.removeEventListener('touchmove', onDragMove);
      window.removeEventListener('mouseup', onDragEnd);
      window.removeEventListener('touchend', onDragEnd);
    }

    // 장식 엘리먼트 생성
    function createPlacedElement(type) {
      const div = document.createElement('div');
      div.className = 'placed-item';
      div.dataset.type = type;
      div.innerHTML = itemSvgTemplates[type];

      // 더블클릭/더블탭 시 삭제
      let lastTap = 0;
      div.addEventListener('click', (e) => {
        const now = Date.now();
        if (now - lastTap < 300) {
          div.remove();
          playPopSound(300, 'sawtooth');
          checkCompletion();
        }
        lastTap = now;
      });

      // 재드래그 설정
      div.addEventListener('mousedown', (e) => {
        if (e.detail > 1) return; // 더블클릭 제외
        startDrag(e, type, false, div);
      });
      div.addEventListener('touchstart', (e) => {
        startDrag(e, type, false, div);
      }, { passive: false });

      return div;
    }

    function getEventPoint(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    // 반짝임 파티클 생성
    function createSparkle(x, y) {
      for (let i = 0; i < 5; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = `${x + (Math.random() - 0.5) * 30}px`;
        sparkle.style.top = `${y + (Math.random() - 0.5) * 30}px`;
        placedContainer.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 600);
      }
    }


    /* =========================================================================
       4. 게임 추가 기능 및 버튼 상호작용
       ========================================================================= */
    const lightsGroup = document.getElementById('lightsGroup');
    const btnLight = document.getElementById('btnLight');
    const btnSnow = document.getElementById('btnSnow');
    const btnTopStar = document.getElementById('btnTopStar');
    const btnRandom = document.getElementById('btnRandom');
    const btnClear = document.getElementById('btnClear');

    // 1) 전구 켜기 / 끄기
    btnLight.addEventListener('click', () => {
      initAudio();
      lightsGroup.classList.toggle('lights-on');
      playPopSound(lightsGroup.classList.contains('lights-on') ? 880 : 440);
    });

    // 2) 눈 내리기 토글
    btnSnow.addEventListener('click', () => {
      initAudio();
      isSnowing = !isSnowing;
      btnSnow.style.opacity = isSnowing ? '1' : '0.6';
      playPopSound(isSnowing ? 659 : 330);
    });

    // 3) 꼭대기 별 달기
    btnTopStar.addEventListener('click', () => {
      initAudio();
      // 기존 별 중 꼭대기 위치 제거 후 새로 달기
      const topStar = createPlacedElement('star');
      const rect = stage.getBoundingClientRect();
      const topX = rect.width / 2;
      const topY = 75; // 트리의 최상단 위치

      topStar.style.left = `${topX}px`;
      topStar.style.top = `${topY}px`;
      topStar.style.transform = 'translate(-50%, -50%) scale(1.3)';

      placedContainer.appendChild(topStar);
      createSparkle(topX, topY);
      playPopSound(987.77);
      checkCompletion();
    });

    // 4) 모두 지우기
    btnClear.addEventListener('click', () => {
      initAudio();
      placedContainer.innerHTML = '';
      isCompleted = false;
      congratsBanner.classList.remove('show');
      playPopSound(220, 'triangle');
    });

    // 5) 랜덤 꾸미기
    btnRandom.addEventListener('click', () => {
      initAudio();
      placedContainer.innerHTML = '';
      const types = Object.keys(itemSvgTemplates);
      const rect = stage.getBoundingClientRect();

      // 트리 꼭대기 별 추가
      const topStar = createPlacedElement('star');
      topStar.style.left = `${rect.width / 2}px`;
      topStar.style.top = `75px`;
      placedContainer.appendChild(topStar);

      // 트리 삼각 영역 내부로 랜덤 12개 배치
      for (let i = 0; i < 12; i++) {
        const randType = types[Math.floor(Math.random() * types.length)];
        const elem = createPlacedElement(randType);
        
        // 트리 모양 내부 좌표 추정
        const progress = Math.random() * 0.7 + 0.2; // 0.2 ~ 0.9 높이 비율
        const posY = progress * (rect.height - 150) + 70;
        const maxSpread = progress * (rect.width * 0.35);
        const posX = rect.width / 2 + (Math.random() - 0.5) * 2 * maxSpread;

        elem.style.left = `${posX}px`;
        elem.style.top = `${posY}px`;
        placedContainer.appendChild(elem);
      }

      playFanfare();
      checkCompletion();
    });

    // --- 장식 개수 확인 및 완성 축하 이벤트 ---
    function checkCompletion() {
      const itemsCount = placedContainer.querySelectorAll('.placed-item').length;
      
      if (itemsCount >= 8 && !isCompleted) {
        isCompleted = true;
        congratsBanner.classList.add('show');
        playFanfare();

        // 트리 전구 켜기 & 눈 펑펑 내리기 효과
        lightsGroup.classList.add('lights-on');
        snowDensity = 160;
        initSnow();

        setTimeout(() => {
          congratsBanner.classList.remove('show');
        }, 3500);
      } else if (itemsCount < 8) {
        isCompleted = false;
      }
    }
  </script>
</body>
</html>
