<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>💎 보석 스왑</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 10%,#7c3aed,#1e1b4b 48%,#09051c);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(94vw,670px);height:min(94vh,820px);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#f0abfc;font-weight:900}h1{margin:2px 0;font-size:clamp(26px,5vw,38px)}.stats{display:flex;gap:7px}.stat{min-width:70px;padding:8px;text-align:center;border:1px solid #ffffff24;border-radius:14px;background:#281852cc}.stat small{display:block;color:#d8b4fe;font-size:9px}.stat b{font-size:20px}.game{position:relative;flex:1;min-height:400px;display:grid;place-items:center;padding:14px;border:1px solid #ffffff25;border-radius:25px;background:linear-gradient(145deg,#2e1760,#111634);box-shadow:0 25px 70px #0009}.board{width:min(100%,520px);aspect-ratio:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:7px;border-radius:16px;background:#070b24aa}.gem{border:1px solid #ffffff15;border-radius:14px;background:#ffffff09;font-size:clamp(23px,6vw,43px);cursor:pointer;transition:transform .14s,background .14s;overflow:hidden}.gem:hover{background:#ffffff17;transform:scale(1.05)}.gem.selected{outline:3px solid #fef08a;transform:scale(.9)}.gem.pop{animation:pop .25s}@keyframes pop{50%{transform:scale(1.4);filter:brightness(1.8)}}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;border-radius:inherit;background:#0c0622e8;z-index:5}.overlay.hide{display:none}.card{max-width:390px;padding:28px 24px;text-align:center;border:1px solid #ffffff24;border-radius:23px;background:#28144d}.ico{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{color:#ddd6fe;font-size:14px;line-height:1.7}.card button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#f0abfc,#67e8f9);color:#25113d;font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#c4b5fd;font-size:12px}@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.game{padding:8px;border-radius:20px}.board{gap:2px;padding:4px}.gem{border-radius:9px}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">GEM CASCADE</div><h1>💎 보석 스왑</h1></div><div class="stats"><div class="stat"><small>점수</small><b id="score">0</b></div><div class="stat"><small>시간</small><b id="time">60</b></div></div></header><section class="game"><div class="board" id="board"></div><div class="overlay" id="over"><div class="card"><div class="ico" id="ico">💎</div><h2 id="title">보석을 연결하세요</h2><p id="desc">서로 이웃한 보석 두 개를 차례로 누르세요.<br>가로 또는 세로로 같은 보석 3개 이상을 만들면<br>보석이 사라지고 새 보석이 내려옵니다.</p><button id="start">60초 도전</button></div></div></section><div class="tip">이웃한 보석 2개 선택 · 3개 이상 연결 · 연쇄 보너스</div></main><script>
(()=>{const N=7,gems=['💎','🔷','🔶','💚','💜','❤️'],board=document.querySelector('#board'),over=document.querySelector('#over'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time');let grid=[],selected=-1,score=0,time=60,playing=false,busy=false,timer;
const rnd=()=>Math.floor(Math.random()*gems.length),adj=(a,b)=>Math.abs(a-b)===N||(Math.floor(a/N)===Math.floor(b/N)&&Math.abs(a-b)===1);
function makeGrid(){grid=Array.from({length:N*N},rnd);let m=findMatches();while(m.size){m.forEach(i=>grid[i]=rnd());m=findMatches()}}
function findMatches(){const set=new Set;for(let y=0;y<N;y++){let run=1;for(let x=1;x<=N;x++){const same=x<N&&grid[y*N+x]===grid[y*N+x-1];if(same)run++;else{if(run>=3)for(let k=x-run;k<x;k++)set.add(y*N+k);run=1}}}for(let x=0;x<N;x++){let run=1;for(let y=1;y<=N;y++){const same=y<N&&grid[y*N+x]===grid[(y-1)*N+x];if(same)run++;else{if(run>=3)for(let k=y-run;k<y;k++)set.add(k*N+x);run=1}}}return set}
function render(pop=new Set){board.innerHTML='';grid.forEach((v,i)=>{const b=document.createElement('button');b.className='gem'+(selected===i?' selected':'')+(pop.has(i)?' pop':'');b.textContent=gems[v];b.onclick=()=>choose(i);board.appendChild(b)})}
async function choose(i){if(!playing||busy)return;if(selected<0){selected=i;return render()}if(selected===i){selected=-1;return render()}if(!adj(selected,i)){selected=i;return render()}let a=selected;selected=-1;[grid[a],grid[i]]=[grid[i],grid[a]];let matches=findMatches();if(!matches.size){[grid[a],grid[i]]=[grid[i],grid[a]];render();return}busy=true;let chain=1;while(matches.size&&playing){render(matches);await wait(240);score+=matches.size*10*chain;scoreEl.textContent=score;collapse(matches);render();await wait(180);matches=findMatches();chain++}busy=false}
function collapse(matches){for(let x=0;x<N;x++){const col=[];for(let y=N-1;y>=0;y--){const i=y*N+x;if(!matches.has(i))col.push(grid[i])}while(col.length<N)col.push(rnd());for(let y=N-1,k=0;y>=0;y--,k++)grid[y*N+x]=col[k]}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));function start(){clearInterval(timer);score=0;time=60;selected=-1;busy=false;scoreEl.textContent=0;timeEl.textContent=60;makeGrid();render();playing=true;over.classList.add('hide');timer=setInterval(()=>{timeEl.textContent=--time;if(time<=0)finish()},1000)}function finish(){if(!playing)return;playing=false;clearInterval(timer);document.querySelector('#ico').textContent='🏆';document.querySelector('#title').textContent=`${score}점 획득!`;document.querySelector('#desc').innerHTML='3개 연결과 연쇄 폭발을 잘 활용했어요.<br>더 큰 콤보에 다시 도전해 보세요.';document.querySelector('#start').textContent='다시 도전';over.classList.remove('hide')}document.querySelector('#start').onclick=start;
})();</script></body></html>
