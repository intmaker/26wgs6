<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🏒 에어 하키</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 10%,#0891b2,#172554 50%,#030712);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(94vw,700px);height:min(95vh,840px);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#67e8f9;font-weight:900}h1{margin:2px 0;font-size:clamp(26px,5vw,38px)}.score{display:flex;gap:8px}.stat{min-width:72px;padding:8px;text-align:center;border:1px solid #ffffff24;border-radius:14px;background:#11214bcc}.stat small{display:block;color:#a5f3fc;font-size:9px}.stat b{font-size:22px}.game{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff2b;border-radius:25px;background:#071d38;box-shadow:0 25px 70px #0009;touch-action:none;cursor:none}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#06152ce8;cursor:default}.overlay.hide{display:none}.card{max-width:390px;padding:28px 24px;text-align:center;border:1px solid #ffffff24;border-radius:23px;background:#102a50}.ico{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{color:#cffafe;font-size:14px;line-height:1.7}.card button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#67e8f9,#a5b4fc);color:#10254c;font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#a5f3fc;font-size:12px}@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.game{border-radius:20px}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">AIR HOCKEY</div><h1>🏒 에어 하키</h1></div><div class="score"><div class="stat"><small>AI</small><b id="aiScore">0</b></div><div class="stat"><small>YOU</small><b id="myScore">0</b></div></div></header><section class="game" id="game"><canvas id="canvas"></canvas><div class="overlay" id="over"><div class="card"><div class="ico" id="ico">🏒</div><h2 id="title">먼저 5골을 넣으세요!</h2><p id="desc">마우스나 손가락으로 아래쪽 파란 패들을 움직이세요.<br>빠르게 움직여 퍽을 쳐내고<br>위쪽 상대 골문에 넣으면 득점합니다.</p><button id="start">경기 시작</button></div></div></section><div class="tip">드래그로 파란 패들 이동 · 먼저 5골 득점</div></main><script>
(()=>{const C=document.querySelector('#canvas'),X=C.getContext('2d'),G=document.querySelector('#game'),O=document.querySelector('#over'),ME=document.querySelector('#myScore'),AE=document.querySelector('#aiScore');let W,H,D=1,on=false,last=0,my=0,aiScore=0,puck,me,bot,target={x:0,y:0},drag=false;
function resize(){const r=G.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);resetPositions();draw()}function resetPositions(dir=1){me={x:W/2,y:H*.82,r:30,vx:0,vy:0};bot={x:W/2,y:H*.18,r:30,vx:0,vy:0};target={x:W/2,y:H*.82};puck={x:W/2,y:H/2,r:15,vx:(Math.random()<.5?-1:1)*(140+Math.random()*90),vy:dir*220}}
function start(){my=aiScore=0;ME.textContent=AE.textContent=0;resetPositions(Math.random()<.5?1:-1);on=true;O.classList.add('hide');last=performance.now();requestAnimationFrame(loop)}function collide(p){const dx=puck.x-p.x,dy=puck.y-p.y,dist=Math.hypot(dx,dy),min=puck.r+p.r;if(dist<min&&dist>0){const nx=dx/dist,ny=dy/dist,rv=(puck.vx-(p.vx||0))*nx+(puck.vy-(p.vy||0))*ny;if(rv<0){puck.x=p.x+nx*min;puck.y=p.y+ny*min;puck.vx-=1.8*rv*nx;puck.vy-=1.8*rv*ny;puck.vx+=(p.vx||0)*.55;puck.vy+=(p.vy||0)*.55}}}
function update(dt){const oldX=me.x,oldY=me.y;me.x+=(target.x-me.x)*Math.min(1,dt*18);me.y+=(target.y-me.y)*Math.min(1,dt*18);me.x=Math.max(me.r,Math.min(W-me.r,me.x));me.y=Math.max(H/2+me.r,Math.min(H-me.r,me.y));me.vx=(me.x-oldX)/dt;me.vy=(me.y-oldY)/dt;const oldBX=bot.x,oldBY=bot.y;let bx=W/2+Math.sin(performance.now()*.0018)*W*.13,by=H*.18;if(puck.y<H*.58){const lead=Math.max(0,Math.min(.45,(puck.y-bot.y)/Math.max(90,Math.abs(puck.vy))));bx=puck.x+puck.vx*lead;by=puck.y-38}bx=Math.max(bot.r,Math.min(W-bot.r,bx));by=Math.max(bot.r,Math.min(H*.43,by));const dx=bx-bot.x,dy=by-bot.y,dist=Math.hypot(dx,dy),maxStep=(255+my*18)*dt;if(dist>0){const step=Math.min(dist,maxStep);bot.x+=dx/dist*step;bot.y+=dy/dist*step}bot.vx=(bot.x-oldBX)/dt;bot.vy=(bot.y-oldBY)/dt;puck.x+=puck.vx*dt;puck.y+=puck.vy*dt;puck.vx*=Math.pow(.994,dt*60);puck.vy*=Math.pow(.994,dt*60);const goalL=W*.34,goalR=W*.66;if(puck.x-puck.r<0){puck.x=puck.r;puck.vx=Math.abs(puck.vx)}if(puck.x+puck.r>W){puck.x=W-puck.r;puck.vx=-Math.abs(puck.vx)}if(puck.y-puck.r<0){if(puck.x>goalL&&puck.x<goalR)return goal(true);puck.y=puck.r;puck.vy=Math.abs(puck.vy)}if(puck.y+puck.r>H){if(puck.x>goalL&&puck.x<goalR)return goal(false);puck.y=H-puck.r;puck.vy=-Math.abs(puck.vy)}collide(me);collide(bot);const sp=Math.hypot(puck.vx,puck.vy);if(sp>750){puck.vx*=750/sp;puck.vy*=750/sp}}
function goal(mine){if(mine){ME.textContent=++my}else{AE.textContent=++aiScore}if(my>=5||aiScore>=5)return finish(my>=5);resetPositions(mine?1:-1)}function draw(){X.clearRect(0,0,W,H);let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#132956');g.addColorStop(.5,'#0d3f57');g.addColorStop(1,'#132956');X.fillStyle=g;X.fillRect(0,0,W,H);X.strokeStyle='#67e8f9';X.lineWidth=4;X.strokeRect(5,5,W-10,H-10);X.beginPath();X.moveTo(0,H/2);X.lineTo(W,H/2);X.stroke();X.beginPath();X.arc(W/2,H/2,70,0,7);X.stroke();X.strokeStyle='#fff';X.lineWidth=8;X.beginPath();X.moveTo(W*.34,5);X.lineTo(W*.66,5);X.moveTo(W*.34,H-5);X.lineTo(W*.66,H-5);X.stroke();for(const [p,c] of [[bot,'#fb7185'],[me,'#38bdf8']]){X.shadowColor=c;X.shadowBlur=18;X.fillStyle=c;X.beginPath();X.arc(p.x,p.y,p.r,0,7);X.fill();X.fillStyle='#ffffff70';X.beginPath();X.arc(p.x-7,p.y-7,p.r*.35,0,7);X.fill()}X.shadowColor='#fff';X.shadowBlur=12;X.fillStyle='#111827';X.beginPath();X.arc(puck.x,puck.y,puck.r,0,7);X.fill();X.shadowBlur=0}
function finish(win){on=false;document.querySelector('#ico').textContent=win?'🏆':'🥅';document.querySelector('#title').textContent=win?'에어 하키 승리!':'아쉽게 패배했어요';document.querySelector('#desc').innerHTML=`최종 스코어 ${my} : ${aiScore}<br>패들을 빠르게 움직일수록 퍽에 강한 힘이 전달됩니다.`;document.querySelector('#start').textContent='다시 경기';setTimeout(()=>O.classList.remove('hide'),450)}function loop(t){if(!on)return;const dt=Math.min(.025,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}function point(e){const r=C.getBoundingClientRect();target.x=e.clientX-r.left;target.y=Math.max(H/2+35,e.clientY-r.top)}C.onpointerdown=e=>{drag=true;C.setPointerCapture(e.pointerId);point(e)};C.onpointermove=e=>{if(drag)point(e)};C.onpointerup=C.onpointercancel=()=>drag=false;document.querySelector('#start').onclick=start;addEventListener('resize',resize);resize();if(new URLSearchParams(location.search).has('autostart'))start()})();</script></body></html>
