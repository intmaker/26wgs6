<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"><title>🛰️ 우주 광산 경영</title><style>
:root{--c1:#3730a3;--c2:#a5b4fc}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 18% 10%,var(--c1),#11162e 52%,#030712);user-select:none;-webkit-user-select:none}.app{width:min(95vw,720px);height:min(95vh,860px);display:flex;flex-direction:column;gap:11px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 4px}.brand small{display:block;color:#cbd5e1;font-size:10px;font-weight:900;letter-spacing:.2em}.brand h1{margin:2px 0 0;font-size:clamp(25px,5vw,38px);letter-spacing:-.05em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:67px;padding:7px 10px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#0f172ac7}.stat small{display:block;color:#cbd5e1;font-size:9px}.stat b{font-size:19px}.stage{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff27;border-radius:25px;background:linear-gradient(145deg,#14203b,#090e21);box-shadow:0 25px 70px #0009;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#050916e9}.overlay.hide{display:none}.card{width:min(100%,410px);padding:28px 24px;text-align:center;border:1px solid #ffffff25;border-radius:23px;background:#111a36ee;box-shadow:0 20px 55px #0008}.card .emoji{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{margin:0 0 19px;color:#cbd5e1;font-size:14px;line-height:1.72;word-break:keep-all}.primary{min-height:48px;width:100%;padding:12px 18px;border:0;border-radius:13px;color:#08111f;background:linear-gradient(135deg,var(--c2),#fef3c7);font:900 15px system-ui;cursor:pointer}.tip{min-height:18px;text-align:center;color:#aebbd0;font-size:12px}.hidden{display:none!important}button{font-family:inherit}.mine-game{height:100%;display:flex;flex-direction:column;align-items:center;gap:11px;padding:14px;background:radial-gradient(circle at 50% 25%,#312e81,#090b24 64%)}.planet{position:relative;width:145px;height:145px;display:grid;place-items:center;border-radius:50%;font-size:95px;background:#ffffff08;box-shadow:0 0 35px #818cf855}.orbit-drone{position:absolute;left:50%;top:50%;font-size:28px;animation:orbit 6s linear infinite}@keyframes orbit{from{transform:rotate(0) translateX(92px) rotate(0)}to{transform:rotate(360deg) translateX(92px) rotate(-360deg)}}.resources{width:min(100%,560px);display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.resources div{text-align:center;padding:10px;border-radius:12px;background:#ffffff0d;color:#c7d2fe}.departments{width:min(100%,560px);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dept{padding:10px 6px;border:1px solid #ffffff20;border-radius:14px;background:#11183b;text-align:center}.dept span,.dept b{display:block}.dept span{font-size:31px}.dept small{display:block;min-height:35px;color:#a5b4fc;font-size:10px}.alloc{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:7px}.alloc button{width:38px;height:38px;border:0;border-radius:9px;background:#4f46e5;color:#fff;font-size:19px}.event{min-height:43px;padding:10px 14px;text-align:center;border-radius:12px;background:#fbbf2417;color:#fde68a;font-weight:800}@media(max-width:430px){.planet{width:110px;height:110px;font-size:70px}.departments{gap:4px}.dept{padding:7px 3px}.dept span{font-size:25px}}
@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.stage{min-height:0;border-radius:20px}.brand h1{font-size:25px}.stat{min-width:61px;padding:6px 8px}.card{padding:24px 19px}.tip{font-size:11px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><small>ASTRO MINING</small><h1>🛰️ 우주 광산 경영</h1></div><div class="hud" id="hud"></div></header><section class="stage" id="stage"><div class="mine-game"><div class="planet">🪨<div class="orbit-drone" id="droneVisual">🛰️</div></div><div class="resources"><div>⚡ 에너지 <b id="energy">80</b></div><div>⛏️ 원석 <b id="ore">0</b></div><div>💰 크레딧 <b id="credits">0</b></div></div><div class="departments" id="departments"></div><div class="event" id="mineEvent">목표: 90초 안에 800 크레딧</div></div><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="resultEmoji">🛰️</div><h2 id="resultTitle">우주 광산 경영</h2><p id="resultText">드론을 발전·채굴·정제 부서에 재배치해 제한시간 안에 생산 목표를 달성하세요.</p><button class="primary" id="startBtn">게임 시작</button></div></div></section><div class="tip">드론을 발전·채굴·정제 부서에 재배치해 제한시간 안에 생산 목표를 달성하세요.</div></main><script>
const $=s=>document.querySelector(s),stage=$('#stage'),overlay=$('#overlay'),startBtn=$('#startBtn');
const safeGet=(k,d=0)=>{try{return Number(localStorage.getItem(k))||d}catch(e){return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function showResult(icon,title,text,button='다시 하기'){ $('#resultEmoji').textContent=icon;$('#resultTitle').textContent=title;$('#resultText').innerHTML=text;startBtn.textContent=button;overlay.classList.remove('hide') }
const hud=$('#hud'),deps=$('#departments'),eventEl=$('#mineEvent');let running=false,time=90,energy=80,ore=0,credits=0,drones=[2,2,2],free=2,timer,tickCount=0;const defs=[['발전','⚡','에너지 생산'],['채굴','⛏️','에너지로 원석 채굴'],['정제','🏭','원석을 크레딧으로 변환']];hud.innerHTML='<div class="stat"><small>남은 시간</small><b id="time">90</b></div><div class="stat"><small>미배치 드론</small><b id="free">2</b></div>';function renderDeps(){deps.innerHTML='';defs.forEach((d,i)=>{const e=document.createElement('div');e.className='dept';e.innerHTML=`<span>${d[1]}</span><b>${d[0]}</b><small>${d[2]}</small><div class="alloc"><button data-i="${i}" data-d="-1">−</button><strong>${drones[i]}</strong><button data-i="${i}" data-d="1">＋</button></div>`;deps.appendChild(e)});deps.querySelectorAll('button').forEach(b=>b.onclick=()=>allocate(+b.dataset.i,+b.dataset.d));$('#free').textContent=free}
function startGame(){clearInterval(timer);time=90;energy=80;ore=0;credits=0;drones=[2,2,2];free=2;tickCount=0;running=true;overlay.classList.add('hide');eventEl.textContent='목표: 90초 안에 800 크레딧';updateUI();renderDeps();timer=setInterval(tick,1000)}function allocate(i,d){if(!running)return;if(d>0&&free>0){drones[i]++;free--}if(d<0&&drones[i]>0){drones[i]--;free++}renderDeps()}
function tick(){if(!running)return;tickCount++;energy+=drones[0]*7;const mined=Math.min(drones[1]*3,Math.floor(energy/2));energy-=mined*2;ore+=mined;const refined=Math.min(ore,drones[2]*3);ore-=refined;credits+=refined*5;if(tickCount%12===0){const events=[['태양 폭풍! 에너지 +35',()=>energy+=35],['광맥 발견! 원석 +25',()=>ore+=25],['장비 고장! 에너지 -25',()=>energy=Math.max(0,energy-25)],['상인 방문! 크레딧 +60',()=>credits+=60]],e=events[Math.floor(Math.random()*events.length)];e[1]();eventEl.textContent=e[0]}time--;updateUI();if(credits>=800)return end(true);if(time<=0)return end(false)}function updateUI(){$('#time').textContent=time;$('#energy').textContent=Math.floor(energy);$('#ore').textContent=Math.floor(ore);$('#credits').textContent=Math.floor(credits)}function end(win){running=false;clearInterval(timer);showResult(win?'🏆':'🪨',win?'광산 계약 달성!':'계약 시간 종료',win?`${90-time}초 만에 ${Math.floor(credits)} 크레딧을 생산했습니다.`:`${Math.floor(credits)} 크레딧을 생산했습니다.<br>발전→채굴→정제 순서의 병목을 찾아 드론을 재배치하세요.`)}startBtn.onclick=startGame;renderDeps();updateUI();
</script></body></html>
