<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"><title>🌦️ 기상 관제소</title><style>
:root{--c1:#0284c7;--c2:#67e8f9}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 18% 10%,var(--c1),#11162e 52%,#030712);user-select:none;-webkit-user-select:none}.app{width:min(95vw,720px);height:min(95vh,860px);display:flex;flex-direction:column;gap:11px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 4px}.brand small{display:block;color:#cbd5e1;font-size:10px;font-weight:900;letter-spacing:.2em}.brand h1{margin:2px 0 0;font-size:clamp(25px,5vw,38px);letter-spacing:-.05em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:67px;padding:7px 10px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#0f172ac7}.stat small{display:block;color:#cbd5e1;font-size:9px}.stat b{font-size:19px}.stage{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff27;border-radius:25px;background:linear-gradient(145deg,#14203b,#090e21);box-shadow:0 25px 70px #0009;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#050916e9}.overlay.hide{display:none}.card{width:min(100%,410px);padding:28px 24px;text-align:center;border:1px solid #ffffff25;border-radius:23px;background:#111a36ee;box-shadow:0 20px 55px #0008}.card .emoji{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{margin:0 0 19px;color:#cbd5e1;font-size:14px;line-height:1.72;word-break:keep-all}.primary{min-height:48px;width:100%;padding:12px 18px;border:0;border-radius:13px;color:#08111f;background:linear-gradient(135deg,var(--c2),#fef3c7);font:900 15px system-ui;cursor:pointer}.tip{min-height:18px;text-align:center;color:#aebbd0;font-size:12px}.hidden{display:none!important}button{font-family:inherit}.weather{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:14px;background:linear-gradient(#60a5fa,#bae6fd 48%,#64748b 49%,#334155)}.city{font-size:90px;filter:drop-shadow(0 10px 10px #0006)}.forecast{width:min(100%,540px);padding:10px;text-align:center;border-radius:13px;background:#0f172acc;color:#e0f2fe;font-weight:900}.gauges{width:min(100%,540px);display:grid;gap:8px}.gauges label{padding:9px 12px;border-radius:12px;background:#0f172ac7;color:#e0f2fe;font-weight:800}.gauges label b{float:right}.gauges input{width:100%;height:32px;accent-color:#22d3ee;touch-action:pan-x}.stabilize{min-height:47px;padding:10px 20px;border:0;border-radius:12px;background:#fef08a;color:#1e3a5f;font-weight:900}#weatherMsg{min-height:23px;text-align:center;color:#fff;font-weight:800;text-shadow:0 2px 4px #000}
@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.stage{min-height:0;border-radius:20px}.brand h1{font-size:25px}.stat{min-width:61px;padding:6px 8px}.card{padding:24px 19px}.tip{font-size:11px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><small>WEATHER CONTROL</small><h1>🌦️ 기상 관제소</h1></div><div class="hud" id="hud"></div></header><section class="stage" id="stage"><div class="weather"><div class="city" id="city">🏙️</div><div class="forecast" id="forecast"></div><div class="gauges"><label>🌡️ 온도 <b id="tempVal"></b><input id="temp" type="range" min="0" max="40"></label><label>💧 습도 <b id="humidVal"></b><input id="humid" type="range" min="10" max="90"></label><label>🌬️ 바람 <b id="windVal"></b><input id="wind" type="range" min="0" max="30"></label></div><button class="stabilize" id="stabilize">기상 안정화 실행</button><div id="weatherMsg">세 수치를 목표 범위에 맞추세요.</div></div><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="resultEmoji">🌦️</div><h2 id="resultTitle">기상 관제소</h2><p id="resultText">온도·습도·바람을 도시의 임무 범위에 맞춰 제한시간 동안 기상을 안정화하세요.</p><button class="primary" id="startBtn">게임 시작</button></div></div></section><div class="tip">온도·습도·바람을 도시의 임무 범위에 맞춰 제한시간 동안 기상을 안정화하세요.</div></main><script>
const $=s=>document.querySelector(s),stage=$('#stage'),overlay=$('#overlay'),startBtn=$('#startBtn');
const safeGet=(k,d=0)=>{try{return Number(localStorage.getItem(k))||d}catch(e){return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function showResult(icon,title,text,button='다시 하기'){ $('#resultEmoji').textContent=icon;$('#resultTitle').textContent=title;$('#resultText').innerHTML=text;startBtn.textContent=button;overlay.classList.remove('hide') }
const temp=$('#temp'),humid=$('#humid'),wind=$('#wind'),forecast=$('#forecast'),msg=$('#weatherMsg'),hud=$('#hud');let mission=0,score=0,time=75,running=false,timer,target;hud.innerHTML='<div class="stat"><small>안정화</small><b id="score">0</b></div><div class="stat"><small>남은 시간</small><b id="time">75</b></div>';const missions=[{n:'야외 체육대회',t:[18,24],h:[35,60],w:[2,12],e:'☀️'},{n:'도시 미세먼지 제거',t:[12,28],h:[30,70],w:[16,25],e:'🌬️'},{n:'농작물 보호',t:[20,27],h:[55,78],w:[0,9],e:'🌱'},{n:'눈 축제 유지',t:[0,5],h:[35,65],w:[3,14],e:'❄️'},{n:'산불 위험 억제',t:[8,23],h:[65,90],w:[0,8],e:'🌧️'}];
function startGame(){clearInterval(timer);mission=0;score=0;time=75;running=true;temp.value=20;humid.value=50;wind.value=10;overlay.classList.add('hide');nextMission();update();timer=setInterval(()=>{time--;$('#time').textContent=time;if(time<=0)end()},1000)}function nextMission(){target=missions[Math.floor(Math.random()*missions.length)];forecast.innerHTML=`${target.e} <b>${target.n}</b><br>온도 ${target.t[0]}~${target.t[1]}℃ · 습도 ${target.h[0]}~${target.h[1]}% · 바람 ${target.w[0]}~${target.w[1]}km/h`;msg.textContent='슬라이더를 조절해 모든 수치를 범위 안에 맞추세요.'}
function update(){const t=+temp.value,h=+humid.value,w=+wind.value;$('#tempVal').textContent=t+'℃';$('#humidVal').textContent=h+'%';$('#windVal').textContent=w+'km/h';$('#city').textContent=t<7?'🏙️❄️':h>70?'🏙️🌧️':w>20?'🏙️🌬️':'🏙️☀️'}
function stabilize(){if(!running)return;const t=+temp.value,h=+humid.value,w=+wind.value,ok=t>=target.t[0]&&t<=target.t[1]&&h>=target.h[0]&&h<=target.h[1]&&w>=target.w[0]&&w<=target.w[1];if(ok){score++;$('#score').textContent=score;msg.textContent='기상 안정화 성공! 다음 도시 요청입니다.';setTimeout(nextMission,350)}else{time=Math.max(0,time-5);msg.textContent='목표 범위를 벗어났습니다. 패널티 -5초';$('#time').textContent=time}}
function end(){running=false;clearInterval(timer);showResult(score>=8?'🏆':'🌦️','관제 임무 종료',`${score}개의 기상 임무를 안정화했습니다.<br>세 범위의 교집합을 빠르게 확인해 보세요.`)}[temp,humid,wind].forEach(x=>x.oninput=update);$('#stabilize').onclick=stabilize;startBtn.onclick=startGame;update();
</script></body></html>
