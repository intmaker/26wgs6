<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"><title>📦 창고 밀기</title><style>
:root{--c1:#78350f;--c2:#fbbf24}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 18% 10%,var(--c1),#11162e 52%,#030712);user-select:none;-webkit-user-select:none}.app{width:min(95vw,720px);height:min(95vh,860px);display:flex;flex-direction:column;gap:11px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 4px}.brand small{display:block;color:#cbd5e1;font-size:10px;font-weight:900;letter-spacing:.2em}.brand h1{margin:2px 0 0;font-size:clamp(25px,5vw,38px);letter-spacing:-.05em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:67px;padding:7px 10px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#0f172ac7}.stat small{display:block;color:#cbd5e1;font-size:9px}.stat b{font-size:19px}.stage{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff27;border-radius:25px;background:linear-gradient(145deg,#14203b,#090e21);box-shadow:0 25px 70px #0009;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#050916e9}.overlay.hide{display:none}.card{width:min(100%,410px);padding:28px 24px;text-align:center;border:1px solid #ffffff25;border-radius:23px;background:#111a36ee;box-shadow:0 20px 55px #0008}.card .emoji{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{margin:0 0 19px;color:#cbd5e1;font-size:14px;line-height:1.72;word-break:keep-all}.primary{min-height:48px;width:100%;padding:12px 18px;border:0;border-radius:13px;color:#08111f;background:linear-gradient(135deg,var(--c2),#fef3c7);font:900 15px system-ui;cursor:pointer}.tip{min-height:18px;text-align:center;color:#aebbd0;font-size:12px}.hidden{display:none!important}button{font-family:inherit}.sokoban{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;background:linear-gradient(145deg,#422006,#1c1917)}.soko-grid{width:min(96%,520px);aspect-ratio:1;display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:6px;border-radius:15px;background:#0f172a}.soko-cell{display:grid;place-items:center;border-radius:7px;background:#78350f55;font-size:clamp(20px,6vw,39px)}.soko-cell.wall{background:#334155}.soko-cell.target{box-shadow:inset 0 0 0 4px #4ade80;background:#14532d88}.soko-pad{display:grid;grid-template-columns:repeat(4,52px);gap:5px}.soko-pad button{min-height:46px;border:1px solid #ffffff25;border-radius:10px;color:#fff;background:#92400e;font-weight:900;font-size:18px}.soko-pad button:first-child{grid-column:2}.soko-pad button:nth-child(2){grid-column:1}.soko-pad button:nth-child(3){grid-column:2}.soko-pad button:nth-child(4){grid-column:3}.soko-pad button:nth-child(5){grid-column:4;grid-row:1}.soko-pad button:nth-child(6){grid-column:4;grid-row:2;font-size:12px}#sokoMsg{min-height:21px;color:#fde68a;font-weight:800}
@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.stage{min-height:0;border-radius:20px}.brand h1{font-size:25px}.stat{min-width:61px;padding:6px 8px}.card{padding:24px 19px}.tip{font-size:11px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><small>SOKOBAN DEPOT</small><h1>📦 창고 밀기</h1></div><div class="hud" id="hud"></div></header><section class="stage" id="stage"><div class="sokoban"><div class="soko-grid" id="sokoGrid"></div><div class="soko-pad"><button data-d="U">▲</button><button data-d="L">◀</button><button data-d="D">▼</button><button data-d="R">▶</button><button id="undoMove">↶</button><button id="resetLevel">재시작</button></div><div id="sokoMsg">상자를 목표 칸까지 밀어 넣으세요.</div></div><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="resultEmoji">📦</div><h2 id="resultTitle">창고 밀기</h2><p id="resultText">상자를 당기지 않고 밀기만 하여 모든 화물을 초록 목표 칸에 배치하세요.</p><button class="primary" id="startBtn">게임 시작</button></div></div></section><div class="tip">상자를 당기지 않고 밀기만 하여 모든 화물을 초록 목표 칸에 배치하세요.</div></main><script>
const $=s=>document.querySelector(s),stage=$('#stage'),overlay=$('#overlay'),startBtn=$('#startBtn');
const safeGet=(k,d=0)=>{try{return Number(localStorage.getItem(k))||d}catch(e){return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function showResult(icon,title,text,button='다시 하기'){ $('#resultEmoji').textContent=icon;$('#resultTitle').textContent=title;$('#resultText').innerHTML=text;startBtn.textContent=button;overlay.classList.remove('hide') }
const gridEl=$('#sokoGrid'),msg=$('#sokoMsg'),hud=$('#hud'),N=7;let level=0,player,boxes=[],targets=[],walls=new Set,moves=0,history=[],playing=false;hud.innerHTML='<div class="stat"><small>레벨</small><b id="level">1</b></div><div class="stat"><small>이동</small><b id="moves">0</b></div>';const key=(x,y)=>y*N+x,has=(arr,x,y)=>arr.some(p=>p[0]===x&&p[1]===y),dirs4=[[0,-1],[0,1],[-1,0],[1,0]];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function connected(w){let start;for(let y=1;y<N-1&&!start;y++)for(let x=1;x<N-1;x++)if(!w.has(key(x,y))){start=[x,y];break}if(!start)return false;const seen=new Set([key(...start)]),q=[start];for(let i=0;i<q.length;i++){const[x,y]=q[i];for(const[dX,dY]of dirs4){const k=key(x+dX,y+dY);if(!w.has(k)&&!seen.has(k)){seen.add(k);q.push([x+dX,y+dY])}}}return seen.size===N*N-w.size}
function generate(n){for(let attempt=0;attempt<80;attempt++){const random=rng(9173+n*7919+attempt*101),w=new Set;for(let i=0;i<N;i++){w.add(key(i,0));w.add(key(i,N-1));w.add(key(0,i));w.add(key(N-1,i))}const wallGoal=Math.min(7,Math.floor(n/2));for(let tries=0,added=0;tries<80&&added<wallGoal;tries++){const x=1+Math.floor(random()*5),y=1+Math.floor(random()*5),k=key(x,y);if(w.has(k))continue;w.add(k);if(connected(w))added++;else w.delete(k)}const floor=[];for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)if(!w.has(key(x,y)))floor.push([x,y]);const count=Math.min(4,2+Math.floor(n/3));for(let i=floor.length-1;i;i--){const j=Math.floor(random()*(i+1));[floor[i],floor[j]]=[floor[j],floor[i]]}const t=floor.slice(0,count).map(p=>[...p]),b=t.map(p=>[...p]);let p=[...floor[count]],pulls=0;const wanted=Math.min(28,4+n*2),seen=new Set;for(let step=0;step<900&&pulls<wanted;step++){const actions=[];for(const[dx,dy]of dirs4){const nx=p[0]+dx,ny=p[1]+dy;if(!w.has(key(nx,ny))&&!has(b,nx,ny))actions.push({p:[nx,ny]});const bi=b.findIndex(v=>v[0]===nx&&v[1]===ny),px=p[0]-dx,py=p[1]-dy;if(bi>=0&&!w.has(key(px,py))&&!has(b,px,py))actions.push({p:[px,py],bi,pull:true})}if(!actions.length)break;let pool=actions.filter(a=>a.pull);if(!pool.length||random()<.28)pool=actions;const a=pool[Math.floor(random()*pool.length)],old=[...p];p=a.p;if(a.pull){b[a.bi]=old;const state=p+'|'+b.map(v=>v.join(',')).sort().join(';');if(seen.has(state)){b[a.bi]=[old[0]+(old[0]-p[0]),old[1]+(old[1]-p[1])];p=old}else{seen.add(state);pulls++}}}const moved=b.filter((v,i)=>v[0]!==t[i][0]||v[1]!==t[i][1]).length;if(pulls>=wanted&&moved>=Math.min(count,2+Math.floor(n/5)))return{p,b,t,w:[...w].map(k=>[k%N,Math.floor(k/N)]),par:wanted}}return generate(n+97)}
function load(){const l=generate(level);player=[...l.p];boxes=l.b.map(x=>[...x]);targets=l.t.map(x=>[...x]);walls=new Set(l.w.map(x=>key(...x)));moves=0;history=[];playing=true;$('#level').textContent=level+1;$('#moves').textContent=0;msg.textContent=`상자 ${boxes.length}개 · 장애물 ${l.w.length-24}개 · 난이도 ${'★'.repeat(Math.min(5,1+Math.floor(level/2)))}`;overlay.classList.add('hide');render()}
function render(){gridEl.innerHTML='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=document.createElement('div');c.className='soko-cell'+(walls.has(key(x,y))?' wall':'')+(has(targets,x,y)?' target':'');c.textContent=walls.has(key(x,y))?'▦':has(boxes,x,y)?(has(targets,x,y)?'📦':'📦'):player[0]===x&&player[1]===y?'🧑':'';gridEl.appendChild(c)}}
const dirs={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};function move(d){if(!playing)return;const[dx,dy]=dirs[d],nx=player[0]+dx,ny=player[1]+dy;if(walls.has(key(nx,ny)))return;const bi=boxes.findIndex(p=>p[0]===nx&&p[1]===ny);history.push({p:[...player],b:boxes.map(v=>[...v])});if(bi>=0){const bx=nx+dx,by=ny+dy;if(walls.has(key(bx,by))||has(boxes,bx,by)){history.pop();return}boxes[bi]=[bx,by]}player=[nx,ny];$('#moves').textContent=++moves;render();if(targets.every(t=>has(boxes,...t))){playing=false;level++;showResult('📦','창고 정리 완료!',`${moves}번 이동으로 모든 상자를 목표 칸에 넣었습니다.<br>다음 창고는 상자 배치가 더 까다롭습니다.`,'다음 창고')}}function undo(){const s=history.pop();if(!s)return;player=s.p;boxes=s.b;moves=Math.max(0,moves-1);$('#moves').textContent=moves;render()}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));addEventListener('keydown',e=>{const d={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R'}[e.key];if(d){e.preventDefault();move(d)}});$('#undoMove').onclick=undo;$('#resetLevel').onclick=load;startBtn.onclick=load;
</script></body></html>
