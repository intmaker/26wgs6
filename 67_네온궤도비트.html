let dpr=1,W=1,H=1,level=0,node=0,nextBeat=0,interval=900,playing=false,counting=false,practice=false,speed=1,score=0,combo=0,maxCombo=0,life=3,total=0,earned=0,lastInput=0,missedThisBeat=false,soundOn=true,metroOn=false,metroPlayed=false,audio=null,stats={},fever=0,feverUntil=0,perfectStreak=0,checkpoint=0,checkpointUsed=false,trails=[],bgStars=[];

function setTheme(name){records.theme=name;let t=themes[name]||themes.basic;document.documentElement.style.setProperty('--a',t[0]);document.documentElement.style.setProperty('--b',t[1]);document.documentElement.style.setProperty('--c',t[2]);save()}
setTheme(records.theme);
function resize(){let r=stageEl.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=Math.max(300,r.width);H=Math.max(330,r.height);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);bgStars=Array.from({length:28},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.8+.4,v:Math.random()*.018+.006}))}addEventListener('resize',resize);resize();
function tone(freq,d=.07,type='sine',gain=.07){if(!soundOn)return;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}

function data(){return rawStages[level]}function pos(i){let p=data().path[i];return{x:p[0]*W,y:p[1]*H}}function totalStars(){return records.stars.reduce((a,b)=>a+b,0)}

function stageIntro(){let s=data();$('#modalIcon').textContent='🪐';$('#modalTitle').textContent=`STAGE ${level+1} · ${s.name}`;$('#modalBody').innerHTML=`<p>${s.desc}</p><div class="results"><span>BPM<b>${Math.round(s.bpm*speed)}</b></span><span>노드<b>${s.path.length}</b></span><span>모드<b>${practice?'연습':'기록'}</b></span></div>`;$('#modalActions').innerHTML='<button class="primary" data-action="start">시작하기</button><button data-action="select">스테이지 선택</button>';$('#overlay').classList.remove('hide')}
function resetStats(start=0){node=start;score=start?Math.floor(score*.5):0;combo=0;maxCombo=0;life=3;total=earned=0;lastInput=0;missedThisBeat=false;stats={perfect:0,great:0,good:0,miss:0};fever=0;feverUntil=0;perfectStreak=0;checkpoint=start;checkpointUsed=start>0;trails=[];updateHud()}

function advance(now,judgement='MISS'){node++;applySpecial(judgement);missedThisBeat=false;if(!checkpoint&&node>=Math.floor((data().path.length-1)/2)){checkpoint=node;flash('#streak','🚩 CHECKPOINT!')}updateHud(now);if(node>=data().path.length-1){playing=false;setTimeout(()=>result(true),450);return}interval=nextInterval();nextBeat=now+interval;metroPlayed=false}
function rankFor(acc){return acc>=97?'S':acc>=90?'A':acc>=80?'B':'C'}
function result(clear){let acc=total?earned/total*100:0,rank=rankFor(acc),stars=clear?(acc>=95&&stats.miss<=1?3:acc>=85?2:1):0;if(clear&&!practice){records.unlocked=Math.max(records.unlocked,Math.min(10,level+2));records.stars[level]=Math.max(records.stars[level],stars);records.scores[level]=Math.max(records.scores[level],score);records.accuracy[level]=Math.max(records.accuracy[level],acc);let ranks=['','C','B','A','S'];if(ranks.indexOf(rank)>ranks.indexOf(records.ranks[level]||''))records.ranks[level]=rank;records.bestScore=Math.max(records.bestScore,score);records.bestCombo=Math.max(records.bestCombo,maxCombo);save()}$('#modalIcon').textContent=clear?'🎉':'💥';$('#modalTitle').textContent=clear?'STAGE CLEAR!':'RHYTHM BREAK!';$('#modalBody').innerHTML=`<div class="rank">RANK ${rank}</div>${clear?`<div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>`:''}<p>${data().name}${practice?' · 연습 기록은 저장되지 않아요':''}</p><div class="results"><span>SCORE<b>${score}</b></span><span>ACCURACY<b>${acc.toFixed(1)}%</b></span><span>MAX COMBO<b>${maxCombo}</b></span><span>PERFECT<b>${stats.perfect}</b></span><span>GREAT<b>${stats.great}</b></span><span>GOOD / MISS<b>${stats.good} / ${stats.miss}</b></span></div>`;let buttons=clear&&level<9?'<button data-action="next">다음 스테이지</button>':'';buttons+='<button data-action="retry">다시 도전</button>';if(!clear)buttons+='<button data-action="practice">연습 모드</button>';if(!clear&&checkpoint)buttons+='<button data-action="checkpoint">체크포인트부터</button>';buttons+='<button data-action="select">스테이지 선택</button>';$('#modalActions').innerHTML=buttons;$('#overlay').classList.remove('hide');if(clear)melody(true)}
function begin(start=0){resetStats(start);countdown()}
// 단일 애니메이션 루프: 늦은 판정, 메트로놈, 그리기
function tick(now){if(playing){if(metroOn&&!metroPlayed&&now>=nextBeat){tone(300,.025,'square',.025);metroPlayed=true}if(now>nextBeat+225){if(!missedThisBeat)miss('MISS',now);if(playing)advance(now,'MISS')}}draw(now);updateHud(now);requestAnimationFrame(tick)}
function draw(now){ctx.clearRect(0,0,W,H);let hot=now<feverUntil;bgStars.forEach(s=>{s.y+=s.v*(hot?3:1);if(s.y>H){s.y=0;s.x=Math.random()*W}ctx.globalAlpha=.25+Math.sin(now*.002+s.x)*.15;ctx.fillStyle=hot?'#fff7ae':'#c4d4ff';ctx.fillRect(s.x,s.y,s.s,s.s)});ctx.globalAlpha=1;let pts=data().path.map((_,i)=>pos(i));ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=hot?10:8;ctx.strokeStyle='#31385f';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();if(node>0){let grad=ctx.createLinearGradient(pts[0].x,pts[0].y,pts[node].x,pts[node].y);grad.addColorStop(0,getComputedStyle(document.documentElement).getPropertyValue('--b'));grad.addColorStop(1,getComputedStyle(document.documentElement).getPropertyValue('--a'));ctx.strokeStyle=grad;ctx.shadowBlur=hot?28:14;ctx.shadowColor=hot?'#ffd000':'#735cff';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<=Math.min(node,pts.length-1);i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();ctx.shadowBlur=0}pts.forEach((p,i)=>{let type=data().special[i],next=i===node+1,r=next?11+Math.sin(now/100)*2:8;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=i<node?'#805dff':i===node?'#fff':next?'#45f3ff':'#66708f';if(type==='bonus')ctx.fillStyle='#fde047';if(type==='perfect')ctx.fillStyle='#67e8f9';if(type==='life')ctx.fillStyle='#fb7185';if(type==='shock')ctx.fillStyle='#f97316';ctx.shadowBlur=next?22:0;ctx.shadowColor=ctx.fillStyle;ctx.fill();ctx.shadowBlur=0;if(type){ctx.fillStyle='#10132e';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText({bonus:'★',perfect:'◆',life:'♥',shock:'⚡'}[type],p.x,p.y+3)}});let c=pts[Math.min(node,pts.length-1)],n=pts[Math.min(node+1,pts.length-1)],prog=playing?Math.max(0,Math.min(1,1-(nextBeat-now)/interval)):0,aim=Math.atan2(n.y-c.y,n.x-c.x),ang=aim+Math.PI*(prog-1),r=Math.min(24,Math.max(16,W/30)),colors=themes[records.theme]||themes.basic;let balls=[{x:c.x+Math.cos(ang)*r,y:c.y+Math.sin(ang)*r,c:colors[0]},{x:c.x+Math.cos(ang+Math.PI)*r,y:c.y+Math.sin(ang+Math.PI)*r,c:colors[1]}];trails.push(balls);let max=hot?10:6;if(trails.length>max)trails.shift();trails.forEach((pair,i)=>pair.forEach(b=>{ctx.globalAlpha=(i+1)/trails.length*.3;ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fillStyle=b.c;ctx.fill()}));ctx.globalAlpha=1;balls.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,10,0,Math.PI*2);ctx.fillStyle=b.c;ctx.shadowBlur=hot?28:18;ctx.shadowColor=b.c;ctx.fill();ctx.shadowBlur=0})}
// 오버레이 조작
$('#modalBody').onclick=e=>{let m=e.target.dataset.mode;if(m){practice=m==='practice';speed=1;stageSelect()}if(e.target.dataset.speed){speed=+e.target.dataset.speed;stageSelect()}let s=e.target.closest('[data-stage]');if(s&&!s.disabled){level=+s.dataset.stage;stageIntro()}if(e.target.dataset.theme){setTheme(e.target.dataset.theme);stageSelect()}};
$('#modalActions').onclick=e=>{let a=e.target.dataset.action;if(!a)return;if(a==='select')stageSelect();if(a==='start'||a==='retry')begin();if(a==='next'){level++;stageIntro()}if(a==='practice'){practice=true;speed=1;stageIntro()}if(a==='checkpoint')begin(checkpoint)};
function activate(){if(!audio)try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch(e){};if(audio&&audio.state==='suspended')audio.resume()}
$('#overlay').addEventListener('pointerdown',e=>e.stopPropagation());stageEl.addEventListener('pointerdown',e=>{e.preventDefault();if(!playing)return;activate();let r=stageEl.getBoundingClientRect(),w=document.createElement('i');w.className='touch-wave';w.style.left=`${e.clientX-r.left-10}px`;w.style.top=`${e.clientY-r.top-10}px`;stageEl.appendChild(w);setTimeout(()=>w.remove(),400);judgeInput(performance.now())});addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!e.repeat){e.preventDefault();activate();judgeInput(performance.now())}});$('#sound').onclick=e=>{e.stopPropagation();soundOn=!soundOn;$('#sound').textContent=soundOn?'🔊':'🔇'};$('#metro').onclick=e=>{e.stopPropagation();metroOn=!metroOn;$('#metro').textContent=metroOn?'🥁 ON':'🥁 OFF'};updateHud();requestAnimationFrame(tick);
</script></body></html>
