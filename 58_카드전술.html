<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"><title>🃏 카드 전술</title><style>
:root{--c1:#9f1239;--c2:#fb7185}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 18% 10%,var(--c1),#11162e 52%,#030712);user-select:none;-webkit-user-select:none}.app{width:min(95vw,720px);height:min(95vh,860px);display:flex;flex-direction:column;gap:11px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 4px}.brand small{display:block;color:#cbd5e1;font-size:10px;font-weight:900;letter-spacing:.2em}.brand h1{margin:2px 0 0;font-size:clamp(25px,5vw,38px);letter-spacing:-.05em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:67px;padding:7px 10px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#0f172ac7}.stat small{display:block;color:#cbd5e1;font-size:9px}.stat b{font-size:19px}.stage{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff27;border-radius:25px;background:linear-gradient(145deg,#14203b,#090e21);box-shadow:0 25px 70px #0009;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#050916e9}.overlay.hide{display:none}.card{width:min(100%,410px);padding:28px 24px;text-align:center;border:1px solid #ffffff25;border-radius:23px;background:#111a36ee;box-shadow:0 20px 55px #0008}.card .emoji{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{margin:0 0 19px;color:#cbd5e1;font-size:14px;line-height:1.72;word-break:keep-all}.primary{min-height:48px;width:100%;padding:12px 18px;border:0;border-radius:13px;color:#08111f;background:linear-gradient(135deg,var(--c2),#fef3c7);font:900 15px system-ui;cursor:pointer}.tip{min-height:18px;text-align:center;color:#aebbd0;font-size:12px}.hidden{display:none!important}button{font-family:inherit}.card-war{height:100%;display:flex;flex-direction:column;gap:8px;padding:12px;background:linear-gradient(145deg,#3f1d2e,#151224)}.bases{display:flex;justify-content:space-between;padding:8px 12px;border-radius:11px;background:#ffffff0b;color:#fecdd3}.lanes{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.lane{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:8px;border:1px solid #ffffff1f;border-radius:14px;background:#ffffff08;cursor:pointer}.lane::after{content:"VS";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#ffffff22;font-weight:1000;font-size:25px}.unit{z-index:2;min-height:80px;padding:7px;text-align:center;border-radius:11px;background:#7f1d1d}.unit.mine{background:#1d4ed8}.unit small,.unit b{display:block}.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;min-height:100px}.card-btn{padding:6px 3px;border:2px solid transparent;border-radius:11px;color:#fff;background:#ffffff10;cursor:pointer}.card-btn.selected{border-color:#fde047;transform:translateY(-5px)}.card-btn span{display:block;font-size:25px}.card-btn small{display:block;font-size:9px;color:#ddd6fe}.end-turn{align-self:center;min-height:44px;padding:9px 18px;border:0;border-radius:11px;background:#fb7185;color:#3f1025;font-weight:900}#warMsg{min-height:21px;text-align:center;color:#fecdd3;font-weight:800}
@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.stage{min-height:0;border-radius:20px}.brand h1{font-size:25px}.stat{min-width:61px;padding:6px 8px}.card{padding:24px 19px}.tip{font-size:11px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><small>THREE LANES</small><h1>🃏 카드 전술</h1></div><div class="hud" id="hud"></div></header><section class="stage" id="stage"><div class="card-war"><div class="bases"><span>🤖 AI 기지 <b id="aiHp">20</b></span><span>내 기지 <b id="myHp">20</b> 🏰</span></div><div class="lanes" id="lanes"></div><div class="hand" id="hand"></div><button class="end-turn" id="endTurn">턴 종료 ▶</button><div id="warMsg">카드를 선택한 뒤 배치할 전선을 누르세요.</div></div><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="resultEmoji">🃏</div><h2 id="resultTitle">카드 전술</h2><p id="resultText">한정된 에너지로 세 전선에 유닛 카드를 배치해 AI의 기지를 먼저 파괴하세요.</p><button class="primary" id="startBtn">게임 시작</button></div></div></section><div class="tip">한정된 에너지로 세 전선에 유닛 카드를 배치해 AI의 기지를 먼저 파괴하세요.</div></main><script>
const $=s=>document.querySelector(s),stage=$('#stage'),overlay=$('#overlay'),startBtn=$('#startBtn');
const safeGet=(k,d=0)=>{try{return Number(localStorage.getItem(k))||d}catch(e){return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function showResult(icon,title,text,button='다시 하기'){ $('#resultEmoji').textContent=icon;$('#resultTitle').textContent=title;$('#resultText').innerHTML=text;startBtn.textContent=button;overlay.classList.remove('hide') }
const lanesEl=$('#lanes'),handEl=$('#hand'),msg=$('#warMsg'),hud=$('#hud');let lanes=[],hand=[],selected=-1,energy=3,turn=1,myHp=20,aiHp=20,playing=false;const cards=[{n:'전사',e:'⚔️',a:3,h:4,c:2},{n:'방패병',e:'🛡️',a:1,h:7,c:2},{n:'궁수',e:'🏹',a:4,h:2,c:2},{n:'정찰병',e:'🥷',a:2,h:3,c:1},{n:'기사',e:'🐴',a:5,h:5,c:3}];hud.innerHTML='<div class="stat"><small>턴</small><b id="turn">1</b></div><div class="stat"><small>에너지</small><b id="energy">3</b></div>';
const drawCard=()=>({...cards[Math.floor(Math.random()*cards.length)]});function startGame(){lanes=Array.from({length:3},()=>({me:null,ai:null}));hand=Array.from({length:4},drawCard);selected=-1;energy=3;turn=1;myHp=aiHp=20;playing=true;overlay.classList.add('hide');render();msg.textContent='카드를 선택한 뒤 아군 전선의 빈칸을 누르세요.'}
function render(){lanesEl.innerHTML='';lanes.forEach((l,i)=>{const e=document.createElement('div');e.className='lane';e.innerHTML=`<div class="unit ${l.ai?'':'hidden'}">${l.ai?`${l.ai.e}<b>${l.ai.n}</b><small>공 ${l.ai.a} · 체 ${l.ai.h}</small>`:''}</div><div class="unit mine ${l.me?'':'hidden'}">${l.me?`${l.me.e}<b>${l.me.n}</b><small>공 ${l.me.a} · 체 ${l.me.h}</small>`:''}</div>`;e.onclick=()=>deploy(i);lanesEl.appendChild(e)});handEl.innerHTML='';hand.forEach((c,i)=>{const b=document.createElement('button');b.className='card-btn'+(i===selected?' selected':'');b.innerHTML=`<span>${c.e}</span><b>${c.n}</b><small>⚡${c.c} · 공${c.a} · 체${c.h}</small>`;b.onclick=()=>{selected=i;render()};handEl.appendChild(b)});$('#energy').textContent=energy;$('#turn').textContent=turn;$('#myHp').textContent=myHp;$('#aiHp').textContent=aiHp}
function deploy(i){if(!playing||selected<0||lanes[i].me)return;const c=hand[selected];if(c.c>energy){msg.textContent='에너지가 부족합니다.';return}energy-=c.c;lanes[i].me=c;hand.splice(selected,1,drawCard());selected=-1;render()}
function aiPlay(){const choices=lanes.map((l,i)=>l.ai?null:i).filter(i=>i!==null);if(choices.length){const i=choices[Math.floor(Math.random()*choices.length)],pool=cards.filter(c=>c.c<=3);lanes[i].ai={...pool[Math.floor(Math.random()*pool.length)]}}}
function resolve(){for(const l of lanes){if(l.me&&l.ai){l.me.h-=l.ai.a;l.ai.h-=l.me.a;if(l.me.h<=0)l.me=null;if(l.ai&&l.ai.h<=0)l.ai=null}else if(l.me)aiHp-=l.me.a;else if(l.ai)myHp-=l.ai.a}if(myHp<=0||aiHp<=0)return end(aiHp<=0);turn++;energy=Math.min(6,3+Math.floor(turn/3));render();msg.textContent='새 턴입니다. 빈 전선과 유닛 상성을 확인하세요.'}
function endTurn(){if(!playing)return;aiPlay();resolve()}function end(win){playing=false;render();showResult(win?'🏆':'🤖',win?'전술 승리!':'기지가 함락됐어요',`최종 기지 체력 — 나 ${Math.max(0,myHp)} / AI ${Math.max(0,aiHp)}<br>빈 전선은 기지를 직접 공격하므로 세 전선을 균형 있게 지키세요.`)}$('#endTurn').onclick=endTurn;startBtn.onclick=startGame;
</script></body></html>
