<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎯 럭키 빙고 챌린지</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    min-height:100%;
}

body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 20% 10%,#0ea5e955,transparent 30%),
        radial-gradient(circle at 90% 80%,#ec489955,transparent 35%),
        linear-gradient(135deg,#075985,#4f46e5,#831843);

    color:#fff;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    user-select:none;
    -webkit-user-select:none;
}

button,select{
    font:inherit;
}

button{
    touch-action:manipulation;
}

.game{
    width:min(95vw,720px);
    padding:20px;
    border:1px solid #ffffff2f;
    border-radius:28px;

    background:#101936e8;

    box-shadow:
        0 25px 70px #0008,
        inset 0 1px #ffffff22;

    position:relative;
    overflow:hidden;
}

.game::before{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    background:#8b5cf62d;
    top:-120px;
    right:-100px;
    pointer-events:none;
}

.top{
    position:relative;
    z-index:2;
}

.title-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

h1{
    margin:0;
    font-size:clamp(25px,5vw,38px);
}

.subtitle{
    margin:4px 0 0;
    color:#cbd5e1;
    font-size:13px;
}

.hud{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:13px;
}

.badge{
    min-width:78px;
    padding:8px 11px;
    text-align:center;
    border-radius:13px;
    background:#ffffff12;
    border:1px solid #ffffff12;
}

.badge small{
    display:block;
    color:#cbd5e1;
    font-size:9px;
}

.badge b{
    font-size:18px;
}

.progress-wrap{
    height:8px;
    margin-top:12px;
    border-radius:99px;
    background:#ffffff17;
    overflow:hidden;
}

.progress{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#22d3ee,#a3e635,#fde047);
    transition:.35s;
}

/* 추첨기 */
.caller-area{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:13px;
    margin:15px 0;
}

.caller{
    width:104px;
    height:104px;
    display:grid;
    place-items:center;

    border:5px solid #ffffff35;
    border-radius:50%;

    background:
        radial-gradient(circle at 35% 25%,#fff6,transparent 15%),
        linear-gradient(145deg,#fbbf24,#f97316);

    color:#31120a;

    font-size:40px;
    font-weight:1000;

    box-shadow:
        0 10px 30px #f9731644,
        inset 0 -7px 14px #c2410c44;

    transition:.25s;
}

.caller.pop{
    transform:scale(1.12) rotate(5deg);
}

.last-calls{
    flex:1;
    max-width:280px;

    background:#ffffff0c;
    border-radius:15px;
    padding:10px;
}

.last-title{
    color:#cbd5e1;
    font-size:11px;
    margin-bottom:7px;
}

.ball-list{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.mini-ball{
    width:32px;
    height:32px;

    display:grid;
    place-items:center;

    border-radius:50%;

    background:#fff;
    color:#312e81;

    font-size:12px;
    font-weight:900;

    animation:miniPop .25s ease;
}

@keyframes miniPop{
    from{
        transform:scale(0);
    }

    to{
        transform:scale(1);
    }
}


/* 빙고판 */
.board-wrap{
    position:relative;
}

.board-header{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
    margin-bottom:5px;
}

.board-header div{
    text-align:center;
    font-weight:1000;
    font-size:clamp(15px,4vw,23px);
}

.board-header div:nth-child(1){color:#67e8f9;}
.board-header div:nth-child(2){color:#a7f3d0;}
.board-header div:nth-child(3){color:#fde047;}
.board-header div:nth-child(4){color:#f9a8d4;}
.board-header div:nth-child(5){color:#c4b5fd;}

.board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.cell{
    position:relative;

    aspect-ratio:1;

    border:1px solid #ffffff20;
    border-radius:14px;

    background:#ffffff10;
    color:#fff;

    font:900 clamp(16px,4vw,25px) system-ui;

    cursor:pointer;

    transition:
        transform .15s,
        background .2s,
        box-shadow .2s;
}

@media (hover:hover){
    .cell:hover{
        transform:translateY(-2px);
        background:#ffffff1c;
    }
}

.cell.called:not(.marked){
    box-shadow:
        inset 0 0 0 3px #fbbf2477,
        0 0 13px #f59e0b33;
}

.cell.marked{
    background:linear-gradient(135deg,#fde047,#fb7185);
    color:#1f1720;
    transform:scale(.95);
}

.cell.marked::after{
    content:"✓";
    position:absolute;
    right:5px;
    bottom:2px;
    font-size:12px;
}

.cell.free{
    background:linear-gradient(135deg,#8b5cf6,#6366f1);
    color:white;
}

.cell.bingo-line{
    animation:bingoFlash .7s ease infinite alternate;
}

@keyframes bingoFlash{
    from{
        box-shadow:
            inset 0 0 0 3px #fff,
            0 0 6px #fde047;
    }
    to{
        box-shadow:
            inset 0 0 0 4px #fde047,
            0 0 20px #fde047;
    }
}


/* 메시지 */
.message{
    min-height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:12px 0 0;

    text-align:center;
    color:#e2e8f0;

    font-weight:800;
    line-height:1.45;

    padding:8px;
}

.message.good{
    color:#86efac;
}

.message.warn{
    color:#fde047;
}

.message.bad{
    color:#fda4af;
}


/* 보너스 */
.combo{
    height:29px;
    text-align:center;
    color:#fde047;
    font-weight:1000;
}

.combo.show{
    animation:comboPop .35s ease;
}

@keyframes comboPop{
    50%{
        transform:scale(1.25);
    }
}


/* 설정 */
.settings{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
}

.setting{
    flex:1 1 140px;

    background:#ffffff0d;
    border:1px solid #ffffff10;
    border-radius:12px;

    padding:8px 10px;

    display:flex;
    gap:7px;
    align-items:center;
    justify-content:space-between;
}

.setting label{
    font-size:11px;
    color:#cbd5e1;
}

.setting select{
    min-height:35px;

    border:0;
    border-radius:8px;

    padding:4px 7px;

    background:#fff;
    color:#1e1b4b;

    font-weight:800;
}


/* 버튼 */
.controls{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-top:12px;
}

.controls button{
    min-height:48px;

    border:0;
    border-radius:13px;

    padding:10px;

    cursor:pointer;

    background:linear-gradient(135deg,#67e8f9,#a7f3d0);
    color:#102040;

    font-weight:900;
    font-size:14px;
}

.controls button.secondary{
    background:#ffffff14;
    color:#fff;
}

.controls button.special{
    background:linear-gradient(135deg,#fde047,#fb923c);
    color:#3b1700;
}

.controls button:disabled{
    opacity:.4;
    cursor:not-allowed;
}


/* 기록 */
.records{
    margin-top:12px;

    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;

    font-size:11px;
    color:#cbd5e1;
}

.records b{
    color:#fff;
}


/* 결과창 */
.modal{
    position:absolute;
    inset:0;

    display:none;
    place-items:center;

    padding:18px;

    background:#080c22dd;
    backdrop-filter:blur(6px);

    z-index:20;
}

.modal.show{
    display:grid;
}

.modal-card{
    width:min(90%,400px);

    padding:26px;

    border-radius:24px;

    text-align:center;

    background:linear-gradient(145deg,#312e81,#581c87);

    box-shadow:0 25px 60px #000a;
}

.modal-card h2{
    margin:0 0 10px;
    font-size:31px;
}

.result-score{
    font-size:45px;
    font-weight:1000;
    color:#fde047;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin:15px 0;
}

.result-box{
    background:#ffffff12;
    border-radius:12px;
    padding:10px;
}

.result-box small{
    display:block;
    color:#cbd5e1;
}

.result-box b{
    font-size:19px;
}

.modal-card button{
    width:100%;
    min-height:48px;

    border:0;
    border-radius:13px;

    background:linear-gradient(135deg,#67e8f9,#a7f3d0);
    color:#102040;

    font-weight:1000;
    cursor:pointer;
}


/* 작은 축하 파티클 */
.particle{
    position:absolute;
    z-index:15;
    pointer-events:none;
    font-size:22px;
    animation:fly 1.1s ease forwards;
}

@keyframes fly{
    to{
        transform:
            translate(var(--x),var(--y))
            rotate(360deg);
        opacity:0;
    }
}


@media(max-width:520px){

    body{
        place-items:stretch;
    }

    .game{
        width:100%;
        min-height:100vh;

        border-radius:0;

        padding:12px;

        display:flex;
        flex-direction:column;
        justify-content:center;
    }

    .board{
        gap:4px;
    }

    .caller-area{
        margin:8px 0;
    }

    .caller{
        width:77px;
        height:77px;
        font-size:30px;
    }

    .last-calls{
        padding:7px;
    }

    .mini-ball{
        width:27px;
        height:27px;
        font-size:10px;
    }

    .cell{
        border-radius:9px;
    }

    .controls button{
        min-height:46px;
    }
}

@media(max-width:350px){

    .subtitle{
        display:none;
    }

    .badge{
        min-width:65px;
        padding:6px;
    }

    .last-title{
        display:none;
    }

    .mini-ball{
        width:24px;
        height:24px;
    }
}
</style>
</head>

<body>

<main class="game" id="game">

    <header class="top">

        <div class="title-row">

            <div>
                <h1>🎯 럭키 빙고</h1>
                <p class="subtitle">
                    숫자를 찾아 표시하고 목표 빙고를 완성하세요!
                </p>
            </div>

        </div>

        <div class="hud">

            <div class="badge">
                <small>빙고</small>
                <b id="count">0</b>
            </div>

            <div class="badge">
                <small>목표</small>
                <b id="target">3</b>
            </div>

            <div class="badge">
                <small>남은 공</small>
                <b id="left">25</b>
            </div>

            <div class="badge">
                <small>점수</small>
                <b id="score">0</b>
            </div>

        </div>

        <div class="progress-wrap">
            <div class="progress" id="progress"></div>
        </div>

    </header>


    <section class="caller-area">

        <div class="caller" id="caller">
            ?
        </div>

        <div class="last-calls">

            <div class="last-title">
                최근 나온 숫자
            </div>

            <div class="ball-list" id="recent">
                -
            </div>

        </div>

    </section>


    <div class="board-wrap">

        <div class="board-header">
            <div>B</div>
            <div>I</div>
            <div>N</div>
            <div>G</div>
            <div>O</div>
        </div>

        <div
            class="board"
            id="board">
        </div>

    </div>


    <div class="combo" id="combo"></div>

    <div
        class="message"
        id="message">
        게임 시작을 누르면 숫자 공이 나옵니다.
    </div>


    <div class="settings">

        <div class="setting">
            <label for="difficulty">
                난이도
            </label>

            <select id="difficulty">
                <option value="easy">쉬움</option>
                <option value="normal" selected>보통</option>
                <option value="hard">어려움</option>
            </select>
        </div>

        <div class="setting">
            <label for="mode">
                추첨
            </label>

            <select id="mode">
                <option value="auto" selected>자동</option>
                <option value="manual">수동</option>
            </select>
        </div>

    </div>


    <div class="controls">

        <button id="start">
            ▶ 게임 시작
        </button>

        <button
            id="call"
            class="secondary"
            disabled>
            🎱 다음 숫자
        </button>

        <button
            id="hint"
            class="special"
            disabled>
            💡 힌트
        </button>

        <button
            id="pause"
            class="secondary"
            disabled>
            ⏸ 일시정지
        </button>

    </div>


    <div class="records">

        <span>
            🏆 최고 점수
            <b id="bestScore">0</b>
        </span>

        <span>
            🔥 최고 콤보
            <b id="bestCombo">0</b>
        </span>

        <span>
            🎯 최고 빙고
            <b id="bestBingo">0</b>
        </span>

    </div>


    <div
        class="modal"
        id="modal">

        <div class="modal-card">

            <h2 id="resultTitle">
                🎉 BINGO!
            </h2>

            <div
                class="result-score"
                id="resultScore">
                0
            </div>

            <div class="result-grid">

                <div class="result-box">
                    <small>완성 빙고</small>
                    <b id="resultBingo">0</b>
                </div>

                <div class="result-box">
                    <small>최대 콤보</small>
                    <b id="resultCombo">0</b>
                </div>

                <div class="result-box">
                    <small>남은 공</small>
                    <b id="resultLeft">0</b>
                </div>

                <div class="result-box">
                    <small>등급</small>
                    <b id="resultGrade">A</b>
                </div>

            </div>

            <button id="restart">
                🔄 다시하기
            </button>

        </div>

    </div>

</main>


<script>
(() => {

    /* =====================================================
       HTML 요소
    ===================================================== */

    const $ =
        selector =>
            document.querySelector(selector);

    const board =
        $("#board");

    const caller =
        $("#caller");

    const countEl =
        $("#count");

    const targetEl =
        $("#target");

    const leftEl =
        $("#left");

    const scoreEl =
        $("#score");

    const progressEl =
        $("#progress");

    const recentEl =
        $("#recent");

    const comboEl =
        $("#combo");

    const msg =
        $("#message");

    const startBtn =
        $("#start");

    const callBtn =
        $("#call");

    const hintBtn =
        $("#hint");

    const pauseBtn =
        $("#pause");

    const difficultySelect =
        $("#difficulty");

    const modeSelect =
        $("#mode");

    const modal =
        $("#modal");


    /* =====================================================
       게임 상태
    ===================================================== */

    let values = [];

    let called =
        new Set();

    let marked =
        new Set();

    let bag = [];

    let bingoLines =
        new Set();

    let recentNumbers = [];

    let playing = false;

    let paused = false;

    let timer = null;

    let targetBingo = 3;

    let score = 0;

    let combo = 0;

    let maxCombo = 0;

    let correctMarks = 0;

    let wrongClicks = 0;


    /* =====================================================
       빙고 라인
    ===================================================== */

    const lines = [

        /* 가로 */
        ...[0,1,2,3,4].map(
            r =>
                [0,1,2,3,4]
                    .map(c => r * 5 + c)
        ),

        /* 세로 */
        ...[0,1,2,3,4].map(
            c =>
                [0,1,2,3,4]
                    .map(r => r * 5 + c)
        ),

        /* 대각선 */
        [0,6,12,18,24],

        [4,8,12,16,20]
    ];


    /* =====================================================
       배열 섞기
    ===================================================== */

    function shuffle(array){

        for(
            let i = array.length - 1;
            i > 0;
            i--
        ){

            const j =
                Math.floor(
                    Math.random() *
                    (i + 1)
                );

            [
                array[i],
                array[j]
            ] = [
                array[j],
                array[i]
            ];
        }

        return array;
    }


    /* =====================================================
       기록
    ===================================================== */

    function loadRecords(){

        try{

            $("#bestScore").textContent =
                localStorage.getItem(
                    "bingoBestScore"
                ) || 0;

            $("#bestCombo").textContent =
                localStorage.getItem(
                    "bingoBestCombo"
                ) || 0;

            $("#bestBingo").textContent =
                localStorage.getItem(
                    "bingoBestLines"
                ) || 0;

        }
        catch(e){}
    }


    function saveRecords(){

        try{

            const bestScore =
                Number(
                    localStorage.getItem(
                        "bingoBestScore"
                    ) || 0
                );

            const bestCombo =
                Number(
                    localStorage.getItem(
                        "bingoBestCombo"
                    ) || 0
                );

            const bestLines =
                Number(
                    localStorage.getItem(
                        "bingoBestLines"
                    ) || 0
                );

            if(score > bestScore){

                localStorage.setItem(
                    "bingoBestScore",
                    score
                );
            }

            if(maxCombo > bestCombo){

                localStorage.setItem(
                    "bingoBestCombo",
                    maxCombo
                );
            }

            if(
                bingoLines.size >
                bestLines
            ){

                localStorage.setItem(
                    "bingoBestLines",
                    bingoLines.size
                );
            }

        }
        catch(e){}

        loadRecords();
    }


    /* =====================================================
       난이도 설정
    ===================================================== */

    function getSettings(){

        const difficulty =
            difficultySelect.value;

        if(difficulty === "easy"){

            return {
                target:2,
                interval:2400
            };
        }

        if(difficulty === "hard"){

            return {
                target:4,
                interval:1100
            };
        }

        return {
            target:3,
            interval:1700
        };
    }


    /* =====================================================
       새 게임
    ===================================================== */

    function startGame(){

        clearInterval(timer);

        modal.classList.remove(
            "show"
        );

        const settings =
            getSettings();

        targetBingo =
            settings.target;

        targetEl.textContent =
            targetBingo;


        /*
            카드의 숫자와 추첨 숫자를
            각각 랜덤으로 섞는다.
        */
        values =
            shuffle(
                Array.from(
                    {length:25},
                    (_,i) => i + 1
                )
            );

        bag =
            shuffle(
                Array.from(
                    {length:25},
                    (_,i) => i + 1
                )
            );


        called.clear();

        marked =
            new Set([12]);

        bingoLines.clear();

        recentNumbers = [];

        score = 0;

        combo = 0;

        maxCombo = 0;

        correctMarks = 0;

        wrongClicks = 0;

        playing = true;

        paused = false;


        caller.textContent =
            "?";

        countEl.textContent =
            0;

        leftEl.textContent =
            bag.length;

        scoreEl.textContent =
            score;

        progressEl.style.width =
            "0%";

        recentEl.textContent =
            "-";

        comboEl.textContent =
            "";

        msg.className =
            "message";

        msg.textContent =
            "나온 숫자를 카드에서 찾아 눌러주세요!";


        startBtn.textContent =
            "🔄 새 게임";

        callBtn.disabled =
            false;

        hintBtn.disabled =
            false;

        pauseBtn.disabled =
            false;

        pauseBtn.textContent =
            "⏸ 일시정지";


        render();


        /*
            자동 추첨 모드
        */
        if(
            modeSelect.value ===
            "auto"
        ){

            timer =
                setInterval(
                    callNumber,
                    settings.interval
                );
        }
    }


    /* =====================================================
       숫자 추첨
    ===================================================== */

    function callNumber(){

        if(
            !playing ||
            paused ||
            bag.length === 0
        ){
            return;
        }


        const n =
            bag.pop();

        called.add(n);

        caller.textContent =
            n;


        caller.classList.remove(
            "pop"
        );

        void caller.offsetWidth;

        caller.classList.add(
            "pop"
        );


        recentNumbers.unshift(n);

        recentNumbers =
            recentNumbers.slice(0,5);


        leftEl.textContent =
            bag.length;


        renderRecent();

        render();


        /*
            모든 공이 나왔는데
            목표 빙고가 안 됐을 경우
        */
        if(
            bag.length === 0 &&
            bingoLines.size <
                targetBingo
        ){

            clearInterval(timer);

            msg.className =
                "message warn";

            msg.textContent =
                "모든 숫자가 나왔어요! 아직 표시하지 않은 칸이 있는지 확인하세요.";
        }
    }


    /* =====================================================
       최근 추첨 숫자 표시
    ===================================================== */

    function renderRecent(){

        if(
            recentNumbers.length === 0
        ){

            recentEl.textContent =
                "-";

            return;
        }


        recentEl.innerHTML =
            recentNumbers
                .map(
                    n =>
                        `<span class="mini-ball">${n}</span>`
                )
                .join("");
    }


    /* =====================================================
       칸 선택
    ===================================================== */

    function markCell(index){

        if(
            !playing ||
            paused ||
            index === 12
        ){
            return;
        }


        const n =
            values[index];


        /*
            아직 추첨되지 않은 숫자
        */
        if(
            !called.has(n)
        ){

            wrongClicks++;

            combo = 0;

            score =
                Math.max(
                    0,
                    score - 20
                );

            scoreEl.textContent =
                score;

            comboEl.textContent =
                "";

            msg.className =
                "message bad";

            msg.textContent =
                `❌ ${n}번은 아직 나오지 않았어요! -20점`;

            return;
        }


        /*
            이미 표시한 칸
        */
        if(
            marked.has(index)
        ){

            msg.className =
                "message";

            msg.textContent =
                "이미 표시한 숫자입니다.";

            return;
        }


        marked.add(index);

        correctMarks++;

        combo++;

        maxCombo =
            Math.max(
                maxCombo,
                combo
            );


        /*
            기본 100점 +
            콤보 보너스
        */
        const earned =
            100 +
            Math.min(
                combo * 10,
                100
            );

        score += earned;

        scoreEl.textContent =
            score;


        comboEl.textContent =
            combo >= 2
                ? `🔥 COMBO × ${combo}`
                : "";

        comboEl.classList.remove(
            "show"
        );

        void comboEl.offsetWidth;

        comboEl.classList.add(
            "show"
        );


        msg.className =
            "message good";

        msg.textContent =
            `✅ 정답! +${earned}점`;


        checkBingo();

        render();
    }


    /* =====================================================
       빙고 검사
    ===================================================== */

    function checkBingo(){

        let newBingo = 0;


        lines.forEach(
            (line,index) => {

                if(
                    line.every(
                        cell =>
                            marked.has(cell)
                    ) &&
                    !bingoLines.has(index)
                ){

                    bingoLines.add(index);

                    newBingo++;
                }
            }
        );


        if(newBingo > 0){

            score +=
                newBingo * 500;

            scoreEl.textContent =
                score;


            msg.className =
                "message good";

            msg.textContent =
                `🎉 BINGO! ${newBingo}줄 완성! +${newBingo * 500}점`;

            createParticles();
        }


        countEl.textContent =
            bingoLines.size;


        const progress =
            Math.min(
                100,
                (
                    bingoLines.size /
                    targetBingo
                ) * 100
            );

        progressEl.style.width =
            progress + "%";


        if(
            bingoLines.size >=
            targetBingo
        ){

            finishGame(true);
        }
    }


    /* =====================================================
       빙고 라인 강조 여부
    ===================================================== */

    function isBingoCell(index){

        for(
            const lineIndex
            of bingoLines
        ){

            if(
                lines[lineIndex]
                    .includes(index)
            ){
                return true;
            }
        }

        return false;
    }


    /* =====================================================
       빙고판 그리기
    ===================================================== */

    function render(){

        board.innerHTML =
            "";


        values.forEach(
            (n,index) => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "cell";


                if(
                    called.has(n)
                ){

                    button.classList.add(
                        "called"
                    );
                }


                if(
                    marked.has(index)
                ){

                    button.classList.add(
                        "marked"
                    );
                }


                if(
                    index === 12
                ){

                    button.classList.add(
                        "free"
                    );
                }


                if(
                    isBingoCell(index)
                ){

                    button.classList.add(
                        "bingo-line"
                    );
                }


                button.textContent =
                    index === 12
                        ? "FREE"
                        : n;


                button.addEventListener(
                    "click",
                    () =>
                        markCell(index)
                );


                board.appendChild(
                    button
                );
            }
        );
    }


    /* =====================================================
       힌트
    ===================================================== */

    function showHint(){

        if(
            !playing ||
            paused
        ){
            return;
        }


        const candidates = [];


        values.forEach(
            (n,index) => {

                if(
                    index !== 12 &&
                    called.has(n) &&
                    !marked.has(index)
                ){

                    candidates.push({
                        n:n,
                        index:index
                    });
                }
            }
        );


        if(
            candidates.length === 0
        ){

            msg.className =
                "message";

            msg.textContent =
                "💡 지금 표시할 수 있는 숫자는 없어요.";

            return;
        }


        /*
            빙고에 가까운 칸을 우선 힌트로 제공
        */
        let best =
            candidates[0];

        let bestValue =
            -1;


        candidates.forEach(
            candidate => {

                let value = 0;


                lines.forEach(
                    line => {

                        if(
                            line.includes(
                                candidate.index
                            )
                        ){

                            value +=
                                line.filter(
                                    i =>
                                        marked.has(i)
                                ).length;
                        }
                    }
                );


                if(
                    value >
                    bestValue
                ){

                    bestValue =
                        value;

                    best =
                        candidate;
                }
            }
        );


        msg.className =
            "message warn";

        msg.textContent =
            `💡 힌트: ${best.n}번을 찾아보세요!`;
    }


    /* =====================================================
       일시정지
    ===================================================== */

    function togglePause(){

        if(
            !playing
        ){
            return;
        }


        paused =
            !paused;


        if(paused){

            pauseBtn.textContent =
                "▶ 계속하기";

            msg.className =
                "message warn";

            msg.textContent =
                "⏸ 게임이 잠시 멈췄습니다.";
        }
        else{

            pauseBtn.textContent =
                "⏸ 일시정지";

            msg.className =
                "message";

            msg.textContent =
                "게임을 계속하세요!";
        }
    }


    /* =====================================================
       게임 성공
    ===================================================== */

    function finishGame(success){

        playing = false;

        clearInterval(timer);

        callBtn.disabled =
            true;

        hintBtn.disabled =
            true;

        pauseBtn.disabled =
            true;


        /*
            남은 공 보너스
        */
        score +=
            bag.length * 30;

        scoreEl.textContent =
            score;


        saveRecords();


        let grade = "C";

        if(
            wrongClicks === 0 &&
            maxCombo >= 8
        ){

            grade = "S";
        }
        else if(
            wrongClicks <= 1
        ){

            grade = "A";
        }
        else if(
            wrongClicks <= 3
        ){

            grade = "B";
        }


        $("#resultTitle")
            .textContent =
                success
                    ? "🎉 BINGO CLEAR!"
                    : "게임 종료";

        $("#resultScore")
            .textContent =
                score;

        $("#resultBingo")
            .textContent =
                bingoLines.size;

        $("#resultCombo")
            .textContent =
                maxCombo;

        $("#resultLeft")
            .textContent =
                bag.length;

        $("#resultGrade")
            .textContent =
                grade;


        setTimeout(
            () =>
                modal
                    .classList
                    .add("show"),
            450
        );


        createParticles();
    }


    /* =====================================================
       축하 효과
    ===================================================== */

    function createParticles(){

        const game =
            $("#game");

        const icons =
            [
                "⭐",
                "✨",
                "🎉",
                "💫"
            ];


        for(
            let i = 0;
            i < 16;
            i++
        ){

            const particle =
                document.createElement(
                    "span"
                );

            particle.className =
                "particle";

            particle.textContent =
                icons[
                    Math.floor(
                        Math.random() *
                        icons.length
                    )
                ];


            particle.style.left =
                45 +
                Math.random() * 10 +
                "%";

            particle.style.top =
                "45%";


            particle.style.setProperty(
                "--x",
                (
                    Math.random() *
                    320 -
                    160
                ) + "px"
            );

            particle.style.setProperty(
                "--y",
                (
                    Math.random() *
                    300 -
                    150
                ) + "px"
            );


            game.appendChild(
                particle
            );


            setTimeout(
                () =>
                    particle.remove(),
                1200
            );
        }
    }


    /* =====================================================
       버튼 이벤트
    ===================================================== */

    startBtn.addEventListener(
        "click",
        startGame
    );


    callBtn.addEventListener(
        "click",
        callNumber
    );


    hintBtn.addEventListener(
        "click",
        showHint
    );


    pauseBtn.addEventListener(
        "click",
        togglePause
    );


    $("#restart")
        .addEventListener(
            "click",
            startGame
        );


    /*
        자동/수동 추첨 변경
    */
    modeSelect.addEventListener(
        "change",
        () => {

            if(!playing){
                return;
            }


            clearInterval(timer);


            if(
                modeSelect.value ===
                "auto"
            ){

                const settings =
                    getSettings();

                timer =
                    setInterval(
                        callNumber,
                        settings.interval
                    );
            }
        }
    );


    /*
        난이도는 다음 게임부터 적용
    */
    difficultySelect.addEventListener(
        "change",
        () => {

            if(playing){

                msg.className =
                    "message warn";

                msg.textContent =
                    "난이도 변경은 새 게임부터 적용됩니다.";
            }
        }
    );


    /* 최초 화면 */

    loadRecords();

    values =
        Array.from(
            {length:25},
            (_,i) => i + 1
        );

    marked =
        new Set([12]);

    render();

})();
</script>

</body>
</html>
