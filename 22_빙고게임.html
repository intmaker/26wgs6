<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🎯 빙고 게임</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;background:linear-gradient(135deg,#075985,#4f46e5,#be185d);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.game{width:min(94vw,650px);padding:22px;border:1px solid #ffffff30;border-radius:24px;background:#101936d9;box-shadow:0 25px 70px #0008}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:0;font-size:clamp(25px,5vw,36px)}.hud{display:flex;gap:7px}.badge{padding:8px 11px;text-align:center;border-radius:13px;background:#ffffff12}.badge small{display:block;color:#cbd5e1;font-size:9px}.badge b{font-size:19px}.caller{margin:16px auto;width:100px;height:100px;display:grid;place-items:center;border:5px solid #ffffff35;border-radius:50%;background:linear-gradient(145deg,#fbbf24,#f97316);color:#31120a;font-size:38px;font-weight:1000;box-shadow:0 10px 30px #f9731644}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.cell{aspect-ratio:1;border:1px solid #ffffff20;border-radius:13px;background:#ffffff10;color:#fff;font:900 clamp(16px,4vw,25px) system-ui;cursor:pointer}.cell.called{box-shadow:inset 0 0 0 3px #fbbf2477}.cell.marked{background:linear-gradient(135deg,#fde047,#fb7185);color:#1f1720;transform:scale(.96)}.cell.free{background:#8b5cf6}.message{min-height:25px;margin:15px 0 0;text-align:center;color:#e2e8f0;font-weight:700}.controls{display:flex;gap:8px;margin-top:14px}.controls button{flex:1;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,#67e8f9,#a7f3d0);color:#102040;font-weight:900;font-size:15px;cursor:pointer}.controls button:last-child{background:#ffffff14;color:#fff}@media(max-width:520px){.game{width:100%;height:100%;border-radius:0;padding:13px;display:flex;flex-direction:column;justify-content:center}.board{gap:4px}.caller{width:78px;height:78px;font-size:31px;margin:10px auto}.cell{border-radius:9px}}
</style></head><body><main class="game"><header class="top"><h1>🎯 럭키 빙고</h1><div class="hud"><div class="badge"><small>빙고</small><b id="count">0</b></div><div class="badge"><small>남은 공</small><b id="left">25</b></div></div></header><div class="caller" id="caller">?</div><div class="board" id="board"></div><div class="message" id="message">게임 시작을 누르면 숫자 공이 하나씩 나옵니다.</div><div class="controls"><button id="start">게임 시작</button><button id="call" disabled>다음 숫자</button></div></main><script>
(()=>{const board=document.querySelector('#board'),caller=document.querySelector('#caller'),countEl=document.querySelector('#count'),leftEl=document.querySelector('#left'),msg=document.querySelector('#message'),startBtn=document.querySelector('#start'),callBtn=document.querySelector('#call');let values=[],called=new Set,marked=new Set,bag=[],playing=false,timer;
const shuffle=a=>{for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const lines=[...[0,1,2,3,4].map(r=>[0,1,2,3,4].map(c=>r*5+c)),...[0,1,2,3,4].map(c=>[0,1,2,3,4].map(r=>r*5+c)),[0,6,12,18,24],[4,8,12,16,20]];
function start(){clearInterval(timer);values=shuffle(Array.from({length:25},(_,i)=>i+1));bag=shuffle(Array.from({length:25},(_,i)=>i+1));called.clear();marked=new Set([12]);playing=true;caller.textContent='?';countEl.textContent=0;leftEl.textContent=25;msg.textContent='나온 숫자를 내 카드에서 찾아 눌러주세요.';startBtn.textContent='새 게임';callBtn.disabled=false;render();timer=setInterval(call,1700)}
function call(){if(!playing||!bag.length)return;const n=bag.pop();called.add(n);caller.textContent=n;leftEl.textContent=bag.length;render();if(!bag.length){clearInterval(timer);msg.textContent='모든 공이 나왔어요. 표시하지 않은 숫자를 확인하세요.'}}
function mark(i){if(!playing||i===12)return;const n=values[i];if(!called.has(n)){msg.textContent=`${n}번 공은 아직 나오지 않았어요!`;return}marked.add(i);render();const count=lines.filter(line=>line.every(j=>marked.has(j))).length;countEl.textContent=count;if(count>=3){playing=false;clearInterval(timer);callBtn.disabled=true;msg.textContent='🎉 3줄 빙고 완성! 축하합니다!'}}
function render(){board.innerHTML='';values.forEach((n,i)=>{const b=document.createElement('button');b.className='cell'+(called.has(n)?' called':'')+(marked.has(i)?' marked':'')+(i===12?' free':'');b.textContent=i===12?'FREE':n;b.onclick=()=>mark(i);board.appendChild(b)})}startBtn.onclick=start;callBtn.onclick=call;render()})();</script></body></html>
