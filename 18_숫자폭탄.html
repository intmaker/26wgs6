<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>💣 숫자 폭탄</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#dc2626,#3b1220 48%,#14070c);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.game{width:min(94vw,660px);padding:24px;border:1px solid #ffffff2b;border-radius:25px;background:#25101ddd;box-shadow:0 25px 70px #0008}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;font-size:clamp(26px,5vw,38px)}.hud{display:flex;gap:7px}.badge{padding:8px 11px;border-radius:13px;text-align:center;background:#ffffff10}.badge small{display:block;color:#fecaca;font-size:9px}.badge b{font-size:19px}.bomb{text-align:center;font-size:74px;margin:12px 0 0;filter:drop-shadow(0 10px 20px #0008)}.problem{margin:5px 0 17px;text-align:center;font-size:clamp(35px,8vw,62px);font-weight:1000}.fuse{height:13px;margin-bottom:18px;border-radius:8px;background:#ffffff12;overflow:hidden}.fuse i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#22c55e,#facc15,#ef4444);transform-origin:left}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answers button{padding:17px;border:1px solid #ffffff1f;border-radius:14px;color:#fff;background:#ffffff10;font-size:22px;font-weight:900;cursor:pointer}.answers button:hover{background:#ffffff20;transform:translateY(-2px)}.message{min-height:26px;margin-top:15px;text-align:center;color:#fecaca;font-weight:800}.start{display:block;width:100%;margin-top:13px;padding:13px;border:0;border-radius:13px;background:linear-gradient(135deg,#fde047,#fb7185);color:#321017;font-weight:900;font-size:15px;cursor:pointer}@media(max-width:520px){.game{width:100%;min-height:100%;border-radius:0;display:flex;flex-direction:column;justify-content:center;padding:16px}}
</style></head><body><main class="game"><header class="top"><h1>💣 숫자 폭탄</h1><div class="hud"><div class="badge"><small>점수</small><b id="score">0</b></div><div class="badge"><small>목숨</small><b id="lives">❤️❤️❤️</b></div></div></header><div class="bomb" id="bomb">💣</div><div class="problem" id="problem">준비!</div><div class="fuse"><i id="fuse"></i></div><div class="answers" id="answers"></div><div class="message" id="message">제한 시간 안에 정답을 골라 폭탄을 해체하세요.</div><button class="start" id="start">게임 시작</button></main><script>
(()=>{const problem=document.querySelector('#problem'),answers=document.querySelector('#answers'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),fuse=document.querySelector('#fuse'),msg=document.querySelector('#message'),startBtn=document.querySelector('#start'),bomb=document.querySelector('#bomb');let score=0,lives=3,answer=0,on=false,raf,startTime,limit=5000;
const rand=(a,b)=>Math.floor(a+Math.random()*(b-a+1)),shuffle=a=>a.sort(()=>Math.random()-.5);
function start(){score=0;lives=3;on=true;scoreEl.textContent=0;livesEl.textContent='❤️❤️❤️';startBtn.disabled=true;startBtn.textContent='해체 진행 중';next()}
function next(){cancelAnimationFrame(raf);const op=['+','−','×'][rand(0,2)],a=rand(2,Math.min(15,7+score)),b=rand(2,Math.min(12,6+score));if(op==='+')answer=a+b;else if(op==='−')answer=Math.abs(a-b);else answer=a*b;problem.textContent=op==='−'?`${Math.max(a,b)} − ${Math.min(a,b)} = ?`:`${a} ${op} ${b} = ?`;const set=new Set([answer]);while(set.size<4){const w=Math.max(0,answer+rand(-Math.max(4,score+4),Math.max(4,score+4)));if(w!==answer)set.add(w)}answers.innerHTML='';shuffle([...set]).forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>choose(v);answers.appendChild(b)});limit=Math.max(1900,5000-score*120);startTime=performance.now();bomb.textContent='💣';msg.textContent='퓨즈가 다 타기 전에 정답을 선택하세요!';raf=requestAnimationFrame(tick)}
function tick(t){if(!on)return;const left=1-(t-startTime)/limit;fuse.style.transform=`scaleX(${Math.max(0,left)})`;if(left<=0)return lose('시간 초과! 폭탄이 터졌어요.');raf=requestAnimationFrame(tick)}function choose(v){if(!on)return;if(v===answer){cancelAnimationFrame(raf);score++;scoreEl.textContent=score;bomb.textContent='🛠️';msg.textContent='해체 성공! 다음 폭탄이 옵니다.';setTimeout(next,350)}else lose('오답! 폭탄이 터졌어요.')}
function lose(text){cancelAnimationFrame(raf);lives--;livesEl.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);bomb.textContent='💥';msg.textContent=text;if(lives<=0)return finish();setTimeout(next,700)}function finish(){on=false;answers.innerHTML='';problem.textContent=`${score}개 해체`;msg.textContent='게임 종료! 더 빠르고 정확하게 다시 도전하세요.';startBtn.disabled=false;startBtn.textContent='다시 시작';fuse.style.transform='scaleX(0)'}startBtn.onclick=start;
})();</script></body></html>
