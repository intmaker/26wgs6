<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"><title>🛡️ 나노 타워 디펜스</title><style>
:root{--c1:#0e7490;--c2:#67e8f9}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 18% 10%,var(--c1),#11162e 52%,#030712);user-select:none;-webkit-user-select:none}.app{width:min(95vw,720px);height:min(95vh,860px);display:flex;flex-direction:column;gap:11px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 4px}.brand small{display:block;color:#cbd5e1;font-size:10px;font-weight:900;letter-spacing:.2em}.brand h1{margin:2px 0 0;font-size:clamp(25px,5vw,38px);letter-spacing:-.05em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:67px;padding:7px 10px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#0f172ac7}.stat small{display:block;color:#cbd5e1;font-size:9px}.stat b{font-size:19px}.stage{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff27;border-radius:25px;background:linear-gradient(145deg,#14203b,#090e21);box-shadow:0 25px 70px #0009;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#050916e9}.overlay.hide{display:none}.card{width:min(100%,410px);padding:28px 24px;text-align:center;border:1px solid #ffffff25;border-radius:23px;background:#111a36ee;box-shadow:0 20px 55px #0008}.card .emoji{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{margin:0 0 19px;color:#cbd5e1;font-size:14px;line-height:1.72;word-break:keep-all}.primary{min-height:48px;width:100%;padding:12px 18px;border:0;border-radius:13px;color:#08111f;background:linear-gradient(135deg,var(--c2),#fef3c7);font:900 15px system-ui;cursor:pointer}.tip{min-height:18px;text-align:center;color:#aebbd0;font-size:12px}.hidden{display:none!important}button{font-family:inherit}#canvas{display:block;width:100%;height:100%;background:#061b25}.td-panel{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;padding:9px;border:1px solid #ffffff24;border-radius:13px;background:#071827d9}.td-panel button{min-height:46px;border:0;border-radius:10px;padding:10px 15px;background:#22d3ee;color:#083344;font-weight:900}.td-panel span{font-size:12px;color:#cffafe}.stage{touch-action:manipulation}
@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.stage{min-height:0;border-radius:20px}.brand h1{font-size:25px}.stat{min-width:61px;padding:6px 8px}.card{padding:24px 19px}.tip{font-size:11px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><small>NANO DEFENSE</small><h1>🛡️ 나노 타워 디펜스</h1></div><div class="hud" id="hud"></div></header><section class="stage" id="stage"><canvas id="canvas"></canvas><div class="td-panel"><button id="waveBtn">▶ 웨이브 시작</button><span id="tdMsg">빈 원을 눌러 포탑을 설치하세요.</span></div><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="resultEmoji">🛡️</div><h2 id="resultTitle">나노 타워 디펜스</h2><p id="resultText">경로 주변에 포탑을 설치하고 업그레이드해 여섯 차례 적의 공격을 막으세요.</p><button class="primary" id="startBtn">게임 시작</button></div></div></section><div class="tip">경로 주변에 포탑을 설치하고 업그레이드해 여섯 차례 적의 공격을 막으세요.</div></main><script>
const $=s=>document.querySelector(s),stage=$('#stage'),overlay=$('#overlay'),startBtn=$('#startBtn');
const safeGet=(k,d=0)=>{try{return Number(localStorage.getItem(k))||d}catch(e){return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function showResult(icon,title,text,button='다시 하기'){ $('#resultEmoji').textContent=icon;$('#resultTitle').textContent=title;$('#resultText').innerHTML=text;startBtn.textContent=button;overlay.classList.remove('hide') }
const C=$('#canvas'),X=C.getContext('2d'),waveBtn=$('#waveBtn'),tdMsg=$('#tdMsg'),hud=$('#hud');let W,H,D=1,running=false,waveActive=false,last=0,wave=0,money=120,hp=10,enemies=[],towers=[],bullets=[],spawnLeft=0,spawnTimer=0,raf;hud.innerHTML='<div class="stat"><small>에너지</small><b id="money">120</b></div><div class="stat"><small>기지</small><b id="hp">10</b></div><div class="stat"><small>웨이브</small><b id="wave">0</b></div>';const slots=[[.2,.23],[.42,.25],[.67,.23],[.78,.48],[.57,.62],[.33,.62],[.18,.78],[.7,.82]];
function resize(){const r=stage.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);draw()}const path=()=>[[0,H*.42],[W*.28,H*.42],[W*.28,H*.72],[W*.73,H*.72],[W*.73,H*.38],[W,H*.38]];
function startGame(){running=true;waveActive=false;wave=0;money=120;hp=10;enemies=[];towers=[];bullets=[];updateHud();overlay.classList.add('hide');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function updateHud(){$('#money').textContent=money;$('#hp').textContent=hp;$('#wave').textContent=wave}
function startWave(){if(!running||waveActive)return;wave++;waveActive=true;spawnLeft=6+wave*2;spawnTimer=0;waveBtn.disabled=true;tdMsg.textContent=`웨이브 ${wave}: 적 ${spawnLeft}기 접근 중`;updateHud()}
function spawnEnemy(){enemies.push({x:0,y:H*.42,path:1,hp:25+wave*10,max:25+wave*10,speed:42+wave*3,r:13})}
function update(dt){if(waveActive&&spawnLeft>0){spawnTimer-=dt;if(spawnTimer<=0){spawnTimer=Math.max(.32,.8-wave*.03);spawnLeft--;spawnEnemy()}}const pts=path();for(const e of enemies){const t=pts[e.path],dx=t[0]-e.x,dy=t[1]-e.y,dist=Math.hypot(dx,dy);if(dist<3){e.path++;if(e.path>=pts.length){e.dead=true;hp--;updateHud();if(hp<=0)return end(false)}}else{e.x+=dx/dist*e.speed*dt;e.y+=dy/dist*e.speed*dt}}for(const t of towers){t.cool-=dt;const target=enemies.filter(e=>!e.dead&&Math.hypot(e.x-t.x,e.y-t.y)<125).sort((a,b)=>b.path-a.path)[0];if(target&&t.cool<=0){t.cool=.55;bullets.push({x:t.x,y:t.y,target,speed:360})}}for(const b of bullets){if(b.target.dead){b.dead=true;continue}const dx=b.target.x-b.x,dy=b.target.y-b.y,dist=Math.hypot(dx,dy);if(dist<10){b.dead=true;b.target.hp-=14;if(b.target.hp<=0){b.target.dead=true;money+=12;updateHud()}}else{b.x+=dx/dist*b.speed*dt;b.y+=dy/dist*b.speed*dt}}enemies=enemies.filter(e=>!e.dead);bullets=bullets.filter(b=>!b.dead);if(waveActive&&spawnLeft===0&&!enemies.length){waveActive=false;waveBtn.disabled=false;money+=35;updateHud();tdMsg.textContent=wave>=6?'모든 웨이브 방어 성공!':'다음 웨이브 전 포탑을 보강하세요.';if(wave>=6)end(true)}}
function place(x,y){if(!running)return;let bestI=-1,bestD=40;slots.forEach((s,i)=>{const d=Math.hypot(x-s[0]*W,y-s[1]*H);if(d<bestD){bestD=d;bestI=i}});if(bestI<0)return;const existing=towers.find(t=>t.slot===bestI);if(existing){if(money>=35){money-=35;existing.level++;existing.cool=Math.max(.2,existing.cool-.06);tdMsg.textContent=`포탑 ${existing.level}레벨 업그레이드`}else tdMsg.textContent='업그레이드 에너지가 부족합니다.'}else if(money>=45){money-=45;const s=slots[bestI];towers.push({slot:bestI,x:s[0]*W,y:s[1]*H,cool:0,level:1});tdMsg.textContent='나노 포탑을 설치했습니다.'}else tdMsg.textContent='설치 에너지가 부족합니다.';updateHud()}
function draw(){X.clearRect(0,0,W,H);X.fillStyle='#061b25';X.fillRect(0,0,W,H);const pts=path();X.strokeStyle='#334155';X.lineWidth=32;X.lineCap='round';X.lineJoin='round';X.beginPath();X.moveTo(...pts[0]);pts.slice(1).forEach(p=>X.lineTo(...p));X.stroke();X.strokeStyle='#64748b';X.lineWidth=3;X.setLineDash([10,12]);X.stroke();X.setLineDash([]);slots.forEach((s,i)=>{X.strokeStyle=towers.some(t=>t.slot===i)?'#22d3ee':'#ffffff55';X.lineWidth=3;X.beginPath();X.arc(s[0]*W,s[1]*H,22,0,7);X.stroke()});for(const t of towers){X.fillStyle='#22d3ee';X.shadowColor='#22d3ee';X.shadowBlur=12;X.beginPath();X.arc(t.x,t.y,15+t.level,0,7);X.fill();X.shadowBlur=0;X.fillStyle='#083344';X.fillText(t.level,t.x-3,t.y+4)}for(const e of enemies){X.fillStyle='#fb7185';X.beginPath();X.arc(e.x,e.y,e.r,0,7);X.fill();X.fillStyle='#111827';X.fillRect(e.x-16,e.y-21,32,4);X.fillStyle='#4ade80';X.fillRect(e.x-16,e.y-21,32*e.hp/e.max,4)}for(const b of bullets){X.fillStyle='#fde047';X.beginPath();X.arc(b.x,b.y,4,0,7);X.fill()}X.font='25px sans-serif';X.fillText('🏠',W-35,H*.38+9)}function loop(t){if(!running)return;const dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}function end(win){running=false;waveActive=false;cancelAnimationFrame(raf);showResult(win?'🏆':'💥',win?'기지 방어 성공!':'기지가 파괴됐어요',win?'6개의 웨이브를 모두 막았습니다. 설치 위치와 업그레이드 타이밍이 훌륭해요.':`웨이브 ${wave}에서 방어선이 무너졌습니다. 길이 꺾이는 곳에 포탑을 집중해 보세요.`)}C.onclick=e=>{const r=C.getBoundingClientRect();place(e.clientX-r.left,e.clientY-r.top)};waveBtn.onclick=startWave;startBtn.onclick=startGame;addEventListener('resize',resize);resize();
</script></body></html>
