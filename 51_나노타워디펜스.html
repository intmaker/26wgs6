<script>
const $=s=>document.querySelector(s);

const stage=$('#stage');
const overlay=$('#overlay');
const startBtn=$('#startBtn');

const C=$('#canvas');
const X=C.getContext('2d');

const tdMsg=$('#tdMsg');

const moneyEl=$('#money');
const scoreEl=$('#score');
const timeEl=$('#time');
const killsEl=$('#kills');
const timerBar=$('#timerBar');

let W=1;
let H=1;
let D=1;

let running=false;
let last=0;
let startTime=0;
let raf=0;

let duration=60;
let remaining=60;

let money=120;
let score=500;
let kills=0;

let enemies=[];
let towers=[];
let bullets=[];

let spawnTimer=0;

const slots=[
  [.20,.23],
  [.42,.25],
  [.67,.23],
  [.78,.48],
  [.57,.62],
  [.33,.62],
  [.18,.78],
  [.70,.82]
];

function resize(){

  const r=stage.getBoundingClientRect();

  D=Math.min(
    2,
    devicePixelRatio||1
  );

  W=r.width;
  H=r.height;

  C.width=W*D;
  C.height=H*D;

  X.setTransform(
    D,0,0,D,0,0
  );

  updateTowerPositions();

  draw();
}

function path(){
  return[
    [0,H*.42],
    [W*.28,H*.42],
    [W*.28,H*.72],
    [W*.73,H*.72],
    [W*.73,H*.38],
    [W,H*.38]
  ];
}

function updateTowerPositions(){

  for(const t of towers){

    const s=slots[t.slot];

    t.x=s[0]*W;
    t.y=s[1]*H;
  }
}

function showToast(text){

  const toast=$('#toast');

  toast.textContent=text;

  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');

  clearTimeout(showToast.timer);

  showToast.timer=setTimeout(()=>{
    toast.classList.remove('show');
  },600);
}

function shake(){

  stage.classList.remove('shake');
  void stage.offsetWidth;
  stage.classList.add('shake');
}

function startGame(){

  running=true;

  duration=60;
  remaining=60;

  money=120;
  score=500;
  kills=0;

  enemies=[];
  towers=[];
  bullets=[];

  spawnTimer=.5;

  startTime=
    performance.now();

  updateHud();

  tdMsg.textContent=
    '방어 시작! 포탑을 설치하세요.';

  overlay.classList.add('hide');

  last=
    performance.now();

  cancelAnimationFrame(raf);

  raf=
    requestAnimationFrame(loop);
}

function updateHud(){

  moneyEl.textContent=
    Math.round(money);

  scoreEl.textContent=
    Math.max(0,Math.round(score));

  killsEl.textContent=
    kills;

  timeEl.textContent=
    Math.ceil(remaining);

  timerBar.style.width=
    `${Math.max(0,remaining/duration*100)}%`;
}

function spawnEnemy(){

  const elapsed=
    duration-remaining;

  const difficulty=
    1+elapsed/25;

  const maxHp=
    24+
    elapsed*1.4;

  const roll=Math.random();

  let enemy;

  if(
    elapsed>30 &&
    roll<.15
  ){

    /*
      빠른 적
    */

    enemy={
      x:0,
      y:H*.42,
      path:1,
      hp:maxHp*.75,
      max:maxHp*.75,
      speed:68+difficulty*5,
      r:10,
      type:'fast',
      dead:false
    };

  }else if(
    elapsed>40 &&
    roll>.82
  ){

    /*
      중장갑 적
    */

    enemy={
      x:0,
      y:H*.42,
      path:1,
      hp:maxHp*2,
      max:maxHp*2,
      speed:35+difficulty*2,
      r:17,
      type:'tank',
      dead:false
    };

  }else{

    enemy={
      x:0,
      y:H*.42,
      path:1,
      hp:maxHp,
      max:maxHp,
      speed:43+difficulty*3,
      r:13,
      type:'normal',
      dead:false
    };
  }

  enemies.push(enemy);
}

function update(dt,now){

  const elapsed=
    (now-startTime)/1000;

  remaining=
    Math.max(
      0,
      duration-elapsed
    );

  if(remaining<=0){

    endGame('time');
    return;
  }

  /*
    적 자동 생성
  */

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawnEnemy();

    const elapsed=
      duration-remaining;

    spawnTimer=
      Math.max(
        .25,
        .85-elapsed*.008
      );
  }

  const pts=path();

  /*
    적 이동
  */

  for(const e of enemies){

    if(e.dead)continue;

    const target=
      pts[e.path];

    if(!target)continue;

    const dx=
      target[0]-e.x;

    const dy=
      target[1]-e.y;

    const dist=
      Math.hypot(dx,dy);

    if(dist<3){

      e.path++;

      if(e.path>=pts.length){

        e.dead=true;

        score=
          Math.max(
            0,
            score-80
          );

        showToast('🏠 기지 침투 -80');

        tdMsg.textContent=
          '적이 기지에 침투했습니다!';

        shake();

        updateHud();

        if(score<=0){

          endGame('score');
          return;
        }
      }

    }else{

      e.x+=
        dx/dist*
        e.speed*
        dt;

      e.y+=
        dy/dist*
        e.speed*
        dt;
    }
  }

  /*
    포탑 공격
  */

  for(const t of towers){

    t.cool-=dt;

    const range=
      120+
      t.level*10;

    const target=
      enemies
      .filter(e=>
        !e.dead &&
        Math.hypot(
          e.x-t.x,
          e.y-t.y
        )<range
      )
      .sort((a,b)=>
        b.path-a.path
      )[0];

    if(
      target &&
      t.cool<=0
    ){

      const fireRate=
        Math.max(
          .18,
          .62-t.level*.08
        );

      t.cool=fireRate;

      bullets.push({
        x:t.x,
        y:t.y,
        target,
        speed:370,
        damage:
          12+
          t.level*6,
        dead:false
      });
    }
  }

  /*
    탄환 이동
  */

  for(const b of bullets){

    if(
      b.dead ||
      !b.target ||
      b.target.dead
    ){
      b.dead=true;
      continue;
    }

    const dx=
      b.target.x-b.x;

    const dy=
      b.target.y-b.y;

    const dist=
      Math.hypot(dx,dy);

    if(dist<10){

      b.dead=true;

      b.target.hp-=
        b.damage;

      if(b.target.hp<=0){

        b.target.dead=true;

        kills++;

        let reward=20;

        if(b.target.type==='tank'){
          reward=35;
        }

        if(b.target.type==='fast'){
          reward=25;
        }

        score+=reward;
        money+=10;

        showToast(
          `💥 처치 +${reward}`
        );

        updateHud();
      }

    }else{

      b.x+=
        dx/dist*
        b.speed*
        dt;

      b.y+=
        dy/dist*
        b.speed*
        dt;
    }
  }

  enemies=
    enemies.filter(e=>!e.dead);

  bullets=
    bullets.filter(b=>!b.dead);

  /*
    자동 에너지 충전
  */

  money+=dt*2;

  updateHud();
}

function place(x,y){

  if(!running)return;

  let bestI=-1;
  let bestD=40;

  slots.forEach((s,i)=>{

    const sx=s[0]*W;
    const sy=s[1]*H;

    const d=
      Math.hypot(
        x-sx,
        y-sy
      );

    if(d<bestD){
      bestD=d;
      bestI=i;
    }
  });

  if(bestI<0)return;

  const existing=
    towers.find(
      t=>t.slot===bestI
    );

  /*
    업그레이드
  */

  if(existing){

    const upgradeCost=
      30+
      existing.level*15;

    if(existing.level>=5){

      tdMsg.textContent=
        '포탑은 이미 최고 레벨입니다.';

      showToast('MAX LEVEL');

      return;
    }

    if(money>=upgradeCost){

      money-=upgradeCost;

      existing.level++;

      tdMsg.textContent=
        `포탑 LEVEL ${existing.level} 업그레이드!`;

      showToast(
        `⬆️ LEVEL ${existing.level}`
      );

    }else{

      tdMsg.textContent=
        `업그레이드 에너지 ${upgradeCost} 필요`;
    }

  }else{

    /*
      신규 설치
    */

    if(money>=45){

      money-=45;

      const s=
        slots[bestI];

      towers.push({
        slot:bestI,
        x:s[0]*W,
        y:s[1]*H,
        cool:0,
        level:1
      });

      tdMsg.textContent=
        '나노 포탑을 설치했습니다.';

      showToast('🛡️ 포탑 설치');

    }else{

      tdMsg.textContent=
        '설치 에너지가 부족합니다.';
    }
  }

  updateHud();
}

function boost(){

  if(!running)return;

  /*
    점수를 일부 사용해 에너지 획득
  */

  if(score<=100){

    tdMsg.textContent=
      '점수가 너무 낮아 긴급충전을 사용할 수 없습니다.';

    return;
  }

  score-=50;
  money+=60;

  showToast(
    '⚡ 에너지 +60 / 점수 -50'
  );

  tdMsg.textContent=
    '점수를 사용해 긴급 에너지를 충전했습니다.';

  updateHud();

  if(score<=0){
    endGame('score');
  }
}

function draw(){

  X.clearRect(
    0,0,W,H
  );

  /*
    배경
  */

  X.fillStyle='#061b25';
  X.fillRect(0,0,W,H);

  /*
    경로
  */

  const pts=path();

  X.strokeStyle='#334155';
  X.lineWidth=32;
  X.lineCap='round';
  X.lineJoin='round';

  X.beginPath();
  X.moveTo(...pts[0]);

  pts
    .slice(1)
    .forEach(p=>
      X.lineTo(...p)
    );

  X.stroke();

  X.strokeStyle='#64748b';
  X.lineWidth=3;
  X.setLineDash([10,12]);

  X.stroke();

  X.setLineDash([]);

  /*
    설치 슬롯
  */

  slots.forEach((s,i)=>{

    const used=
      towers.some(
        t=>t.slot===i
      );

    X.strokeStyle=
      used
        ?'#22d3ee'
        :'#ffffff55';

    X.lineWidth=3;

    X.beginPath();

    X.arc(
      s[0]*W,
      s[1]*H,
      22,
      0,
      Math.PI*2
    );

    X.stroke();
  });

  /*
    포탑
  */

  for(const t of towers){

    X.fillStyle='#22d3ee';

    X.shadowColor='#22d3ee';
    X.shadowBlur=12;

    X.beginPath();

    X.arc(
      t.x,
      t.y,
      14+t.level,
      0,
      Math.PI*2
    );

    X.fill();

    X.shadowBlur=0;

    X.fillStyle='#083344';

    X.font='bold 11px sans-serif';
    X.textAlign='center';

    X.fillText(
      t.level,
      t.x,
      t.y+4
    );
  }

  /*
    적
  */

  for(const e of enemies){

    if(e.type==='tank'){
      X.fillStyle='#a855f7';
    }
    else if(e.type==='fast'){
      X.fillStyle='#facc15';
    }
    else{
      X.fillStyle='#fb7185';
    }

    X.beginPath();

    X.arc(
      e.x,
      e.y,
      e.r,
      0,
      Math.PI*2
    );

    X.fill();

    /*
      체력바
    */

    X.fillStyle='#111827';

    X.fillRect(
      e.x-16,
      e.y-e.r-10,
      32,
      4
    );

    X.fillStyle='#4ade80';

    X.fillRect(
      e.x-16,
      e.y-e.r-10,
      32*
      Math.max(0,e.hp/e.max),
      4
    );
  }

  /*
    총알
  */

  for(const b of bullets){

    X.fillStyle='#fde047';

    X.shadowColor='#fde047';
    X.shadowBlur=8;

    X.beginPath();

    X.arc(
      b.x,
      b.y,
      4,
      0,
      Math.PI*2
    );

    X.fill();

    X.shadowBlur=0;
  }

  /*
    기지
  */

  X.font='28px sans-serif';
  X.textAlign='center';

  X.fillText(
    '🏠',
    W-27,
    H*.38+10
  );
}

function loop(t){

  if(!running)return;

  const dt=
    Math.min(
      .035,
      (t-last)/1000
    );

  last=t;

  update(dt,t);

  draw();

  if(running){
    raf=
      requestAnimationFrame(loop);
  }
}

function endGame(reason){

  if(!running)return;

  running=false;

  cancelAnimationFrame(raf);

  const success=
    reason==='time';

  let rank='C';

  if(kills>=20){
    rank='B';
  }

  if(kills>=30){
    rank='A';
  }

  if(kills>=40){
    rank='S';
  }

  $('#resultEmoji').textContent=
    success
      ?'🏆'
      :'💥';

  $('#resultTitle').textContent=
    success
      ?'60초 방어 성공!'
      :'방어선 붕괴!';

  $('#resultText').innerHTML=
    `<b style="font-size:29px;color:#fde047">RANK ${rank}</b><br><br>`+
    (
      success
        ?'60초 동안 기지를 지켜냈습니다!'
        :'점수가 0이 되어 방어 작전이 종료되었습니다.'
    )+
    `<br><br>`+
    `적 처치 <b>${kills}</b>기<br>`+
    `최종 점수 <b>${Math.max(0,Math.round(score))}</b>점<br>`+
    `남은 에너지 <b>${Math.round(money)}</b><br>`+
    `설치 포탑 <b>${towers.length}</b>개`;

  startBtn.textContent=
    '60초 다시 방어';

  startBtn.onclick=startGame;

  overlay.classList.remove('hide');
}

C.addEventListener(
  'pointerdown',
  e=>{

    const r=
      C.getBoundingClientRect();

    place(
      e.clientX-r.left,
      e.clientY-r.top
    );
  }
);

$('#boostBtn').onclick=
  boost;

startBtn.onclick=
  startGame;

addEventListener(
  'resize',
  resize
);

resize();
</script>

</body>
</html>
