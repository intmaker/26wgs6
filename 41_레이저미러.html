<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🔭 레이저 미러</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 70% 10%,#581c87,#11102e 48%,#030712);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(94vw,680px);height:min(94vh,820px);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#f0abfc;font-weight:900}h1{font-size:clamp(26px,5vw,38px);margin:2px 0}.stats{display:flex;gap:7px}.stat{min-width:70px;padding:8px;text-align:center;border:1px solid #ffffff24;border-radius:14px;background:#241441cc}.stat small{display:block;color:#d8b4fe;font-size:9px}.stat b{font-size:20px}.game{position:relative;flex:1;min-height:390px;display:grid;place-items:center;padding:15px;border:1px solid #ffffff25;border-radius:25px;background:linear-gradient(145deg,#21113e,#09152d);box-shadow:0 25px 70px #0009}.board{position:relative;width:min(100%,520px);aspect-ratio:1;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:#040a18;border:6px solid #263354;border-radius:15px;overflow:hidden}.cell{position:relative;border:1px solid #ffffff0d;background:#0c1630}.mirror{width:100%;height:100%;border:0;background:transparent;color:#e9d5ff;font:900 clamp(32px,8vw,61px)/1 monospace;cursor:pointer;text-shadow:0 0 12px #d946ef;transition:.15s}.mirror:hover{background:#d946ef15}.source,.target{display:grid;place-items:center;font-size:clamp(25px,6vw,45px)}.beam-layer{position:absolute;inset:0;pointer-events:none;z-index:2}.beam{position:absolute;background:#fb7185;box-shadow:0 0 7px #fff,0 0 18px #f43f5e;border-radius:4px}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;border-radius:inherit;background:#080817e8}.overlay.hide{display:none}.card{max-width:390px;padding:28px 24px;text-align:center;border:1px solid #ffffff24;border-radius:23px;background:#221442}.ico{font-size:54px}.card h2{margin:8px;font-size:28px}.card p{color:#ddd6fe;font-size:14px;line-height:1.7}.card button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#e879f9,#818cf8);color:#1e103b;font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#c4b5fd;font-size:12px}@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.game{padding:8px;border-radius:20px}.board{gap:2px;border-width:4px}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">LASER LAB</div><h1>🔭 레이저 미러</h1></div><div class="stats"><div class="stat"><small>회전</small><b id="moves">0</b></div><div class="stat"><small>목표</small><b>🎯</b></div></div></header><section class="game"><div class="board" id="board"><div class="beam-layer" id="beams"></div></div><div class="overlay" id="over"><div class="card"><div class="ico" id="ico">🔭</div><h2 id="title">빛의 길을 만드세요</h2><p id="desc">거울을 누르면 <b>/</b>와 <b>\</b> 방향이 바뀝니다.<br>왼쪽 레이저를 반사시켜 오른쪽 목표에 보내세요.<br>빛의 진행 경로가 실시간으로 표시됩니다.</p><button id="start">실험 시작</button></div></div></section><div class="tip">거울 클릭·터치로 회전 · 레이저를 🎯까지 연결</div></main><script>
(()=>{const N=6,board=document.querySelector('#board'),beamBox=document.querySelector('#beams'),over=document.querySelector('#over'),movesEl=document.querySelector('#moves');let cells=[],moves=0,playing=false;const mirrorMap=new Map([[14,'\\'],[26,'/'],[24,'\\'],[6,'/'],[4,'/'],[21,'\\']]);
function start(){cells=Array(N*N).fill(null);for(const [i,sol] of mirrorMap)cells[i]={v:Math.random()<.5?'/':'\\',sol};moves=0;movesEl.textContent=0;playing=true;over.classList.add('hide');render();trace()}
function render(){[...board.querySelectorAll('.cell')].forEach(e=>e.remove());for(let i=0;i<N*N;i++){const c=document.createElement('div');c.className='cell';if(i===12){c.classList.add('source');c.textContent='🔴'}else if(i===11){c.classList.add('target');c.textContent='🎯'}else if(cells[i]){const b=document.createElement('button');b.className='mirror';b.textContent=cells[i].v;b.onclick=()=>{if(!playing)return;cells[i].v=cells[i].v==='/'?'\\':'/';movesEl.textContent=++moves;render();trace()};c.appendChild(b)}board.appendChild(c)}}
function trace(){beamBox.innerHTML='';let x=0,y=2,d=1,seen=new Set,steps=[];for(let k=0;k<80;k++){const key=`${x},${y},${d}`;if(seen.has(key))break;seen.add(key);steps.push({x,y,d});const i=y*N+x,m=cells[i]?.v;if(m==='/')d=[1,0,3,2][d];if(m==='\\')d=[3,2,1,0][d];const nx=x+[0,1,0,-1][d],ny=y+[-1,0,1,0][d];if(nx===N&&ny===1){drawBeam(steps);return win()}if(nx<0||nx>=N||ny<0||ny>=N)break;x=nx;y=ny}drawBeam(steps)}
function drawBeam(steps){const size=board.clientWidth/N;for(const s of steps){const b=document.createElement('i');b.className='beam';if(s.d%2){b.style.cssText=`left:${s.x*size}px;top:${s.y*size+size/2-2}px;width:${size}px;height:4px`}else{b.style.cssText=`left:${s.x*size+size/2-2}px;top:${s.y*size}px;width:4px;height:${size}px`}beamBox.appendChild(b)}}
function win(){if(!playing)return;playing=false;document.querySelector('#ico').textContent='✨';document.querySelector('#title').textContent='레이저 연결 성공!';document.querySelector('#desc').innerHTML=`${moves}번 회전으로 목표를 밝혔습니다.<br>다른 배치로 다시 실험해 보세요.`;document.querySelector('#start').textContent='새 실험';setTimeout(()=>over.classList.remove('hide'),500)}document.querySelector('#start').onclick=start;addEventListener('resize',()=>playing&&trace())})();</script></body></html>
