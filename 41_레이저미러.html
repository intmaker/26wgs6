<style>
*{box-sizing:border-box}
html,body{height:100%}

body{
  margin:0;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 70% 10%,#581c87,#11102e 48%,#030712);
  color:#fff;
  font-family:system-ui,"Noto Sans KR",sans-serif;

}

.app{
  width:min(95vw,700px);
  height:min(96vh,840px);

  flex-direction:column;
  gap:10px
}

.top{
  display:flex;

}

}

}

  .app{
    width:100%;

    padding:8px
  }

  .game{
    padding:8px;
    border-radius:20px
  }

  .board{
    gap:2px;

  }

  .stat{
    min-width:53px;

  }

  .stat b{
    font-size:15px
  }

<body>

<main class="app">

<header class="top">

<div>
  <div class="tag">LASER LAB CHALLENGE</div>
  <h1>🔭 레이저 미러</h1>
</div>

<div class="stats">

  <div class="stat">
    <small>시간</small>
    <b id="time">60</b>
  </div>

  <div class="stat">
    <small>퍼즐</small>
    <b id="round">1</b>
  </div>

  <div class="stat">
    <small>점수</small>
    <b id="score">500</b>
  </div>

  <div class="stat">
    <small>콤보</small>
    <b id="combo">0</b>
  </div>

</div>

</header>

<section class="game" id="game">

<div class="timer-wrap">
  <div class="timer-bar" id="timerBar"></div>
</div>

<div class="board" id="board">
  <div class="beam-layer" id="beams"></div>
</div>

<div class="toast" id="toast">
  ✨ 연결 성공!
</div>

<div class="status" id="status">
  거울을 눌러 레이저를 🎯까지 연결하세요.
</div>

<div class="overlay" id="over">

<div class="card">

  <div class="ico" id="ico">🔭</div>

  <h2 id="title">
    빛의 길을 만드세요
  </h2>

  <p id="desc">
    거울을 누르면
    <b style="font-size:20px">╱</b> 와
    <b style="font-size:20px">╲</b>
    방향이 바뀝니다.<br><br>

    레이저를 반사해 🎯에 연결하세요.<br>
    성공하면 바로 다음 퍼즐이 시작됩니다.<br><br>

    <b>60초 동안 최대한 많은 퍼즐을 해결하세요!</b>
  </p>

  <button id="start">
    60초 실험 시작
  </button>

</div>

</div>

</section>

<div class="tip">
╱ ╲ 거울 클릭·터치 · 레이저 연결 · 60초 연속 퍼즐
</div>

</main>

<script>
(()=>{
const N=6;

const board=
  document.querySelector('#board');

const beamBox=
  document.querySelector('#beams');

const over=
  document.querySelector('#over');

const game=
  document.querySelector('#game');

const timeEl=
  document.querySelector('#time');

const roundEl=
  document.querySelector('#round');

const scoreEl=
  document.querySelector('#score');

const comboEl=
  document.querySelector('#combo');

const timerBar=
  document.querySelector('#timerBar');

const status=
  document.querySelector('#status');

const toast=
  document.querySelector('#toast');

let cells=[];

let playing=false;

let round=1;
let score=500;
let combo=0;
let solved=0;
let totalMoves=0;

let startTime=0;
let duration=60;
let remaining=60;
let raf=0;

let sourceRow=2;
let targetRow=1;

/*
  화면에는 ╱ ╲ 를 표시하지만
  내부 계산은 / 와 \ 를 사용합니다.
*/

function mirrorSymbol(v){
  return v==='/' ? '╱' : '╲';
}

function showToast(text){

  toast.textContent=text;

  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');

  clearTimeout(showToast.timer);

  showToast.timer=
    setTimeout(()=>{
      toast.classList.remove('show');
    },650);
}

function shake(){

  game.classList.remove('shake');
  void game.offsetWidth;
  game.classList.add('shake');
}

/*
  여러 가지 퍼즐 패턴
*/

const puzzles=[

  {
    source:2,
    target:1,
    mirrors:[
      [14,'\\'],
      [26,'/'],
      [24,'\\'],
      [6,'/'],
      [4,'/'],
      [21,'\\']
    ]
  },

  {
    source:3,
    target:0,
    mirrors:[
      [18,'/'],
      [20,'\\'],
      [8,'/'],
      [10,'\\'],
      [5,'/'],
      [27,'\\'],
      [29,'/']
    ]
  },

  {
    source:1,
    target:4,
    mirrors:[
      [7,'\\'],
      [19,'/'],
      [21,'\\'],
      [27,'/'],
      [29,'\\'],
      [11,'/']
    ]
  },

  {
    source:4,
    target:2,
    mirrors:[
      [24,'/'],
      [26,'\\'],
      [14,'/'],
      [16,'\\'],
      [4,'/'],
      [10,'\\'],
      [17,'/']
    ]
  },

  {
    source:0,
    target:5,
    mirrors:[
      [0,'\\'],
      [12,'/'],
      [14,'\\'],
      [26,'/'],
      [28,'\\'],
      [34,'/'],
      [23,'\\']
    ]
  }

];

let activePuzzle=null;

function makePuzzle(){

  activePuzzle=
    puzzles[
      Math.floor(
        Math.random()*puzzles.length
      )
    ];

  sourceRow=
    activePuzzle.source;

  targetRow=
    activePuzzle.target;

  cells=
    Array(N*N)
    .fill(null);

  for(
    const [i,solution]
    of activePuzzle.mirrors
  ){

    /*
      약 50% 확률로 정답과 반대로 시작
    */

    let value=
      Math.random()<.5
        ?solution
        :(solution==='/'?'\\':'/');

    cells[i]={
      v:value,
      sol:solution
    };
  }

  /*
    최소 한두 개는 틀린 상태로 시작
  */

  let wrong=
    activePuzzle.mirrors
    .filter(([i])=>
      cells[i].v!==
      cells[i].sol
    );

  if(wrong.length<2){

    for(let n=0;n<2;n++){

      const pick=
        activePuzzle.mirrors[
          Math.floor(
            Math.random()*
            activePuzzle.mirrors.length
          )
        ][0];

      cells[pick].v=
        cells[pick].sol==='/'?'\\':'/';
    }
  }

  render();
  trace();
}

function start(){

  playing=true;

  round=1;
  score=500;
  combo=0;
  solved=0;
  totalMoves=0;

  duration=60;
  remaining=60;

  roundEl.textContent=1;
  scoreEl.textContent=500;
  comboEl.textContent=0;
  timeEl.textContent=60;

  timerBar.style.width='100%';

  status.textContent=
    '거울을 돌려 레이저를 🎯까지 연결하세요.';

  over.classList.add('hide');

  makePuzzle();

  startTime=
    performance.now();

  cancelAnimationFrame(raf);

  raf=
    requestAnimationFrame(loop);
}

function render(){

  [
    ...board.querySelectorAll('.cell')
  ].forEach(e=>e.remove());

  for(let i=0;i<N*N;i++){

    const x=i%N;
    const y=Math.floor(i/N);

    const c=
      document.createElement('div');

    c.className='cell';

    /*
      왼쪽 레이저 출발점
    */

    if(
      x===0 &&
      y===sourceRow
    ){

      c.classList.add('source');

      const s=
        document.createElement('span');

      s.textContent='🔴';

      c.appendChild(s);
    }

    /*
      오른쪽 목표
    */

    if(
      x===N-1 &&
      y===targetRow
    ){

      c.classList.add('target');

      const t=
        document.createElement('span');

      t.textContent='🎯';

      c.appendChild(t);
    }

    /*
      거울
    */

    if(cells[i]){

      const b=
        document.createElement('button');

      b.className='mirror';

      /*
        역슬래시 대신
        Unicode 대각선 기호 사용
      */

      b.textContent=
        mirrorSymbol(
          cells[i].v
        );

      b.onclick=()=>{

        if(!playing)return;

        cells[i].v=
          cells[i].v==='/'?'\\':'/';

        totalMoves++;

        /*
          거울 1회 회전은 아주 작은 감점
          무작정 누르는 플레이 방지
        */

        score=
          Math.max(
            0,
            score-2
          );

        scoreEl.textContent=score;

        render();

        const success=
          trace();

        if(
          score<=0 &&
          playing
        ){
          endGame('score');
        }

        if(success){
          solvePuzzle();
        }
      };

      c.appendChild(b);
    }

    board.appendChild(c);
  }
}

function trace(){

  beamBox.innerHTML='';

  let x=0;
  let y=sourceRow;

  /*
    0 위
    1 오른쪽
    2 아래
    3 왼쪽
  */

  let d=1;

  const seen=
    new Set();

  const steps=[];

  let success=false;

  for(let k=0;k<100;k++){

    const key=
      `${x},${y},${d}`;

    if(seen.has(key)){
      break;
    }

    seen.add(key);

    steps.push({
      x,y,d
    });

    const i=
      y*N+x;

    const m=
      cells[i]?.v;

    if(m==='/'){

      d=[
        1,
        0,
        3,
        2
      ][d];
    }

    if(m==='\\'){

      d=[
        3,
        2,
        1,
        0
      ][d];
    }

    const nx=
      x+
      [0,1,0,-1][d];

    const ny=
      y+
      [-1,0,1,0][d];

    /*
      오른쪽 목표 도착
    */

    if(
      nx===N &&
      ny===targetRow
    ){

      success=true;
      break;
    }

    if(
      nx<0||
      nx>=N||
      ny<0||
      ny>=N
    ){
      break;
    }

    x=nx;
    y=ny;
  }

  drawBeam(
    steps,
    success
  );

  return success;
}

function drawBeam(
  steps,
  success=false
){

  /*
    board 내부 실제 칸 크기 계산
  */

  const size=
    board.clientWidth/N;

  for(const s of steps){

    const b=
      document.createElement('i');

    b.className=
      'beam'+
      (success?' success':'');

    if(s.d%2){

      b.style.left=
        `${s.x*size}px`;

      b.style.top=
        `${s.y*size+size/2-2}px`;

      b.style.width=
        `${size}px`;

      b.style.height='4px';

    }else{

      b.style.left=
        `${s.x*size+size/2-2}px`;

      b.style.top=
        `${s.y*size}px`;

      b.style.width='4px';

      b.style.height=
        `${size}px`;
    }

    beamBox.appendChild(b);
  }
}

function solvePuzzle(){

  if(!playing)return;

  /*
    중복 성공 방지
  */

  playing=false;

  combo++;
  solved++;

  const comboBonus=
    Math.min(
      150,
      combo*20
    );

  const gain=
    100+
    comboBonus;

  score+=gain;

  scoreEl.textContent=score;
  comboEl.textContent=combo;

  showToast(
    `✨ 연결 성공 +${gain}`
  );

  status.textContent=
    `${combo} 콤보! 다음 광학 퍼즐 준비...`;

  document
    .querySelectorAll('.target')
    .forEach(e=>
      e.classList.add('active')
    );

  setTimeout(()=>{

    /*
      시간이 이미 끝났다면 종료
    */

    const now=
      performance.now();

    const elapsed=
      (now-startTime)/1000;

    if(elapsed>=duration){

      endGame('time');
      return;
    }

    round++;

    roundEl.textContent=
      round;

    /*
      다시 플레이 활성화
    */

    playing=true;

    makePuzzle();

    status.textContent=
      `퍼즐 ${round} · 레이저를 🎯까지 연결하세요.`;

  },500);
}

function loop(now){

  /*
    퍼즐 전환 중에도
    전체 60초 시간은 계속 흐름
  */

  const elapsed=
    (now-startTime)/1000;

  remaining=
    Math.max(
      0,
      duration-elapsed
    );

  timeEl.textContent=
    Math.ceil(remaining);

  timerBar.style.width=
    `${remaining/duration*100}%`;

  if(
    remaining<=0 &&
    startTime>0
  ){

    endGame('time');
    return;
  }

  raf=
    requestAnimationFrame(loop);
}

function endGame(reason){

  cancelAnimationFrame(raf);

  playing=false;

  startTime=0;

  const success=
    reason==='time';

  let rank='C';

  if(solved>=4)rank='B';
  if(solved>=7)rank='A';
  if(solved>=10)rank='S';

  document.querySelector('#ico')
    .textContent=
    success?'🏆':'💥';

  document.querySelector('#title')
    .textContent=
    success
      ?'60초 실험 완료!'
      :'에너지 소진!';

  document.querySelector('#desc')
    .innerHTML=
    `<b style="font-size:29px;color:#fde047">RANK ${rank}</b><br><br>`+
    (
      success
        ?'60초 동안 광학 실험을 완료했습니다!'
        :'점수가 0이 되어 실험이 종료되었습니다.'
    )+
    `<br><br>`+
    `해결한 퍼즐 <b>${solved}</b>개<br>`+
    `최고 콤보 <b>${combo}</b>회<br>`+
    `거울 회전 <b>${totalMoves}</b>회<br>`+
    `최종 점수 <b>${Math.max(0,score)}</b>점`;

  document.querySelector('#start')
    .textContent=
    '60초 다시 도전';

  over.classList.remove('hide');
}

document.querySelector('#start')
  .onclick=start;

addEventListener(
  'resize',
  ()=>{
    if(startTime>0){
      render();
      trace();
    }
  }
);

})();
</script>

</body>
</html>
