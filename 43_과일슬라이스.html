<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🍉 과일 슬라이스</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 10%,#9f1239,#351329 50%,#120611);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(94vw,700px);height:min(95vh,840px);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#fda4af;font-weight:900}h1{font-size:clamp(26px,5vw,38px);margin:2px 0}.stats{display:flex;gap:7px}.stat{min-width:70px;padding:8px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#3b1026cc}.stat small{display:block;color:#fecdd3;font-size:9px}.stat b{font-size:20px}.game{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff26;border-radius:25px;background:#1b0b1b;box-shadow:0 25px 70px #0009;touch-action:none}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#180817e8}.overlay.hide{display:none}.card{max-width:390px;padding:28px 24px;text-align:center;border:1px solid #ffffff24;border-radius:23px;background:#40152d}.ico{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{color:#ffe4e6;font-size:14px;line-height:1.7}.card button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#fb7185,#fbbf24);color:#3a0c20;font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#fecdd3;font-size:12px}@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.game{border-radius:20px}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">SLICE RUSH</div><h1>🍉 과일 슬라이스</h1></div><div class="stats"><div class="stat"><small>점수</small><b id="score">0</b></div><div class="stat"><small>목숨</small><b id="lives">❤️❤️❤️</b></div></div></header><section class="game" id="game"><canvas id="canvas"></canvas><div class="overlay" id="over"><div class="card"><div class="ico" id="ico">🍉</div><h2 id="title">과일을 시원하게 베세요!</h2><p id="desc">마우스나 손가락을 <b>누른 채로 드래그</b>해<br>날아오르는 과일을 베세요.<br>폭탄을 베거나 과일 3개를 놓치면 종료됩니다.</p><button id="start">슬라이스 시작</button></div></div></section><div class="tip">누른 채 드래그하여 베기 · 💣 폭탄은 피하기</div></main><script>
(()=>{const C=document.querySelector('#canvas'),X=C.getContext('2d'),G=document.querySelector('#game'),O=document.querySelector('#over'),SE=document.querySelector('#score'),LE=document.querySelector('#lives'),fruits=['🍉','🍊','🍋','🥝','🍎','🍑'];let W,H,D=1,on=false,last=0,time=0,next=0,score=0,lives=3,items=[],sparks=[],trail=[],drag=false;
function resize(){const r=G.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);draw()}function spawn(){const bomb=Math.random()<Math.min(.25,.08+score*.004),x=60+Math.random()*(W-120);items.push({x,y:H+35,vx:(Math.random()-.5)*150,vy:-570-Math.random()*130,g:760,r:0,vr:(Math.random()-.5)*5,bomb,emoji:bomb?'💣':fruits[Math.floor(Math.random()*fruits.length)],cut:false})}
function start(){score=0;lives=3;time=0;next=.2;items=[];sparks=[];trail=[];SE.textContent=0;LE.textContent='❤️❤️❤️';on=true;O.classList.add('hide');last=performance.now();requestAnimationFrame(loop)}function slice(x,y){if(!on)return;trail.push({x,y,life:1});for(const a of items){if(!a.cut&&Math.hypot(a.x-x,a.y-y)<34){a.cut=true;if(a.bomb)return finish('폭탄을 베었어요!');score++;SE.textContent=score;for(let i=0;i<12;i++)sparks.push({x:a.x,y:a.y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,life:1,c:['#fbbf24','#fb7185','#a7f3d0'][i%3]})}}}
function update(dt){time+=dt;if(time>next){next=time+Math.max(.35,.85-score*.012);spawn();if(score>8&&Math.random()<.25)spawn()}for(const a of items){a.vy+=a.g*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.r+=a.vr*dt;if(!a.cut&&!a.bomb&&a.y>H+45&&a.vy>0){a.cut=true;lives--;LE.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);if(lives<=0)finish('과일을 세 개 놓쳤어요!')}}items=items.filter(a=>a.y<H+80&&!a.cut);sparks.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=350*dt;p.life-=dt*2});sparks=sparks.filter(p=>p.life>0);trail.forEach(p=>p.life-=dt*4);trail=trail.filter(p=>p.life>0)}
function draw(){X.clearRect(0,0,W,H);let g=X.createRadialGradient(W/2,H*.35,10,W/2,H*.5,W*.8);g.addColorStop(0,'#51223d');g.addColorStop(1,'#160916');X.fillStyle=g;X.fillRect(0,0,W,H);X.strokeStyle='#ffffff09';for(let i=0;i<W;i+=40){X.beginPath();X.moveTo(i,0);X.lineTo(i,H);X.stroke()}for(const a of items){X.save();X.translate(a.x,a.y);X.rotate(a.r);X.font='52px sans-serif';X.textAlign='center';X.textBaseline='middle';X.shadowColor='#0009';X.shadowBlur=12;X.fillText(a.emoji,0,0);X.restore()}sparks.forEach(p=>{X.globalAlpha=p.life;X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,4,0,7);X.fill()});if(trail.length>1){X.globalAlpha=.85;X.strokeStyle='#fff';X.lineWidth=4;X.lineCap='round';X.beginPath();X.moveTo(trail[0].x,trail[0].y);trail.slice(1).forEach(p=>X.lineTo(p.x,p.y));X.stroke()}X.globalAlpha=1}
function finish(reason){if(!on)return;on=false;document.querySelector('#ico').textContent=score>15?'🏆':'🍉';document.querySelector('#title').textContent=`${score}개 슬라이스!`;document.querySelector('#desc').innerHTML=reason+'<br>폭탄 사이의 과일만 빠르게 이어서 베어보세요.';document.querySelector('#start').textContent='다시 베기';setTimeout(()=>O.classList.remove('hide'),350)}function loop(t){if(!on)return;const dt=Math.min(.032,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}function pos(e){const r=C.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}C.addEventListener('pointerdown',e=>{drag=true;C.setPointerCapture(e.pointerId);const p=pos(e);slice(p.x,p.y)});C.addEventListener('pointermove',e=>{if(drag){const p=pos(e);slice(p.x,p.y)}});['pointerup','pointercancel'].forEach(v=>C.addEventListener(v,()=>drag=false));document.querySelector('#start').onclick=start;addEventListener('resize',resize);resize();draw()})();</script></body></html>
