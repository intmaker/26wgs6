<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BEAT STEP - 리듬을 타고 STEP!</title>
  <style>
    /* ==========================================================================
       1. CSS 초기화 및 전역 스타일
       ========================================================================== */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050d;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #ffffff;
      touch-action: none; /* 모바일 제스처 및 스크롤 방지 */
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #101026 0%, #05050d 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ==========================================================================
       2. UI 오버레이 레이어
       ========================================================================== */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 13, 0.85);
      backdrop-filter: blur(8px);
      z-index: 50;
      transition: opacity 0.25s ease;
    }
    .overlay.hidden {
      display: none;
      opacity: 0;
      pointer-events: none;
    }

    /* 상단 상태 바 (인게임) */
    #top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 10px);
      left: 0;
      width: 100%;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    .top-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 18px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .top-btn:active {
      background: rgba(255, 255, 255, 0.25);
    }

    /* 모바일 터치 패드 */
    #mobile-controls {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 15px);
      width: 100%;
      max-width: 500px;
      padding: 0 16px;
      display: flex;
      justify-content: space-around;
      gap: 12px;
      z-index: 30;
      touch-action: none;
    }
    .touch-btn {
      flex: 1;
      height: 76px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: #fff;
      transition: transform 0.06s ease, background-color 0.06s ease, border-color 0.06s ease;
      touch-action: none;
    }
    .touch-btn.active {
      transform: scale(0.92);
    }
    .touch-btn[data-dir="0"].active { background: rgba(255, 0, 85, 0.4); border-color: #ff0055; box-shadow: 0 0 20px #ff0055; }
    .touch-btn[data-dir="1"].active { background: rgba(0, 229, 255, 0.4); border-color: #00e5ff; box-shadow: 0 0 20px #00e5ff; }
    .touch-btn[data-dir="2"].active { background: rgba(0, 255, 102, 0.4); border-color: #00ff66; box-shadow: 0 0 20px #00ff66; }
    .touch-btn[data-dir="3"].active { background: rgba(255, 170, 0, 0.4); border-color: #ffaa00; box-shadow: 0 0 20px #ffaa00; }

    /* 타이틀 및 UI 요소 스타일 */
    .title-box {
      text-align: center;
      margin-bottom: 24px;
    }
    .main-title {
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #ff0055, #00e5ff, #00ff66);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
    }
    .sub-title {
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #a0a5c0;
      margin-top: 6px;
    }

    .song-select {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
      max-width: 560px;
    }
    .song-btn {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.04);
      color: #d5d9ee;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .song-btn.selected {
      background: linear-gradient(135deg, #ff0055, #00e5ff);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.4);
      transform: translateY(-1px);
    }

    /* 난이도 선택 버튼 */
    .difficulty-select {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .diff-btn {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #aaa;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .diff-btn.selected {
      background: #00e5ff;
      color: #05050d;
      border-color: #00e5ff;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
      transform: translateY(-2px);
    }

    /* 기본 액션 버튼 */
    .primary-btn {
      padding: 14px 42px;
      font-size: 1.25rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #ff0055, #ff5500);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .primary-btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
    }

    .info-panel {
      margin-top: 24px;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.85rem;
      color: #8f94a6;
      line-height: 1.6;
      text-align: center;
    }

    /* 결과 스탯창 */
    .result-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      margin-bottom: 20px;
    }
    .rank-badge {
      font-size: 4.5rem;
      font-weight: 900;
      margin-bottom: 10px;
      text-shadow: 0 0 20px currentColor;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.95rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }

    /* 반응형 화면 보정 */
    @media (min-width: 768px) {
      #mobile-controls {
        display: none; /* PC 뷰에서는 터치 패드 숨김 (Canvas 중심) */
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 상단 컨트롤 버튼 -->
    <div id="top-bar">
      <button id="pause-btn" class="top-btn">❚❚</button>
      <button id="mute-btn" class="top-btn">🔊</button>
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay">
      <div class="title-box">
        <h1 class="main-title">BEAT STEP</h1>
        <p class="sub-title">리듬을 타고 STEP!</p>
      </div>
      <div id="song-select" class="song-select" aria-label="음악 선택"></div>
      <div class="difficulty-select">
        <button class="diff-btn" data-diff="easy">EASY</button>
        <button class="diff-btn selected" data-diff="normal">NORMAL</button>
        <button class="diff-btn" data-diff="hard">HARD</button>
      </div>
      <button id="start-btn" class="primary-btn">START GAME</button>
      <div class="info-panel">
        <p><strong>[PC]</strong> ← ↓ ↑ → 또는 W A S D</p>
        <p><strong>[모바일]</strong> 하단 4개 방향 버튼 터치</p>
      </div>
    </div>

    <!-- 일시정지 화면 -->
    <div id="pause-screen" class="overlay hidden">
      <h2 style="font-size: 2.2rem; margin-bottom: 24px; letter-spacing: 2px;">PAUSED</h2>
      <div class="btn-group" style="flex-direction: column; width: 220px; gap: 14px;">
        <button id="resume-btn" class="primary-btn">CONTINUE</button>
        <button id="restart-btn" class="diff-btn" style="padding: 12px;">RESTART</button>
        <button id="quit-btn" class="diff-btn" style="padding: 12px;">QUIT</button>
      </div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="overlay hidden">
      <h2 style="font-size: 1.8rem; margin-bottom: 12px; color: #a0a5c0;">RESULT</h2>
      <div class="result-card">
        <div id="rank-display" class="rank-badge" style="color: #00ff66;">S</div>
        <div class="stat-row"><span>SCORE</span><span id="res-score" style="font-weight:bold; color:#00e5ff;">0</span></div>
        <div class="stat-row"><span>MAX COMBO</span><span id="res-combo">0</span></div>
        <div class="stat-row"><span>ACCURACY</span><span id="res-acc">0%</span></div>
        <div class="stat-row" style="color:#ff0055;"><span>PERFECT</span><span id="res-perfect">0</span></div>
        <div class="stat-row" style="color:#00e5ff;"><span>GREAT</span><span id="res-great">0</span></div>
        <div class="stat-row" style="color:#00ff66;"><span>GOOD</span><span id="res-good">0</span></div>
        <div class="stat-row" style="color:#888;"><span>MISS</span><span id="res-miss">0</span></div>
      </div>
      <div class="btn-group">
        <button id="again-btn" class="primary-btn">PLAY AGAIN</button>
        <button id="diff-change-btn" class="diff-btn" style="padding: 14px 20px;">DIFFICULTY</button>
      </div>
    </div>

    <!-- 모바일 컨트롤 버튼 -->
    <div id="mobile-controls">
      <div class="touch-btn" data-dir="0">←</div>
      <div class="touch-btn" data-dir="1">↓</div>
      <div class="touch-btn" data-dir="2">↑</div>
      <div class="touch-btn" data-dir="3">→</div>
    </div>
  </div>

  <script>
    /**
     * ==========================================================================
     * BEAT STEP - 고성능 반응형 웹 리듬게임
     * ==========================================================================
     */

    // --- 1. 전역 상수 및 설정 ---
    const LANES = [
      { id: 0, name: 'left',  symbol: '←', color: '#ff0055', keys: ['ArrowLeft',  'KeyA', 'a', 'A'] },
      { id: 1, name: 'down',  symbol: '↓', color: '#00e5ff', keys: ['ArrowDown',  'KeyS', 's', 'S'] },
      { id: 2, name: 'up',    symbol: '↑', color: '#00ff66', keys: ['ArrowUp',    'KeyW', 'w', 'W'] },
      { id: 3, name: 'right', symbol: '→', color: '#ffaa00', keys: ['ArrowRight', 'KeyD', 'd', 'D'] }
    ];

    const JUDGMENTS = {
      PERFECT: { name: 'PERFECT!', score: 1000, window: 0.065, color: '#ff0077', life: 4 },
      GREAT:   { name: 'GREAT!',   score: 700,  window: 0.125, color: '#00e5ff', life: 2 },
      GOOD:    { name: 'GOOD',     score: 400,  window: 0.200, color: '#00ff66', life: 0 },
      MISS:    { name: 'MISS',     score: 0,    window: 0.260, color: '#666688', life: -12 }
    };

    const DEFAULT_BPM = 132;
    const SONG_BEATS = 128; // 총 32마디 곡 (약 58초)
    const TARGET_Y_RATIO = 0.82; // 판정선 높이 비율 (하단 18% 영역)

    const SONG_LIBRARY = [
      { id: 'neon', name: 'Neon Pulse', bpm: 132, accent: '#00e5ff' },
      { id: 'sunset', name: 'Sunset Drift', bpm: 118, accent: '#ff8a65' },
      { id: 'arcade', name: 'Arcade Rush', bpm: 146, accent: '#00ff66' },
      { id: 'midnight', name: 'Midnight Echo', bpm: 124, accent: '#9c6bff' }
    ];

    // --- 2. 오디오 합성 엔진 (Web Audio API) ---
    class RhythmAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.isMuted = false;
        this.scheduledBeats = 0;
        this.bpm = DEFAULT_BPM;
        this.songName = 'Neon Pulse';
      }

      setSong(song) {
        if (!song) return;
        this.bpm = song.bpm || DEFAULT_BPM;
        this.songName = song.name || 'Neon Pulse';
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.masterGain = this.ctx.createGain();
          this.masterGain.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.masterGain) {
          this.masterGain.gain.setValueAtTime(this.isMuted ? 0 : 1, this.ctx.currentTime);
        }
        return this.isMuted;
      }

      // 사운드 합성 프리셋
      playKick(time) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(140, time);
        osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.18);
        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.18);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(time);
        osc.stop(time + 0.18);
      }

      playSnare(time) {
        if (!this.ctx) return;
        // 노이즈 버퍼 생성
        const bufferSize = this.ctx.sampleRate * 0.12;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 900;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.7, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.12);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        noise.start(time);
        noise.stop(time + 0.12);
      }

      playHihat(time) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'highpass';
        osc.frequency.setValueAtTime(7000, time);
        gain.gain.setValueAtTime(0.25, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.04);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(time);
        osc.stop(time + 0.04);
      }

      playSynth(time, freq, duration = 0.15) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, time);
        gain.gain.setValueAtTime(0.2, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(time);
        osc.stop(time + duration);
      }

      playHitFeedback(success = true) {
        if (!this.ctx || this.isMuted) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = success ? 'triangle' : 'sawtooth';
        osc.frequency.setValueAtTime(success ? 587.33 : 130.81, now); // D5 or C3
        if (success) {
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08); // A5
        }
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      // 오디오 룩어헤드 스케줄러 (BPM 동기화 음악)
      scheduleMusic(gameStartTime, currentAudioTime) {
        const secondsPerBeat = 60 / this.bpm;
        const lookahead = 0.2; // 200ms 앞서 스케줄
        while ((this.scheduledBeats * secondsPerBeat) < (currentAudioTime - gameStartTime + lookahead) && this.scheduledBeats < SONG_BEATS) {
          const beatTime = gameStartTime + this.scheduledBeats * secondsPerBeat;
          const beatNum = this.scheduledBeats % 16;
          const measure = Math.floor(this.scheduledBeats / 16);

          if (beatTime >= currentAudioTime) {
            // 드럼 패턴
            if (beatNum % 4 === 0) this.playKick(beatTime);
            if (beatNum % 4 === 2) this.playSnare(beatTime);
            this.playHihat(beatTime);
            if (beatNum % 2 === 1) this.playHihat(beatTime + secondsPerBeat * 0.5);

            // 신스 멜로디 / 베이스라인 (펜타토닉 음계 기반 전개)
            const notes = [220, 261.63, 293.66, 329.63, 392.00]; // A, C, D, E, G
            const pitch = notes[(this.scheduledBeats * 3) % notes.length];
            const multiplier = measure >= 4 ? 2 : 1; // 후반 클라이맥스 옥타브업
            this.playSynth(beatTime, pitch * multiplier, secondsPerBeat * 0.8);
          }
          this.scheduledBeats++;
        }
      }

      resetScheduler() {
        this.scheduledBeats = 0;
      }
    }

    // --- 3. 차트 생성기 (리듬 패턴 빌더) ---
    function generateChart(difficulty, bpm = DEFAULT_BPM) {
      const notes = [];
      let idCounter = 0;
      const totalMeasures = 8; // 8마디 루프 x 4회 = 32마디
      const speedMap = { easy: 1.4, normal: 1.0, hard: 0.75 }; // 화면 이동 시간(초)
      const travelDuration = speedMap[difficulty] || 1.0;
      const beatDuration = 60 / bpm;

      for (let m = 0; m < 4; m++) {
        for (let b = 0; b < 32; b++) {
          const currentBeat = m * 32 + b;
          if (currentBeat < 4 || currentBeat > SONG_BEATS - 4) continue; // 앞뒤 여유 1마디

          const hitTime = currentBeat * beatDuration;
          const intensity = m; // 난이도 점진적 상승

          // 1) 기본 4비트 노트
          if (b % 2 === 0) {
            const dir = (b / 2 + m) % 4;
            notes.push({
              id: idCounter++,
              lane: dir,
              hitTime: hitTime,
              type: 'normal',
              duration: 0,
              hit: false,
              missed: false
            });
          }

          // 2) 동시타 노트 (NORMAL/HARD 전용 패턴)
          if (difficulty !== 'easy' && b % 8 === 4 && intensity >= 1) {
            const lane1 = (b % 4);
            const lane2 = (lane1 + 2) % 4; // 반대편 동시타
            notes.push({
              id: idCounter++,
              lane: lane2,
              hitTime: hitTime,
              type: 'normal',
              duration: 0,
              hit: false,
              missed: false
            });
          }

          // 3) 롱 노트
          if (b % 16 === 12 && intensity >= 1) {
            const holdDuration = beatDuration * (difficulty === 'hard' ? 3 : 2);
            notes.push({
              id: idCounter++,
              lane: (m + 1) % 4,
              hitTime: hitTime,
              type: 'hold',
              duration: holdDuration,
              hit: false,
              holding: false,
              holdCompleted: false,
              missed: false
            });
          }

          // 4) 8비트 난타 (HARD 전용 클라이맥스)
          if (difficulty === 'hard' && intensity >= 2 && b % 2 === 1 && Math.random() > 0.4) {
            notes.push({
              id: idCounter++,
              lane: Math.floor(Math.random() * 4),
              hitTime: hitTime,
              type: 'normal',
              duration: 0,
              hit: false,
              missed: false
            });
          }
        }
      }

      // 시간 순서대로 정렬
      notes.sort((a, b) => a.hitTime - b.hitTime);
      return { notes, travelDuration };
    }

    // --- 4. 메인 게임 엔진 클래스 ---
    class BeatStepGame {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.audio = new RhythmAudioEngine();
        this.song = SONG_LIBRARY[0];

        // 게임 상태
        this.state = 'TITLE'; // TITLE, COUNTDOWN, PLAYING, PAUSED, RESULT, GAMEOVER
        this.difficulty = 'normal';
        this.notes = [];
        this.travelDuration = 1.0;
        this.beatDuration = 60 / this.song.bpm;
        
        // 동기화 타이머
        this.gameTime = 0;
        this.startTime = 0;
        this.pauseStartTime = 0;
        this.totalPausedDuration = 0;

        // 플레이어 스탯
        this.score = 0;
        this.combo = 0;
        this.maxCombo = 0;
        this.life = 100;
        this.stats = { perfect: 0, great: 0, good: 0, miss: 0 };

        // 비주얼 / 피드백 이펙트 상태
        this.laneStates = [false, false, false, false];
        this.laneMissHighlight = [0, 0, 0, 0];
        this.judgmentText = '';
        this.judgmentColor = '#fff';
        this.judgmentScale = 1;
        this.particles = [];
        this.confetti = [];
        this.shakeTimer = 0;
        this.shakeMagnitude = 0;
        this.countdownValue = 3;
        this.countdownText = '';

        // 터치 및 입력 관리
        this.activeTouches = new Map();

        this.initDOM();
        this.setupResize();
        this.setupInputs();
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
      }

      initDOM() {
        // UI 엘리먼트 캐싱
        this.ui = {
          startScreen: document.getElementById('start-screen'),
          pauseScreen: document.getElementById('pause-screen'),
          resultScreen: document.getElementById('result-screen'),
          startBtn: document.getElementById('start-btn'),
          pauseBtn: document.getElementById('pause-btn'),
          resumeBtn: document.getElementById('resume-btn'),
          restartBtn: document.getElementById('restart-btn'),
          quitBtn: document.getElementById('quit-btn'),
          muteBtn: document.getElementById('mute-btn'),
          againBtn: document.getElementById('again-btn'),
          diffChangeBtn: document.getElementById('diff-change-btn'),
          diffBtns: document.querySelectorAll('.diff-btn[data-diff]'),
          touchBtns: document.querySelectorAll('.touch-btn'),
          songSelect: document.getElementById('song-select'),
          resScore: document.getElementById('res-score'),
          resCombo: document.getElementById('res-combo'),
          resAcc: document.getElementById('res-acc'),
          resPerfect: document.getElementById('res-perfect'),
          resGreat: document.getElementById('res-great'),
          resGood: document.getElementById('res-good'),
          resMiss: document.getElementById('res-miss'),
          rankDisplay: document.getElementById('rank-display')
        };

        this.buildSongSelector();

        // 난이도 선택 리스너
        this.ui.diffBtns.forEach(btn => {
          btn.addEventListener('click', (e) => {
            this.ui.diffBtns.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            this.difficulty = btn.dataset.diff;
          });
        });

        // 시작 / 재시작 / 일시정지 액션
        this.ui.startBtn.addEventListener('click', () => this.startCountdown());
        this.ui.pauseBtn.addEventListener('click', () => this.togglePause());
        this.ui.resumeBtn.addEventListener('click', () => this.togglePause());
        this.ui.restartBtn.addEventListener('click', () => {
          this.ui.pauseScreen.classList.add('hidden');
          this.startCountdown();
        });
        this.ui.quitBtn.addEventListener('click', () => {
          this.ui.pauseScreen.classList.add('hidden');
          this.showScreen('startScreen');
          this.state = 'TITLE';
        });
        this.ui.muteBtn.addEventListener('click', () => {
          const muted = this.audio.toggleMute();
          this.ui.muteBtn.innerText = muted ? '🔇' : '🔊';
        });
        this.ui.againBtn.addEventListener('click', () => this.startCountdown());
        this.ui.diffChangeBtn.addEventListener('click', () => {
          this.showScreen('startScreen');
          this.state = 'TITLE';
        });
      }

      buildSongSelector() {
        this.ui.songSelect.innerHTML = '';
        SONG_LIBRARY.forEach(song => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'song-btn';
          btn.textContent = song.name;
          btn.dataset.songId = song.id;
          if (this.song && this.song.id === song.id) btn.classList.add('selected');
          btn.addEventListener('click', () => {
            this.song = song;
            this.beatDuration = 60 / song.bpm;
            this.audio.setSong(song);
            this.ui.songSelect.querySelectorAll('.song-btn').forEach(el => el.classList.toggle('selected', el.dataset.songId === song.id));
          });
          this.ui.songSelect.appendChild(btn);
        });
      }

      showScreen(screenName) {
        ['startScreen', 'pauseScreen', 'resultScreen'].forEach(key => {
          if (key === screenName) this.ui[key].classList.remove('hidden');
          else this.ui[key].classList.add('hidden');
        });
      }

      setupResize() {
        const resize = () => {
          const dpr = Math.min(window.devicePixelRatio || 1, 2); // 모바일 발열/성능 방지 위해 최대 2배수 제한
          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.canvas.width = this.width * dpr;
          this.canvas.height = this.height * dpr;
          this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          // 레이아웃 지오메트리 계산
          this.laneWidth = Math.min(this.width / 4.4, 90);
          this.trackWidth = this.laneWidth * 4;
          this.trackX = (this.width - this.trackWidth) / 2;
          this.targetY = this.height * TARGET_Y_RATIO;
          this.spawnY = -60;
        };
        window.addEventListener('resize', resize);
        resize();
      }

      setupInputs() {
        // PC 키보드
        window.addEventListener('keydown', (e) => {
          if (e.repeat) return;
          if (e.key === 'Escape' && (this.state === 'PLAYING' || this.state === 'PAUSED')) {
            this.togglePause();
            return;
          }
          LANES.forEach(lane => {
            if (lane.keys.includes(e.code) || lane.keys.includes(e.key)) {
              this.handleLanePress(lane.id);
            }
          });
        });

        window.addEventListener('keyup', (e) => {
          LANES.forEach(lane => {
            if (lane.keys.includes(e.code) || lane.keys.includes(e.key)) {
              this.handleLaneRelease(lane.id);
            }
          });
        });

        // 스마트폰 멀티터치 바인딩
        const touchContainer = document.getElementById('mobile-controls');
        const processTouches = (e) => {
          e.preventDefault();
          const activeLanes = new Set();
          for (let i = 0; i < e.touches.length; i++) {
            const touch = e.touches[i];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            if (target && target.classList.contains('touch-btn')) {
              const laneId = parseInt(target.dataset.dir);
              activeLanes.add(laneId);
            }
          }

          LANES.forEach(lane => {
            const wasActive = this.laneStates[lane.id];
            const isActive = activeLanes.has(lane.id);
            if (!wasActive && isActive) this.handleLanePress(lane.id);
            if (wasActive && !isActive) this.handleLaneRelease(lane.id);
          });
        };

        ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(ev => {
          touchContainer.addEventListener(ev, processTouches, { passive: false });
        });
      }

      // --- 입력 판정 로직 ---
      handleLanePress(laneId) {
        this.laneStates[laneId] = true;
        this.updateTouchBtnStyle(laneId, true);

        if (this.state !== 'PLAYING') return;

        // 판정 대상 노트 탐색 (가장 가까운 노트)
        let targetNote = null;
        let minDiff = Infinity;

        for (const note of this.notes) {
          if (note.lane === laneId && !note.hit && !note.missed) {
            const diff = note.hitTime - this.gameTime;
            if (Math.abs(diff) < JUDGMENTS.MISS.window && Math.abs(diff) < minDiff) {
              minDiff = Math.abs(diff);
              targetNote = note;
            }
          }
        }

        if (targetNote) {
          const diff = Math.abs(targetNote.hitTime - this.gameTime);
          if (diff <= JUDGMENTS.PERFECT.window) {
            this.applyJudgment(JUDGMENTS.PERFECT, targetNote);
          } else if (diff <= JUDGMENTS.GREAT.window) {
            this.applyJudgment(JUDGMENTS.GREAT, targetNote);
          } else if (diff <= JUDGMENTS.GOOD.window) {
            this.applyJudgment(JUDGMENTS.GOOD, targetNote);
          } else {
            this.applyJudgment(JUDGMENTS.MISS, targetNote);
          }

          if (targetNote.type === 'hold' && !targetNote.missed) {
            targetNote.holding = true;
          } else {
            targetNote.hit = true;
          }
        }
      }

      handleLaneRelease(laneId) {
        this.laneStates[laneId] = false;
        this.updateTouchBtnStyle(laneId, false);

        if (this.state !== 'PLAYING') return;

        // 롱노트 도중 뗐을 때 처리
        this.notes.forEach(note => {
          if (note.lane === laneId && note.type === 'hold' && note.holding && !note.holdCompleted) {
            const remainTime = (note.hitTime + note.duration) - this.gameTime;
            if (remainTime > 0.15) { // 너무 일찍 뗌 -> BREAK
              note.missed = true;
              note.holding = false;
              this.applyJudgment(JUDGMENTS.MISS, note, 'HOLD BREAK');
            }
          }
        });
      }

      updateTouchBtnStyle(laneId, active) {
        const btn = this.ui.touchBtns[laneId];
        if (btn) {
          if (active) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      }

      // --- 판정 적용 및 점수/체력 계산 ---
      applyJudgment(judg, note, customText = null) {
        this.judgmentText = customText || judg.name;
        this.judgmentColor = judg.color;
        this.judgmentScale = 1.35;

        const isSuccess = (judg !== JUDGMENTS.MISS);
        this.audio.playHitFeedback(isSuccess);

        if (isSuccess) {
          this.combo++;
          if (this.combo > this.maxCombo) this.maxCombo = this.combo;
          const comboBonus = Math.min(this.combo * 15, 300);
          this.score += judg.score + comboBonus;
          this.life = Math.min(100, this.life + judg.life);

          // 스탯 기록
          if (judg === JUDGMENTS.PERFECT) {
            this.stats.perfect++;
            this.spawnParticles(this.getLaneCenterX(note.lane), this.targetY, judg.color, 16);
          } else if (judg === JUDGMENTS.GREAT) {
            this.stats.great++;
            this.spawnParticles(this.getLaneCenterX(note.lane), this.targetY, judg.color, 8);
          } else {
            this.stats.good++;
          }

          // 콤보 마일스톤 화면 흔들림
          if (this.combo === 25 || this.combo === 50 || this.combo === 100) {
            this.triggerShake(6, 0.25);
          }
        } else {
          this.combo = 0;
          this.stats.miss++;
          this.life = Math.max(0, this.life + judg.life);
          this.laneMissHighlight[note.lane] = 1.0; // 붉은색 플래시

          if (this.life <= 0) {
            this.gameOver();
          }
        }
      }

      triggerShake(magnitude, duration) {
        this.shakeMagnitude = magnitude;
        this.shakeTimer = duration;
      }

      spawnParticles(x, y, color, count = 12) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 220 + 80;
          this.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: color,
            alpha: 1.0,
            size: Math.random() * 5 + 3,
            isStar: Math.random() > 0.5,
            life: Math.random() * 0.35 + 0.25
          });
        }
      }

      spawnConfetti() {
        for (let i = 0; i < 80; i++) {
          this.confetti.push({
            x: Math.random() * this.width,
            y: -20,
            vx: (Math.random() - 0.5) * 120,
            vy: Math.random() * 200 + 150,
            rot: Math.random() * 360,
            rotSpeed: (Math.random() - 0.5) * 400,
            color: ['#ff0055', '#00e5ff', '#00ff66', '#ffaa00', '#fff'][Math.floor(Math.random() * 5)],
            size: Math.random() * 8 + 6,
            alpha: 1.0
          });
        }
      }

      // --- 게임 흐름 제어 ---
      startCountdown() {
        this.audio.init();
        this.audio.setSong(this.song);
        this.audio.resetScheduler();
        const chart = generateChart(this.difficulty, this.song.bpm);
        this.notes = chart.notes;
        this.travelDuration = chart.travelDuration;

        // 스탯 초기화
        this.score = 0;
        this.combo = 0;
        this.maxCombo = 0;
        this.life = 100;
        this.stats = { perfect: 0, great: 0, good: 0, miss: 0 };
        this.judgmentText = '';
        this.particles = [];
        this.confetti = [];

        this.showScreen(null);
        this.state = 'COUNTDOWN';
        this.countdownValue = 3;
        this.countdownText = 'READY?';

        let countStep = 0;
        const countdownInterval = setInterval(() => {
          countStep++;
          if (countStep === 1) this.countdownText = '3';
          else if (countStep === 2) this.countdownText = '2';
          else if (countStep === 3) this.countdownText = '1';
          else if (countStep === 4) {
            this.countdownText = 'GO!';
            this.audio.playSynth(this.audio.ctx.currentTime, 587.33, 0.25);
          } else {
            clearInterval(countdownInterval);
            this.state = 'PLAYING';
            this.startTime = this.audio.ctx.currentTime;
            this.totalPausedDuration = 0;
          }
          if (countStep >= 1 && countStep <= 3) {
            this.audio.playSynth(this.audio.ctx.currentTime, 440, 0.1);
          }
        }, 550);
      }

      togglePause() {
        if (this.state === 'PLAYING') {
          this.state = 'PAUSED';
          this.pauseStartTime = this.audio.ctx.currentTime;
          this.showScreen('pauseScreen');
        } else if (this.state === 'PAUSED') {
          this.state = 'PLAYING';
          const pauseDuration = this.audio.ctx.currentTime - this.pauseStartTime;
          this.totalPausedDuration += pauseDuration;
          this.showScreen(null);
        }
      }

      gameOver() {
        this.state = 'GAMEOVER';
        this.triggerShake(12, 0.5);
        this.judgmentText = 'GAME OVER';
        this.judgmentColor = '#ff0033';
        setTimeout(() => this.showResult(), 1200);
      }

      showResult() {
        this.state = 'RESULT';
        this.showScreen('resultScreen');

        const totalNotes = this.stats.perfect + this.stats.great + this.stats.good + this.stats.miss;
        const acc = totalNotes > 0 ? ((this.stats.perfect * 100 + this.stats.great * 70 + this.stats.good * 40) / (totalNotes * 100)) * 100 : 0;
        
        let rank = 'D';
        let rankColor = '#666';
        if (acc >= 98 && this.stats.miss === 0) { rank = 'S+'; rankColor = '#ff0055'; }
        else if (acc >= 95) { rank = 'S'; rankColor = '#00e5ff'; }
        else if (acc >= 90) { rank = 'A'; rankColor = '#00ff66'; }
        else if (acc >= 80) { rank = 'B'; rankColor = '#ffaa00'; }
        else if (acc >= 70) { rank = 'C'; rankColor = '#a0a5c0'; }

        if (rank === 'S' || rank === 'S+') this.spawnConfetti();

        // 결과창 카운트업 애니메이션
        this.ui.rankDisplay.innerText = rank;
        this.ui.rankDisplay.style.color = rankColor;
        this.ui.resScore.innerText = this.score.toLocaleString();
        this.ui.resCombo.innerText = this.maxCombo;
        this.ui.resAcc.innerText = acc.toFixed(1) + '%';
        this.ui.resPerfect.innerText = this.stats.perfect;
        this.ui.resGreat.innerText = this.stats.great;
        this.ui.resGood.innerText = this.stats.good;
        this.ui.resMiss.innerText = this.stats.miss;
      }

      getLaneCenterX(laneId) {
        return this.trackX + laneId * this.laneWidth + this.laneWidth / 2;
      }

      // --- 5. 프레임 렌더링 & 업데이트 루프 ---
      loop(timestamp) {
        const dt = 1 / 60; // 기본 델타 타임

        if (this.state === 'PLAYING') {
          // 정밀 Web Audio 타이머 기반 게임 시간 계산
          this.gameTime = this.audio.ctx.currentTime - this.startTime - this.totalPausedDuration;
          this.audio.scheduleMusic(this.startTime + this.totalPausedDuration, this.audio.ctx.currentTime);
          this.updateGameLogic(dt);
        }

        this.updateEffects(dt);
        this.render();

        requestAnimationFrame(this.loop);
      }

      updateGameLogic(dt) {
        // 노트 판정 및 수명 관리
        let activeNotesRemaining = false;

        this.notes.forEach(note => {
          if (note.missed) return;

          // 1) 롱노트 홀드 유지 검사
          if (note.type === 'hold' && note.holding && !note.holdCompleted) {
            const holdEndTime = note.hitTime + note.duration;
            if (this.gameTime >= holdEndTime) {
              note.holdCompleted = true;
              note.holding = false;
              note.hit = true;
              this.score += 500;
              this.spawnParticles(this.getLaneCenterX(note.lane), this.targetY, '#00ff66', 20);
              this.judgmentText = 'HOLD COMPLETE!';
              this.judgmentColor = '#00ff66';
            } else {
              // 홀드 중 지속 파티클
              if (Math.random() > 0.6) {
                this.spawnParticles(this.getLaneCenterX(note.lane), this.targetY, LANES[note.lane].color, 1);
              }
            }
          }

          // 2) 일반 판정선 초과 미스 처리
          const missLimit = (note.type === 'hold' ? note.hitTime + note.duration : note.hitTime) + JUDGMENTS.MISS.window;
          if (!note.hit && !note.holding && this.gameTime > missLimit) {
            note.missed = true;
            this.applyJudgment(JUDGMENTS.MISS, note);
          }

          if (!note.hit && !note.missed) {
            activeNotesRemaining = true;
          }
        });

        // 곡 종료 검사
        const lastNote = this.notes[this.notes.length - 1];
        if (lastNote && this.gameTime > (lastNote.hitTime + 2.5) && !activeNotesRemaining) {
          this.showResult();
        }
      }

      updateEffects(dt) {
        // 셰이크 감쇄
        if (this.shakeTimer > 0) {
          this.shakeTimer -= dt;
        }

        // 판정 텍스트 스케일 감쇄
        if (this.judgmentScale > 1.0) {
          this.judgmentScale = Math.max(1.0, this.judgmentScale - dt * 2.5);
        }

        // 미스 레인 하이라이트 감쇄
        for (let i = 0; i < 4; i++) {
          if (this.laneMissHighlight[i] > 0) {
            this.laneMissHighlight[i] = Math.max(0, this.laneMissHighlight[i] - dt * 3.5);
          }
        }

        // 파티클 업데이트
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.alpha -= dt / p.life;
          if (p.alpha <= 0) this.particles.splice(i, 1);
        }

        // 색종이 업데이트
        for (let i = this.confetti.length - 1; i >= 0; i--) {
          const c = this.confetti[i];
          c.x += c.vx * dt;
          c.y += c.vy * dt;
          c.rot += c.rotSpeed * dt;
          if (c.y > this.height + 20) this.confetti.splice(i, 1);
        }
      }

      // --- 6. 화면 그리기 (Canvas Graphic) ---
      render() {
        this.ctx.save();

        // 화면 흔들림 오프셋
        if (this.shakeTimer > 0) {
          const ox = (Math.random() - 0.5) * this.shakeMagnitude * 2;
          const oy = (Math.random() - 0.5) * this.shakeMagnitude * 2;
          this.ctx.translate(ox, oy);
        }

        // 배경 렌더링 (비트 펄스 효과)
        this.ctx.fillStyle = '#05050d';
        this.ctx.fillRect(0, 0, this.width, this.height);

        const beatLength = 60 / (this.song?.bpm || DEFAULT_BPM);
        const beatPulse = (this.state === 'PLAYING') ? Math.sin((this.gameTime / beatLength) * Math.PI) * 0.08 : 0;
        if (beatPulse > 0) {
          const bgGrad = this.ctx.createRadialGradient(this.width/2, this.height/2, 10, this.width/2, this.height/2, this.width);
          bgGrad.addColorStop(0, `rgba(0, 229, 255, ${beatPulse * 0.3})`);
          bgGrad.addColorStop(1, 'transparent');
          this.ctx.fillStyle = bgGrad;
          this.ctx.fillRect(0, 0, this.width, this.height);
        }

        // 콤보 50 이상 주변 네온 발광
        if (this.combo >= 50) {
          this.ctx.strokeStyle = `rgba(255, 0, 85, ${Math.min(0.3, this.combo * 0.003)})`;
          this.ctx.lineWidth = 12;
          this.ctx.strokeRect(6, 6, this.width - 12, this.height - 12);
        }

        // 트랙 & 레인 렌더링
        this.renderTracks();

        // 롱노트 바 & 노트 렌더링
        if (this.state === 'PLAYING' || this.state === 'PAUSED') {
          this.renderNotes();
        }

        // 판정 타겟 화살표
        this.renderTargetArrows();

        // 파티클 & 색종이
        this.renderParticles();

        // HUD (점수, 체력, 콤보, 판정)
        this.renderHUD();

        // 카운트다운
        if (this.state === 'COUNTDOWN') {
          this.renderCountdown();
        }

        this.ctx.restore();
      }

      renderTracks() {
        // 트랙 배경
        this.ctx.fillStyle = 'rgba(15, 15, 30, 0.75)';
        this.ctx.fillRect(this.trackX, 0, this.trackWidth, this.height);

        // 레인 구분선 및 하이라이트
        for (let i = 0; i < 4; i++) {
          const lx = this.trackX + i * this.laneWidth;

          // 키 누름 발광 효과
          if (this.laneStates[i]) {
            const laneGrad = this.ctx.createLinearGradient(0, this.targetY, 0, this.height);
            laneGrad.addColorStop(0, `${LANES[i].color}66`);
            laneGrad.addColorStop(1, 'transparent');
            this.ctx.fillStyle = laneGrad;
            this.ctx.fillRect(lx, 0, this.laneWidth, this.height);
          }

          // 미스 시 붉은 플래시
          if (this.laneMissHighlight[i] > 0) {
            this.ctx.fillStyle = `rgba(255, 0, 0, ${this.laneMissHighlight[i] * 0.35})`;
            this.ctx.fillRect(lx, 0, this.laneWidth, this.height);
          }

          // 레인 경계선
          this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
          this.ctx.lineWidth = 1;
          this.ctx.beginPath();
          this.ctx.moveTo(lx, 0);
          this.ctx.lineTo(lx, this.height);
          this.ctx.stroke();
        }

        // 트랙 외곽선
        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        this.ctx.strokeRect(this.trackX, 0, this.trackWidth, this.height);

        // 판정선 가이드
        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        this.ctx.lineWidth = 2;
        this.ctx.beginPath();
        this.ctx.moveTo(this.trackX, this.targetY);
        this.ctx.lineTo(this.trackX + this.trackWidth, this.targetY);
        this.ctx.stroke();
      }

      renderTargetArrows() {
        for (let i = 0; i < 4; i++) {
          const cx = this.getLaneCenterX(i);
          const cy = this.targetY;
          const isPressed = this.laneStates[i];
          const color = LANES[i].color;

          this.ctx.save();
          this.ctx.translate(cx, cy);

          // 화살표 외곽 박스/원 펄스
          this.ctx.strokeStyle = isPressed ? '#ffffff' : color;
          this.ctx.lineWidth = isPressed ? 4 : 2;
          this.ctx.shadowColor = color;
          this.ctx.shadowBlur = isPressed ? 18 : 8;

          this.ctx.beginPath();
          this.ctx.arc(0, 0, this.laneWidth * 0.36, 0, Math.PI * 2);
          this.ctx.stroke();

          // 방향 화살표 텍스트
          this.ctx.fillStyle = isPressed ? '#ffffff' : color;
          this.ctx.font = `bold ${this.laneWidth * 0.46}px sans-serif`;
          this.ctx.textAlign = 'center';
          this.ctx.textBaseline = 'middle';
          this.ctx.fillText(LANES[i].symbol, 0, 2);

          this.ctx.restore();
        }
      }

      renderNotes() {
        const timeWindow = this.travelDuration;

        this.notes.forEach(note => {
          if (note.hit && (!note.holding || note.holdCompleted)) return;
          if (note.missed) return;

          // 시간 기반 Y 좌표 보간 계산 (아래 -> 위로 상승)
          const timeToHit = note.hitTime - this.gameTime;
          const currentY = this.targetY - (timeToHit / timeWindow) * (this.targetY - this.spawnY);
          const cx = this.getLaneCenterX(note.lane);
          const color = LANES[note.lane].color;

          // 1) 롱노트 몸체 렌더링
          if (note.type === 'hold') {
            const holdTailY = this.targetY - ((note.hitTime + note.duration - this.gameTime) / timeWindow) * (this.targetY - this.spawnY);
            const bodyTop = Math.min(this.targetY, Math.max(currentY, holdTailY));
            const bodyBottom = Math.max(currentY, holdTailY);

            if (bodyBottom > 0 && bodyTop < this.height) {
              const bodyGrad = this.ctx.createLinearGradient(0, bodyTop, 0, bodyBottom);
              bodyGrad.addColorStop(0, color);
              bodyGrad.addColorStop(1, `${color}44`);

              this.ctx.fillStyle = bodyGrad;
              this.ctx.fillRect(cx - this.laneWidth * 0.18, bodyTop, this.laneWidth * 0.36, bodyBottom - bodyTop);

              this.ctx.strokeStyle = '#ffffff';
              this.ctx.lineWidth = 2;
              this.ctx.strokeRect(cx - this.laneWidth * 0.18, bodyTop, this.laneWidth * 0.36, bodyBottom - bodyTop);
            }
          }

          // 2) 노트 헤드 렌더링 (화면 내에 있을 때만)
          if (currentY > -60 && currentY < this.height + 60) {
            this.ctx.save();
            this.ctx.translate(cx, currentY);

            // 네온 헤드 글로우
            this.ctx.shadowColor = color;
            this.ctx.shadowBlur = 12;

            this.ctx.fillStyle = '#0f111a';
            this.ctx.beginPath();
            this.ctx.arc(0, 0, this.laneWidth * 0.35, 0, Math.PI * 2);
            this.ctx.fill();

            this.ctx.strokeStyle = color;
            this.ctx.lineWidth = 3;
            this.ctx.stroke();

            // 노트 화살표
            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = `bold ${this.laneWidth * 0.44}px sans-serif`;
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            this.ctx.fillText(LANES[note.lane].symbol, 0, 1);

            this.ctx.restore();
          }
        });
      }

      renderParticles() {
        // 일반 파티클
        this.particles.forEach(p => {
          this.ctx.save();
          this.ctx.globalAlpha = Math.max(0, p.alpha);
          this.ctx.fillStyle = p.color;
          this.ctx.shadowColor = p.color;
          this.ctx.shadowBlur = 8;
          this.ctx.beginPath();
          if (p.isStar) {
            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          } else {
            this.ctx.rect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
          }
          this.ctx.fill();
          this.ctx.restore();
        });

        // 결과 색종이
        this.confetti.forEach(c => {
          this.ctx.save();
          this.ctx.translate(c.x, c.y);
          this.ctx.rotate((c.rot * Math.PI) / 180);
          this.ctx.fillStyle = c.color;
          this.ctx.fillRect(-c.size/2, -c.size/2, c.size, c.size * 0.6);
          this.ctx.restore();
        });
      }

      renderHUD() {
        if (this.state !== 'PLAYING' && this.state !== 'PAUSED' && this.state !== 'COUNTDOWN') return;

        // 1) 체력 게이지 (상단 중앙)
        const barW = Math.min(this.width * 0.7, 360);
        const barH = 10;
        const barX = (this.width - barW) / 2;
        const barY = 56;

        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        this.ctx.fillRect(barX, barY, barW, barH);

        const lifeColor = this.life > 50 ? '#00ff66' : (this.life > 25 ? '#ffaa00' : '#ff0055');
        this.ctx.fillStyle = lifeColor;
        this.ctx.shadowColor = lifeColor;
        this.ctx.shadowBlur = 8;
        this.ctx.fillRect(barX, barY, (barW * this.life) / 100, barH);
        this.ctx.shadowBlur = 0;

        // 2) 스코어 & 정확도
        this.ctx.fillStyle = '#ffffff';
        this.ctx.font = 'bold 20px sans-serif';
        this.ctx.textAlign = 'left';
        this.ctx.fillText(`SCORE ${this.score.toLocaleString()}`, barX, barY - 14);

        const totalNotes = this.stats.perfect + this.stats.great + this.stats.good + this.stats.miss;
        const acc = totalNotes > 0 ? ((this.stats.perfect * 100 + this.stats.great * 70 + this.stats.good * 40) / (totalNotes * 100)) * 100 : 100;
        this.ctx.textAlign = 'right';
        this.ctx.fillText(`${acc.toFixed(1)}%`, barX + barW, barY - 14);

        // 3) 콤보 표시 (트랙 중앙 상단)
        if (this.combo >= 3) {
          this.ctx.save();
          this.ctx.textAlign = 'center';
          this.ctx.fillStyle = '#a0a5c0';
          this.ctx.font = 'bold 16px sans-serif';
          this.ctx.fillText('COMBO', this.width / 2, this.targetY + 90);

          this.ctx.fillStyle = '#ffffff';
          this.ctx.font = '900 42px sans-serif';
          this.ctx.shadowColor = '#00e5ff';
          this.ctx.shadowBlur = 15;
          this.ctx.fillText(this.combo, this.width / 2, this.targetY + 135);
          this.ctx.restore();
        }

        // 4) 판정 피드백 텍스트
        if (this.judgmentText) {
          this.ctx.save();
          this.ctx.textAlign = 'center';
          this.ctx.font = `900 ${26 * this.judgmentScale}px sans-serif`;
          this.ctx.fillStyle = this.judgmentColor;
          this.ctx.shadowColor = this.judgmentColor;
          this.ctx.shadowBlur = 12;
          this.ctx.fillText(this.judgmentText, this.width / 2, this.targetY + 50);
          this.ctx.restore();
        }
      }

      renderCountdown() {
        this.ctx.save();
        this.ctx.fillStyle = 'rgba(5, 5, 13, 0.4)';
        this.ctx.fillRect(0, 0, this.width, this.height);

        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.font = '900 64px sans-serif';
        this.ctx.fillStyle = '#00e5ff';
        this.ctx.shadowColor = '#00e5ff';
        this.ctx.shadowBlur = 25;
        this.ctx.fillText(this.countdownText, this.width / 2, this.height / 2);
        this.ctx.restore();
      }
    }

    // --- 7. 초기화 진입점 ---
    window.addEventListener('DOMContentLoaded', () => {
      window.beatStepGame = new BeatStepGame();
    });
  </script>
</body>
</html>
