<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"><title>⚫ AI 오목</title><style>
:root{--c1:#92400e;--c2:#fbbf24}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 18% 10%,var(--c1),#11162e 52%,#030712);user-select:none;-webkit-user-select:none}.app{width:min(95vw,720px);height:min(95vh,860px);display:flex;flex-direction:column;gap:11px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 4px}.brand small{display:block;color:#cbd5e1;font-size:10px;font-weight:900;letter-spacing:.2em}.brand h1{margin:2px 0 0;font-size:clamp(25px,5vw,38px);letter-spacing:-.05em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:67px;padding:7px 10px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#0f172ac7}.stat small{display:block;color:#cbd5e1;font-size:9px}.stat b{font-size:19px}.stage{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff27;border-radius:25px;background:linear-gradient(145deg,#14203b,#090e21);box-shadow:0 25px 70px #0009;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#050916e9}.overlay.hide{display:none}.card{width:min(100%,410px);padding:28px 24px;text-align:center;border:1px solid #ffffff25;border-radius:23px;background:#111a36ee;box-shadow:0 20px 55px #0008}.card .emoji{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{margin:0 0 19px;color:#cbd5e1;font-size:14px;line-height:1.72;word-break:keep-all}.primary{min-height:48px;width:100%;padding:12px 18px;border:0;border-radius:13px;color:#08111f;background:linear-gradient(135deg,var(--c2),#fef3c7);font:900 15px system-ui;cursor:pointer}.tip{min-height:18px;text-align:center;color:#aebbd0;font-size:12px}.hidden{display:none!important}button{font-family:inherit}.gomoku-wrap{height:100%;display:grid;place-items:center;align-content:center;gap:12px;padding:12px;background:linear-gradient(145deg,#422006,#1c1917)}.turn{padding:8px 14px;border-radius:999px;background:#0007;color:#fde68a;font-weight:800}.gomoku{width:min(94%,570px);aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);padding:13px;border:7px solid #78350f;border-radius:14px;background-color:#d6a84b;background-image:linear-gradient(#6b451f55 1px,transparent 1px),linear-gradient(90deg,#6b451f55 1px,transparent 1px);background-size:calc(100% / 9) calc(100% / 9);box-shadow:inset 0 0 25px #78350f88,0 15px 35px #0007}.gcell{position:relative;border:0;background:transparent;cursor:pointer;min-width:0}.gcell::after{content:"";position:absolute;inset:13%;border-radius:50%;transition:.18s}.gcell.black::after{background:radial-gradient(circle at 34% 28%,#64748b,#09090b 45%);box-shadow:0 5px 8px #0008}.gcell.white::after{background:radial-gradient(circle at 34% 28%,#fff,#d1d5db 55%);box-shadow:0 5px 8px #0006}.gcell.last::after{outline:3px solid #fbbf24;outline-offset:-5px}@media(max-width:430px){.gomoku{padding:7px;border-width:4px}.gcell::after{inset:9%}}
@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.stage{min-height:0;border-radius:20px}.brand h1{font-size:25px}.stat{min-width:61px;padding:6px 8px}.card{padding:24px 19px}.tip{font-size:11px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><small>NINE BOARD</small><h1>⚫ AI 오목</h1></div><div class="hud" id="hud"></div></header><section class="stage" id="stage"><div class="gomoku-wrap"><div class="turn" id="turn">당신은 흑돌입니다</div><div class="gomoku" id="board"></div></div><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="resultEmoji">⚫</div><h2 id="resultTitle">AI 오목</h2><p id="resultText">9×9 보드에서 인공지능보다 먼저 다섯 돌을 연결하세요.</p><button class="primary" id="startBtn">게임 시작</button></div></div></section><div class="tip">9×9 보드에서 인공지능보다 먼저 다섯 돌을 연결하세요.</div></main><script>
const $=s=>document.querySelector(s),stage=$('#stage'),overlay=$('#overlay'),startBtn=$('#startBtn');
const safeGet=(k,d=0)=>{try{return Number(localStorage.getItem(k))||d}catch(e){return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function showResult(icon,title,text,button='다시 하기'){ $('#resultEmoji').textContent=icon;$('#resultTitle').textContent=title;$('#resultText').innerHTML=text;startBtn.textContent=button;overlay.classList.remove('hide') }
const N=9,board=$('#board'),turnEl=$('#turn'),hud=$('#hud');let cells=[],playing=false,human=true,last=-1,wins=0;hud.innerHTML='<div class="stat"><small>승리</small><b id="wins">0</b></div><div class="stat"><small>목표</small><b>5목</b></div>';
function render(){board.innerHTML='';cells.forEach((v,i)=>{const b=document.createElement('button');b.className='gcell '+(v===1?'black':v===2?'white':'')+(i===last?' last':'');b.setAttribute('aria-label',`${Math.floor(i/N)+1}행 ${i%N+1}열`);b.onclick=()=>humanMove(i);board.appendChild(b)})}
function startGame(){cells=Array(N*N).fill(0);playing=true;human=true;last=-1;turnEl.textContent='당신 차례 · 흑돌을 놓으세요';overlay.classList.add('hide');render()}
function humanMove(i){if(!playing||!human||cells[i])return;place(i,1);if(checkWin(i,1))return finish(true);if(cells.every(Boolean))return finish(null);human=false;turnEl.textContent='AI가 수를 생각하는 중...';setTimeout(aiMove,280)}
function place(i,p){cells[i]=p;last=i;render()}
const dirs=[[1,0],[0,1],[1,1],[1,-1]];function count(i,p,dx,dy){let x=i%N+dx,y=Math.floor(i/N)+dy,n=0;while(x>=0&&x<N&&y>=0&&y<N&&cells[y*N+x]===p){n++;x+=dx;y+=dy}return n}function checkWin(i,p){return dirs.some(([dx,dy])=>1+count(i,p,dx,dy)+count(i,p,-dx,-dy)>=5)}
function scoreSpot(i,p){let score=0;cells[i]=p;for(const[dX,dY]of dirs){const n=1+count(i,p,dX,dY)+count(i,p,-dX,-dY);score+=n>=5?100000:n===4?4000:n===3?380:n===2?45:4}cells[i]=0;return score}
function aiMove(){if(!playing)return;const empty=cells.map((v,i)=>v?null:i).filter(v=>v!==null);let best=-1,bestScore=-1;for(const i of empty){const near=cells.some((v,j)=>v&&Math.max(Math.abs(i%N-j%N),Math.abs(Math.floor(i/N)-Math.floor(j/N)))<=2);if(!near&&empty.length<N*N-1)continue;const s=scoreSpot(i,2)*1.15+scoreSpot(i,1)+Math.random()*5;if(s>bestScore){bestScore=s;best=i}}if(best<0)best=empty[Math.floor(Math.random()*empty.length)];place(best,2);if(checkWin(best,2))return finish(false);if(cells.every(Boolean))return finish(null);human=true;turnEl.textContent='당신 차례 · AI의 수를 막아보세요'}
function finish(result){playing=false;if(result===true){wins++;$('#wins').textContent=wins;showResult('🏆','오목 승리!','AI보다 먼저 다섯 돌을 연결했습니다.')}else if(result===false)showResult('🤖','AI 승리','공격만 보지 말고 AI의 열린 3목과 4목을 먼저 막아보세요.');else showResult('🤝','무승부','빈칸 없이 치열한 대국이 끝났습니다.')}startBtn.onclick=startGame;render();
</script></body></html>
