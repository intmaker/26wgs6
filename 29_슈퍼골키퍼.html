<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🥅 슈퍼 골키퍼</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 15%,#16a34a,#064e3b 50%,#052e16);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(94vw,700px);height:min(95vh,840px);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#86efac;font-weight:900}h1{margin:2px 0;font-size:clamp(26px,5vw,38px)}.stats{display:flex;gap:7px}.stat{min-width:70px;padding:8px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#064e3bcc}.stat small{display:block;color:#bbf7d0;font-size:9px}.stat b{font-size:20px}.game{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff30;border-radius:25px;background:linear-gradient(#60a5fa 0 42%,#22c55e 42% 100%);box-shadow:0 25px 70px #0009}.crowd{position:absolute;inset:0 0 58%;background:repeating-linear-gradient(90deg,#1e293b 0 12px,#334155 12px 24px);opacity:.65}.goal{position:absolute;left:8%;right:8%;top:20%;height:47%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);border:9px solid #f8fafc;border-bottom-width:13px;box-shadow:0 8px 30px #0005;background:repeating-linear-gradient(45deg,#ffffff24 0 2px,transparent 2px 18px)}.zone{border:1px dashed #ffffff25;cursor:pointer;touch-action:manipulation}.zone:hover{background:#ffffff18}.keeper{position:absolute;left:50%;top:58%;font-size:62px;transform:translate(-50%,-50%);transition:left .18s,top .18s,transform .18s;z-index:2}.ball{position:absolute;left:50%;top:88%;font-size:35px;transform:translate(-50%,-50%);transition:left .48s cubic-bezier(.2,.8,.3,1),top .48s cubic-bezier(.2,.8,.3,1),transform .48s;z-index:3}.signal{position:absolute;left:50%;top:74%;transform:translateX(-50%);padding:9px 15px;border-radius:999px;background:#071827c9;font-weight:900;white-space:nowrap}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#052e16e8}.overlay.hide{display:none}.card{max-width:390px;padding:28px 24px;text-align:center;border:1px solid #ffffff25;border-radius:23px;background:#064e3b}.ico{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{color:#dcfce7;font-size:14px;line-height:1.7}.card button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#86efac,#fef08a);color:#064e3b;font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#bbf7d0;font-size:12px}@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.game{border-radius:20px}.goal{left:4%;right:4%}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">PENALTY GUARD</div><h1>🥅 슈퍼 골키퍼</h1></div><div class="stats"><div class="stat"><small>선방</small><b id="score">0</b></div><div class="stat"><small>남은 슛</small><b id="round">10</b></div></div></header><section class="game"><div class="crowd"></div><div class="goal" id="goal"></div><div class="keeper" id="keeper">🧤</div><div class="ball" id="ball">⚽</div><div class="signal" id="signal">키커의 몸 방향을 잘 보세요</div><div class="overlay" id="over"><div class="card"><div class="ico" id="ico">🥅</div><h2 id="title">페널티킥을 막아내세요!</h2><p id="desc">키커가 방향 힌트를 잠깐 보여준 뒤 슛합니다.<br>공이 출발하면 골대의 6개 구역 중 하나를 누르세요.<br>너무 일찍 몸을 날리면 키커가 방향을 바꿉니다.</p><button id="start">10번의 승부 시작</button></div></div></section><div class="tip">공이 출발한 뒤 골대 구역 클릭·터치 · 성급한 다이빙 주의</div></main><script>
(()=>{const goal=document.querySelector('#goal'),keeper=document.querySelector('#keeper'),ball=document.querySelector('#ball'),signal=document.querySelector('#signal'),over=document.querySelector('#over'),scoreEl=document.querySelector('#score'),roundEl=document.querySelector('#round');let score=0,round=0,target=0,state='idle',timer;for(let i=0;i<6;i++){const z=document.createElement('button');z.className='zone';z.onclick=()=>dive(i);goal.appendChild(z)}const pos=i=>({x:[21,50,79][i%3],y:[32,57][Math.floor(i/3)]});
function start(){clearTimeout(timer);score=0;round=0;scoreEl.textContent=0;roundEl.textContent=10;over.classList.add('hide');nextShot()}
function nextShot(){if(round>=10)return finish();round++;roundEl.textContent=11-round;state='hint';target=Math.floor(Math.random()*6);resetActors();const side=['왼쪽','가운데','오른쪽'][target%3];signal.textContent=`키커의 시선: ${side}...?`;timer=setTimeout(()=>{state='shot';if(Math.random()<.22)target=(target+1+Math.floor(Math.random()*5))%6;const p=pos(target);signal.textContent='지금! 막으세요!';ball.style.left=p.x+'%';ball.style.top=p.y+'%';ball.style.transform='translate(-50%,-50%) scale(.72)';timer=setTimeout(()=>resolve(-1),650)},650+Math.random()*500)}
function resetActors(){ball.style.transition='none';ball.style.left='50%';ball.style.top='88%';ball.style.transform='translate(-50%,-50%) scale(1)';keeper.style.left='50%';keeper.style.top='58%';keeper.style.transform='translate(-50%,-50%) scale(1)';void ball.offsetWidth;ball.style.transition='left .48s cubic-bezier(.2,.8,.3,1),top .48s cubic-bezier(.2,.8,.3,1),transform .48s'}
function dive(i){if(state==='idle'||state==='done')return;if(state==='hint'){state='early';signal.textContent='너무 일찍 움직였어요!';target=(i+1+Math.floor(Math.random()*5))%6;timer=setTimeout(()=>{state='shot';const p=pos(target);ball.style.left=p.x+'%';ball.style.top=p.y+'%';timer=setTimeout(()=>resolve(i),520)},250);moveKeeper(i);return}if(state==='shot'){clearTimeout(timer);state='done';moveKeeper(i);setTimeout(()=>resolve(i),360)}}function moveKeeper(i){const p=pos(i);keeper.style.left=p.x+'%';keeper.style.top=p.y+'%';keeper.style.transform='translate(-50%,-50%) scale(1.22) rotate('+(i%3===0?-18:i%3===2?18:0)+'deg)'}
function resolve(i){if(state==='resolved')return;state='resolved';if(i===target){score++;scoreEl.textContent=score;signal.textContent='🧤 슈퍼 세이브!'}else signal.textContent='⚽ 골! 다음 슛을 준비하세요';timer=setTimeout(nextShot,850)}function finish(){state='idle';document.querySelector('#ico').textContent=score>=7?'🏆':'🧤';document.querySelector('#title').textContent=`10개 중 ${score}개 선방!`;document.querySelector('#desc').innerHTML=score>=7?'놀라운 반사 신경이에요! 골문을 완벽하게 지켰습니다.':'공이 출발한 직후 방향을 보고 몸을 날려보세요.';document.querySelector('#start').textContent='다시 막기';over.classList.remove('hide')}document.querySelector('#start').onclick=start;
})();</script></body></html>
