<script>
const $=s=>document.querySelector(s);

const stageEl=$('#stage');
const overlay=$('#overlay');
const startBtn=$('#startBtn');

const sea=$('#sea');
const log=$('#log');

const ammoEl=$('#ammo');
const scoreEl=$('#score');
const bestEl=$('#best');
const stageNoEl=$('#stageNo');

const sonarsEl=$('#sonars');
const depthsEl=$('#depths');

const enemyStatus=$('#enemyStatus');
const comboEl=$('#combo');
const toast=$('#toast');

const SIZE=8;

const safeGet=(k,d=0)=>{
  try{
    return Number(localStorage.getItem(k))||d;
  }catch{
    return d;
  }
};

const safeSet=(k,v)=>{
  try{
    localStorage.setItem(k,v);
  }catch{}
};

let grid=[];
let ships=[];

let shots=0;
let ammo=24;
let sonars=3;
let depths=1;

let score=0;
let combo=0;

let mode='fire';
let playing=false;

let stageNo=1;
let difficulty=1;

let best=safeGet('sonarScoreBest',0);

const difficultyNames=[
  '쉬움',
  '보통',
  '어려움'
];

bestEl.textContent=best;

function showToast(text){
  toast.textContent=text;

  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');

  clearTimeout(showToast.timer);

  showToast.timer=setTimeout(()=>{
    toast.classList.remove('show');
  },700);
}

function shake(){
  stageEl.classList.remove('shake');
  void stageEl.offsetWidth;
  stageEl.classList.add('shake');
}

function shipLengths(){
  if(stageNo<=2){
    return [3,2,2];
  }

  if(stageNo<=4){
    return [4,3,2];
  }

  return [4,3,3,2];
}

function placeShips(){

  grid=
    Array(SIZE*SIZE)
    .fill(null)
    .map(()=>({
      ship:-1,
      shot:false,
      scan:null,
      special:false
    }));

  ships=[];

  for(const len of shipLengths()){

    let ok=false;
    let guard=0;

    while(!ok && guard<5000){

      guard++;

      const horizontal=
        Math.random()<.5;

      const x=
        Math.floor(
          Math.random()*
          (horizontal
            ?SIZE-len+1
            :SIZE)
        );

      const y=
        Math.floor(
          Math.random()*
          (horizontal
            ?SIZE
            :SIZE-len+1)
        );

      const cells=
        Array.from(
          {length:len},
          (_,k)=>
            (y+(horizontal?0:k))*SIZE+
            x+
            (horizontal?k:0)
        );

      const blocked=cells.some(i=>{

        const cx=i%SIZE;
        const cy=Math.floor(i/SIZE);

        for(let yy=cy-1;yy<=cy+1;yy++){
          for(let xx=cx-1;xx<=cx+1;xx++){

            if(
              xx<0||
              yy<0||
              xx>=SIZE||
              yy>=SIZE
            ) continue;

            if(grid[yy*SIZE+xx].ship>=0){
              return true;
            }
          }
        }

        return false;
      });

      if(!blocked){

        const id=ships.length;

        cells.forEach(i=>{
          grid[i].ship=id;
        });

        ships.push({
          cells,
          hits:0,
          len,
          sunk:false
        });

        ok=true;
      }
    }
  }
}

function getAmmo(){

  const base=
    difficulty===0
      ?28
      :difficulty===1
      ?24
      :20;

  return Math.max(
    15,
    base-Math.floor((stageNo-1)*.8)
  );
}

function getSonars(){
  return difficulty===0?4:
         difficulty===1?3:2;
}

function startGame(){

  placeShips();

  ammo=getAmmo();
  shots=0;

  sonars=getSonars();
  depths=
    stageNo>=3
      ?2
      :1;

  score=0;
  combo=0;

  playing=true;

  stageNoEl.textContent=stageNo;
  ammoEl.textContent=ammo;
  sonarsEl.textContent=sonars;
  depthsEl.textContent=depths;

  scoreEl.textContent=0;

  updateCombo();
  updateShips();

  setMode('fire');

  log.textContent=
    '🎯 적 함대가 숨어 있습니다. 공격을 시작하세요.';

  overlay.classList.add('hide');

  render();
}

function setMode(m){

  mode=m;

  $('#fireMode')
    .classList
    .toggle('active',m==='fire');

  $('#sonarMode')
    .classList
    .toggle('active',m==='sonar');

  $('#depthMode')
    .classList
    .toggle('active',m==='depth');

  if(m==='sonar'){
    log.textContent=
      '📡 중심 칸을 선택하면 주변 3×3 구역을 탐지합니다.';
  }

  if(m==='depth'){
    log.textContent=
      '💣 중심 칸 주변 3×3 구역에 폭뢰를 투하합니다.';
  }

  if(m==='fire'){
    log.textContent=
      '🎯 공격할 좌표를 선택하세요.';
  }
}

function updateCombo(){
  comboEl.textContent=
    `COMBO x${combo}`;
}

function updateShips(){

  enemyStatus.innerHTML=
    '적 함대 '+
    ships.map(s=>
      `<span class="enemyShip ${s.sunk?'':'alive'}">${
        s.len>=4?'🛳️':
        s.len===3?'🚢':
        '⛴️'
      }</span>`
    ).join('');
}

function render(){

  sea.innerHTML='';

  grid.forEach((c,i)=>{

    const b=document.createElement('button');

    const sunk=
      c.ship>=0 &&
      ships[c.ship].sunk;

    b.className=
      'scell'+
      (
        c.shot
          ?c.ship>=0
            ?' hit'
            :' miss'
          :''
      )+
      (
        c.scan!==null
          ?' scan'
          :''
      )+
      (
        sunk
          ?' sunk'
          :''
      )+
      (
        c.special
          ?' special'
          :''
      );

    if(
      c.scan!==null &&
      !c.shot
    ){
      b.textContent=c.scan;
    }

    b.onclick=()=>act(i);

    sea.appendChild(b);
  });
}

function sonarScan(i){

  if(sonars<=0){
    showToast('📡 소나 없음');
    return;
  }

  sonars--;
  sonarsEl.textContent=sonars;

  const x=i%SIZE;
  const y=Math.floor(i/SIZE);

  let count=0;

  for(let yy=y-1;yy<=y+1;yy++){

    for(let xx=x-1;xx<=x+1;xx++){

      if(
        xx<0||
        yy<0||
        xx>=SIZE||
        yy>=SIZE
      ) continue;

      const j=
        yy*SIZE+xx;

      if(
        grid[j].ship>=0 &&
        !grid[j].shot
      ){
        count++;
      }
    }
  }

  grid[i].scan=count;

  if(count===0){

    log.textContent=
      '📡 반응 없음! 주변에는 적 함선이 없습니다.';

    showToast('📡 반응 0');

  }else{

    log.textContent=
      `📡 소나 반응 ${count}! 주변 3×3에 함선 칸 ${count}개가 있습니다.`;

    showToast(
      `📡 함선 반응 ${count}`
    );
  }

  setMode('fire');
  render();
}

function fireCell(i,free=false){

  const c=grid[i];

  if(c.shot){
    return false;
  }

  c.shot=true;

  if(!free){
    ammo--;
    shots++;
  }

  if(c.ship>=0){

    const ship=
      ships[c.ship];

    ship.hits++;

    combo++;

    const gain=
      100+
      combo*25;

    score+=gain;

    if(ship.hits>=ship.cells.length){

      ship.sunk=true;

      score+=300;

      showToast(
        `🚢 침몰! +${gain+300}`
      );

      log.textContent=
        '🔥 적 함선 침몰! 다른 함선을 추적하세요.';

      shake();

    }else{

      showToast(
        `💥 명중 +${gain}`
      );

      log.textContent=
        '💥 명중! 주변 칸을 공격해 같은 함선을 추적하세요.';
    }

  }else{

    combo=0;

    if(!free){
      score=Math.max(
        0,
        score-10
      );
    }

    log.textContent=
      '🌊 빗나갔습니다. 소나를 활용해 범위를 줄여보세요.';
  }

  scoreEl.textContent=score;
  ammoEl.textContent=ammo;

  updateCombo();
  updateShips();

  return true;
}

function depthCharge(i){

  if(depths<=0){
    showToast('💣 폭뢰 없음');
    return;
  }

  depths--;

  depthsEl.textContent=depths;

  ammo--;

  shots++;

  ammoEl.textContent=ammo;

  const cx=i%SIZE;
  const cy=Math.floor(i/SIZE);

  let hits=0;

  for(let y=cy-1;y<=cy+1;y++){

    for(let x=cx-1;x<=cx+1;x++){

      if(
        x<0||
        y<0||
        x>=SIZE||
        y>=SIZE
      ) continue;

      const j=y*SIZE+x;

      grid[j].special=true;

      if(!grid[j].shot){

        const wasShip=
          grid[j].ship>=0;

        fireCell(j,true);

        if(wasShip){
          hits++;
        }
      }
    }
  }

  showToast(
    hits
      ?`💣 폭뢰 명중 ${hits}`
      :'💣 폭뢰 빗나감'
  );

  shake();

  setTimeout(()=>{

    grid.forEach(c=>{
      c.special=false;
    });

    render();

  },450);

  setMode('fire');

  checkEnd();
}

function act(i){

  if(!playing)return;

  if(mode==='sonar'){
    sonarScan(i);
    return;
  }

  if(mode==='depth'){
    depthCharge(i);
    return;
  }

  if(ammo<=0)return;

  const changed=
    fireCell(i,false);

  if(!changed)return;

  render();

  checkEnd();
}

function checkEnd(){

  if(
    ships.every(s=>s.sunk)
  ){
    win();
    return;
  }

  if(ammo<=0){
    lose();
  }
}

function revealShips(){

  grid.forEach(c=>{

    if(c.ship>=0){
      c.shot=true;
    }

  });

  ships.forEach(s=>{
    s.sunk=true;
  });

  updateShips();
  render();
}

function win(){

  playing=false;

  const ammoBonus=
    ammo*50;

  const sonarBonus=
    sonars*80;

  const stageBonus=
    stageNo*150;

  score+=
    ammoBonus+
    sonarBonus+
    stageBonus;

  scoreEl.textContent=score;

  if(score>best){

    best=score;

    safeSet(
      'sonarScoreBest',
      best
    );

    bestEl.textContent=best;
  }

  let stars=1;

  if(ammo>=4){
    stars=2;
  }

  if(
    ammo>=7 &&
    sonars>=1
  ){
    stars=3;
  }

  const rating=
    '⭐'.repeat(stars)+
    '☆'.repeat(3-stars);

  $('#resultEmoji')
    .textContent='🏆';

  $('#resultTitle')
    .textContent='적 함대 전멸!';

  $('#resultText')
    .innerHTML=
    `${rating}<br><br>`+
    `사용 포탄 <b>${shots}</b>발<br>`+
    `남은 포탄 <b>${ammo}</b>발<br>`+
    `남은 소나 <b>${sonars}</b>회<br>`+
    `최종 점수 <b>${score}</b>점<br><br>`+
    `다음 스테이지에서는 함대가 더 강력해집니다.`;

  startBtn.textContent=
    '다음 스테이지';

  startBtn.onclick=()=>{
    stageNo++;
    startGame();
  };

  setTimeout(()=>{
    overlay.classList.remove('hide');
  },500);
}

function lose(){

  playing=false;

  revealShips();

  $('#resultEmoji')
    .textContent='🌊';

  $('#resultTitle')
    .textContent='포탄 소진';

  $('#resultText')
    .innerHTML=
    `적 함대를 모두 찾지 못했습니다.<br><br>`+
    `📡 소나 숫자가 높게 나온 곳을 중심으로<br>`+
    `공격하면 함선을 더 빠르게 찾을 수 있습니다.<br><br>`+
    `폭뢰는 확실한 위치에서 사용하는 것이 좋습니다.`;

  startBtn.textContent=
    '다시 작전';

  startBtn.onclick=startGame;

  setTimeout(()=>{
    overlay.classList.remove('hide');
  },500);
}

$('#fireMode').onclick=()=>{
  if(playing){
    setMode('fire');
  }
};

$('#sonarMode').onclick=()=>{

  if(
    playing &&
    sonars>0
  ){
    setMode('sonar');
  }

};

$('#depthMode').onclick=()=>{

  if(
    playing &&
    depths>0
  ){
    setMode('depth');
  }

};

startBtn.onclick=startGame;

$('#levelBtn').onclick=()=>{

  difficulty=
    (difficulty+1)%3;

  $('#levelBtn')
    .textContent=
    `난이도 : ${difficultyNames[difficulty]}`;
};

placeShips();
updateShips();
render();
</script>

</body>
</html>
