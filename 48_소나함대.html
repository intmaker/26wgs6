<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"><title>📡 소나 함대</title><style>
:root{--c1:#075985;--c2:#67e8f9}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 18% 10%,var(--c1),#11162e 52%,#030712);user-select:none;-webkit-user-select:none}.app{width:min(95vw,720px);height:min(95vh,860px);display:flex;flex-direction:column;gap:11px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 4px}.brand small{display:block;color:#cbd5e1;font-size:10px;font-weight:900;letter-spacing:.2em}.brand h1{margin:2px 0 0;font-size:clamp(25px,5vw,38px);letter-spacing:-.05em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:67px;padding:7px 10px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#0f172ac7}.stat small{display:block;color:#cbd5e1;font-size:9px}.stat b{font-size:19px}.stage{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff27;border-radius:25px;background:linear-gradient(145deg,#14203b,#090e21);box-shadow:0 25px 70px #0009;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#050916e9}.overlay.hide{display:none}.card{width:min(100%,410px);padding:28px 24px;text-align:center;border:1px solid #ffffff25;border-radius:23px;background:#111a36ee;box-shadow:0 20px 55px #0008}.card .emoji{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{margin:0 0 19px;color:#cbd5e1;font-size:14px;line-height:1.72;word-break:keep-all}.primary{min-height:48px;width:100%;padding:12px 18px;border:0;border-radius:13px;color:#08111f;background:linear-gradient(135deg,var(--c2),#fef3c7);font:900 15px system-ui;cursor:pointer}.tip{min-height:18px;text-align:center;color:#aebbd0;font-size:12px}.hidden{display:none!important}button{font-family:inherit}.sonar{height:100%;display:grid;place-items:center;align-content:center;gap:11px;padding:14px;background:radial-gradient(circle,#075985,#031a31)}.sonar-tools{display:flex;gap:8px}.mode{min-height:46px;padding:9px 16px;border:1px solid #ffffff2b;border-radius:12px;color:#dbeafe;background:#ffffff0d;font-weight:900;cursor:pointer}.mode.active{background:#0ea5e9;color:#082f49}.sea{width:min(95%,530px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:7px;border:2px solid #38bdf8;border-radius:16px;background:#082f49}.scell{position:relative;border:1px solid #38bdf833;border-radius:8px;background:linear-gradient(145deg,#075985,#0c4a6e);color:#fff;font-size:clamp(14px,3vw,23px);font-weight:900;cursor:pointer}.scell.miss::after{content:"•";font-size:30px;color:#bae6fd}.scell.hit{background:#dc2626}.scell.hit::after{content:"💥"}.scell.scan{box-shadow:inset 0 0 0 3px #facc15}.scell.sunk{background:#7f1d1d}.log{min-height:25px;text-align:center;color:#bae6fd;font-weight:800}.pulse{animation:pulse .55s}@keyframes pulse{50%{transform:scale(.88);filter:brightness(1.8)}}
@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.stage{min-height:0;border-radius:20px}.brand h1{font-size:25px}.stat{min-width:61px;padding:6px 8px}.card{padding:24px 19px}.tip{font-size:11px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><small>SONAR FLEET</small><h1>📡 소나 함대</h1></div><div class="hud" id="hud"></div></header><section class="stage" id="stage"><div class="sonar"><div class="sonar-tools"><button id="fireMode" class="mode active">🎯 공격</button><button id="sonarMode" class="mode">📡 소나 <b id="sonars">3</b></button></div><div class="sea" id="sea"></div><div class="log" id="log">좌표를 선택해 적 함대를 찾으세요.</div></div><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="resultEmoji">📡</div><h2 id="resultTitle">소나 함대</h2><p id="resultText">제한된 포탄과 소나 단서로 숨은 적 함대를 모두 침몰시키세요.</p><button class="primary" id="startBtn">게임 시작</button></div></div></section><div class="tip">제한된 포탄과 소나 단서로 숨은 적 함대를 모두 침몰시키세요.</div></main><script>
const $=s=>document.querySelector(s),stage=$('#stage'),overlay=$('#overlay'),startBtn=$('#startBtn');
const safeGet=(k,d=0)=>{try{return Number(localStorage.getItem(k))||d}catch(e){return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function showResult(icon,title,text,button='다시 하기'){ $('#resultEmoji').textContent=icon;$('#resultTitle').textContent=title;$('#resultText').innerHTML=text;startBtn.textContent=button;overlay.classList.remove('hide') }
const SIZE=8,sea=$('#sea'),log=$('#log'),hud=$('#hud'),sonarsEl=$('#sonars');let grid=[],ships=[],shots=0,sonars=3,mode='fire',playing=false,best=safeGet('sonarBest',0);hud.innerHTML=`<div class="stat"><small>남은 포탄</small><b id="ammo">24</b></div><div class="stat"><small>최소 기록</small><b id="best">${best||'-'}</b></div>`;
function placeShips(){grid=Array(SIZE*SIZE).fill(null).map(()=>({ship:-1,shot:false,scan:null}));ships=[];for(const len of[3,2,2]){let ok=false;while(!ok){const horizontal=Math.random()<.5,x=Math.floor(Math.random()*(horizontal?SIZE-len+1:SIZE)),y=Math.floor(Math.random()*(horizontal?SIZE:SIZE-len+1)),cells=Array.from({length:len},(_,k)=>(y+(horizontal?0:k))*SIZE+x+(horizontal?k:0));if(cells.every(i=>grid[i].ship<0)){const id=ships.length;cells.forEach(i=>grid[i].ship=id);ships.push({cells,hits:0});ok=true}}}}
function startGame(){placeShips();shots=0;sonars=3;mode='fire';playing=true;sonarsEl.textContent=3;$('#ammo').textContent=24;log.textContent='공격할 좌표를 선택하세요.';setMode('fire');overlay.classList.add('hide');render()}
function setMode(m){mode=m;$('#fireMode').classList.toggle('active',m==='fire');$('#sonarMode').classList.toggle('active',m==='sonar')}
function render(){sea.innerHTML='';grid.forEach((c,i)=>{const b=document.createElement('button');const sunk=c.ship>=0&&ships[c.ship].hits===ships[c.ship].cells.length;b.className='scell'+(c.shot?(c.ship>=0?' hit':' miss'):'')+(c.scan!==null?' scan':'')+(sunk?' sunk':'');b.textContent=c.scan!==null&&!c.shot?c.scan:'';b.onclick=()=>act(i);sea.appendChild(b)})}
function act(i){if(!playing)return;const c=grid[i];if(mode==='sonar'){if(!sonars)return;sonars--;sonarsEl.textContent=sonars;const x=i%SIZE,y=Math.floor(i/SIZE);c.scan=grid.filter((z,j)=>z.ship>=0&&Math.abs(j%SIZE-x)<=1&&Math.abs(Math.floor(j/SIZE)-y)<=1).length;log.textContent=`소나 반응: 주변 3×3 구역에 함선 칸 ${c.scan}개`;setMode('fire');render();return}if(c.shot)return;c.shot=true;shots++;$('#ammo').textContent=Math.max(0,24-shots);if(c.ship>=0){ships[c.ship].hits++;log.textContent=ships[c.ship].hits===ships[c.ship].cells.length?'🚢 적 함선을 침몰시켰습니다!':'💥 명중! 같은 함선의 나머지 칸을 찾으세요.'}else log.textContent='빗나갔습니다. 소나 단서를 활용하세요.';render();if(ships.every(s=>s.hits===s.cells.length))return win();if(shots>=24)return lose()}
function win(){playing=false;if(!best||shots<best){best=shots;safeSet('sonarBest',best);$('#best').textContent=best}showResult('🏆','적 함대 전멸!',`${shots}발로 모든 함선을 침몰시켰습니다.<br>소나를 겹치지 않게 사용하면 더 적은 포탄으로 찾을 수 있어요.`)}function lose(){playing=false;grid.forEach(c=>{if(c.ship>=0)c.shot=true});render();showResult('🌊','포탄 소진','숨은 함선 위치를 확인하고 다시 작전을 세워보세요.')}$('#fireMode').onclick=()=>setMode('fire');$('#sonarMode').onclick=()=>sonars&&setMode('sonar');startBtn.onclick=startGame;placeShips();render();
</script></body></html>
