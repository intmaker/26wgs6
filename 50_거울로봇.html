<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"><title>🪞 거울 로봇</title><style>
:root{--c1:#4c1d95;--c2:#c4b5fd}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 18% 10%,var(--c1),#11162e 52%,#030712);user-select:none;-webkit-user-select:none}.app{width:min(95vw,720px);height:min(95vh,860px);display:flex;flex-direction:column;gap:11px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 4px}.brand small{display:block;color:#cbd5e1;font-size:10px;font-weight:900;letter-spacing:.2em}.brand h1{margin:2px 0 0;font-size:clamp(25px,5vw,38px);letter-spacing:-.05em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:67px;padding:7px 10px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#0f172ac7}.stat small{display:block;color:#cbd5e1;font-size:9px}.stat b{font-size:19px}.stage{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff27;border-radius:25px;background:linear-gradient(145deg,#14203b,#090e21);box-shadow:0 25px 70px #0009;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#050916e9}.overlay.hide{display:none}.card{width:min(100%,410px);padding:28px 24px;text-align:center;border:1px solid #ffffff25;border-radius:23px;background:#111a36ee;box-shadow:0 20px 55px #0008}.card .emoji{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{margin:0 0 19px;color:#cbd5e1;font-size:14px;line-height:1.72;word-break:keep-all}.primary{min-height:48px;width:100%;padding:12px 18px;border:0;border-radius:13px;color:#08111f;background:linear-gradient(135deg,var(--c2),#fef3c7);font:900 15px system-ui;cursor:pointer}.tip{min-height:18px;text-align:center;color:#aebbd0;font-size:12px}.hidden{display:none!important}button{font-family:inherit}.mirror-game{height:100%;display:flex;flex-direction:column;justify-content:center;gap:13px;padding:13px;background:linear-gradient(145deg,#172554,#4c1d95)}.boards{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;color:#ddd6fe}.mirror-board{margin-top:6px;aspect-ratio:1;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:5px;border:2px solid #ffffff35;border-radius:14px;background:#080e25}.mcell{display:grid;place-items:center;border-radius:6px;background:#ffffff0b;font-size:clamp(13px,4.5vw,29px)}.mcell.wall{background:#334155}.mcell.exit{background:#22c55e55;box-shadow:inset 0 0 0 2px #4ade80}.dpad{align-self:center;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,48px);gap:5px}.dpad button{min-height:46px;border:1px solid #ffffff35;border-radius:11px;color:#fff;background:#312e81;font-size:20px;font-weight:900}.dpad button[data-d=up]{grid-column:2}.dpad button[data-d=left]{grid-column:1}.dpad button[data-d=down]{grid-column:2}.dpad button[data-d=right]{grid-column:3}.mirror-msg{text-align:center;min-height:22px;color:#ddd6fe;font-weight:800}@media(max-width:430px){.boards{gap:5px}.mirror-board{gap:2px;padding:3px}.mcell{border-radius:4px}}
@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.stage{min-height:0;border-radius:20px}.brand h1{font-size:25px}.stat{min-width:61px;padding:6px 8px}.card{padding:24px 19px}.tip{font-size:11px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><small>MIRROR BOTS</small><h1>🪞 거울 로봇</h1></div><div class="hud" id="hud"></div></header><section class="stage" id="stage"><div class="mirror-game"><div class="boards"><div><b>BLUE</b><div class="mirror-board" id="boardA"></div></div><div><b>PINK</b><div class="mirror-board" id="boardB"></div></div></div><div class="dpad"><button data-d="up">▲</button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div><div class="mirror-msg" id="message">두 로봇을 동시에 출구로 보내세요.</div></div><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="resultEmoji">🪞</div><h2 id="resultTitle">거울 로봇</h2><p id="resultText">한 번의 입력으로 서로 반대 움직임을 하는 두 로봇을 함께 탈출시키세요.</p><button class="primary" id="startBtn">게임 시작</button></div></div></section><div class="tip">한 번의 입력으로 서로 반대 움직임을 하는 두 로봇을 함께 탈출시키세요.</div></main><script>
const $=s=>document.querySelector(s),stage=$('#stage'),overlay=$('#overlay'),startBtn=$('#startBtn');
const safeGet=(k,d=0)=>{try{return Number(localStorage.getItem(k))||d}catch(e){return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function showResult(icon,title,text,button='다시 하기'){ $('#resultEmoji').textContent=icon;$('#resultTitle').textContent=title;$('#resultText').innerHTML=text;startBtn.textContent=button;overlay.classList.remove('hide') }
const N=6,aBoard=$('#boardA'),bBoard=$('#boardB'),msg=$('#message'),hud=$('#hud');let a,b,wallsA,wallsB,exitA,exitB,playing=false,moves=0,level=1;hud.innerHTML='<div class="stat"><small>레벨</small><b id="level">1</b></div><div class="stat"><small>이동</small><b id="moves">0</b></div>';
const key=(x,y)=>y*N+x,dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};function randomPuzzle(){for(let tries=0;tries<300;tries++){a={x:0,y:N-1};b={x:N-1,y:N-1};exitA={x:N-1,y:0};exitB={x:0,y:0};wallsA=new Set;wallsB=new Set;while(wallsA.size<4+level)wallsA.add(Math.floor(Math.random()*N*N));while(wallsB.size<4+level)wallsB.add(Math.floor(Math.random()*N*N));[key(a.x,a.y),key(exitA.x,exitA.y)].forEach(i=>wallsA.delete(i));[key(b.x,b.y),key(exitB.x,exitB.y)].forEach(i=>wallsB.delete(i));if(hasSolution())return}wallsA=new Set;wallsB=new Set}
function hasSolution(){const q=[[a.x,a.y,b.x,b.y]],seen=new Set(q[0].join());while(q.length){const s=q.shift();if(s[0]===exitA.x&&s[1]===exitA.y&&s[2]===exitB.x&&s[3]===exitB.y)return true;for(const[d,[dx,dy]]of Object.entries(dirs)){let ax=s[0]+dx,ay=s[1]+dy,bx=s[2]-dx,by=s[3]+dy;if(ax<0||ax>=N||ay<0||ay>=N||wallsA.has(key(ax,ay))){ax=s[0];ay=s[1]}if(bx<0||bx>=N||by<0||by>=N||wallsB.has(key(bx,by))){bx=s[2];by=s[3]}const k=[ax,ay,bx,by].join();if(!seen.has(k)){seen.add(k);q.push([ax,ay,bx,by])}}}return false}
function startGame(){moves=0;playing=true;randomPuzzle();$('#moves').textContent=0;$('#level').textContent=level;msg.textContent='파란 로봇의 좌우 입력은 분홍 로봇에게 반대로 적용됩니다.';overlay.classList.add('hide');render()}
function renderBoard(el,p,walls,exit,emoji){el.innerHTML='';for(let i=0;i<N*N;i++){const c=document.createElement('div');c.className='mcell'+(walls.has(i)?' wall':'')+(i===key(exit.x,exit.y)?' exit':'');if(i===key(p.x,p.y))c.textContent=emoji;else if(walls.has(i))c.textContent='▦';else if(i===key(exit.x,exit.y))c.textContent='🚪';el.appendChild(c)}}function render(){renderBoard(aBoard,a,wallsA,exitA,'🤖');renderBoard(bBoard,b,wallsB,exitB,'🦾')}
function move(d){if(!playing)return;const[dx,dy]=dirs[d];const attempt=(p,w,xDir)=>{const nx=p.x+xDir,ny=p.y+dy;if(nx>=0&&nx<N&&ny>=0&&ny<N&&!w.has(key(nx,ny))){p.x=nx;p.y=ny}};attempt(a,wallsA,dx);attempt(b,wallsB,-dx);moves++;$('#moves').textContent=moves;render();if(a.x===exitA.x&&a.y===exitA.y&&b.x===exitB.x&&b.y===exitB.y){playing=false;level++;showResult('🪞','동시 탈출 성공!',`${moves}번 이동으로 두 로봇을 모두 탈출시켰습니다.<br>다음 레벨은 벽이 하나 더 추가됩니다.`,'다음 레벨')}}document.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>move(x.dataset.d));addEventListener('keydown',e=>{const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(m){e.preventDefault();move(m)}});startBtn.onclick=startGame;
</script></body></html>
