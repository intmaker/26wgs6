<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>시간 탐험대</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui;background:radial-gradient(circle,#1d4ed8,#172554);color:#fff;user-select:none;touch-action:manipulation}.app{max-width:740px;height:100%;margin:auto;padding:7px;display:flex;flex-direction:column;gap:6px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hud b{background:#ffffff18;padding:6px 9px;border-radius:99px}.portal{flex:1;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:50%;background:#ffffff10;box-shadow:inset 0 0 45px #22d3ee}.clock{position:relative;width:130px;height:130px;border:8px solid #fff;border-radius:50%;background:#eff6ff}.clock:before{content:'';position:absolute;left:57px;top:57px;width:8px;height:8px;border-radius:50%;background:#172554}.hand{position:absolute;left:61px;bottom:61px;width:5px;transform-origin:bottom;border-radius:5px;background:#ef4444}.hour{height:38px}.minute{height:51px;background:#2563eb}.question{max-width:90%;font-size:clamp(19px,5vw,27px);font-weight:900;text-align:center}.answers{display:grid;grid-template-columns:1fr 1fr;width:90%;gap:8px}.answers button{min-height:54px;border:0;border-radius:14px;background:#67e8f9;font-weight:900}.traveler{font-size:45px}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#172554dd;padding:15px}.hide{display:none}.card{width:min(420px,100%);padding:24px;text-align:center;background:#fff;color:#172554;border-radius:22px}.card div{font-size:55px}.card button{width:100%;min-height:50px;border:0;border-radius:13px;background:#38bdf8;font-weight:900}</style></head><body><main class="app"><h1>⏰ 시간 탐험대</h1><div class="hud"><b>⏱ <span id="time">100</span></b><b>점수 <span id="score">200</span></b><b>콤보 <span id="combo">0</span></b><b>장소 <span id="place">1</span></b></div><section class="portal"><div class="clock"><i class="hand hour" id="hour"></i><i class="hand minute" id="minute"></i></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="traveler" id="traveler">🧑‍🚀</div></section></main><div class="overlay" id="overlay"><div class="card"><div>⏰🌀</div><h2 id="title">시간 탐험대</h2><p id="text">시계를 읽고 시간 포털을 여행해요!</p><button id="start">탐험 시작</button></div></div><script>const $=s=>document.querySelector(s);let time,score,combo,maxCombo,ok,bad,place,timer,on,answer,best=0;try{best=+(localStorage.getItem('mathTimeBest')||0)}catch(e){}function ui(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo;$('#place').textContent=place}function fmt(m){m=(m+720)%720;let h=Math.floor(m/60)||12,mm=m%60;return`${h}시 ${mm?mm+'분':''}`}function opts(a){let s=new Set([a]);while(s.size<4)s.add((a+(Math.floor(Math.random()*7)-3)*10+720)%720);return[...s].sort(()=>Math.random()-.5)}function next(){let unit=time>80?30:time>40?10:5,start=(1+Math.floor(Math.random()*11))*60+Math.floor(Math.random()*(60/unit))*unit,type=Math.floor(Math.random()*(time>80?2:4)),delta=(1+Math.floor(Math.random()*4))*unit;if(type===0){answer=start;$('#question').textContent='시계는 몇 시일까요?'}else if(type===1){answer=(start+delta)%720;$('#question').textContent=`${fmt(start)}에서 ${delta}분 뒤는?`}else if(type===2){answer=(start-delta+720)%720;$('#question').textContent=`${fmt(start)}에서 ${delta}분 전은?`}else{answer=delta;$('#question').textContent=`${fmt(start)}부터 ${fmt(start+delta)}까지 몇 분?`}let display=type===3?x=>x+'분':fmt;$('#hour').style.transform=`rotate(${(start/60)*30}deg)`;$('#minute').style.transform=`rotate(${(start%60)*6}deg)`;$('#answers').innerHTML=opts(answer).map(n=>`<button data-n="${n}">${display(n)}</button>`).join('')}$('#answers').onclick=e=>{if(!on||e.target.dataset.n===undefined)return;if(+e.target.dataset.n===answer){score+=15+Math.min(combo,10);combo++;ok++;place++;maxCombo=Math.max(maxCombo,combo);$('#traveler').animate([{translate:'0'},{translate:'80px',opacity:0},{translate:'-80px',opacity:0},{translate:'0'}],{duration:450})}else{score=Math.max(0,score-7);combo=0;bad++}ui();if(!score)return end();setTimeout(next,450)};function start(){time=100;score=200;combo=maxCombo=ok=bad=0;place=1;on=true;$('#overlay').classList.add('hide');ui();next();clearInterval(timer);timer=setInterval(()=>{time--;ui();if(!time)end()},1000)}function end(){if(!on)return;on=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('mathTimeBest',best)}catch(e){}$('#title').textContent='🌟 시간 여행 완료!';$('#text').innerHTML=`점수 ${score} · 정답 ${ok} · 오답 ${bad}<br>최고 콤보 ${maxCombo} · 정확도 ${Math.round(ok/(ok+bad||1)*100)}%<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;</script></body></html>
