<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>숫자 기차</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,sans-serif;background:linear-gradient(#bfdbfe,#fef3c7);color:#1e3a8a;user-select:none;-webkit-user-select:none;touch-action:manipulation}.app{width:min(820px,100%);height:100%;margin:auto;padding:9px;display:flex;flex-direction:column;gap:8px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.hud b{padding:7px 11px;background:#fff;border-radius:99px}.scene{position:relative;flex:1;min-height:310px;overflow:hidden;border-radius:23px;background:linear-gradient(#93c5fd 0 62%,#84cc16 63% 77%,#78716c 78%)}.clouds{position:absolute;font-size:45px;top:8%;white-space:nowrap;animation:cloud 10s linear infinite}@keyframes cloud{from{left:100%}to{left:-40%}}.train{position:absolute;left:50%;top:44%;translate:-50%;display:flex;align-items:flex-end;gap:5px;width:94%;justify-content:center;transition:.35s}.train.go{animation:go .5s}@keyframes go{50%{translate:-42% -6px}}.engine{font-size:65px}.car{position:relative;display:grid;place-items:center;width:84px;height:69px;border:4px solid #92400e;border-radius:12px;background:#fb923c;color:#431407;font-size:clamp(22px,5vw,34px);font-weight:1000}.car:after{content:'●  ●';position:absolute;bottom:-19px;font-size:19px}.answers{position:absolute;left:5%;right:5%;bottom:5%;display:flex;gap:10px;justify-content:center}.answers button{flex:1;max-width:150px;min-height:58px;border:0;border-radius:16px;background:#fef08a;color:#713f12;font:1000 25px system-ui}.msg{position:absolute;top:15%;width:100%;text-align:center;font-size:clamp(18px,4vw,26px);font-weight:900}.tip{text-align:center}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:15px;background:#1e3a8acc}.overlay.hide{display:none}.cardbox{width:min(410px,100%);padding:24px;text-align:center;border-radius:23px;background:#fff}.cardbox div{font-size:58px}.cardbox button{width:100%;min-height:50px;border:0;border-radius:14px;background:#facc15;font-weight:900}@media(max-width:520px){.car{width:61px;height:57px}.engine{font-size:50px}.train{gap:2px}}
</style></head><body><main class="app"><h1>🚂 숫자 기차 순서 맞추기</h1><div class="hud"><b>⏱ <span id="time">60</span></b><b>점수 <span id="score">100</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div><section class="scene"><div class="clouds">☁️　☁️</div><div class="msg" id="msg">빈 기차 칸에 들어갈 숫자는?</div><div class="train" id="train"></div><div class="answers" id="answers"></div></section><div class="tip">숫자 순서를 보고 빈 칸을 채워요.</div></main><div class="overlay" id="overlay"><div class="cardbox"><div>🚂</div><h2 id="title">숫자 기차</h2><p id="text">숫자들이 차례대로 탄 기차의 빈 칸을 찾아요!</p><button id="start">게임 시작</button></div></div><script>
const $=s=>document.querySelector(s);let time,score,combo,maxCombo,correct,timer,running,answer,best=0;try{best=+(localStorage.getItem('mathTrainBest')||0)}catch(e){}$('#best').textContent=best;function update(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo}function opts(a){let s=new Set([a]);while(s.size<3)s.add(Math.max(1,Math.min(30,a+Math.floor(Math.random()*7)-3)));return[...s].sort(()=>Math.random()-.5)}function question(){let step=time>35?1:(Math.random()<.5?1:2),start=1+Math.floor(Math.random()*(30-step*3)),seq=[0,1,2,3].map(i=>start+i*step),hole=Math.floor(Math.random()*4);answer=seq[hole];$('#train').innerHTML='<span class="engine">🚂</span>'+seq.map((n,i)=>`<span class="car">${i===hole?'?':n}</span>`).join('');$('#answers').innerHTML=opts(answer).map(n=>`<button data-n="${n}">${n}</button>`).join('');$('#msg').textContent=step===1?'1씩 커지는 기차예요!':'2씩 커지는 기차예요!'}
$('#answers').onclick=e=>{if(!running||!e.target.dataset.n)return;if(+e.target.dataset.n===answer){score+=10+Math.min(combo*2,8);combo++;correct++;maxCombo=Math.max(maxCombo,combo);$('#train').classList.add('go');$('#msg').textContent='🚂 칙칙폭폭! 정답!'}else{score=Math.max(0,score-5);combo=0;$('#msg').textContent='괜찮아요! 앞뒤 숫자를 다시 봐요.'}update();if(score<=0)return end();setTimeout(()=>{$('#train').classList.remove('go');question()},450)};function start(){time=60;score=100;combo=maxCombo=correct=0;running=true;$('#overlay').classList.add('hide');question();update();clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)end()},1000)}function end(){if(!running)return;running=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('mathTrainBest',best)}catch(e){}$('#title').textContent='🏁 기차 여행 완료!';$('#text').innerHTML=`최종 점수 ${score}<br>맞힌 문제 ${correct}개 · 최고 콤보 ${maxCombo}<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;
</script></body></html>
