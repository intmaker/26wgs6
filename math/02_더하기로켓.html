<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>더하기 로켓</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,sans-serif;background:#090d2e;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}.app{width:min(760px,100%);height:100%;margin:auto;padding:9px;display:flex;flex-direction:column}.top{text-align:center}.top h1{margin:2px}.hud{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.hud b{padding:6px 11px;border-radius:99px;background:#ffffff16}.space{position:relative;flex:1;min-height:300px;overflow:hidden;margin:8px 0;border-radius:22px;background:radial-gradient(circle at 70% 20%,#4338ca,#11143f 45%,#050719)}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:29px 31px;animation:fall 4s linear infinite}@keyframes fall{to{background-position:0 124px}}.rocket{position:absolute;left:50%;bottom:9%;translate:-50%;font-size:70px;transition:bottom .4s;filter:drop-shadow(0 0 15px #fb923c)}.problem{position:absolute;left:50%;top:10%;translate:-50%;width:90%;text-align:center;font-size:clamp(34px,9vw,62px);font-weight:1000}.answers{position:absolute;left:7%;right:7%;bottom:6%;display:flex;gap:10px;justify-content:center}.answers button{flex:1;max-width:150px;min-height:60px;border:0;border-radius:17px;background:#38bdf8;color:#082f49;font:1000 25px system-ui}.answers button:hover{filter:brightness(1.12)}.tip{text-align:center;color:#c7d2fe}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:15px;background:#06091ddd}.overlay.hide{display:none}.card{width:min(420px,100%);padding:25px;text-align:center;border-radius:23px;background:#fff;color:#1e1b4b}.card div{font-size:58px}.card button{width:100%;min-height:50px;border:0;border-radius:14px;background:#fbbf24;font-weight:900}@media(max-width:480px){.rocket{font-size:58px}.answers{left:3%;right:3%}.answers button{min-height:56px}}
</style></head><body><main class="app"><header class="top"><h1>➕ 더하기 로켓</h1><div class="hud"><b>⏱ <span id="time">60</span></b><b>점수 <span id="score">100</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div></header><section class="space"><div class="stars"></div><div class="problem" id="problem">3 + 4 = ?</div><div class="rocket" id="rocket">🚀</div><div class="answers" id="answers"></div></section><div class="tip">정답을 눌러 로켓을 더 높이 보내요!</div></main><div class="overlay" id="overlay"><div class="card"><div>🚀</div><h2 id="title">더하기 로켓</h2><p id="text">더하기 문제를 풀고 별나라로 출발해요!</p><button id="start">게임 시작</button></div></div><script>
const $=s=>document.querySelector(s);let time,score,combo,maxCombo,correct,timer,running,answer,born,best=0,height=9;try{best=+(localStorage.getItem('mathRocketBest')||0)}catch(e){}$('#best').textContent=best;function update(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo;$('#rocket').style.bottom=height+'%'}function choices(ans){let a=new Set([ans]);while(a.size<3){let n=Math.max(0,ans+Math.floor(Math.random()*7)-3);a.add(n)}return[...a].sort(()=>Math.random()-.5)}function question(){let max=time>45?10:time>25?14:20,a=1+Math.floor(Math.random()*(max-1)),b=Math.floor(Math.random()*(max-a+1));answer=a+b;born=Date.now();$('#problem').textContent=`${a} + ${b} = ?`;$('#answers').innerHTML=choices(answer).map(n=>`<button data-n="${n}">${n}</button>`).join('')}
$('#answers').onclick=e=>{if(!running||!e.target.dataset.n)return;if(+e.target.dataset.n===answer){combo++;correct++;maxCombo=Math.max(maxCombo,combo);score+=10+(Date.now()-born<3000?5:0)+(combo%5===0?10:0);height=Math.min(68,height+5);$('#rocket').animate([{scale:1},{scale:1.25},{scale:1}],{duration:300});if(combo%5===0)$('#problem').textContent='⭐ 연속 5문제!'}else{score=Math.max(0,score-5);combo=0;height=Math.max(9,height-2);e.target.animate([{rotate:'-5deg'},{rotate:'5deg'}],{duration:220})}update();if(score<=0)return end();setTimeout(question,200)};function start(){time=60;score=100;combo=maxCombo=correct=0;height=9;running=true;$('#overlay').classList.add('hide');question();update();clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)end()},1000)}function end(){if(!running)return;running=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('mathRocketBest',best)}catch(e){}$('#title').textContent='🌟 우주 비행 완료!';$('#text').innerHTML=`최종 점수 ${score}<br>맞힌 문제 ${correct}개 · 최고 콤보 ${maxCombo}<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;
</script></body></html>
