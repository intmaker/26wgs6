<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>수학 마트</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui;background:linear-gradient(#fed7aa,#fecaca);color:#7c2d12;user-select:none;touch-action:manipulation}.app{max-width:760px;height:100%;margin:auto;padding:7px;display:flex;flex-direction:column;gap:6px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hud b{background:#fff;padding:6px 9px;border-radius:99px}.shop{flex:1;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border:7px solid #fb923c;border-radius:22px;background:#fff9}.cart{font-size:52px;letter-spacing:-12px;min-height:58px}.items{font-size:clamp(18px,5vw,27px);font-weight:900;text-align:center}.question{padding:8px 15px;border-radius:12px;background:#ffedd5;font-size:20px;font-weight:900}.answers{display:grid;grid-template-columns:1fr 1fr;width:92%;gap:8px}.answers button{min-height:55px;border:0;border-radius:14px;background:#fbbf24;font:900 19px system-ui}.register{font-size:43px}.ring{animation:ring .35s}@keyframes ring{50%{scale:1.3}}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#9a3412d9;padding:15px}.hide{display:none}.card{width:min(420px,100%);padding:24px;text-align:center;background:#fff;border-radius:22px}.card div{font-size:55px}.card button{width:100%;min-height:50px;border:0;border-radius:13px;background:#fb923c;font-weight:900}</style></head><body><main class="app"><h1>🛒 수학 마트 계산왕</h1><div class="hud"><b>⏱ <span id="time">100</span></b><b>점수 <span id="score">200</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div><section class="shop"><div class="cart" id="cart">🛒</div><div class="items" id="items"></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="register" id="register">🧾</div></section></main><div class="overlay" id="overlay"><div class="card"><div>🛒🪙</div><h2 id="title">수학 마트</h2><p id="text">가격을 더하고 거스름돈을 계산해요!</p><button id="start">마트 열기</button></div></div><script>const $=s=>document.querySelector(s);let time,score,combo,maxCombo,ok,bad,timer,on,answer,best=0;try{best=+(localStorage.getItem('mathMarketBest')||0)}catch(e){}$('#best').textContent=best;const goods=[['🍎','사과'],['🥛','우유'],['🍞','빵'],['🍪','과자'],['🧃','주스']];function ui(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo}function opts(a){let s=new Set([a]);while(s.size<4)s.add(Math.max(0,a+(Math.floor(Math.random()*9)-4)*100));return[...s].sort(()=>Math.random()-.5)}function next(){let d=time>80?0:time>40?1:2,type=Math.floor(Math.random()*(d?4:2)),g1=goods[Math.floor(Math.random()*5)],g2=goods[Math.floor(Math.random()*5)],p1=(2+Math.floor(Math.random()*(d?48:18)))*100,p2=(2+Math.floor(Math.random()*(d?35:15)))*100;if(type===0){answer=p1+p2;$('#items').textContent=`${g1[0]} ${p1.toLocaleString()}원 + ${g2[0]} ${p2.toLocaleString()}원`;$('#question').textContent='모두 얼마일까요?'}else if(type===1){let price=p1,paid=Math.ceil(price/1000)*1000+1000;answer=paid-price;$('#items').textContent=`${g1[0]} ${price.toLocaleString()}원 · 낸 돈 ${paid.toLocaleString()}원`;$('#question').textContent='거스름돈은?'}else if(type===2){answer=Math.abs(p1-p2);$('#items').textContent=`${g1[0]} ${p1.toLocaleString()}원 · ${g2[0]} ${p2.toLocaleString()}원`;$('#question').textContent='가격 차이는?'}else{let unit=(2+Math.floor(Math.random()*8))*100,money=unit*(2+Math.floor(Math.random()*8));answer=money/unit;$('#items').textContent=`${unit}원 물건 · 가진 돈 ${money.toLocaleString()}원`;$('#question').textContent='몇 개 살 수 있나요?'}$('#answers').innerHTML=opts(answer).map(n=>`<button data-n="${n}">${n.toLocaleString()}${type===3?'개':'원'}</button>`).join('')}$('#answers').onclick=e=>{if(!on||e.target.dataset.n===undefined)return;if(+e.target.dataset.n===answer){score+=15+Math.min(combo,10);combo++;ok++;maxCombo=Math.max(maxCombo,combo);$('#register').classList.add('ring');$('#cart').textContent+='🛍️'}else{score=Math.max(0,score-7);combo=0;bad++}ui();if(!score)return end();setTimeout(()=>{$('#register').classList.remove('ring');next()},400)};function start(){time=100;score=200;combo=maxCombo=ok=bad=0;on=true;$('#cart').textContent='🛒';$('#overlay').classList.add('hide');ui();next();clearInterval(timer);timer=setInterval(()=>{time--;ui();if(!time)end()},1000)}function end(){if(!on)return;on=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('mathMarketBest',best)}catch(e){}$('#title').textContent='🧾 계산 완료!';$('#text').innerHTML=`점수 ${score} · 정답 ${ok} · 오답 ${bad}<br>최고 콤보 ${maxCombo} · 정확도 ${Math.round(ok/(ok+bad||1)*100)}%<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;</script></body></html>
