<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>숫자 풍선 터뜨리기</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,sans-serif;background:linear-gradient(#7dd3fc,#fef3c7);color:#164e63;user-select:none;-webkit-user-select:none;touch-action:manipulation}.app{width:min(760px,100%);height:100%;margin:auto;padding:10px;display:flex;flex-direction:column;gap:8px}h1{margin:0;text-align:center;font-size:clamp(24px,5vw,36px)}.hud{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.hud b{padding:7px 11px;background:#fff;border-radius:99px}.target{text-align:center;font-size:clamp(27px,7vw,48px);font-weight:1000}.field{position:relative;flex:1;min-height:300px;overflow:hidden;border-radius:24px;background:linear-gradient(#bae6fd,#ecfccb);box-shadow:inset 0 0 30px #fff}.balloon{position:absolute;width:68px;height:82px;border:0;border-radius:50% 50% 47% 47%;color:#fff;font:1000 25px system-ui;box-shadow:inset -8px -10px #0001,0 8px 12px #0002;animation:float 3s ease-in-out infinite}.balloon:after{content:'▼';position:absolute;left:27px;bottom:-13px;color:inherit;font-size:17px}.balloon.hit{animation:pop .25s forwards}.bonus{background:#facc15!important}@keyframes float{50%{translate:0 -18px}}@keyframes pop{to{scale:1.6;opacity:0}}.tip{text-align:center;font-weight:700}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:#075985cc}.overlay.hide{display:none}.card{width:min(420px,100%);padding:25px;text-align:center;border-radius:24px;background:#fff}.card .emo{font-size:55px}.card h2{font-size:29px}.card button{width:100%;min-height:50px;border:0;border-radius:14px;background:#38bdf8;font:900 17px system-ui}.flash{animation:yay .35s}@keyframes yay{50%{filter:brightness(1.25)}}@media(max-width:480px){.balloon{width:58px;height:70px}.app{padding:6px}}
</style></head><body><main class="app"><h1>🔢 숫자 풍선 터뜨리기</h1><div class="hud"><b>⏱ <span id="time">60</span>초</b><b>점수 <span id="score">100</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div><div class="target"><span id="target">7</span>을 찾아요!</div><section class="field" id="field"></section><div class="tip">같은 숫자 풍선을 톡 터뜨려요! ⭐는 보너스예요.</div></main><div class="overlay" id="overlay"><div class="card"><div class="emo">🎈</div><h2 id="title">숫자 풍선 터뜨리기</h2><p id="text">목표 숫자와 같은 풍선을 찾아 터치하세요!</p><button id="start">게임 시작</button></div></div><script>
const $=s=>document.querySelector(s);let time=60,score=100,combo=0,maxCombo=0,correct=0,timer,running=false,target=1;let best=0;try{best=+(localStorage.getItem('mathBalloonBest')||0)}catch(e){}$('#best').textContent=best;
function level(){return time>45?10:time>25?15:20}function update(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo}function question(){target=1+Math.floor(Math.random()*level());$('#target').textContent=target;let count=time>25?6:8,nums=[target];while(nums.length<count){let n=1+Math.floor(Math.random()*level());if(!nums.includes(n)||Math.random()<.25)nums.push(n)}nums.sort(()=>Math.random()-.5);$('#field').innerHTML=nums.map((n,i)=>`<button class="balloon" data-n="${n}" style="left:${5+Math.random()*82}%;top:${6+Math.random()*70}%;background:hsl(${i*55+Math.random()*30} 78% 58%);animation-delay:-${Math.random()*3}s">${n}</button>`).join('')+(Math.random()<.2?`<button class="balloon bonus" data-bonus="1" style="left:${10+Math.random()*75}%;top:${10+Math.random()*65}%">⭐</button>`:'')}
$('#field').onclick=e=>{if(!running||!e.target.matches('.balloon'))return;if(e.target.dataset.bonus){score+=20;e.target.classList.add('hit');setTimeout(question,220);return update()}if(+e.target.dataset.n===target){combo++;maxCombo=Math.max(maxCombo,combo);correct++;score+=10+Math.min(combo*2,10);e.target.classList.add('hit');$('#field').classList.add('flash');setTimeout(()=>{$('#field').classList.remove('flash');question()},230)}else{score=Math.max(0,score-5);combo=0;e.target.animate([{translate:'-6px'},{translate:'6px'},{translate:'0'}],{duration:220})}update();if(score<=0)end()};
function start(){time=60;score=100;combo=maxCombo=correct=0;running=true;$('#overlay').classList.add('hide');update();question();clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)end()},1000)}function end(){if(!running)return;running=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('mathBalloonBest',best)}catch(e){}$('#title').textContent='🎉 풍선 놀이 끝!';$('#text').innerHTML=`최종 점수 <b>${score}</b><br>맞힌 숫자 ${correct}개 · 최고 콤보 ${maxCombo}<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;
</script></body></html>
