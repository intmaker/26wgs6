<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>분수 피자</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui;background:linear-gradient(#fef3c7,#fecaca);color:#7c2d12;user-select:none;touch-action:manipulation}.app{max-width:720px;height:100%;margin:auto;padding:7px;display:flex;flex-direction:column;gap:6px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hud b{background:#fff;padding:6px 9px;border-radius:99px}.shop{flex:1;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border-radius:25px;background:#fff9}.customer{font-size:48px}.pizza{position:relative;width:150px;height:150px;border:8px solid #d97706;border-radius:50%;background:conic-gradient(#ef4444 0 var(--fill),#fde68a var(--fill) 100%);box-shadow:0 10px 20px #0002}.pizza:after{content:'🍕';position:absolute;inset:30px;display:grid;place-items:center;font-size:50px;opacity:.5}.question{text-align:center;font-size:21px;font-weight:900}.answers{display:flex;width:90%;gap:9px;justify-content:center}.answers button{flex:1;min-height:58px;border:0;border-radius:14px;background:#fb923c;color:#431407;font:1000 22px system-ui}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#9a3412dd;padding:15px}.hide{display:none}.card{width:min(420px,100%);padding:24px;text-align:center;background:#fff;border-radius:22px}.card div{font-size:55px}.card button{width:100%;min-height:50px;border:0;border-radius:13px;background:#fb923c;font-weight:900}</style></head><body><main class="app"><h1>🍕 분수 피자 가게</h1><div class="hud"><b>⏱ <span id="time">100</span></b><b>점수 <span id="score">200</span></b><b>콤보 <span id="combo">0</span></b><b>주문 <span id="orders">0</span></b></div><section class="shop"><div class="customer" id="customer">🧒</div><div class="pizza" id="pizza"></div><div class="question" id="question"></div><div class="answers" id="answers"></div></section></main><div class="overlay" id="overlay"><div class="card"><div>🍕⭐</div><h2 id="title">분수 피자</h2><p id="text">피자 조각을 보며 분수를 익혀요!</p><button id="start">가게 열기</button></div></div><script>const $=s=>document.querySelector(s);let time,score,combo,maxCombo,ok,bad,orders,timer,on,answer,best=0;try{best=+(localStorage.getItem('fractionPizzaBest')||0)}catch(e){}function ui(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo;$('#orders').textContent=orders}function gcd(a,b){while(b)[a,b]=[b,a%b];return a}function next(){let dens=time>60?[2,3,4]:[2,3,4,6,8],d=dens[Math.floor(Math.random()*dens.length)],n=1+Math.floor(Math.random()*(d-1)),g=gcd(n,d),simple=`${n/g}/${d/g}`;answer=time<45&&Math.random()<.4?simple:`${n}/${d}`;$('#pizza').style.setProperty('--fill',`${n/d*100}%`);$('#question').textContent=`${d}조각 중 ${n}조각은 전체의 얼마?`;let choices=new Set([answer]);while(choices.size<4){let dd=dens[Math.floor(Math.random()*dens.length)],nn=1+Math.floor(Math.random()*(dd-1));choices.add(`${nn}/${dd}`)}$('#answers').innerHTML=[...choices].sort(()=>Math.random()-.5).map(x=>`<button data-a="${x}">${x}</button>`).join('')}$('#answers').onclick=e=>{if(!on||!e.target.dataset.a)return;if(e.target.dataset.a===answer){score+=15+Math.min(combo,10);combo++;ok++;orders++;maxCombo=Math.max(maxCombo,combo);$('#customer').textContent=combo%3===0?'🤩':'😋';$('#pizza').animate([{rotate:'0'},{rotate:'360deg'}],{duration:450})}else{score=Math.max(0,score-7);combo=0;bad++;$('#customer').textContent='🤔'}ui();if(!score)return end();setTimeout(()=>{$('#customer').textContent='🧒';next()},450)};function start(){time=100;score=200;combo=maxCombo=ok=bad=orders=0;on=true;$('#overlay').classList.add('hide');ui();next();clearInterval(timer);timer=setInterval(()=>{time--;ui();if(!time)end()},1000)}function end(){if(!on)return;on=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('fractionPizzaBest',best)}catch(e){}$('#title').textContent='⭐ 피자 가게 마감!';$('#text').innerHTML=`점수 ${score} · 정답 ${ok} · 오답 ${bad}<br>최고 콤보 ${maxCombo} · 정확도 ${Math.round(ok/(ok+bad||1)*100)}%<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;</script></body></html>
