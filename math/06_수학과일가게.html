<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>수학 과일가게</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,sans-serif;background:linear-gradient(145deg,#fed7aa,#fecdd3);color:#7c2d12;user-select:none;-webkit-user-select:none;touch-action:manipulation}.app{width:min(760px,100%);height:100%;margin:auto;padding:8px;display:flex;flex-direction:column;gap:7px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.hud b{padding:7px 11px;background:#fff;border-radius:99px}.shop{position:relative;flex:1;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;border:7px solid #fb923c;border-radius:23px;background:repeating-linear-gradient(90deg,#fff7ed 0 55px,#ffedd5 55px 110px)}.sign{position:absolute;top:0;left:0;right:0;padding:8px;text-align:center;background:#ea580c;color:#fff;font-weight:900}.clerk{font-size:65px}.question{max-width:94%;padding:12px;text-align:center;border-radius:16px;background:#fff;font-size:clamp(19px,5vw,29px);font-weight:900}.fruitrow{text-align:center;font-size:clamp(24px,6vw,38px);min-height:45px}.answers{display:flex;width:90%;gap:10px;justify-content:center}.answers button{flex:1;max-width:150px;min-height:60px;border:0;border-radius:17px;background:#fbbf24;color:#78350f;font:1000 25px system-ui}.coin{position:absolute;font-size:30px;animation:coin .7s forwards;pointer-events:none}@keyframes coin{to{translate:0 -90px;rotate:360deg;opacity:0}}.register{font-size:42px}.register.ring{animation:ring .35s}@keyframes ring{50%{scale:1.25}}.tip{text-align:center}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:15px;background:#9a3412cc}.overlay.hide{display:none}.card{width:min(410px,100%);padding:24px;text-align:center;border-radius:23px;background:#fff}.card div{font-size:58px}.card button{width:100%;min-height:50px;border:0;border-radius:14px;background:#fb923c;font-weight:900}
</style></head><body><main class="app"><h1>🍎 수학 과일가게</h1><div class="hud"><b>⏱ <span id="time">60</span></b><b>점수 <span id="score">100</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div><section class="shop" id="shop"><div class="sign">오늘도 싱싱한 수학 과일!</div><div class="clerk" id="clerk">🧑‍🌾</div><div class="question" id="question"></div><div class="fruitrow" id="fruitrow"></div><div class="answers" id="answers"></div><div class="register" id="register">🧮</div></section><div class="tip">더하거나 빼서 알맞은 과일 수를 계산해요.</div></main><div class="overlay" id="overlay"><div class="card"><div>🍎🍊</div><h2 id="title">수학 과일가게</h2><p id="text">과일을 사고팔며 더하기와 빼기를 해요!</p><button id="start">가게 열기</button></div></div><script>
const $=s=>document.querySelector(s);let time,score,combo,maxCombo,correct,timer,running,answer,best=0;try{best=+(localStorage.getItem('mathFruitBest')||0)}catch(e){}$('#best').textContent=best;const fruits=[['🍎','사과'],['🍊','귤'],['🍓','딸기'],['🍌','바나나']];function update(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo}function opts(a){let s=new Set([a]);while(s.size<3)s.add(Math.max(0,a+Math.floor(Math.random()*7)-3));return[...s].sort(()=>Math.random()-.5)}function question(){let max=time>45?10:time>25?15:20,[icon,name]=fruits[Math.floor(Math.random()*fruits.length)],add=Math.random()<.55,a=2+Math.floor(Math.random()*(max-2)),b=1+Math.floor(Math.random()*(add?Math.max(2,max-a):a));answer=add?a+b:a-b;$('#question').textContent=add?`${name} ${a}개 + ${b}개 = 모두 몇 개?`:`${name} ${a}개에서 ${b}개를 팔면 몇 개?`;$('#fruitrow').textContent=icon.repeat(Math.min(a,12))+(a>12?` +${a-12}`:'');$('#answers').innerHTML=opts(answer).map(n=>`<button data-n="${n}">${n}</button>`).join('')}
function coins(){for(let i=0;i<7;i++){let c=document.createElement('i');c.className='coin';c.textContent='🪙';c.style.left=35+Math.random()*30+'%';c.style.top=55+Math.random()*15+'%';$('#shop').appendChild(c);setTimeout(()=>c.remove(),750)}}$('#answers').onclick=e=>{if(!running||!e.target.dataset.n)return;if(+e.target.dataset.n===answer){combo++;correct++;maxCombo=Math.max(maxCombo,combo);score+=10+(combo%3===0?10:0);$('#clerk').textContent='😄';$('#register').classList.add('ring');coins()}else{score=Math.max(0,score-5);combo=0;$('#clerk').textContent='🙂';e.target.animate([{translate:'-5px'},{translate:'5px'}],{duration:220})}update();if(score<=0)return end();setTimeout(()=>{$('#clerk').textContent='🧑‍🌾';$('#register').classList.remove('ring');question()},430)};function start(){time=60;score=100;combo=maxCombo=correct=0;running=true;$('#overlay').classList.add('hide');question();update();clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)end()},1000)}function end(){if(!running)return;running=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('mathFruitBest',best)}catch(e){}$('#title').textContent='🪙 가게 문을 닫아요!';$('#text').innerHTML=`최종 점수 ${score}<br>맞힌 문제 ${correct}개 · 최고 콤보 ${maxCombo}<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;
</script></body></html>
