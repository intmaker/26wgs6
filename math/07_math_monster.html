<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>사칙연산 몬스터</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui;background:radial-gradient(circle,#4c1d95,#111827);color:#fff;user-select:none;touch-action:manipulation}.app{max-width:760px;height:100%;margin:auto;padding:7px;display:flex;flex-direction:column;gap:6px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hud b{padding:6px 9px;border-radius:99px;background:#ffffff18}.arena{flex:1;min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border-radius:22px;background:#ffffff10}.monster{font-size:80px}.monster.hit{animation:hit .35s}@keyframes hit{50%{translate:12px;filter:brightness(2)}}.hp{width:70%;height:14px;border-radius:99px;background:#3f3f46;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:#22c55e;transition:.3s}.problem{font-size:clamp(31px,8vw,50px);font-weight:1000}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:90%}.answers button{min-height:58px;border:0;border-radius:15px;background:#c4b5fd;font:1000 22px system-ui}.msg{min-height:25px;font-weight:800}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#111827dd;padding:15px}.hide{display:none}.card{width:min(420px,100%);padding:24px;text-align:center;background:#fff;color:#312e81;border-radius:22px}.card div{font-size:55px}.card button{width:100%;min-height:50px;border:0;border-radius:13px;background:#a78bfa;font-weight:900}</style></head><body><main class="app"><h1>🧮 사칙연산 몬스터</h1><div class="hud"><b>⏱ <span id="time">100</span></b><b>점수 <span id="score">200</span></b><b>콤보 <span id="combo">0</span></b><b>처치 <span id="kills">0</span></b></div><section class="arena"><div class="monster" id="monster">👾</div><div class="hp"><i id="hp"></i></div><div class="problem" id="problem"></div><div class="answers" id="answers"></div><div class="msg" id="msg">계산 공격을 준비해요!</div></section></main><div class="overlay" id="overlay"><div class="card"><div>⚔️👾</div><h2 id="title">사칙연산 몬스터</h2><p id="text">계산 문제를 풀어 몬스터를 물리쳐요!</p><button id="start">게임 시작</button></div></div><script>const $=s=>document.querySelector(s);let time,score,combo,maxCombo,ok,bad,kills,hp,timer,on,answer,best=0;try{best=+(localStorage.getItem('mathMonster34')||0)}catch(e){}function ui(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo;$('#kills').textContent=kills;$('#hp').style.width=hp+'%'}function opts(a){let s=new Set([a]);while(s.size<4)s.add(Math.max(0,a+Math.floor(Math.random()*19)-9));return[...s].sort(()=>Math.random()-.5)}function next(){let d=time>80?0:time>40?1:2,op=['+','-','×'][Math.floor(Math.random()*3)],a,b;if(op==='×'){let max=d?9:5;a=2+Math.floor(Math.random()*(max-1));b=2+Math.floor(Math.random()*8);answer=a*b}else{a=10+Math.floor(Math.random()*(d?80:30));b=1+Math.floor(Math.random()*(d?Math.min(a,60):9));if(op==='-'&&b>a)[a,b]=[b,a];answer=op==='+'?a+b:a-b}$('#problem').textContent=`${a} ${op} ${b} = ?`;$('#answers').innerHTML=opts(answer).map(n=>`<button data-n="${n}">${n}</button>`).join('')}$('#answers').onclick=e=>{if(!on||e.target.dataset.n===undefined)return;if(+e.target.dataset.n===answer){combo++;ok++;maxCombo=Math.max(maxCombo,combo);score+=10+Math.min(combo,10);hp-=combo>=5?35:25;$('#monster').classList.add('hit');$('#msg').textContent=combo>=5?'💥 강력한 콤보 공격!':'⚔️ 명중!';if(hp<=0){kills++;hp=100+Math.min(kills,3)*20;$('#monster').textContent=['👾','👹','🤖','🐲'][kills%4]}}else{score=Math.max(0,score-7);combo=0;bad++;$('#msg').textContent='방패가 막았어요. 다시 계산해요!'}ui();if(!score)return end();setTimeout(()=>{$('#monster').classList.remove('hit');next()},380)};function start(){time=100;score=200;combo=maxCombo=ok=bad=kills=0;hp=100;on=true;$('#overlay').classList.add('hide');ui();next();clearInterval(timer);timer=setInterval(()=>{time--;ui();if(!time)end()},1000)}function end(){if(!on)return;on=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('mathMonster34',best)}catch(e){}let acc=Math.round(ok/(ok+bad||1)*100);$('#title').textContent='🏆 전투 완료!';$('#text').innerHTML=`점수 ${score} · 정답 ${ok} · 오답 ${bad}<br>최고 콤보 ${maxCombo} · 정확도 ${acc}%<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;</script></body></html>
