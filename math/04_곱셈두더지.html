<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>곱셈 두더지</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,sans-serif;background:linear-gradient(#86efac,#fde68a);color:#14532d;user-select:none;-webkit-user-select:none;touch-action:manipulation}.app{width:min(760px,100%);height:100%;margin:auto;padding:8px;display:flex;flex-direction:column;gap:7px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hud b{padding:7px 10px;background:#fff;border-radius:99px}.problem{text-align:center;font-size:clamp(30px,8vw,50px);font-weight:1000}.garden{flex:1;min-height:300px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;border-radius:22px;background:#65a30d}.hole{position:relative;overflow:hidden;border:0;border-radius:50% 50% 36% 36%;background:radial-gradient(ellipse at bottom,#3f1d0b 0 48%,#713f12 50%);min-height:105px}.mole{position:absolute;left:50%;bottom:-15%;translate:-50%;width:78%;height:84%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50% 50% 35% 35%;background:#d97706;font-size:43px;animation:up .38s forwards}.mole b{padding:2px 10px;border-radius:9px;background:#fff;font-size:20px}@keyframes up{to{bottom:3%}}.hole.hit .mole{animation:bonk .35s}@keyframes bonk{50%{scale:.8;bottom:-20%}}.tip{text-align:center;font-weight:700}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:15px;background:#14532dcc}.overlay.hide{display:none}.card{width:min(410px,100%);padding:24px;text-align:center;border-radius:23px;background:#fff}.card div{font-size:58px}.card button{width:100%;min-height:50px;border:0;border-radius:14px;background:#a3e635;font-weight:900}@media(max-width:480px){.garden{gap:6px;padding:7px}.hole{min-height:86px}.mole{font-size:34px}}
</style></head><body><main class="app"><h1>✖️ 곱셈 두더지</h1><div class="hud"><b>⏱ <span id="time">60</span></b><b>점수 <span id="score">100</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div><div class="problem" id="problem">2 × 3 = ?</div><section class="garden" id="garden"></section><div class="tip">정답 팻말을 든 두더지를 톡 눌러요!</div></main><div class="overlay" id="overlay"><div class="card"><div>🐹🔨</div><h2 id="title">곱셈 두더지</h2><p id="text">2단부터 천천히 곱셈 두더지를 찾아요!</p><button id="start">게임 시작</button></div></div><script>
const $=s=>document.querySelector(s);let time,score,combo,maxCombo,correct,timer,running,answer,best=0;try{best=+(localStorage.getItem('mathMoleBest')||0)}catch(e){}$('#best').textContent=best;function update(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo}function question(){let maxDan=time>45?3:time>25?4:5,a=2+Math.floor(Math.random()*(maxDan-1)),b=1+Math.floor(Math.random()*9);answer=a*b;$('#problem').textContent=`${a} × ${b} = ?`;let nums=new Set([answer]);while(nums.size<6)nums.add(Math.max(1,answer+(Math.floor(Math.random()*9)-4)));$('#garden').innerHTML=[...nums].sort(()=>Math.random()-.5).map(n=>`<button class="hole" data-n="${n}"><span class="mole">🐹<b>${n}</b></span></button>`).join('')}
$('#garden').onclick=e=>{let h=e.target.closest('.hole');if(!running||!h)return;if(+h.dataset.n===answer){score+=10+Math.min(combo*2,10);combo++;correct++;maxCombo=Math.max(maxCombo,combo);h.classList.add('hit')}else{score=Math.max(0,score-5);combo=0;h.animate([{translate:'-5px'},{translate:'5px'}],{duration:220})}update();if(score<=0)return end();setTimeout(question,330)};function start(){time=60;score=100;combo=maxCombo=correct=0;running=true;$('#overlay').classList.add('hide');question();update();clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)end()},1000)}function end(){if(!running)return;running=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('mathMoleBest',best)}catch(e){}$('#title').textContent='🌱 두더지 놀이 끝!';$('#text').innerHTML=`최종 점수 ${score}<br>맞힌 문제 ${correct}개 · 최고 콤보 ${maxCombo}<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;
</script></body></html>
