<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>몬스터 빼기</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,sans-serif;background:linear-gradient(145deg,#fef3c7,#fbcfe8);color:#4c1d48;user-select:none;-webkit-user-select:none;touch-action:manipulation}.app{width:min(720px,100%);height:100%;margin:auto;padding:9px;display:flex;flex-direction:column;gap:7px}h1{text-align:center;margin:2px}.hud{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.hud b{padding:7px 11px;background:#fff;border-radius:99px}.room{flex:1;min-height:310px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;border-radius:24px;background:#fff8;box-shadow:0 14px 35px #be185d18}.monster{font-size:clamp(75px,20vw,130px);filter:drop-shadow(0 10px 8px #0002)}.monster.happy{animation:happy .45s}.monster.think{animation:think .45s}@keyframes happy{50%{translate:0 -15px;rotate:8deg}}@keyframes think{50%{rotate:-8deg}}.story{text-align:center;font-size:clamp(19px,5vw,30px);font-weight:900;padding:0 12px}.items{max-width:90%;text-align:center;font-size:clamp(18px,4vw,28px);line-height:1.5}.answers{display:flex;gap:10px;width:90%;justify-content:center}.answers button{flex:1;max-width:150px;min-height:60px;border:0;border-radius:17px;background:#f472b6;color:#4a044e;font:1000 25px system-ui}.msg{min-height:28px;font-weight:800}.tip{text-align:center}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:15px;background:#831843cc}.overlay.hide{display:none}.card{width:min(410px,100%);padding:24px;text-align:center;border-radius:23px;background:#fff}.card div{font-size:58px}.card button{width:100%;min-height:50px;border:0;border-radius:14px;background:#f9a8d4;font-weight:900}
</style></head><body><main class="app"><h1>➖ 몬스터 빼기</h1><div class="hud"><b>⏱ <span id="time">60</span></b><b>점수 <span id="score">100</span></b><b>콤보 <span id="combo">0</span></b><b>최고 <span id="best">0</span></b></div><section class="room"><div class="monster" id="monster">👾</div><div class="story" id="story"></div><div class="items" id="items"></div><div class="answers" id="answers"></div><div class="msg" id="msg">천천히 생각해 보세요!</div></section><div class="tip">남은 개수를 골라 몬스터를 도와줘요.</div></main><div class="overlay" id="overlay"><div class="card"><div>👾🍎</div><h2 id="title">몬스터 빼기</h2><p id="text">몬스터가 먹고 남긴 간식은 몇 개일까요?</p><button id="start">게임 시작</button></div></div><script>
const $=s=>document.querySelector(s);let time,score,combo,maxCombo,correct,timer,running,answer,best=0;try{best=+(localStorage.getItem('mathMonsterBest')||0)}catch(e){}$('#best').textContent=best;const foods=['🍎','🍊','🍓','🍬'];function update(){$('#time').textContent=time;$('#score').textContent=score;$('#combo').textContent=combo}function opts(a){let s=new Set([a]);while(s.size<3)s.add(Math.max(0,a+Math.floor(Math.random()*7)-3));return[...s].sort(()=>Math.random()-.5)}function question(){let max=time>45?10:time>25?15:20,total=3+Math.floor(Math.random()*(max-2)),eat=1+Math.floor(Math.random()*(total-1)),food=foods[Math.floor(Math.random()*foods.length)];answer=total-eat;$('#story').textContent=`${food} ${total}개 중 ${eat}개를 먹었어요. 몇 개 남았을까요?`;$('#items').textContent=food.repeat(Math.min(total,12))+(total>12?` +${total-12}`:'');$('#answers').innerHTML=opts(answer).map(n=>`<button data-n="${n}">${n}</button>`).join('');$('#msg').textContent='천천히 생각해 보세요!'}
$('#answers').onclick=e=>{if(!running||!e.target.dataset.n)return;if(+e.target.dataset.n===answer){score+=10+Math.min(combo*2,8);combo++;correct++;maxCombo=Math.max(maxCombo,combo);$('#monster').textContent='😄';$('#monster').className='monster happy';$('#msg').textContent='맛있어요! 정답이에요!'}else{score=Math.max(0,score-5);combo=0;$('#monster').textContent='🤔';$('#monster').className='monster think';$('#msg').textContent='괜찮아요! 남은 간식을 다시 세어 봐요.'}update();if(score<=0)return end();setTimeout(()=>{$('#monster').textContent='👾';$('#monster').className='monster';question()},450)};function start(){time=60;score=100;combo=maxCombo=correct=0;running=true;$('#overlay').classList.add('hide');question();update();clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)end()},1000)}function end(){if(!running)return;running=false;clearInterval(timer);best=Math.max(best,score);try{localStorage.setItem('mathMonsterBest',best)}catch(e){}$('#title').textContent='🍭 간식 계산 완료!';$('#text').innerHTML=`최종 점수 ${score}<br>맞힌 문제 ${correct}개 · 최고 콤보 ${maxCombo}<br>최고 기록 ${best}`;$('#start').textContent='다시 하기';$('#overlay').classList.remove('hide')}$('#start').onclick=start;
</script></body></html>
