<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>☁️ 구름 점프</title>
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:radial-gradient(circle at 20% 10%,#60a5fa,#312e81 48%,#11152e);user-select:none}.app{width:min(94vw,700px);height:min(95vh,840px);display:flex;flex-direction:column;gap:11px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 4px}.tag{color:#bae6fd;font-size:10px;font-weight:900;letter-spacing:.2em}h1{margin:2px 0 0;font-size:clamp(26px,5vw,38px);letter-spacing:-.05em}.hud{display:flex;gap:7px}.pill{min-width:69px;padding:7px 11px;text-align:center;border:1px solid #ffffff30;border-radius:14px;background:#16204dc7;backdrop-filter:blur(12px)}.pill small{display:block;color:#cbd5e1;font-size:9px}.pill b{font-size:20px}.game{position:relative;flex:1;min-height:390px;overflow:hidden;border:1px solid #ffffff42;border-radius:25px;background:#86d9ff;box-shadow:0 28px 70px #101648aa;touch-action:none}canvas{display:block;width:100%;height:100%}.tip{text-align:center;color:#d8e6f5;font-size:12px}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:linear-gradient(#172554a8,#111632e8);transition:.25s}.overlay.hidden{opacity:0;visibility:hidden}.card{width:min(100%,400px);padding:28px 24px;text-align:center;border:1px solid #ffffff35;border-radius:24px;background:#182352e8;box-shadow:0 24px 60px #0007;backdrop-filter:blur(16px)}.icon{font-size:58px}.card h2{margin:8px 0;font-size:29px}.card p{margin:0 0 20px;color:#d5dfef;font-size:14px;line-height:1.7;word-break:keep-all}.controls{display:flex;justify-content:center;gap:8px;margin-bottom:20px}.key{padding:7px 12px;border:1px solid #ffffff35;border-bottom-width:3px;border-radius:9px;background:#ffffff12;font-weight:900}button{width:100%;padding:14px;border:0;border-radius:14px;color:#08203a;background:linear-gradient(135deg,#fef3c7,#7dd3fc,#a7f3d0);font:900 16px inherit;cursor:pointer;box-shadow:0 10px 28px #38bdf84d}button:hover{filter:brightness(1.08);transform:translateY(-2px)}.mobile-controls{position:absolute;inset:auto 0 16px;z-index:3;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.move{width:72px;height:58px;padding:0;border:1px solid #ffffff55;color:#fff;background:#15295ea6;font-size:26px;pointer-events:auto;backdrop-filter:blur(8px)}@media(min-width:700px){.mobile-controls{display:none}}@media(max-width:520px){.app{width:100%;height:100%;padding:10px}.game{border-radius:20px}}
</style></head>
<body><main class="app"><header class="top"><div><div class="tag">CLOUD HOP</div><h1>☁️ 구름 점프</h1></div><div class="hud"><div class="pill"><small>높이</small><b id="score">0</b></div><div class="pill"><small>최고</small><b id="best">0</b></div></div></header><section class="game" id="game"><canvas id="canvas"></canvas><div class="mobile-controls"><button class="move" data-dir="left">◀</button><button class="move" data-dir="right">▶</button></div><div class="overlay" id="overlay"><div class="card"><div class="icon" id="icon">☁️</div><h2 id="title">구름을 밟고 올라가요!</h2><p id="desc">캐릭터는 자동으로 점프합니다.<br><b>좌우로 움직여 구름 위에 착지</b>하세요.<br>화면 아래로 떨어지면 게임이 끝나요.</p><div class="controls"><span class="key">←</span><span class="key">A</span><span class="key">D</span><span class="key">→</span></div><button id="start">게임 시작</button></div></div></section><div class="tip">자동 점프 · 방향키/A,D · 모바일은 화면 버튼</div></main>
<script>
(()=>{
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),game=document.querySelector('#game'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),startBtn=document.querySelector('#start');
let W=0,H=0,D=1,running=false,last=0,score=0,best=Number(localStorage.cloudHopBest||0),player,clouds=[],particles=[],keys={left:false,right:false},nextId=0;
bestEl.textContent=best;
function resize(){const r=game.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);if(!running)draw(0)}
function cloud(x,y,w=105){return{x,y,w,h:22,id:nextId++,landed:false}}
function reset(){score=0;scoreEl.textContent=0;clouds=[];particles=[];const first=cloud(W/2-65,H-62,130);first.landed=true;clouds.push(first);let y=H-155;while(y>-50){const prev=clouds.at(-1);let width=Math.max(72,112-clouds.length*2);let maxStep=Math.min(145,W*.3);let center=Math.max(width/2+12,Math.min(W-width/2-12,prev.x+prev.w/2+(Math.random()-.5)*maxStep*2));clouds.push(cloud(center-width/2,y,width));y-=82+Math.random()*25}player={x:W/2-18,y:H-105,w:36,h:42,vx:0,vy:-510,face:1};running=true;overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function addCloudAbove(){let top=clouds.reduce((a,b)=>a.y<b.y?a:b),width=Math.max(62,105-score*.7),maxStep=Math.min(142,W*.3),center=Math.max(width/2+10,Math.min(W-width/2-10,top.x+top.w/2+(Math.random()-.5)*maxStep*2));clouds.push(cloud(center-width/2,top.y-80-Math.random()*28,width))}
function burst(x,y){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*150,vy:-30-Math.random()*100,life:1,size:2+Math.random()*5})}
function land(c){player.y=c.y-player.h;player.vy=-510-Math.min(score,25)*4;if(!c.landed){c.landed=true;score++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.cloudHopBest=best}burst(player.x+player.w/2,c.y);addCloudAbove()}}
function finish(){if(!running)return;running=false;document.querySelector('#icon').textContent=score>=15?'🏆':'🌧️';document.querySelector('#title').textContent=`${score}개의 구름을 올랐어요!`;document.querySelector('#desc').innerHTML=score<5?'점프할 곳을 먼저 보고 좌우 이동을 짧게 눌러보세요.<br>캐릭터는 구름에 닿으면 자동으로 다시 뜁니다.':'멋진 구름 여행이었어요!<br>더 작고 멀리 있는 구름에 다시 도전해 보세요.';startBtn.textContent='다시 점프';overlay.classList.remove('hidden')}
function update(dt){const accel=keys.left?-900:keys.right?900:0;player.vx+=accel*dt;player.vx*=Math.pow(.06,dt);player.vx=Math.max(-260,Math.min(260,player.vx));if(keys.left)player.face=-1;if(keys.right)player.face=1;player.x+=player.vx*dt;if(player.x+player.w<0)player.x=W;if(player.x>W)player.x=-player.w;const oldBottom=player.y+player.h;player.vy+=1080*dt;player.y+=player.vy*dt;const newBottom=player.y+player.h;if(player.vy>0){for(const c of clouds){if(oldBottom<=c.y+5&&newBottom>=c.y&&player.x+player.w>c.x+8&&player.x<c.x+c.w-8){land(c);break}}}if(player.y<H*.38&&player.vy<0){const shift=(H*.38-player.y);player.y=H*.38;clouds.forEach(c=>c.y+=shift);particles.forEach(p=>p.y+=shift)}clouds=clouds.filter(c=>c.y<H+70);particles.forEach(p=>{p.vy+=260*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.8});particles=particles.filter(p=>p.life>0);if(player.y>H+70)finish()}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(t){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#60a5fa');sky.addColorStop(.55,'#7dd3fc');sky.addColorStop(1,'#dbeafe');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const sun=ctx.createRadialGradient(W*.82,H*.12,4,W*.82,H*.12,80);sun.addColorStop(0,'#fffde7');sun.addColorStop(.3,'#fef3c799');sun.addColorStop(1,'transparent');ctx.fillStyle=sun;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.18;ctx.fillStyle='#fff';for(let i=0;i<12;i++){let x=(i*137+t*.006*(i%2?1:-1))%(W+150)-75,y=45+(i*83)%H;ctx.beginPath();ctx.arc(x,y,25,0,7);ctx.arc(x+28,y+4,20,0,7);ctx.fill()}ctx.globalAlpha=1;
for(const c of clouds){ctx.save();ctx.shadowColor='#2563eb42';ctx.shadowBlur=17;const g=ctx.createLinearGradient(0,c.y-10,0,c.y+c.h);g.addColorStop(0,'#fff');g.addColorStop(1,c.landed?'#bfdbfe':'#e0f2fe');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(c.x+c.w*.2,c.y+5,c.w*.2,15,0,0,7);ctx.ellipse(c.x+c.w*.48,c.y,c.w*.28,22,0,0,7);ctx.ellipse(c.x+c.w*.76,c.y+6,c.w*.23,16,0,0,7);ctx.ellipse(c.x+c.w*.5,c.y+11,c.w*.48,14,0,0,7);ctx.fill();ctx.restore()}
particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()});ctx.globalAlpha=1;if(player){ctx.save();ctx.translate(player.x+player.w/2,player.y+player.h/2);ctx.scale(player.face,1);ctx.font='38px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#1e3a8a66';ctx.shadowBlur=10;ctx.fillText('🐰',0,0);ctx.restore()}if(running&&score===0){ctx.fillStyle='#1e3a8acc';ctx.font='800 13px sans-serif';ctx.textAlign='center';ctx.fillText('←  첫 구름 위로 이동하세요  →',W/2,H-125)}}
function loop(now){if(!running)return;const dt=Math.min(.03,(now-last)/1000);last=now;update(dt);draw(now);requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){keys.left=true;e.preventDefault()}if(['ArrowRight','d','D'].includes(e.key)){keys.right=true;e.preventDefault()}});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});document.querySelectorAll('.move').forEach(b=>{const k=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});game.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=game.getBoundingClientRect();keys[e.clientX-r.left<W/2?'left':'right']=true});game.addEventListener('pointerup',()=>{keys.left=keys.right=false});startBtn.addEventListener('click',e=>{e.stopPropagation();reset()});addEventListener('resize',resize);resize();draw(0);
})();
</script></body></html>
