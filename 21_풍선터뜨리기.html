<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>풍선 터뜨리기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #38bdf8);
      color: white;
    }
    .game {
      width: min(92vw, 760px);
      background: rgba(255,255,255,0.1);
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.22);
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); }
    .badge {
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 800;
    }
    .board {
      position: relative;
      width: 100%;
      height: 420px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(19, 90, 140, 0.7), rgba(17, 24, 39, 0.9));
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.18);
    }
    .balloon {
      position: absolute;
      width: 70px;
      height: 90px;
      border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      cursor: pointer;
      box-shadow: inset -8px -10px rgba(255,255,255,0.2), 0 8px 14px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      animation: float 1.1s ease-in-out infinite alternate;
    }
    .balloon::after {
      content: '';
      position: absolute;
      width: 2px;
      height: 60px;
      background: rgba(255,255,255,0.8);
      left: 50%;
      top: 86%;
      transform: translateX(-50%);
    }
    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }
    .message {
      text-align: center;
      margin-top: 18px;
      min-height: 28px;
      font-weight: 700;
    }
    button {
      display: block;
      margin: 18px auto 0;
      border: none;
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(135deg, #fef08a, #f472b6);
      color: #111827;
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="top">
      <h1>🎈 풍선 터뜨리기</h1>
      <div class="badge">점수: <span id="score">0</span></div>
    </div>
    <div class="board" id="board"></div>
    <div class="message" id="message">풍선을 터뜨려 점수를 올리세요!</div>
    <button id="startBtn">게임 시작</button>
  </div>

  <script>
    const board = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const messageEl = document.getElementById('message');
    const startBtn = document.getElementById('startBtn');

    let score = 0;
    let timer = null;
    let round = 0;

    function randomColor() {
      const colors = ['#fca5a5', '#f9a8d4', '#fcd34d', '#86efac', '#93c5fd', '#c4b5fd'];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function createBalloon() {
      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      balloon.textContent = '🎈';
      balloon.style.left = `${Math.random() * (board.clientWidth - 90)}px`;
      balloon.style.top = `${Math.random() * (board.clientHeight - 130)}px`;
      balloon.style.background = randomColor();
      balloon.addEventListener('click', () => {
        score += 1;
        scoreEl.textContent = score;
        messageEl.textContent = '팡! 점수+1';
        balloon.remove();
      });
      board.appendChild(balloon);
    }

    function startGame() {
      score = 0;
      round = 0;
      scoreEl.textContent = score;
      board.innerHTML = '';
      messageEl.textContent = '풍선을 잡아보세요!';
      startBtn.disabled = true;

      for (let i = 0; i < 8; i++) createBalloon();
      timer = setInterval(() => {
        round += 1;
        if (round % 2 === 0) {
          createBalloon();
        }
        if (board.children.length > 12) {
          const old = board.children[0];
          if (old) old.remove();
        }
      }, 800);

      setTimeout(() => {
        clearInterval(timer);
        messageEl.textContent = `게임 종료! 최종 점수는 ${score}점입니다.`;
        startBtn.disabled = false;
        startBtn.textContent = '다시 시작';
      }, 20000);
    }

    startBtn.addEventListener('click', () => {
      startBtn.textContent = '게임 진행 중';
      startGame();
    });
  </script>
</body>
</html>
