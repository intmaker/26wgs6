<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SKY STACK · 도형 스택</title>
<style>
:root{--ink:#f8fbff;--muted:#a9b7d0}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:radial-gradient(circle at 15% 15%,#4338ca 0,transparent 30%),radial-gradient(circle at 85% 80%,#be185d 0,transparent 30%),#060a18;display:grid;place-items:center;user-select:none}.shell{width:min(94vw,760px);height:min(94vh,860px);display:flex;flex-direction:column;gap:12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px}.brand small{display:block;color:#7dd3fc;font-weight:900;letter-spacing:.22em;font-size:10px}h1{margin:2px 0 0;font-size:clamp(25px,5vw,39px);line-height:1;letter-spacing:-.05em}.stats{display:flex;gap:8px}.stat{min-width:72px;padding:8px 13px;text-align:center;border:1px solid #ffffff24;border-radius:15px;background:#0b1226b8;backdrop-filter:blur(12px)}.stat span{display:block;color:var(--muted);font-size:10px;font-weight:800}.stat strong{font-size:21px;font-variant-numeric:tabular-nums}.stage{position:relative;flex:1;min-height:360px;overflow:hidden;border:1px solid #ffffff24;border-radius:25px;background:#071126cc;box-shadow:0 25px 70px #0008,inset 0 1px #ffffff18;cursor:pointer;touch-action:manipulation}canvas{display:block;width:100%;height:100%}.hint{position:absolute;left:50%;top:17px;transform:translateX(-50%);white-space:nowrap;z-index:2;padding:8px 14px;border-radius:999px;color:#dbeafe;background:#071124c9;border:1px solid #ffffff18;font-size:12px;font-weight:800;pointer-events:none;transition:.25s}.hint.hide{opacity:0;transform:translate(-50%,-8px)}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;z-index:5;background:linear-gradient(#050a18aa,#050a18ed);transition:.25s}.overlay.hidden{opacity:0;visibility:hidden}.card{width:min(100%,410px);text-align:center;padding:30px 24px;border-radius:25px;border:1px solid #ffffff1f;background:#0d1633e8;box-shadow:0 25px 70px #0009;backdrop-filter:blur(16px)}.icon{font-size:52px;filter:drop-shadow(0 8px 18px #38bdf866)}.card h2{margin:12px 0 9px;font-size:29px;letter-spacing:-.04em}.card p{margin:0 auto 20px;color:#bdc8da;font-size:14px;line-height:1.7;word-break:keep-all}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:22px}.rule{padding:10px 5px;border-radius:12px;background:#ffffff0a;color:#c8d4e8;font-size:11px;line-height:1.4}.rule b{display:block;color:white;font-size:18px}button{width:100%;border:0;border-radius:14px;padding:14px;color:#07111f;font:900 16px inherit;cursor:pointer;background:linear-gradient(135deg,#67e8f9,#a7f3d0 55%,#fde68a);box-shadow:0 10px 30px #22d3ee38}button:hover{filter:brightness(1.08);transform:translateY(-2px)}footer{display:flex;justify-content:space-between;padding:0 5px;color:#91a0b8;font-size:12px}.key{padding:3px 7px;border:1px solid #ffffff24;border-bottom-width:2px;border-radius:6px;color:#fff}@media(max-width:520px){.shell{width:100%;height:100%;padding:12px}.stage{border-radius:21px}.stat{min-width:64px;padding:7px 9px}.desktop{display:none}footer{justify-content:center}}
</style></head><body><main class="shell"><header><div class="brand"><small>SKY STACK</small><h1>도형 스택</h1></div><div class="stats"><div class="stat"><span>높이</span><strong id="score">0</strong></div><div class="stat"><span>최고</span><strong id="best">0</strong></div></div></header><section class="stage" id="stage"><canvas id="canvas"></canvas><div class="hint" id="hint">움직이는 블록을 눌러 떨어뜨리세요!</div><div class="overlay" id="overlay"><div class="card"><div class="icon" id="icon">🧊</div><h2 id="title">하늘까지 쌓아볼까요?</h2><p id="text">위에서 좌우로 움직이는 블록을 떨어뜨리세요.<br>아래 블록과 <b>겹친 부분만</b> 다음 발판이 됩니다.</p><div class="rules"><div class="rule"><b>↔</b>자동 이동</div><div class="rule"><b>↓</b>눌러 낙하</div><div class="rule"><b>✂</b>남는 부분</div></div><button id="start">게임 시작</button></div></div></section><footer><span>정확히 맞추면 <b>퍼펙트!</b></span><span class="desktop"><span class="key">SPACE</span> 또는 클릭</span></footer></main>
<script>
(()=>{const C=document.querySelector('#canvas'),X=C.getContext('2d'),S=document.querySelector('#stage'),O=document.querySelector('#overlay'),Q=s=>document.querySelector(s),scoreEl=Q('#score'),bestEl=Q('#best'),hint=Q('#hint');let W,H,D,run=false,score=0,best=+(localStorage.skyStackBest||0),blocks=[],active=null,bits=[],dust=[],last=0,cam=0,shake=0;const BH=28,G=3,colors=['#67e8f9','#a78bfa','#fb7185','#fbbf24','#34d399','#60a5fa'];bestEl.textContent=best;
function resize(){let r=S.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);draw(performance.now())}function spawn(){let top=blocks.at(-1),left=score%2===0;active={x:left?-top.w:W,y:Math.min(82,top.y-145),w:top.w,h:BH,vx:(left?1:-1)*(150+Math.min(score,25)*7),vy:0,state:'move',color:colors[score%colors.length]}}
function reset(){score=0;scoreEl.textContent=0;blocks=[];bits=[];dust=[];cam=0;shake=0;let w=Math.min(230,W*.48);blocks.push({x:(W-w)/2,y:H-58,w,h:BH,color:'#e2e8f0'});spawn();run=true;O.classList.add('hidden');hint.classList.remove('hide');setTimeout(()=>hint.classList.add('hide'),2600);last=performance.now();requestAnimationFrame(loop)}function drop(){if(run&&active?.state==='move'){active.state='fall';active.vx=0;active.vy=210;hint.classList.add('hide')}}
function burst(x,y,c,n){for(let i=0;i<n;i++)dust.push({x,y,vx:(Math.random()-.5)*170,vy:-40-Math.random()*130,life:1,c,s:2+Math.random()*4})}function land(){let top=blocks.at(-1),l=Math.max(active.x,top.x),r=Math.min(active.x+active.w,top.x+top.w),over=r-l;if(over<=0){active.state='miss';active.vy=300;setTimeout(overGame,520);return}let ox=active.x,ow=active.w,perfect=Math.abs(ox-top.x)<5;if(perfect){active.x=top.x;active.w=top.w;burst(top.x+top.w/2,top.y,'#fef08a',18)}else{active.x=l;active.w=over;let cx=ox<top.x?ox:r,cw=ow-over;if(cw>0)bits.push({x:cx,y:top.y-BH-G,w:cw,h:BH,vy:40,vr:(ox<top.x?-1:1)*2.2,r:0,color:active.color});burst(l+over/2,top.y,active.color,10)}active.y=top.y-BH-G;active.state='land';blocks.push({...active});scoreEl.textContent=++score;if(score>best){best=score;bestEl.textContent=best;localStorage.skyStackBest=best}shake=perfect?5:2;if(blocks.length>7)cam+=BH+G;setTimeout(()=>{if(run)spawn()},170)}
function overGame(){if(!run)return;run=false;Q('#icon').textContent='🏗️';Q('#title').textContent=`${score}층까지 쌓았어요!`;Q('#text').innerHTML=score<5?'조금만 더 천천히 맞춰 보세요.<br>블록 중앙이 포개질 때 떨어뜨리면 쉬워요.':'멋진 균형 감각이에요!<br>더 좁아지는 발판에 다시 도전해 보세요.';Q('#start').textContent='다시 쌓기';O.classList.remove('hidden')}
function update(dt){if(!active)return;if(active.state==='move'){active.x+=active.vx*dt;if(active.x<=0){active.x=0;active.vx=Math.abs(active.vx)}if(active.x+active.w>=W){active.x=W-active.w;active.vx=-Math.abs(active.vx)}}else if(active.state==='fall'){active.vy+=900*dt;active.y+=active.vy*dt;let t=blocks.at(-1);if(active.y+BH>=t.y){active.y=t.y-BH-G;land()}}else if(active.state==='miss'){active.vy+=900*dt;active.y+=active.vy*dt}bits.forEach(b=>{b.vy+=700*dt;b.y+=b.vy*dt;b.r+=b.vr*dt});bits=bits.filter(b=>b.y<H+100);dust.forEach(p=>{p.vy+=260*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.7});dust=dust.filter(p=>p.life>0);shake*=Math.pow(.02,dt)}
function shape(b){let y=b.y+cam;X.save();X.shadowColor=b.color+'77';X.shadowBlur=16;let g=X.createLinearGradient(0,y,0,y+b.h);g.addColorStop(0,'white');g.addColorStop(.09,b.color);g.addColorStop(1,b.color+'bb');X.fillStyle=g;X.beginPath();X.roundRect(b.x,y,b.w,b.h,7);X.fill();X.shadowBlur=0;X.fillStyle='#ffffff40';X.beginPath();X.roundRect(b.x+5,y+4,Math.max(0,b.w-10),4,2);X.fill();X.restore()}
function draw(t){X.clearRect(0,0,W,H);X.save();X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071329');g.addColorStop(1,'#172554');X.fillStyle=g;X.fillRect(0,0,W,H);for(let i=0;i<34;i++){X.globalAlpha=.12+.28*(1+Math.sin(t*.001+i))/2;X.fillStyle='white';X.fillRect((i*83.7)%W,(i*47.3+cam*.12)%H,1.5,1.5)}X.globalAlpha=1;blocks.forEach(shape);bits.forEach(b=>{X.save();X.translate(b.x+b.w/2,b.y+b.h/2+cam);X.rotate(b.r);shape({...b,x:-b.w/2,y:-b.h/2-cam});X.restore()});if(active&&active.state!=='land')shape(active);dust.forEach(p=>{X.globalAlpha=p.life;X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y+cam,p.s,0,7);X.fill()});X.globalAlpha=1;X.restore()}function loop(now){if(!run){draw(now);return}let dt=Math.min(.032,(now-last)/1000);last=now;update(dt);draw(now);requestAnimationFrame(loop)}
S.addEventListener('pointerdown',e=>{if(e.target.id!=='start')drop()});addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowDown')&&!e.repeat){e.preventDefault();drop()}});Q('#start').onclick=e=>{e.stopPropagation();reset()};addEventListener('resize',resize);resize()})();
</script></body></html>
