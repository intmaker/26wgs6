<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>⚖️ 균형 다리</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 10%,#be185d,#3b163c 50%,#160716);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(94vw,700px);height:min(95vh,840px);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#f9a8d4;font-weight:900}h1{margin:2px 0;font-size:clamp(26px,5vw,38px)}.stats{display:flex;gap:7px}.stat{min-width:70px;padding:8px;text-align:center;border:1px solid #ffffff24;border-radius:14px;background:#481535cc}.stat small{display:block;color:#fbcfe8;font-size:9px}.stat b{font-size:20px}.game{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff24;border-radius:25px;background:#210e27;box-shadow:0 25px 70px #0009;touch-action:none}canvas{display:block;width:100%;height:100%}.pad{position:absolute;inset:auto 15px 15px;z-index:3;display:flex;justify-content:space-between}.pad button{width:82px;height:53px;padding:0;border:1px solid #ffffff42;border-radius:12px;color:#fff;background:#4b1740b9;font-size:24px;touch-action:none}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#190817e8}.overlay.hide{display:none}.card{max-width:390px;padding:28px 24px;text-align:center;border:1px solid #ffffff24;border-radius:23px;background:#481535}.ico{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{color:#fce7f3;font-size:14px;line-height:1.7}.card>button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#f9a8d4,#fcd34d);color:#4a102f;font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#fbcfe8;font-size:12px}@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.game{border-radius:20px}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">BALANCE BRIDGE</div><h1>⚖️ 균형 다리</h1></div><div class="stats"><div class="stat"><small>버틴 시간</small><b id="time">0</b></div><div class="stat"><small>최고</small><b id="best">0</b></div></div></header><section class="game" id="game"><canvas id="canvas"></canvas><div class="pad"><button data-k="left">◀</button><button data-k="right">▶</button></div><div class="overlay" id="over"><div class="card"><div class="ico" id="ico">⚖️</div><h2 id="title">화물의 균형을 지키세요</h2><p id="desc">바람과 화물 때문에 다리가 계속 기울어집니다.<br>기울어지는 반대쪽 버튼을 눌러 균형을 잡으세요.<br>시간이 지날수록 상자가 추가되고 바람이 강해집니다.</p><button id="start">균형 잡기</button></div></div></section><div class="tip">← → 또는 화면 버튼 · 중앙 게이지를 유지하세요</div></main><script>
(()=>{const C=document.querySelector('#canvas'),X=C.getContext('2d'),G=document.querySelector('#game'),O=document.querySelector('#over'),TE=document.querySelector('#time'),BE=document.querySelector('#best');let W,H,D=1,on=false,last=0,elapsed=0,angle=0,av=0,wind=0,nextWind=0,boxes=[],keys={left:false,right:false},best=Number(localStorage.balanceBest||0);BE.textContent=best;
function resize(){const r=G.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);draw()}function start(){elapsed=0;angle=0;av=0;wind=0;nextWind=1;boxes=[{p:-.15,c:'#fb7185'}];TE.textContent=0;on=true;O.classList.add('hide');last=performance.now();requestAnimationFrame(loop)}
function update(dt){elapsed+=dt;TE.textContent=elapsed.toFixed(1);if(elapsed>nextWind){nextWind=elapsed+1.3+Math.random()*1.7;wind=(Math.random()-.5)*(0.32+elapsed*.012)}if(boxes.length<5&&elapsed>boxes.length*8)boxes.push({p:(Math.random()-.5)*.75,c:['#fbbf24','#67e8f9','#a7f3d0','#c4b5fd'][boxes.length-1]});const load=boxes.reduce((s,b)=>s+b.p*.32,0),control=(keys.right?1:0)-(keys.left?1:0);av+=(Math.sin(angle)*1.7+load+wind-control*.9)*dt;av*=Math.pow(.42,dt);angle+=av*dt;angle=Math.max(-1.25,Math.min(1.25,angle));if(Math.abs(angle)>.72)finish()}
function draw(){X.clearRect(0,0,W,H);let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#321439');g.addColorStop(1,'#18091c');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle='#ffffff0c';for(let i=0;i<30;i++){X.beginPath();X.arc(i*83%W,i*47%H,2,0,7);X.fill()}const cx=W/2,cy=H*.58,len=W*.72;X.save();X.translate(cx,cy);X.fillStyle='#94a3b8';X.beginPath();X.moveTo(-22,72);X.lineTo(0,5);X.lineTo(22,72);X.fill();X.rotate(angle);X.shadowColor='#000';X.shadowBlur=15;X.fillStyle='#f8fafc';X.beginPath();X.roundRect(-len/2,-10,len,20,8);X.fill();for(const b of boxes){const bx=b.p*len*.76;X.fillStyle=b.c;X.beginPath();X.roundRect(bx-25,-58,50,48,8);X.fill();X.fillStyle='#ffffff50';X.fillRect(bx-18,-51,36,5)}X.restore();const gx=W*.18,gy=45,gw=W*.64;X.fillStyle='#ffffff18';X.beginPath();X.roundRect(gx,gy,gw,15,8);X.fill();X.fillStyle=Math.abs(angle)<.3?'#4ade80':Math.abs(angle)<.55?'#facc15':'#fb7185';X.fillRect(W/2-3+angle/(.72)*gw/2,gy-7,6,29);X.strokeStyle='#ffffff50';X.strokeRect(W/2-gw*.18,gy,gw*.36,15)}
function finish(){if(!on)return;on=false;if(elapsed>best){best=Number(elapsed.toFixed(1));BE.textContent=best;localStorage.balanceBest=best}document.querySelector('#ico').textContent=elapsed>20?'🏆':'📦';document.querySelector('#title').textContent=`${elapsed.toFixed(1)}초 버텼어요!`;document.querySelector('#desc').innerHTML='게이지가 기울어지는 반대 방향을 짧게 눌러보세요.<br>오래 누르면 관성 때문에 반대로 넘어갈 수 있어요.';document.querySelector('#start').textContent='다시 균형 잡기';setTimeout(()=>O.classList.remove('hide'),400)}function loop(t){if(!on)return;const dt=Math.min(.03,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{keys[k]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[k]=false});document.querySelector('#start').onclick=start;addEventListener('resize',resize);resize()})();</script></body></html>
