<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 별빛 로봇 공방</title>
<style>
:root{--purple:#7657ff;--sky:#35c7ff;--green:#22c55e;--ink:#201b48}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{min-height:100vh;background:linear-gradient(145deg,#e0f2fe,#ede9fe);font-family:system-ui,-apple-system,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}button,select{font:inherit}button{cursor:pointer}.app{width:min(1080px,100%);margin:auto;padding:10px}.top{text-align:center}.top h1{margin:4px;font-size:clamp(25px,5vw,38px)}.concept{margin:5px;color:#6d28d9;font-weight:700}.progress{height:8px;overflow:hidden;border-radius:99px;background:#ddd6fe}.progress i{display:block;height:100%;width:10%;background:linear-gradient(90deg,var(--sky),var(--purple));transition:.4s}.hud{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:8px 0}.pill{min-height:42px;padding:6px 10px;border-radius:12px;background:#fff;box-shadow:0 5px 15px #4c1d9515;font-size:12px}.pill b{display:block;font-size:16px}.game{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1fr);gap:12px}.card{padding:13px;border-radius:20px;background:#fff;box-shadow:0 12px 32px #4c1d9518}.mission{margin-bottom:10px;padding:10px 12px;border-left:5px solid var(--purple);border-radius:12px;background:#f5f3ff}.mission b{display:block}.mission small{color:#6b7280}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:7px;aspect-ratio:1;border-radius:17px;background:#c4b5fd}.cell{position:relative;display:grid;place-items:center;min-width:0;border-radius:7px;background:#f8fafc;font-size:clamp(17px,4vw,30px)}.wall{background:#475569}.danger{background:#fecaca}.door{background:#fde68a}.robot{display:inline-block;transition:transform .25s}.robot.move{animation:hop .32s}.robot.crash{animation:shake .35s}.robot.win{animation:jump .55s infinite alternate}.d0{transform:rotate(0)}.d1{transform:rotate(90deg)}.d2{transform:rotate(180deg)}.d3{transform:rotate(270deg)}@keyframes hop{50%{transform:translateY(-8px) scale(1.12)}}@keyframes shake{25%{translate:-8px}75%{translate:8px}}@keyframes jump{to{translate:0 -10px;scale:1.12}}.message{min-height:48px;padding:10px;text-align:center;font-weight:800}.message.fail{color:#dc2626}.message.ok{color:#15803d}.palette,.actions,.speed{display:flex;gap:6px;flex-wrap:wrap}.palette button,.actions button,.speed select{min-height:44px;border:0;border-radius:11px;padding:8px 10px;font-weight:850}.move-btn{background:#7dd3fc}.turn-btn{background:#fbbf24}.loop-btn{background:#c4b5fd}.dash-btn{background:#86efac}.run{background:#22c55e;color:#07351b}.step{background:#fde047}.neutral{background:#e2e8f0}.hint{background:#f9a8d4}.select{background:#ddd6fe}.queue{display:grid;gap:6px;max-height:285px;overflow:auto;margin:10px 0;padding:3px}.block{display:flex;align-items:center;gap:5px;min-height:48px;padding:7px;border-radius:11px;background:#e0f2fe;transition:.2s}.block>span{flex:1}.block.active{outline:3px solid #f59e0b;background:#fef3c7;transform:scale(1.015);box-shadow:0 0 14px #f59e0b88}.block.done{background:#dcfce7}.block button{min-width:38px;min-height:38px;border:0;border-radius:8px;background:#fff}.debug{min-height:25px;margin-top:6px;color:#6d28d9;font-weight:850}.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:15px;background:#171238dd}.overlay.hide{display:none}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px;text-align:center;border-radius:23px;background:#fff}.modal h2{margin:6px}.bigrobot{font-size:58px}.primary{width:100%;min-height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--sky),#a78bfa);font-weight:900}.stage-list{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px 0}.stage-button{min-height:65px;border:0;border-radius:13px;background:#ede9fe;font-weight:900}.stage-button.locked{filter:grayscale(1);opacity:.55}.stage-button small{display:block}.result-stars{font-size:42px;letter-spacing:6px}.particles{position:fixed;inset:0;z-index:30;pointer-events:none}.particle{position:absolute;animation:fall 1.2s ease-out forwards}@keyframes fall{to{translate:var(--x) 75vh;rotate:360deg;opacity:0}}@media(max-width:720px){.game{grid-template-columns:1fr}.app{padding:6px}.grid{max-width:450px;margin:auto}.queue{max-height:220px}.stage-list{grid-template-columns:repeat(3,1fr)}.palette button,.actions button{flex:1 1 30%}}@media(max-width:390px){.pill{padding:5px 7px}.palette button,.actions button{flex-basis:45%}.card{padding:9px}}
</style>
</head>
<body>
<main class="app">
 <header class="top"><h1>🤖 별빛 로봇 공방</h1><p class="concept">명령을 조립하면 로봇이 위에서 아래로 차례대로 실행해요.</p><div class="progress"><i id="progress"></i></div><div class="hud"><span class="pill">STAGE<b id="level">1 / 10</b></span><span class="pill">방향<b id="direction">↑ 북쪽</b></span><span class="pill">별<b><span id="got">0</span>/<span id="need">0</span></b></span><span class="pill">에너지<b id="energy">∞</b></span><span class="pill">제한<b id="limit">8 블록</b></span><button class="pill" id="sound">🔊 소리</button></div></header>
 <section class="game">
  <div class="card"><div class="mission"><b id="mission">오늘의 미션</b><small id="challenge"></small></div><div class="grid" id="grid"></div><div class="message" id="message">명령을 먼저 조립하세요.</div></div>
  <div class="card"><h2>🧱 나의 코드</h2><div class="palette" id="palette"></div><div class="queue" id="queue"></div><div class="speed"><label>실행 속도 <select id="speed"><option value="650">🐢 느리게</option><option value="350" selected>🚶 보통</option><option value="160">🐇 빠르게</option></select></label></div><div class="debug" id="debug">코드 준비 중 · 0 / 0</div><div class="actions"><button class="run" id="run">▶ 전체 실행</button><button class="step" id="step">⏭ 한 단계</button><button class="neutral" id="undo">↶ 명령 취소</button><button class="neutral" id="clear">🗑 코드 지우기</button><button class="neutral" id="reset">↺ 다시 시작</button><button class="hint" id="hint">💡 힌트</button><button class="select" id="select">▦ 스테이지 선택</button></div></div>
 </section>
</main>
<div class="overlay" id="overlay"><div class="modal"><div class="bigrobot" id="modalIcon">🤖</div><h2 id="modalTitle">별빛 로봇 공방</h2><p id="modalText">명령 블록을 조립해서 로봇을 충전소까지 보내세요!</p><div id="stageList"></div><button class="primary" id="modalButton">게임 시작</button></div></div><div class="particles" id="particles"></div>
<script>
const $=s=>document.querySelector(s);
const N=6,dirs=[[0,-1],[1,0],[0,1],[-1,0]],dirNames=['↑ 북쪽','→ 동쪽','↓ 남쪽','← 서쪽'];
const stages=[
 {name:'첫 전진',mission:'🔋 충전소까지 앞으로 이동',s:[0,5,0],g:[0,2],limit:5,opt:3,h:['앞으로 명령을 세 번 넣어 보세요.']},
 {name:'방향 전환',mission:'↷ 방향을 바꿔 충전소 도착',s:[0,5,0],g:[2,3],limit:7,opt:5,h:['먼저 위로 두 칸 이동하세요.','오른쪽으로 가기 전에 우회전이 필요해요.']},
 {name:'별 수집가',mission:'⭐ 별 2개를 모두 모아 도착',s:[0,5,0],g:[2,3],stars:[[0,3],[1,3]],limit:7,opt:5,h:['별은 지나가는 칸에서 자동으로 모아져요.']},
 {name:'벽 너머',mission:'▦ 벽을 피해 별과 충전소 찾기',s:[0,5,0],g:[3,2],stars:[[1,2]],walls:[21,22,16],limit:10,opt:7,h:['벽 위쪽 길을 이용하세요.']},
 {name:'반복의 힘',mission:'🔁 반복 블록으로 긴 길 압축',s:[0,5,0],g:[0,0],stars:[[0,3],[0,1]],limit:4,opt:3,h:['앞으로 뒤에 ×3 반복을 두 번 사용해 보세요.']},
 {name:'잠긴 문',mission:'🔑 열쇠를 얻고 문을 통과',s:[0,5,0],g:[4,3],key:[0,3],door:[2,3],walls:[25,26,27,28,29],limit:9,opt:7,h:['열쇠는 시작 위치의 위쪽에 있어요.','열쇠를 먹은 뒤 오른쪽으로 이동하세요.']},
 {name:'에너지 배송',mission:'⚡ 충전 패드를 거쳐 목적지 도착',s:[0,5,1],g:[5,5],charger:[2,5],energy:4,limit:8,opt:5,h:['초록 충전 패드는 에너지를 5 채워요.']},
 {name:'위험 구역',mission:'🔥 위험 타일을 피해 별 2개 수집',s:[0,5,0],g:[5,2],stars:[[0,2],[5,3]],danger:[26,21,16],walls:[19,20],limit:12,opt:10,h:['불 타일에는 들어갈 수 없어요.','막힌 곳에서는 한 줄 위로 돌아가 보세요.']},
 {name:'별빛 포털',mission:'🌀 포털을 이용해 반대편으로 이동',s:[0,5,0],g:[5,0],stars:[[1,4],[4,1]],portals:[[1,3],[4,2]],walls:[14,15,20,21],limit:11,opt:8,h:['첫 포털은 왼쪽 아래에 있어요.','포털에 닿으면 짝 포털로 이동해요.']},
 {name:'공방 마스터',mission:'🏆 열쇠·문·별·위험을 모두 해결',s:[0,5,0],g:[5,0],stars:[[0,3],[2,2],[5,2]],key:[0,3],door:[3,2],danger:[19,20,22,10],walls:[14,15,21,28],limit:14,opt:11,h:['시작 위치 위쪽의 별과 열쇠부터 모으세요.','문을 지난 뒤 오른쪽 위 충전소로 향하세요.']}
];
const labels={F:'↑ 앞으로',L:'↶ 왼쪽 회전',R:'↷ 오른쪽 회전',X2:'🔁 마지막 명령 ×2',X3:'🔁 마지막 명령 ×3',D:'⚡ 두 칸 전진'};
let level=0,code=[],expanded=[],robot,stars=[],hasKey=false,energy=Infinity,ip=0,running=false,doneBlocks=new Set(),hintIndex=0,audio=null,soundOn=true,moveState='';
let save={unlocked:1,stars:Array(10).fill(0),best:Array(10).fill(null)};
try{let old=JSON.parse(localStorage.getItem('starRobotWorkshopV2'));if(old)save={...save,...old}}catch(e){}

// 간단한 자체 효과음
function tone(freq,d=.07){if(!soundOn)return;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function persist(){try{localStorage.setItem('starRobotWorkshopV2',JSON.stringify(save))}catch(e){}}
function idx(x,y){return y*N+x}
function current(){return stages[level]}

// 스테이지 선택 화면
function showStageSelect(){running=false;$('#modalIcon').textContent='🗺️';$('#modalTitle').textContent='스테이지 선택';$('#modalText').textContent=`획득한 별 ${save.stars.reduce((a,b)=>a+b,0)} / 30`;
 $('#stageList').className='stage-list';$('#stageList').innerHTML=stages.map((s,i)=>`<button class="stage-button ${i>=save.unlocked?'locked':''}" data-stage="${i}" ${i>=save.unlocked?'disabled':''}>${i+1}<small>${i>=save.unlocked?'🔒':'⭐'.repeat(save.stars[i])+'☆'.repeat(3-save.stars[i])}</small></button>`).join('');$('#modalButton').style.display='none';$('#overlay').classList.remove('hide')}
$('#stageList').onclick=e=>{let n=e.target.closest('[data-stage]');if(n&&!n.disabled){level=+n.dataset.stage;$('#overlay').classList.add('hide');loadStage()}};

// 스테이지 불러오기
function loadStage(){let s=current();robot=[...s.s];stars=(s.stars||[]).map(a=>[...a]);hasKey=false;energy=s.energy??Infinity;code=[];expanded=[];ip=0;running=false;doneBlocks.clear();hintIndex=0;$('#level').textContent=`${level+1} / 10`;$('#direction').textContent=dirNames[robot[2]];$('#mission').textContent=`오늘의 미션 · ${s.name}`;$('#challenge').textContent=`${s.mission} · 권장 ${s.opt}블록 · 최대 ${s.limit}블록`;$('#progress').style.width=`${(level+1)*10}%`;message('명령 버튼을 눌러 코드를 먼저 조립하세요.');buildPalette();render();}
function buildPalette(){let items=['F'];if(level>=1)items.push('L','R');if(level>=4)items.push('X2','X3');if(level>=7)items.push('D');$('#palette').innerHTML=items.map(c=>`<button class="${c==='F'?'move-btn':c==='L'||c==='R'?'turn-btn':c==='D'?'dash-btn':'loop-btn'}" data-command="${c}">${labels[c]}</button>`).join('')}

// 코드 명령 추가 및 반복 블록 펼치기
function addCommand(c){if(running||code.length>=current().limit)return message('📦 명령 블록 제한에 도달했어요.','fail');if((c==='X2'||c==='X3')&&!code.some(x=>!x.startsWith('X')))return message('반복할 이동이나 회전 명령을 먼저 넣으세요.','fail');code.push(c);tone(440);resetRunState(false);renderQueue()}
function expandCode(){let out=[];code.forEach((c,block)=>{if(c==='X2'||c==='X3'){let previous=[...out].reverse().find(x=>x.cmd!=='X2'&&x.cmd!=='X3');if(previous){let count=c==='X2'?1:2;for(let k=0;k<count;k++)out.push({cmd:previous.cmd,block})}}else out.push({cmd:c,block})});return out}
$('#palette').onclick=e=>{if(e.target.dataset.command)addCommand(e.target.dataset.command)};

// 코드 목록과 위/아래/삭제
function renderQueue(){let active=expanded[ip]?.block;$('#queue').innerHTML=code.length?code.map((c,i)=>`<div class="block ${running&&i===active?'active':''} ${doneBlocks.has(i)?'done':''}"><b>${i+1}</b><span>${labels[c]}</span><button data-up="${i}" aria-label="위로">↑</button><button data-down="${i}" aria-label="아래로">↓</button><button data-delete="${i}" aria-label="삭제">×</button></div>`).join(''):'<div class="block"><span>아직 코드가 없어요.</span></div>';$('#debug').textContent=`${running?'🐞 DEBUG':'코드 준비 중'} · ${Math.min(ip+1,expanded.length)} / ${expanded.length||0}`}
$('#queue').onclick=e=>{if(running)return;let i;if(e.target.dataset.delete!==undefined){i=+e.target.dataset.delete;code.splice(i,1)}else if(e.target.dataset.up!==undefined&&(i=+e.target.dataset.up)>0)[code[i-1],code[i]]=[code[i],code[i-1]];else if(e.target.dataset.down!==undefined&&(i=+e.target.dataset.down)<code.length-1)[code[i+1],code[i]]=[code[i],code[i+1]];resetRunState(false);renderQueue()};

// 맵과 상태 표시
function render(){let s=current(),html='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){let k=idx(x,y),wall=(s.walls||[]).includes(k),danger=(s.danger||[]).includes(k),star=stars.some(a=>a[0]===x&&a[1]===y),portal=(s.portals||[]).findIndex(a=>a[0]===x&&a[1]===y),content='';if(robot[0]===x&&robot[1]===y)content=`<span class="robot d${robot[2]} ${moveState}">🤖</span>`;else if(wall)content='▦';else if(star)content='⭐';else if(s.key&&!hasKey&&s.key[0]===x&&s.key[1]===y)content='🔑';else if(s.door&&s.door[0]===x&&s.door[1]===y)content=hasKey?'🚪':'🔒';else if(s.charger&&s.charger[0]===x&&s.charger[1]===y)content='⚡';else if(portal>=0)content=portal?'🌀':'🌀';else if(s.g[0]===x&&s.g[1]===y)content='🔋';else if(danger)content='🔥';html+=`<div class="cell${wall?' wall':''}${danger?' danger':''}${s.door&&s.door[0]===x&&s.door[1]===y?' door':''}">${content}</div>`}$('#grid').innerHTML=html;$('#direction').textContent=dirNames[robot[2]];$('#got').textContent=(s.stars||[]).length-stars.length;$('#need').textContent=(s.stars||[]).length;$('#energy').textContent=energy===Infinity?'∞':energy;$('#limit').textContent=`${code.length}/${s.limit} 블록`;renderQueue()}
function message(text,type=''){$('#message').textContent=text;$('#message').className='message '+type}
function resetRunState(redraw=true){let s=current();robot=[...s.s];stars=(s.stars||[]).map(a=>[...a]);hasKey=false;energy=s.energy??Infinity;expanded=expandCode();ip=0;doneBlocks.clear();moveState='';if(redraw)render()}

// 충돌, 열쇠, 문, 위험 타일, 충전소, 포털 처리
async function moveOne(){let s=current(),[dx,dy]=dirs[robot[2]],nx=robot[0]+dx,ny=robot[1]+dy,k=idx(nx,ny);if(nx<0||nx>=N||ny<0||ny>=N||(s.walls||[]).includes(k))return fail('💥 벽에 부딪혔어요. 코드를 수정해 보세요.');if(s.door&&s.door[0]===nx&&s.door[1]===ny&&!hasKey)return fail('🚪 문이 잠겨 있어요! 먼저 열쇠를 찾으세요.');if(energy!==Infinity&&energy<=0)return fail('⚡ 배터리가 부족해 움직일 수 없어요.');robot[0]=nx;robot[1]=ny;if(energy!==Infinity)energy--;moveState='move';tone(520);render();await wait(120);moveState='';if((s.danger||[]).includes(k))return fail('🔥 위험한 칸으로 이동했어요.');if(s.key&&s.key[0]===nx&&s.key[1]===ny&&!hasKey){hasKey=true;tone(820);message('🔑 열쇠를 획득했어요!')}let before=stars.length;stars=stars.filter(a=>a[0]!==nx||a[1]!==ny);if(stars.length<before){tone(960);message('⭐ 별을 모았어요!','ok')}if(s.charger&&s.charger[0]===nx&&s.charger[1]===ny&&energy!==Infinity){energy+=5;tone(760);message('⚡ 에너지를 충전했어요!','ok')}let pi=(s.portals||[]).findIndex(a=>a[0]===nx&&a[1]===ny);if(pi>=0){let to=s.portals[pi?0:1];await wait(150);robot[0]=to[0];robot[1]=to[1];tone(700);message('🌀 포털 순간이동!','ok')}render();return true}
async function executeCommand(cmd){if(cmd==='L'){robot[2]=(robot[2]+3)%4;tone(360);render();return true}if(cmd==='R'){robot[2]=(robot[2]+1)%4;tone(400);render();return true}if(cmd==='D'){if(!await moveOne())return false;return await moveOne()}return await moveOne()}
function fail(text){running=false;moveState='crash';message(text,'fail');tone(150,.15);render();return false}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}

// 전체 실행과 한 단계 디버깅
async function runAll(){if(running||!code.length)return;resetRunState();expanded=expandCode();running=true;while(ip<expanded.length&&running){renderQueue();let item=expanded[ip];if(!await executeCommand(item.cmd))break;doneBlocks.add(item.block);ip++;renderQueue();await wait(+$('#speed').value)}if(running){running=false;finishCheck()}render()}
async function stepOnce(){if(running||!code.length)return;if(!expanded.length||ip>=expanded.length)resetRunState();running=true;renderQueue();let item=expanded[ip];if(await executeCommand(item.cmd)){doneBlocks.add(item.block);ip++;running=false;message(`🐞 한 단계 실행: ${ip} / ${expanded.length}`);if(ip>=expanded.length)finishCheck()}render()}
function finishCheck(){let s=current();if(stars.length)return message('⭐ 아직 모으지 않은 별이 있어요.','fail');if(robot[0]!==s.g[0]||robot[1]!==s.g[1])return message('🔋 코드가 끝났지만 충전소에 도착하지 못했어요.','fail');completeStage()}

// 별 3개 평가와 기록 저장
function completeStage(){running=false;moveState='win';let used=code.length,rating=used<=current().opt?3:used<=current().opt+2?2:1;save.stars[level]=Math.max(save.stars[level],rating);save.best[level]=save.best[level]===null?used:Math.min(save.best[level],used);save.unlocked=Math.max(save.unlocked,Math.min(10,level+2));persist();render();celebrate();tone(660);setTimeout(()=>tone(820),120);setTimeout(()=>tone(1040),240);$('#modalIcon').textContent='🎉';$('#modalTitle').textContent='미션 완료!';$('#modalText').innerHTML=`<span class="result-stars">${'★'.repeat(rating)}${'☆'.repeat(3-rating)}</span><br>${rating===3?'완벽한 코드!':'좋아요! 더 짧은 코드에도 도전해 보세요.'}<br>사용 ${used}블록 · 권장 ${current().opt}블록 · 최고 ${save.best[level]}블록`;$('#stageList').className='';$('#stageList').innerHTML='';$('#modalButton').style.display='block';$('#modalButton').textContent=level<9?'다음 스테이지':'스테이지 선택';$('#modalButton').onclick=()=>{if(level<9){level++;$('#overlay').classList.add('hide');loadStage()}else showStageSelect()};setTimeout(()=>$('#overlay').classList.remove('hide'),450)}
function celebrate(){let p=$('#particles');p.innerHTML=Array.from({length:16},(_,i)=>`<i class="particle" style="left:${10+Math.random()*80}%;top:15%;--x:${-80+Math.random()*160}px;font-size:${16+Math.random()*18}px">${i%2?'⭐':'✨'}</i>`).join('');setTimeout(()=>p.innerHTML='',1400)}

$('#run').onclick=runAll;$('#step').onclick=stepOnce;$('#undo').onclick=()=>{if(!running){code.pop();resetRunState(false);render()}};$('#clear').onclick=()=>{if(!running){code=[];resetRunState(false);render()}};$('#reset').onclick=()=>{if(!running)loadStage()};$('#hint').onclick=()=>{let h=current().h;message('💡 '+h[Math.min(hintIndex++,h.length-1)])};$('#select').onclick=showStageSelect;$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'🔊 소리':'🔇 음소거'};

// 첫 화면
$('#modalButton').onclick=()=>showStageSelect();loadStage();
</script>
</body>
</html>
