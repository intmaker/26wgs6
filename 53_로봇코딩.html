<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"><title>🤖 로봇 코딩</title><style>
:root{--c1:#0f766e;--c2:#5eead4}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 18% 10%,var(--c1),#11162e 52%,#030712);user-select:none;-webkit-user-select:none}.app{width:min(95vw,720px);height:min(95vh,860px);display:flex;flex-direction:column;gap:11px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 4px}.brand small{display:block;color:#cbd5e1;font-size:10px;font-weight:900;letter-spacing:.2em}.brand h1{margin:2px 0 0;font-size:clamp(25px,5vw,38px);letter-spacing:-.05em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:67px;padding:7px 10px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#0f172ac7}.stat small{display:block;color:#cbd5e1;font-size:9px}.stat b{font-size:19px}.stage{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff27;border-radius:25px;background:linear-gradient(145deg,#14203b,#090e21);box-shadow:0 25px 70px #0009;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#050916e9}.overlay.hide{display:none}.card{width:min(100%,410px);padding:28px 24px;text-align:center;border:1px solid #ffffff25;border-radius:23px;background:#111a36ee;box-shadow:0 20px 55px #0008}.card .emoji{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{margin:0 0 19px;color:#cbd5e1;font-size:14px;line-height:1.72;word-break:keep-all}.primary{min-height:48px;width:100%;padding:12px 18px;border:0;border-radius:13px;color:#08111f;background:linear-gradient(135deg,var(--c2),#fef3c7);font:900 15px system-ui;cursor:pointer}.tip{min-height:18px;text-align:center;color:#aebbd0;font-size:12px}.hidden{display:none!important}button{font-family:inherit}.code-game{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:12px;background:linear-gradient(145deg,#0f3f46,#0b1f31)}.code-grid{width:min(94%,500px);aspect-ratio:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px;border:2px solid #5eead4;border-radius:15px;background:#071923}.ccell{display:grid;place-items:center;border-radius:8px;background:#ffffff0a;font-size:clamp(18px,5vw,35px)}.ccell.wall{background:#334155}.ccell.goal{background:#22c55e55}.queue{width:min(94%,500px);min-height:47px;padding:10px;overflow-x:auto;white-space:nowrap;border-radius:11px;background:#020617;color:#67e8f9;font-size:21px;letter-spacing:.17em}.commands{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}.commands button{min-width:49px;min-height:45px;padding:8px 12px;border:1px solid #ffffff22;border-radius:10px;color:#fff;background:#0f766e;font-weight:900;font-size:18px}.commands #runCmd{background:#fbbf24;color:#18302e}.code-msg{min-height:21px;text-align:center;color:#99f6e4;font-weight:800}
@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.stage{min-height:0;border-radius:20px}.brand h1{font-size:25px}.stat{min-width:61px;padding:6px 8px}.card{padding:24px 19px}.tip{font-size:11px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><small>CODE ROUTE</small><h1>🤖 로봇 코딩</h1></div><div class="hud" id="hud"></div></header><section class="stage" id="stage"><div class="code-game"><div class="code-grid" id="grid"></div><div class="queue" id="queue">명령을 추가하세요</div><div class="commands"><button data-c="U">↑</button><button data-c="L">←</button><button data-c="D">↓</button><button data-c="R">→</button><button id="backCmd">⌫</button><button id="runCmd">▶ 실행</button></div><div class="code-msg" id="message">명령을 미리 작성한 뒤 한 번에 실행하세요.</div></div><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="resultEmoji">🤖</div><h2 id="resultTitle">로봇 코딩</h2><p id="resultText">이동 명령을 미리 조립하고 한 번에 실행해 로봇을 배터리까지 보내세요.</p><button class="primary" id="startBtn">게임 시작</button></div></div></section><div class="tip">이동 명령을 미리 조립하고 한 번에 실행해 로봇을 배터리까지 보내세요.</div></main><script>
const $=s=>document.querySelector(s),stage=$('#stage'),overlay=$('#overlay'),startBtn=$('#startBtn');
const safeGet=(k,d=0)=>{try{return Number(localStorage.getItem(k))||d}catch(e){return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function showResult(icon,title,text,button='다시 하기'){ $('#resultEmoji').textContent=icon;$('#resultTitle').textContent=title;$('#resultText').innerHTML=text;startBtn.textContent=button;overlay.classList.remove('hide') }
const N=7,gridEl=$('#grid'),queueEl=$('#queue'),msg=$('#message'),hud=$('#hud');let walls=new Set,robot,goal,commands=[],playing=false,running=false,level=1,movesLimit=14;hud.innerHTML='<div class="stat"><small>레벨</small><b id="level">1</b></div><div class="stat"><small>최소 경로</small><b id="optimal">-</b></div><div class="stat"><small>명령 제한</small><b id="limit">14</b></div>';const idx=(x,y)=>y*N+x,dirs={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]},arrows={U:'↑',D:'↓',L:'←',R:'→'};
function generate(){for(let tries=0;tries<300;tries++){robot={x:0,y:N-1};goal={x:N-1,y:0};walls=new Set;while(walls.size<7+level*2)walls.add(Math.floor(Math.random()*N*N));walls.delete(idx(robot.x,robot.y));walls.delete(idx(goal.x,goal.y));const d=bfs();if(d&&d<=movesLimit-1){$('#optimal').textContent=d;return}}walls=new Set;$('#optimal').textContent=12}
function bfs(){const q=[[robot.x,robot.y,0]],seen=new Set([idx(robot.x,robot.y)]);while(q.length){const[x,y,d]=q.shift();if(x===goal.x&&y===goal.y)return d;for(const[dx,dy]of Object.values(dirs)){const nx=x+dx,ny=y+dy,k=idx(nx,ny);if(nx>=0&&nx<N&&ny>=0&&ny<N&&!walls.has(k)&&!seen.has(k)){seen.add(k);q.push([nx,ny,d+1])}}}return 0}
function startGame(){commands=[];playing=true;running=false;movesLimit=Math.min(20,13+level);generate();$('#level').textContent=level;$('#limit').textContent=movesLimit;msg.textContent='로봇이 목표 배터리까지 갈 명령을 작성하세요.';overlay.classList.add('hide');render()}
function render(){gridEl.innerHTML='';for(let i=0;i<N*N;i++){const c=document.createElement('div');c.className='ccell'+(walls.has(i)?' wall':'')+(i===idx(goal.x,goal.y)?' goal':'');c.textContent=walls.has(i)?'▦':i===idx(goal.x,goal.y)?'🔋':i===idx(robot.x,robot.y)?'🤖':'';gridEl.appendChild(c)}queueEl.textContent=commands.length?commands.map(c=>arrows[c]).join(' '):'명령을 추가하세요'}
function add(c){if(playing&&!running&&commands.length<movesLimit){commands.push(c);render()}}async function run(){if(!playing||running||!commands.length)return;running=true;for(const c of commands){await new Promise(r=>setTimeout(r,260));const[dx,dy]=dirs[c],nx=robot.x+dx,ny=robot.y+dy;if(nx<0||nx>=N||ny<0||ny>=N||walls.has(idx(nx,ny))){running=false;msg.textContent='벽에 충돌했습니다! 명령을 수정해 보세요.';return}robot.x=nx;robot.y=ny;render();if(robot.x===goal.x&&robot.y===goal.y){playing=false;running=false;level++;return showResult('🤖','프로그램 성공!',`${commands.length}개의 명령으로 배터리에 도착했습니다.<br>다음 레벨은 장애물이 더 많아집니다.`,'다음 레벨')}}running=false;msg.textContent='명령이 끝났지만 목표에 도착하지 못했습니다. 다시 작성하세요.'}
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>add(b.dataset.c));$('#backCmd').onclick=()=>{if(!running){commands.pop();render()}};$('#runCmd').onclick=run;startBtn.onclick=startGame;
</script></body></html>
