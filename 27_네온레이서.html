<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🏎️ 네온 레이서</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 10%,#4338ca,#111633 50%,#030712);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(94vw,700px);height:min(95vh,840px);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#67e8f9;font-weight:900}h1{margin:2px 0;font-size:clamp(26px,5vw,38px)}.stats{display:flex;gap:7px}.stat{min-width:70px;padding:8px;text-align:center;border:1px solid #ffffff24;border-radius:14px;background:#151b42cc}.stat small{display:block;color:#a5f3fc;font-size:9px}.stat b{font-size:20px}.game{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff25;border-radius:25px;background:#080d1d;box-shadow:0 25px 70px #0009;touch-action:none}canvas{display:block;width:100%;height:100%}.pad{position:absolute;inset:auto 15px 15px;z-index:3;display:flex;justify-content:space-between}.pad button{width:84px;height:54px;padding:0;border:1px solid #ffffff45;border-radius:13px;background:#121a42bc;color:#fff;font-size:25px;touch-action:none}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#070b1be8}.overlay.hide{display:none}.card{max-width:390px;padding:28px 24px;text-align:center;border:1px solid #ffffff24;border-radius:23px;background:#171c48}.ico{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{color:#dbeafe;font-size:14px;line-height:1.7}.card>button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#67e8f9,#a78bfa);color:#12143c;font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#a5b4fc;font-size:12px}@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.game{border-radius:20px}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">NEON HIGHWAY</div><h1>🏎️ 네온 레이서</h1></div><div class="stats"><div class="stat"><small>거리</small><b id="score">0</b></div><div class="stat"><small>최고</small><b id="best">0</b></div></div></header><section class="game" id="game"><canvas id="canvas"></canvas><div class="pad"><button data-d="-1">◀</button><button data-d="1">▶</button></div><div class="overlay" id="over"><div class="card"><div class="ico" id="ico">🏎️</div><h2 id="title">네온 고속도로를 질주하세요</h2><p id="desc">좌우 버튼으로 세 개 차선을 이동하세요.<br>다른 차량과 공사 장애물을 피하고<br>에너지 링을 모으면 보너스를 얻습니다.</p><button id="start">레이스 시작</button></div></div></section><div class="tip">← → 차선 변경 · 화면 좌우 터치 · 장애물 회피</div></main><script>
(()=>{const C=document.querySelector('#canvas'),X=C.getContext('2d'),G=document.querySelector('#game'),O=document.querySelector('#over'),SE=document.querySelector('#score'),BE=document.querySelector('#best');let W,H,D=1,on=false,last=0,time=0,next=0,lane=1,targetLane=1,items=[],distance=0,best=Number(localStorage.racerBest||0),roadY=0;BE.textContent=best;
function resize(){const r=G.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);draw()}const laneX=i=>W*.2+(i+.5)*W*.2;
function start(){time=0;next=.8;lane=targetLane=1;items=[];distance=0;SE.textContent=0;on=true;O.classList.add('hide');last=performance.now();requestAnimationFrame(loop)}function move(d){if(on)targetLane=Math.max(0,Math.min(2,targetLane+d))}
function spawn(){const coin=Math.random()<.25;items.push({lane:Math.floor(Math.random()*3),y:-65,speed:230+Math.min(250,distance*.35)+Math.random()*60,coin,type:coin?'⚡':Math.random()<.5?'🚙':'🚧',got:false})}
function update(dt){time+=dt;roadY=(roadY+(270+distance*.22)*dt)%80;lane+=(targetLane-lane)*Math.min(1,dt*12);distance+=dt*10;SE.textContent=Math.floor(distance);if(time>next){next=time+Math.max(.36,.85-distance*.003);spawn()}const px=laneX(lane),py=H-92;for(const a of items){a.y+=a.speed*dt;if(!a.got&&Math.abs(laneX(a.lane)-px)<W*.08&&Math.abs(a.y-py)<45){if(a.coin){a.got=true;distance+=15}else return finish()}}items=items.filter(a=>a.y<H+80&&!a.got)}
function draw(){X.clearRect(0,0,W,H);let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#080b1a');g.addColorStop(1,'#17143c');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle='#101827';X.beginPath();X.moveTo(W*.22,0);X.lineTo(W*.05,H);X.lineTo(W*.95,H);X.lineTo(W*.78,0);X.fill();X.strokeStyle='#22d3eeaa';X.lineWidth=3;X.beginPath();X.moveTo(W*.22,0);X.lineTo(W*.05,H);X.moveTo(W*.78,0);X.lineTo(W*.95,H);X.stroke();X.strokeStyle='#ffffff70';X.setLineDash([35,45]);X.lineDashOffset=roadY;for(let i=1;i<3;i++){const top=W*.22+i*W*.56/3,bottom=W*.05+i*W*.9/3;X.beginPath();X.moveTo(top,0);X.lineTo(bottom,H);X.stroke()}X.setLineDash([]);for(const a of items){X.font=a.coin?'31px sans-serif':'45px sans-serif';X.textAlign='center';X.fillText(a.type,laneX(a.lane),a.y)}X.save();X.translate(laneX(lane),H-92);X.font='55px sans-serif';X.textAlign='center';X.shadowColor='#22d3ee';X.shadowBlur=18;X.fillText('🏎️',0,0);X.restore()}
function finish(){if(!on)return;on=false;const s=Math.floor(distance);if(s>best){best=s;BE.textContent=best;localStorage.racerBest=best}document.querySelector('#ico').textContent='🏁';document.querySelector('#title').textContent=`${s}m 질주!`;document.querySelector('#desc').innerHTML='차선 변경을 미리 시작하면 빠른 장애물도 피할 수 있어요.<br>에너지 링은 15m 보너스입니다.';document.querySelector('#start').textContent='다시 달리기';setTimeout(()=>O.classList.remove('hide'),400)}function loop(t){if(!on)return;const dt=Math.min(.032,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});document.querySelectorAll('.pad button').forEach(b=>b.onpointerdown=e=>{e.preventDefault();move(Number(b.dataset.d))});G.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=G.getBoundingClientRect();move(e.clientX-r.left<W/2?-1:1)});document.querySelector('#start').onclick=start;addEventListener('resize',resize);resize()})();</script></body></html>
