<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🔧 파이프 연결</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 10%,#065f46,#062b2c 48%,#031315);color:#ecfeff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(94vw,680px);height:min(94vh,820px);display:flex;flex-direction:column;gap:12px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#5eead4;font-weight:900}h1{margin:2px 0;font-size:clamp(26px,5vw,38px)}.hud{display:flex;gap:8px}.stat{min-width:72px;text-align:center;padding:8px;border:1px solid #ffffff26;border-radius:14px;background:#052e2bc9}.stat small{display:block;color:#99f6e4;font-size:9px}.stat b{font-size:20px}.game{position:relative;flex:1;min-height:390px;display:grid;place-items:center;padding:16px;border:1px solid #ffffff24;border-radius:24px;background:linear-gradient(145deg,#073b3a,#0b2533);box-shadow:0 25px 60px #0008}.board{width:min(100%,520px);aspect-ratio:1;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.tile{position:relative;border:1px solid #ffffff1f;border-radius:13px;background:#102f3b;cursor:pointer;transition:transform .18s,background .2s}.tile:hover{background:#164755}.tile::before,.tile::after{content:"";position:absolute;background:#94a3b8;box-shadow:inset 0 0 0 3px #cbd5e1}.tile::before{width:18px;height:56%;left:calc(50% - 9px);top:-1px}.tile::after{width:56%;height:18px;left:calc(50% - 1px);top:calc(50% - 9px);transform-origin:left center}.tile.straight::after{width:calc(100% + 2px);left:-1px}.tile.straight::before{display:none}.tile.corner::before{height:calc(50% + 1px)}.tile.corner::after{width:calc(50% + 1px)}.tile[data-r="1"]{transform:rotate(90deg)}.tile[data-r="2"]{transform:rotate(180deg)}.tile[data-r="3"]{transform:rotate(270deg)}.tile.flow::before,.tile.flow::after{background:#22d3ee;box-shadow:0 0 13px #22d3ee,inset 0 0 0 3px #cffafe}.source,.goal{position:absolute;top:50%;z-index:3;transform:translateY(-50%);font-size:25px}.source{left:2px}.goal{right:2px}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;border-radius:inherit;background:#031715e8;z-index:5}.overlay.hide{display:none}.card{max-width:390px;text-align:center;padding:28px 24px;border:1px solid #ffffff25;border-radius:22px;background:#0b3535}.ico{font-size:54px}.card h2{margin:8px;font-size:28px}.card p{color:#b7d9d7;line-height:1.7;font-size:14px}.card button{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,#5eead4,#67e8f9);color:#07302f;font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#9cc8c8;font-size:12px}@media(max-width:520px){.app{width:100%;height:100%;padding:10px}.game{border-radius:20px;padding:10px}.board{gap:3px}.tile{border-radius:9px}.tile::before{width:13px;left:calc(50% - 6.5px)}.tile::after{height:13px;top:calc(50% - 6.5px)}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">PIPEWORKS</div><h1>🔧 파이프 연결</h1></div><div class="hud"><div class="stat"><small>회전</small><b id="moves">0</b></div><div class="stat"><small>최고</small><b id="best">-</b></div></div></header><section class="game"><span class="source">💧</span><div class="board" id="board"></div><span class="goal">🌱</span><div class="overlay" id="over"><div class="card"><div class="ico">🔧</div><h2 id="title">물길을 연결하세요</h2><p id="desc">파이프 조각을 눌러 90도씩 돌리세요.<br>왼쪽 물탱크부터 오른쪽 화분까지<br>모든 파이프가 이어지면 성공합니다.</p><button id="start">퍼즐 시작</button></div></div></section><div class="tip">파이프 클릭·터치로 회전 · 모든 칸을 하나의 물길로 연결</div></main><script>
(()=>{const board=document.querySelector('#board'),over=document.querySelector('#over'),movesEl=document.querySelector('#moves'),bestEl=document.querySelector('#best'),N=5;let tiles=[],moves=0,playing=false,best=Number(localStorage.pipeBest||0);bestEl.textContent=best||'-';
function solution(){const out=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){let type='straight',r=0;if(y%2===0){if(x===N-1&&y<N-1){type='corner';r=2}else if(x===0&&y>0){type='corner';r=0}}else{if(x===0&&y<N-1){type='corner';r=1}else if(x===N-1){type='corner';r=3}}out.push({type,sol:r,r:Math.floor(Math.random()*4),flow:false})}return out}
function ports(t){return t.type==='straight'?(t.r%2?[0,2]:[1,3]):[t.r,(t.r+1)%4]}
function neighbor(i,d){const x=i%N,y=Math.floor(i/N),nx=x+[0,1,0,-1][d],ny=y+[-1,0,1,0][d];return nx<0||nx>=N||ny<0||ny>=N?-1:ny*N+nx}
function trace(){tiles.forEach(t=>t.flow=false);let q=[0],seen=new Set;while(q.length){const i=q.shift();if(seen.has(i))continue;seen.add(i);tiles[i].flow=true;for(const d of ports(tiles[i])){const n=neighbor(i,d);if(n>=0&&ports(tiles[n]).includes((d+2)%4))q.push(n)}}render();if(seen.size===N*N&&ports(tiles[0]).includes(3)&&ports(tiles.at(-1)).includes(1))win()}
function render(){board.innerHTML='';tiles.forEach((t,i)=>{const b=document.createElement('button');b.className='tile '+t.type+(t.flow?' flow':'');b.dataset.r=t.r;b.setAttribute('aria-label',`${i+1}번 파이프 회전`);b.onclick=()=>{if(!playing)return;t.r=(t.r+1)%4;movesEl.textContent=++moves;trace()};board.appendChild(b)})}
function start(){tiles=solution();moves=0;movesEl.textContent=0;playing=true;over.classList.add('hide');render()}
function win(){playing=false;if(!best||moves<best){best=moves;bestEl.textContent=best;localStorage.pipeBest=best}document.querySelector('#title').textContent='물길 연결 성공!';document.querySelector('#desc').innerHTML=`${moves}번 회전으로 화분에 물을 보냈어요.<br>더 적은 회전으로 다시 도전해 보세요.`;document.querySelector('#start').textContent='새 퍼즐';setTimeout(()=>over.classList.remove('hide'),450)}document.querySelector('#start').onclick=start;
})();</script></body></html>
