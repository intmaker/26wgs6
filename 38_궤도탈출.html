<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🪐 궤도 탈출</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 10%,#6d28d9,#131536 50%,#030712);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(94vw,700px);height:min(95vh,840px);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#c4b5fd;font-weight:900}h1{margin:2px 0;font-size:clamp(26px,5vw,38px)}.stats{display:flex;gap:7px}.stat{min-width:70px;padding:8px;text-align:center;border:1px solid #ffffff24;border-radius:14px;background:#19163dcc}.stat small{display:block;color:#c4b5fd;font-size:9px}.stat b{font-size:20px}.game{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff24;border-radius:25px;background:#05081a;box-shadow:0 25px 70px #0009;touch-action:manipulation;cursor:pointer}canvas{display:block;width:100%;height:100%}.launch{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;padding:12px 25px;border:1px solid #ffffff40;border-radius:999px;background:#4c1d95cc;color:#fff;font-weight:900;font-size:15px}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#070817e8}.overlay.hide{display:none}.card{max-width:390px;padding:28px 24px;text-align:center;border:1px solid #ffffff24;border-radius:23px;background:#20194c}.ico{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{color:#ede9fe;font-size:14px;line-height:1.7}.card>button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#c4b5fd,#67e8f9);color:#24194d;font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#c4b5fd;font-size:12px}@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.game{border-radius:20px}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">ORBIT HOP</div><h1>🪐 궤도 탈출</h1></div><div class="stats"><div class="stat"><small>이동</small><b id="score">0</b></div><div class="stat"><small>최고</small><b id="best">0</b></div></div></header><section class="game" id="game"><canvas id="canvas"></canvas><button class="launch" id="launch">지금 발사!</button><div class="overlay" id="over"><div class="card"><div class="ico" id="ico">🪐</div><h2 id="title">행성 사이를 점프하세요</h2><p id="desc">우주선은 현재 행성 주위를 자동으로 돕니다.<br>우주선이 다음 행성을 향하는 순간 화면을 누르세요.<br>흰색 유도선과 방향이 맞지 않으면 우주로 날아갑니다.</p><button id="start">궤도 진입</button></div></div></section><div class="tip">화면·스페이스로 발사 · 다음 행성 방향과 일치할 때 점프</div></main><script>
(()=>{const C=document.querySelector('#canvas'),X=C.getContext('2d'),G=document.querySelector('#game'),O=document.querySelector('#over'),SE=document.querySelector('#score'),BE=document.querySelector('#best');let W,H,D=1,on=false,last=0,a=0,speed=1.8,targetA=0,score=0,best=Number(localStorage.orbitBest||0),flash=0,stars=[];BE.textContent=best;
function resize(){const r=G.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);stars=Array.from({length:70},(_,i)=>({x:i*97%W,y:i*61%H,s:1+i%2}));draw()}function newTarget(){const choices=[-.9,-.55,-.25,.25,.55,.9];targetA=choices[Math.floor(Math.random()*choices.length)];speed=(Math.random()<.5?-1:1)*(1.8+score*.09)}function start(){a=Math.PI;score=0;flash=0;SE.textContent=0;on=true;O.classList.add('hide');newTarget();last=performance.now();requestAnimationFrame(loop)}
function launch(){if(!on)return;let diff=Math.atan2(Math.sin(a-targetA),Math.cos(a-targetA));if(Math.abs(diff)<.3){score++;SE.textContent=score;if(score>best){best=score;BE.textContent=best;localStorage.orbitBest=best}flash=1;a=targetA+Math.PI;newTarget()}else finish()}
function update(dt){a+=speed*dt;flash=Math.max(0,flash-dt*2.8)}function draw(){X.clearRect(0,0,W,H);let g=X.createRadialGradient(W/2,H/2,10,W/2,H/2,Math.max(W,H));g.addColorStop(0,'#1e1b4b');g.addColorStop(1,'#03040c');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle='#fff';stars.forEach(s=>{X.globalAlpha=.25+(s.x%7)/10;X.fillRect(s.x,s.y,s.s,s.s)});X.globalAlpha=1;const cx=W/2,cy=H/2,r=Math.min(W,H)*.22,nx=cx+Math.cos(targetA)*r*2.05,ny=cy+Math.sin(targetA)*r*2.05;X.strokeStyle='#ffffff2d';X.setLineDash([7,9]);X.beginPath();X.arc(cx,cy,r,0,7);X.stroke();X.beginPath();X.moveTo(cx,cy);X.lineTo(nx,ny);X.stroke();X.setLineDash([]);X.font='72px sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText(['🪐','🌍','🌕'][score%3],cx,cy);X.font='54px sans-serif';X.fillText(['🌕','🪐','🌍'][(score+1)%3],nx,ny);const sx=cx+Math.cos(a)*r,sy=cy+Math.sin(a)*r;X.save();X.translate(sx,sy);X.rotate(a+Math.PI/2);X.font='31px sans-serif';X.fillText('🚀',0,0);X.restore();if(flash){X.globalAlpha=flash;X.fillStyle='#fff';X.fillRect(0,0,W,H);X.globalAlpha=1}}
function finish(){if(!on)return;on=false;document.querySelector('#ico').textContent=score>=8?'🏆':'🌌';document.querySelector('#title').textContent=`${score}번 궤도 이동!`;document.querySelector('#desc').innerHTML='우주선·현재 행성·다음 행성이 일직선에 가까울 때<br>발사 버튼을 눌러보세요.';document.querySelector('#start').textContent='다시 진입';setTimeout(()=>O.classList.remove('hide'),400)}function loop(t){if(!on)return;const dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}document.querySelector('#launch').onclick=e=>{e.stopPropagation();launch()};G.addEventListener('pointerdown',e=>{if(!e.target.closest('button'))launch()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();launch()}});document.querySelector('#start').onclick=start;addEventListener('resize',resize);resize()})();</script></body></html>
