/* =========================================================
   26. AI 위치 평가
========================================================= */

/*
    평가값:
    + 값 = 흰색에 유리
    - 값 = 검은색 AI에 유리

    AI는 검은색이므로
    가능한 낮은 평가값을 찾는다.
*/
function evaluatePosition(state) {

    let score = 0;

    let whiteBishops = 0;
    let blackBishops = 0;

    let whiteMobility = 0;
    let blackMobility = 0;


    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const p =
                state.board[row][col];

            if (!p) {
                continue;
            }

            let value =
                PIECE_VALUES[p.type];


            /* =================================================
               중앙 점유
            ================================================= */

            const distanceFromCenter =
                Math.abs(3.5 - row) +
                Math.abs(3.5 - col);

            let positional = 0;


            /* 폰 */
            if (p.type === "p") {

                positional +=
                    Math.round(
                        (7 - distanceFromCenter) * 3
                    );

                /*
                    전진한 폰에 작은 보너스
                */
                if (p.color === WHITE) {

                    positional +=
                        (6 - row) * 4;
                }
                else {

                    positional +=
                        (row - 1) * 4;
                }
            }


            /* 나이트 */
            if (p.type === "n") {

                positional +=
                    Math.round(
                        (7 - distanceFromCenter) * 7
                    );

                /*
                    시작 위치에 그대로 있는 나이트보다
                    전개된 나이트를 약간 선호.
                */
                if (
                    p.color === WHITE &&
                    row === 7 &&
                    (col === 1 || col === 6)
                ) {
                    positional -= 12;
                }

                if (
                    p.color === BLACK &&
                    row === 0 &&
                    (col === 1 || col === 6)
                ) {
                    positional -= 12;
                }
            }


            /* 비숍 */
            if (p.type === "b") {

                positional +=
                    Math.round(
                        (7 - distanceFromCenter) * 4
                    );

                if (p.color === WHITE) {
                    whiteBishops++;
                }
                else {
                    blackBishops++;
                }


                if (
                    p.color === WHITE &&
                    row === 7 &&
                    (col === 2 || col === 5)
                ) {
                    positional -= 10;
                }

                if (
                    p.color === BLACK &&
                    row === 0 &&
                    (col === 2 || col === 5)
                ) {
                    positional -= 10;
                }
            }


            /* 룩 */
            if (p.type === "r") {

                positional +=
                    Math.round(
                        (7 - distanceFromCenter) * 1.5
                    );
            }


            /* 퀸 */
            if (p.type === "q") {

                positional +=
                    Math.round(
                        (7 - distanceFromCenter)
                    );
            }


            /* 킹 */
            if (p.type === "k") {

                /*
                    초중반에는 중앙에 있는 킹보다
                    캐슬링한 킹을 선호.
                */
                if (p.color === WHITE) {

                    if (
                        row === 7 &&
                        (
                            col === 6 ||
                            col === 2
                        )
                    ) {
                        positional += 45;
                    }

                    if (
                        row <= 5 &&
                        col >= 2 &&
                        col <= 5
                    ) {
                        positional -= 30;
                    }
                }
                else {

                    if (
                        row === 0 &&
                        (
                            col === 6 ||
                            col === 2
                        )
                    ) {
                        positional += 45;
                    }

                    if (
                        row >= 2 &&
                        col >= 2 &&
                        col <= 5
                    ) {
                        positional -= 30;
                    }
                }
            }


            value += positional;


            if (p.color === WHITE) {
                score += value;
            }
            else {
                score -= value;
            }
        }
    }


    /* 비숍 쌍 보너스 */
    if (whiteBishops >= 2) {
        score += 22;
    }

    if (blackBishops >= 2) {
        score -= 22;
    }


    /*
        활동성 평가.
        너무 많은 탐색 비용이 발생하지 않게
        pseudo 이동 개수로 가볍게 계산.
    */
    whiteMobility =
        countPseudoMobility(
            state,
            WHITE
        );

    blackMobility =
        countPseudoMobility(
            state,
            BLACK
        );

    score +=
        (
            whiteMobility -
            blackMobility
        ) * 2;


    /* 체크 보너스 */
    if (
        isKingInCheck(
            state,
            WHITE
        )
    ) {
        score -= 35;
    }

    if (
        isKingInCheck(
            state,
            BLACK
        )
    ) {
        score += 35;
    }


    /* 킹 주변 폰 보호 */
    score +=
        kingSafetyScore(
            state,
            WHITE
        );

    score -=
        kingSafetyScore(
            state,
            BLACK
        );


    /* 공격받는 고가 기물 평가 */
    score +=
        hangingPieceScore(
            state,
            WHITE
        );

    score -=
        hangingPieceScore(
            state,
            BLACK
        );


    return score;
}


/* =========================================================
   27. 활동성 계산
========================================================= */

function countPseudoMobility(
    state,
    color
) {

    let count = 0;

    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const p =
                state.board[row][col];

            if (
                p &&
                p.color === color
            ) {

                count +=
                    generatePseudoMovesForPiece(
                        state,
                        row,
                        col
                    ).length;
            }
        }
    }

    return count;
}


/* =========================================================
   28. 킹 안전성 평가
========================================================= */

function kingSafetyScore(
    state,
    color
) {

    const king =
        findKing(state,color);

    if (!king) {
        return -10000;
    }

    let score = 0;

    /*
        킹 주변 아군 폰이 있으면
        보호막으로 평가
    */
    for (
        let dr = -1;
        dr <= 1;
        dr++
    ) {

        for (
            let dc = -1;
            dc <= 1;
            dc++
        ) {

            if (
                dr === 0 &&
                dc === 0
            ) {
                continue;
            }

            const r =
                king.row + dr;

            const c =
                king.col + dc;

            if (!isInside(r,c)) {
                continue;
            }

            const p =
                state.board[r][c];

            if (
                p &&
                p.color === color &&
                p.type === "p"
            ) {
                score += 8;
            }
        }
    }

    return score;
}


/* =========================================================
   29. 위험에 노출된 기물 평가
========================================================= */

function hangingPieceScore(
    state,
    color
) {

    const enemy =
        color === WHITE
            ? BLACK
            : WHITE;

    let score = 0;

    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const p =
                state.board[row][col];

            if (
                !p ||
                p.color !== color ||
                p.type === "k"
            ) {
                continue;
            }


            const attacked =
                isSquareAttacked(
                    state,
                    row,
                    col,
                    enemy
                );


            if (!attacked) {
                continue;
            }


            const defended =
                isSquareAttacked(
                    state,
                    row,
                    col,
                    color
                );


            const penalty =
                Math.round(
                    PIECE_VALUES[p.type] *
                    (
                        defended
                            ? 0.025
                            : 0.07
                    )
                );

            score -= penalty;
        }
    }

    return score;
}


/* =========================================================
   30. AI 이동 정렬
========================================================= */

/*
    좋은 후보를 먼저 탐색하면 Alpha-Beta 가지치기가
    더 많이 일어나므로 모바일에서도 속도가 좋아진다.
*/
function moveOrderingScore(
    state,
    move
) {

    let score = 0;

    const movingPiece =
        state.board
        [move.from.row]
        [move.from.col];

    let captured =
        state.board
        [move.to.row]
        [move.to.col];


    if (move.enPassant) {

        const direction =
            movingPiece.color === WHITE
                ? -1
                : 1;

        captured =
            state.board
            [move.to.row - direction]
            [move.to.col];
    }


    /* 잡는 수 */
    if (captured) {

        score +=
            PIECE_VALUES[captured.type] * 10;

        score -=
            PIECE_VALUES[movingPiece.type];
    }


    /* 프로모션 */
    if (move.promotion) {

        score +=
            PIECE_VALUES[move.promotion] * 6;
    }


    /* 중앙 이동 */
    const centerDistance =
        Math.abs(3.5 - move.to.row) +
        Math.abs(3.5 - move.to.col);

    score +=
        Math.round(
            (7 - centerDistance) * 5
        );


    /* 캐슬링 */
    if (move.castle) {
        score += 160;
    }


    /*
        직접 한 번 적용해서 체크인지 검사
    */
    const test =
        cloneGame(state);

    applyMove(
        test,
        move,
        false
    );

    const enemy =
        move.color === WHITE
            ? BLACK
            : WHITE;

    if (
        isKingInCheck(
            test,
            enemy
        )
    ) {
        score += 220;
    }


    return score;
}


function orderMoves(
    state,
    moves,
    maximizingWhite
) {

    const scored =
        moves.map(move => ({
            move:move,
            score:
                moveOrderingScore(
                    state,
                    move
                )
        }));

    scored.sort(
        (a,b) =>
            b.score - a.score
    );

    return scored.map(
        item => item.move
    );
}


/* =========================================================
   31. AI Minimax + Alpha-Beta Pruning
========================================================= */

const CHECKMATE_SCORE = 999999;


/*
    maximizingWhite:
    true  = 흰색 차례라 점수를 크게
    false = 검은색 AI 차례라 점수를 작게
*/
function minimax(
    state,
    depth,
    alpha,
    beta,
    maximizingWhite,
    ply
) {

    /*
        어려움에서 스마트폰이 지나치게 느려지는 것을
        방지하기 위한 시간 제한
    */
    if (
        performance.now() >
        aiSearchDeadline
    ) {

        aiSearchAborted = true;

        return evaluatePosition(state);
    }


    const color =
        maximizingWhite
            ? WHITE
            : BLACK;

    const legalMoves =
        generateLegalMoves(
            state,
            color
        );


    /* 체크메이트 / 스테일메이트 */
    if (legalMoves.length === 0) {

        if (
            isKingInCheck(
                state,
                color
            )
        ) {

            /*
                흰색이 체크메이트면
                매우 큰 음수 = AI 승리.

                검은색이 체크메이트면
                매우 큰 양수 = 사용자 승리.
            */
            if (color === WHITE) {

                return (
                    -CHECKMATE_SCORE +
                    ply
                );
            }
            else {

                return (
                    CHECKMATE_SCORE -
                    ply
                );
            }
        }

        /* 스테일메이트 */
        return 0;
    }


    if (depth <= 0) {

        return evaluatePosition(
            state
        );
    }


    const orderedMoves =
        orderMoves(
            state,
            legalMoves,
            maximizingWhite
        );


    if (maximizingWhite) {

        let best =
            -Infinity;

        for (
            const move
            of orderedMoves
        ) {

            const child =
                cloneGame(state);

            applyMove(
                child,
                move,
                false
            );

            child.turn = BLACK;

            const score =
                minimax(
                    child,
                    depth - 1,
                    alpha,
                    beta,
                    false,
                    ply + 1
                );

            best =
                Math.max(
                    best,
                    score
                );

            alpha =
                Math.max(
                    alpha,
                    best
                );

            if (beta <= alpha) {
                break;
            }

            if (aiSearchAborted) {
                break;
            }
        }

        return best;
    }
    else {

        let best =
            Infinity;

        for (
            const move
            of orderedMoves
        ) {

            const child =
                cloneGame(state);

            applyMove(
                child,
                move,
                false
            );

            child.turn = WHITE;

            const score =
                minimax(
                    child,
                    depth - 1,
                    alpha,
                    beta,
                    true,
                    ply + 1
                );

            best =
                Math.min(
                    best,
                    score
                );

            beta =
                Math.min(
                    beta,
                    best
                );

            if (beta <= alpha) {
                break;
            }

            if (aiSearchAborted) {
                break;
            }
        }

        return best;
    }
}


/* =========================================================
   32. AI 최적 이동 선택
========================================================= */

function findBestAIMove() {

    const allMoves =
        generateLegalMoves(
            game,
            BLACK
        );

    if (allMoves.length === 0) {
        return null;
    }


    const difficulty =
        difficultySelect.value;


    let depth = 2;
    let timeLimit = 1200;


    if (difficulty === "easy") {
        depth = 1;
        timeLimit = 400;
    }

    if (difficulty === "normal") {
        depth = 2;
        timeLimit = 850;
    }

    if (difficulty === "hard") {
        depth = 3;

        /*
            PC는 약간 더 긴 탐색 허용.
            모바일에서는 계산량 제한.
        */
        const mobile =
            window.innerWidth <= 900;

        timeLimit =
            mobile
                ? 1500
                : 2400;
    }


    aiSearchDeadline =
        performance.now() +
        timeLimit;

    aiSearchAborted = false;


    const orderedMoves =
        orderMoves(
            game,
            allMoves,
            false
        );


    /*
        체크메이트 가능한 수는
        탐색 전에 즉시 찾는다.
    */
    for (
        const move
        of orderedMoves
    ) {

        const test =
            cloneGame(game);

        applyMove(
            test,
            move,
            false
        );

        test.turn = WHITE;

        const whiteMoves =
            generateLegalMoves(
                test,
                WHITE
            );

        if (
            whiteMoves.length === 0 &&
            isKingInCheck(
                test,
                WHITE
            )
        ) {
            return move;
        }
    }


    /*
        쉬움 난이도는 약 28% 확률로
        최선수 대신 다른 합법적인 수를 선택한다.
    */
    if (
        difficulty === "easy" &&
        Math.random() < 0.28
    ) {

        /*
            완전 랜덤보다 조금 자연스럽도록
            정렬된 상위 60% 정도에서 선택
        */
        const candidateCount =
            Math.max(
                2,
                Math.ceil(
                    orderedMoves.length *
                    0.6
                )
            );

        return orderedMoves[
            Math.floor(
                Math.random() *
                candidateCount
            )
        ];
    }


    let bestMove =
        orderedMoves[0];

    let bestScore =
        Infinity;


    /*
        같은 평가의 수가 여러 개이면
        게임이 매번 완전히 똑같지 않도록 후보 저장.
    */
    let bestMoves = [];


    for (
        const move
        of orderedMoves
    ) {

        const child =
            cloneGame(game);

        applyMove(
            child,
            move,
            false
        );

        child.turn = WHITE;


        const score =
            minimax(
                child,

                /*
                    루트에서 이미 1수를 두었으므로
                    남은 탐색 깊이는 depth-1
                */
                depth - 1,

                -Infinity,
                Infinity,

                true,
                1
            );


        if (
            score <
            bestScore - 0.01
        ) {

            bestScore = score;
            bestMove = move;
            bestMoves = [move];
        }
        else if (
            Math.abs(
                score - bestScore
            ) < 0.01
        ) {

            bestMoves.push(move);
        }


        if (aiSearchAborted) {
            break;
        }
    }


    if (bestMoves.length > 0) {

        return bestMoves[
            Math.floor(
                Math.random() *
                bestMoves.length
            )
        ];
    }


    return bestMove;
}


/* =========================================================
   33. AI 실행 예약
========================================================= */

function scheduleAI() {

    if (
        game.gameOver ||
        game.turn !== BLACK
    ) {
        return;
    }


    aiThinking = true;

    selectedSquare = null;
    selectedMoves = [];

    renderAll();


    /*
        AI가 바로 움직이지 않고
        300~700ms 정도 생각하는 듯 보이게 한다.
    */
    const visualDelay =
        300 +
        Math.floor(
            Math.random() * 401
        );


    if (aiTimer) {

        clearTimeout(aiTimer);
    }


    aiTimer = setTimeout(
        function () {

            /*
                먼저 UI를 그린 뒤 계산하도록
                한 번 더 이벤트 루프에 양보한다.
            */
            setTimeout(
                function () {

                    if (
                        game.gameOver ||
                        game.turn !== BLACK
                    ) {

                        aiThinking = false;
                        renderAll();
                        return;
                    }


                    const bestMove =
                        findBestAIMove();


                    aiThinking = false;


                    if (!bestMove) {

                        renderAll();
                        checkGameEnd();
                        return;
                    }


                    makeRealMove(
                        bestMove
                    );

                },
                20
            );

        },
        visualDelay
    );
}


/* =========================================================
   34. 새 게임
========================================================= */

function newGame() {

    if (aiTimer) {
        clearTimeout(aiTimer);
        aiTimer = null;
    }

    game =
        createInitialGame();

    selectedSquare = null;
    selectedMoves = [];

    aiThinking = false;

    pendingPromotion = null;

    resultModal
        .classList
        .remove("show");

    promotionModal
        .classList
        .remove("show");

    renderAll();
}


/* =========================================================
   35. 무르기
========================================================= */

function undoMove() {

    if (
        aiThinking ||
        pendingPromotion ||
        game.undoStack.length === 0
    ) {
        return;
    }


    if (aiTimer) {
        clearTimeout(aiTimer);
        aiTimer = null;
    }


    /*
        사용자 vs AI 게임이므로
        가능하면 사용자와 AI의 최근 한 수씩,
        즉 한 턴 전체를 되돌린다.

        예:
        사용자 e4
        AI e5

        → 무르기
        두 수 모두 취소하고 다시 사용자 차례.
    */

    let snapshot =
        game.undoStack.pop();


    restoreSnapshot(snapshot);


    /*
        복원 후 AI 차례가 되었다는 것은
        바로 직전 사용자의 수까지만 되돌아간 상태이다.

        그 이전 스냅샷이 있으면
        AI 수까지 함께 되돌려 사용자의 차례로 만든다.
    */
    if (
        game.turn === BLACK &&
        game.undoStack.length > 0
    ) {

        snapshot =
            game.undoStack.pop();

        restoreSnapshot(snapshot);
    }


    game.gameOver = false;

    aiThinking = false;

    selectedSquare = null;
    selectedMoves = [];

    resultModal
        .classList
        .remove("show");

    renderAll();
}


/* =========================================================
   36. 결과 팝업
========================================================= */

function showResult(
    title,
    message
) {

    aiThinking = false;

    resultTitle.textContent =
        title;

    resultMessage.textContent =
        message;

    resultModal
        .classList
        .add("show");

    updateStatus();
}


/* =========================================================
   37. 버튼 이벤트
========================================================= */

newGameBtn.addEventListener(
    "click",
    newGame
);

restartBtn.addEventListener(
    "click",
    newGame
);

undoBtn.addEventListener(
    "click",
    undoMove
);


/*
    난이도 변경은 현재 게임에서도 즉시 적용된다.
*/
difficultySelect.addEventListener(
    "change",
    function () {

        if (
            game &&
            !game.gameOver &&
            game.turn === WHITE
        ) {

            statusText.textContent =
                "AI 난이도가 변경되었습니다.";
        }
    }
);


/* =========================================================
   38. 키보드 접근성 보조
========================================================= */

/*
    PC에서 Esc를 누르면
    선택된 말을 취소한다.
*/
document.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Escape") {

            if (
                pendingPromotion ||
                game.gameOver
            ) {
                return;
            }

            selectedSquare = null;
            selectedMoves = [];

            renderBoard();
        }
    }
);


/* =========================================================
   39. 모바일 확대 문제 최소화
========================================================= */

/*
    일부 모바일 환경에서 빠르게 버튼을 두 번 눌렀을 때
    더블 탭 확대가 일어나는 것을 줄인다.

    브라우저의 일반적인 접근성 확대 기능은 막지 않고,
    게임 UI의 연속 터치만 안정화한다.
*/
let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    function (event) {

        const now =
            Date.now();

        /*
            게임판과 버튼에서만
            지나치게 빠른 연속 터치 방지.
        */
        const target =
            event.target;

        const interactive =
            target.closest(
                ".board, button, select"
            );

        if (
            interactive &&
            now - lastTouchEnd <= 250
        ) {

            /*
                preventDefault를 무조건 쓰면
                일부 Safari에서 클릭 이벤트까지 막을 수 있으므로
                touch-action CSS를 주 방식으로 사용하고
                여기서는 시간만 기록한다.
            */
        }

        lastTouchEnd = now;

    },
    {
        passive:true
    }
);


/* =========================================================
   40. 초기 게임 시작
========================================================= */

newGame();
