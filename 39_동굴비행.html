<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐦 동굴비행 챌린지</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:radial-gradient(circle at 20% 10%,#3730a3,#070b18 45%,#020617);
  color:#f8fafc;
  font-family:system-ui,"Noto Sans KR",sans-serif;
  display:grid;
  place-items:center;
  overflow:hidden;
  user-select:none
}
.app{
  width:min(95vw,720px);
  height:min(96vh,840px);
  display:flex;
  flex-direction:column;
  gap:10px
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:8px
}
.tag{
  color:#67e8f9;
  font-size:10px;
  font-weight:900;
  letter-spacing:.2em
}
h1{
  margin:2px 0;
  font-size:clamp(25px,5vw,37px)
}
.hud{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end
}
.pill{
  background:#111936cc;
  border:1px solid #ffffff20;
  border-radius:14px;
  padding:7px 10px;
  text-align:center;
  min-width:62px
}
.pill small{
  display:block;
  color:#94a3b8;
  font-size:9px
}
.pill b{font-size:18px}
.game{
  position:relative;
  flex:1;
  min-height:390px;
  background:linear-gradient(#071126e8,#15214be8);
  border:1px solid #ffffff22;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 25px 60px #0008;
  touch-action:none
}
.game.shake{animation:shake .18s}
@keyframes shake{
  25%{transform:translateX(-4px)}
  50%{transform:translateX(4px)}
  75%{transform:translateX(-2px)}
}
canvas{
  width:100%;
  height:100%;
  display:block
}
.tip{
  text-align:center;
  color:#a9b7cc;
  font-size:12px
}
.over{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  padding:20px;
  background:#030712dc;
  z-index:5
}
.over.hide{display:none}
.card{
  text-align:center;
  width:min(100%,410px);
  padding:27px 23px;
  border:1px solid #ffffff22;
  border-radius:23px;
  background:#101936ef
}
.ico{font-size:55px}
.card h2{
  font-size:27px;
  margin:8px
}
.card p{
  color:#bdc8d9;
  line-height:1.65;
  font-size:14px;
  margin:0 0 20px;
  word-break:keep-all
}
button{
  border:0;
  border-radius:13px;
  padding:13px 28px;
  font-weight:900;
  font-size:15px;
  background:linear-gradient(135deg,#67e8f9,#a7f3d0);
  color:#07111f;
  cursor:pointer
}
.toast{
  position:absolute;
  left:50%;
  top:22%;
  z-index:4;
  transform:translate(-50%,-50%);
  padding:9px 16px;
  border-radius:999px;
  border:1px solid #ffffff33;
  background:#0f172ae8;
  font-weight:900;
  opacity:0;
  transition:.2s;
  pointer-events:none
}
.toast.show{
  opacity:1;
  top:18%
}
@media(max-width:520px){
  .app{width:100%;height:100%;padding:9px}
  .game{border-radius:20px}
  .pill{min-width:54px;padding:6px}
  .pill b{font-size:15px}
}
</style>
</head>
<body>
<main class="app">

<header class="top">
  <div>
    <div class="tag">MINI ARCADE</div>
    <h1>🐦 동굴비행</h1>
  </div>

  <div class="hud">
    <div class="pill"><small>점수</small><b id="score">0</b></div>
    <div class="pill"><small>콤보</small><b id="combo">0</b></div>
    <div class="pill"><small>목숨</small><b id="life">❤️❤️❤️</b></div>
    <div class="pill"><small>최고</small><b id="best">0</b></div>
  </div>
</header>

<section class="game" id="game">
  <canvas id="c"></canvas>

  <div class="toast" id="toast">⭐ +3</div>

  <div class="over" id="over">
    <div class="card">
      <div class="ico" id="ico">🐦</div>
      <h2 id="title">동굴비행</h2>
      <p id="desc">
        클릭·터치·스페이스바로 날갯짓하세요.<br><br>
        기둥 사이가 넓어져 조금 더 쉽게 플레이할 수 있어요.<br>
        기둥을 통과하면 점수, ⭐을 먹으면 보너스!<br>
        <b>목숨은 3개</b>라 한 번 부딪혀도 바로 끝나지 않습니다.
      </p>
      <button id="start">게임 시작</button>
    </div>
  </div>
</section>

<div class="tip">
클릭 · 터치 · SPACE = 날갯짓 · ⭐ 보너스 · ❤️ 3목숨
</div>

</main>

<script>
(()=>{
const C=document.querySelector('#c');
const X=C.getContext('2d');
const G=document.querySelector('#game');
const O=document.querySelector('#over');

const scoreEl=document.querySelector('#score');
const comboEl=document.querySelector('#combo');
const lifeEl=document.querySelector('#life');
const bestEl=document.querySelector('#best');
const toast=document.querySelector('#toast');

const KEY='caveFlightEasyBest';

let W=1,H=1,D=1;
let running=false;
let last=0;
let raf=0;

let bird;
let pipes=[];
let stars=[];
let score=0;
let combo=0;
let lives=3;
let best=0;
let time=0;
let nextPipe=0;
let invincible=0;

try{
  best=Number(localStorage.getItem(KEY))||0;
}catch{}

bestEl.textContent=best;

function resize(){
  const r=G.getBoundingClientRect();
  W=r.width;
  H=r.height;
  D=Math.min(2,devicePixelRatio||1);

  C.width=W*D;
  C.height=H*D;
  X.setTransform(D,0,0,D,0,0);

  draw();
}

function showToast(text){
  toast.textContent=text;
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');

  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>{
    toast.classList.remove('show');
  },650);
}

function shake(){
  G.classList.remove('shake');
  void G.offsetWidth;
  G.classList.add('shake');
}

function updateHud(){
  scoreEl.textContent=score;
  comboEl.textContent=combo;
  lifeEl.textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives);

  if(score>best){
    best=score;
    bestEl.textContent=best;
    try{localStorage.setItem(KEY,best)}catch{}
  }
}

function startGame(){
  bird={
    x:Math.max(70,W*.16),
    y:H*.48,
    w:34,
    h:27,
    vy:0
  };

  pipes=[];
  stars=[];
  score=0;
  combo=0;
  lives=3;
  time=0;
  nextPipe=.8;
  invincible=0;

  running=true;
  updateHud();

  O.classList.add('hide');

  last=performance.now();
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

function flap(){
  if(!running)return;

  // 기존보다 조금 부드러운 날갯짓
  bird.vy=-245;
}

function spawnPipe(){
  // 기존 gap ±65 = 130px보다 넓게
  const gapHalf=Math.max(82,Math.min(98,H*.17));
  const gapY=
    gapHalf+35+
    Math.random()*
    Math.max(20,H-gapHalf*2-105);

  const pipe={
    x:W+10,
    gapY,
    gapHalf,
    w:58,
    passed:false,
    hit:false
  };

  pipes.push(pipe);

  // 기둥 사이에 별을 배치
  if(Math.random()<.72){
    stars.push({
      x:pipe.x+pipe.w/2,
      y:gapY+(Math.random()-.5)*gapHalf*.7,
      r:13,
      got:false
    });
  }
}

function collideRect(a,b){
  return (
    a.x < b.x+b.w &&
    a.x+a.w > b.x &&
    a.y < b.y+b.h &&
    a.y+a.h > b.y
  );
}

function damage(){
  if(invincible>0||!running)return;

  lives--;
  combo=0;
  invincible=1.2;

  showToast('💥 괜찮아요! 목숨 -1');
  shake();
  updateHud();

  // 너무 아래/위에서 부딪혔을 때 가운데로 살짝 복귀
  bird.y=Math.max(55,Math.min(H-90,bird.y));
  bird.vy=-120;

  if(lives<=0){
    endGame();
  }
}

function update(dt){
  time+=dt;

  if(invincible>0){
    invincible-=dt;
  }

  // 기존 720보다 낮춘 중력
  bird.vy+=585*dt;
  bird.y+=bird.vy*dt;

  if(time>=nextPipe){
    // 기존 1.7초보다 여유 있게
    nextPipe=time+1.95;
    spawnPipe();
  }

  // 기존 150보다 느린 속도
  const pipeSpeed=122+Math.min(28,time*.25);

  for(const p of pipes){
    p.x-=pipeSpeed*dt;

    const upper={
      x:p.x,
      y:0,
      w:p.w,
      h:p.gapY-p.gapHalf
    };

    const lower={
      x:p.x,
      y:p.gapY+p.gapHalf,
      w:p.w,
      h:H-(p.gapY+p.gapHalf)
    };

    if(!p.hit && invincible<=0 &&
      (collideRect(bird,upper)||collideRect(bird,lower))
    ){
      p.hit=true;
      damage();
    }

    if(!p.passed && p.x+p.w<bird.x){
      p.passed=true;
      combo++;

      const gain=1+Math.floor(combo/5);
      score+=gain;

      if(combo>0 && combo%5===0){
        showToast(`🔥 ${combo} 콤보! +${gain}`);
      }

      updateHud();
    }
  }

  for(const s of stars){
    s.x-=pipeSpeed*dt;

    if(
      !s.got &&
      Math.hypot(
        bird.x+bird.w/2-s.x,
        bird.y+bird.h/2-s.y
      ) < 27
    ){
      s.got=true;
      score+=3;
      showToast('⭐ 보너스 +3');
      updateHud();
    }
  }

  pipes=pipes.filter(p=>p.x+p.w>-40);
  stars=stars.filter(s=>!s.got&&s.x>-30);

  // 천장/바닥도 즉시 게임오버 대신 목숨 감소
  if(bird.y<0){
    bird.y=1;
    damage();
  }

  if(bird.y+bird.h>H){
    bird.y=H-bird.h-1;
    damage();
  }
}

function draw(){
  X.clearRect(0,0,W,H);

  const bg=X.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#07152e');
  bg.addColorStop(1,'#182454');

  X.fillStyle=bg;
  X.fillRect(0,0,W,H);

  // 별빛 배경
  X.fillStyle='#ffffff30';
  for(let i=0;i<30;i++){
    X.fillRect(
      (i*73)%Math.max(1,W),
      (i*47)%Math.max(1,H),
      i%4===0?2:1,
      i%4===0?2:1
    );
  }

  // 동굴 바닥/천장 장식
  X.fillStyle='#1e293b';
  X.fillRect(0,0,W,14);
  X.fillRect(0,H-14,W,14);

  // 파이프
  for(const p of pipes){
    const topH=p.gapY-p.gapHalf;
    const bottomY=p.gapY+p.gapHalf;

    X.fillStyle='#16a34a';
    X.fillRect(p.x,0,p.w,topH);
    X.fillRect(p.x,bottomY,p.w,H-bottomY);

    X.fillStyle='#4ade80';
    X.fillRect(p.x+p.w-8,0,8,topH);
    X.fillRect(p.x+p.w-8,bottomY,8,H-bottomY);

    X.fillStyle='#22c55e';
    X.fillRect(p.x-5,topH-16,p.w+10,16);
    X.fillRect(p.x-5,bottomY,p.w+10,16);
  }

  // 별
  for(const s of stars){
    X.font='25px sans-serif';
    X.textAlign='center';
    X.fillText('⭐',s.x,s.y+9);
  }

  // 새
  X.save();
  X.globalAlpha=invincible>0 && Math.floor(invincible*12)%2===0 ? .35 : 1;
  X.font='31px sans-serif';
  X.textAlign='left';
  X.fillText('🐦',bird?.x||80,(bird?.y||H/2)+25);
  X.restore();

  // 시작 직후 방향 안내
  if(running && time<2){
    X.fillStyle='#ffffffcc';
    X.font='bold 13px sans-serif';
    X.textAlign='center';
    X.fillText('터치하면 위로 날아요!',W/2,H*.18);
  }
}

function loop(t){
  if(!running)return;

  const dt=Math.min(.032,(t-last)/1000);
  last=t;

  update(dt);
  draw();

  if(running){
    raf=requestAnimationFrame(loop);
  }
}

function endGame(){
  if(!running)return;

  running=false;
  cancelAnimationFrame(raf);

  document.querySelector('#ico').textContent='🐦';
  document.querySelector('#title').textContent=`${score}점!`;

  let msg='조금만 더 연습하면 기록을 깰 수 있어요!';

  if(score>=10)msg='멋져요! 동굴 비행에 익숙해지고 있어요.';
  if(score>=20)msg='대단해요! 기둥 사이를 아주 안정적으로 통과했어요.';
  if(score>=35)msg='🏆 동굴비행 마스터! 정말 훌륭한 기록이에요.';

  document.querySelector('#desc').innerHTML=
    `${msg}<br><br>`+
    `최종 점수 <b>${score}</b>점<br>`+
    `최고 기록 <b>${best}</b>점`;

  document.querySelector('#start').textContent='다시 날기';
  O.classList.remove('hide');
}

G.addEventListener('pointerdown',e=>{
  if(!running)return;
  e.preventDefault();
  flap();
});

addEventListener('keydown',e=>{
  if(!running)return;

  if(
    e.code==='Space' ||
    e.key==='ArrowUp' ||
    e.key==='w' ||
    e.key==='W'
  ){
    e.preventDefault();
    flap();
  }
});

document.querySelector('#start').onclick=e=>{
  e.stopPropagation();
  startGame();
};

addEventListener('resize',resize);

resize();
})();
</script>
</body>
</html>
