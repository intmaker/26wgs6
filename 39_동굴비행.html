<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🐦 동굴비행</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(circle at 20% 10%,#3730a3,#070b18 45%,#020617);color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;display:grid;place-items:center;overflow:hidden;user-select:none}.app{width:min(94vw,700px);height:min(94vh,820px);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;align-items:end}.tag{color:#67e8f9;font-size:10px;font-weight:900;letter-spacing:.2em}h1{margin:2px 0;font-size:clamp(25px,5vw,37px)}.hud{display:flex;gap:7px}.pill{background:#111936cc;border:1px solid #ffffff20;border-radius:14px;padding:7px 12px;text-align:center;min-width:69px}.pill small{display:block;color:#94a3b8;font-size:9px}.pill b{font-size:20px}.game{position:relative;flex:1;min-height:380px;background:linear-gradient(#071126e8,#15214be8);border:1px solid #ffffff22;border-radius:24px;overflow:hidden;box-shadow:0 25px 60px #0008;touch-action:none}canvas{width:100%;height:100%;display:block}.tip{text-align:center;color:#a9b7cc;font-size:12px}.over{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:#030712dc;z-index:4}.over.hide{display:none}.card{text-align:center;max-width:390px;padding:27px 23px;border:1px solid #ffffff22;border-radius:23px;background:#101936e8}.ico{font-size:55px}.card h2{font-size:27px;margin:8px}.card p{color:#bdc8d9;line-height:1.65;font-size:14px;margin:0 0 20px;word-break:keep-all}button{border:0;border-radius:13px;padding:13px 28px;font-weight:900;font-size:15px;background:linear-gradient(135deg,#67e8f9,#a7f3d0);color:#07111f;cursor:pointer}@media(max-width:520px){.app{width:100%;height:100%;padding:10px}.game{border-radius:20px}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">MINI ARCADE</div><h1>🐦 동굴비행</h1></div><div class="hud"><div class="pill"><small>점수</small><b id="score">0</b></div><div class="pill"><small>최고</small><b id="best">0</b></div></div></header><section class="game" id="game"><canvas id="c"></canvas><div class="over" id="over"><div class="card"><div class="ico">🐦</div><h2 id="title">동굴비행</h2><p id="desc">날갯짓으로 동굴 기둥 사이를 통과하세요<br>클릭·터치 또는 방향키로 플레이할 수 있어요.</p><button id="start">게임 시작</button></div></div></section><div class="tip">날갯짓으로 동굴 기둥 사이를 통과하세요 · 방향키 / 클릭 / 터치</div></main><script>
(()=>{const KIND='flap',KEY='g39',C=document.querySelector('#c'),x=C.getContext('2d'),G=document.querySelector('#game'),O=document.querySelector('#over'),SE=document.querySelector('#score'),BE=document.querySelector('#best');let W,H,d=1,on=0,score=0,best=+(localStorage[KEY]||0),t0=0,S={p:{x:0,y:0,w:0,h:0},items:[],grid:[]},keys={};BE.textContent=best;const R=(a,b)=>a+Math.random()*(b-a),hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function resize(){let r=G.getBoundingClientRect();W=r.width;H=r.height;d=Math.min(2,devicePixelRatio||1);C.width=W*d;C.height=H*d;x.setTransform(d,0,0,d,0,0);if(on)draw(0)}function add(n=1){score+=n;SE.textContent=score;if(score>best){BE.textContent=best=score;localStorage[KEY]=best}}function end(msg='다시 도전해 보세요!'){if(!on)return;on=0;document.querySelector('#title').textContent=`${score}점!`;document.querySelector('#desc').innerHTML=msg;document.querySelector('#start').textContent='다시 하기';O.classList.remove('hide')}
function init(){score=0;SE.textContent=0;S={time:0,p:{x:W/2-25,y:H-70,w:50,h:18},items:[],grid:[],sel:null};if(KIND==='break'){for(let j=0;j<5;j++)for(let i=0;i<8;i++)S.items.push({x:12+i*(W-24)/8,y:45+j*25,w:(W-24)/8-4,h:18});S.ball={x:W/2,y:H-100,vx:150,vy:-190,r:7}}if(KIND==='snake'){S.sn=[{x:8,y:10}];S.dir={x:1,y:0};food()}if(['mines','lights','pipes','match','laser'].includes(KIND))gridInit();if(KIND==='dodge')S.p={x:W/2-22,y:H-85,w:44,h:65};if(KIND==='lander')S.p={x:W/2-18,y:50,w:36,h:40,vy:0};if(KIND==='balance')S.ang=0;if(KIND==='orbit')S.a=0;if(KIND==='flap')S.p={x:90,y:H/2,w:30,h:24,vy:0};if(KIND==='parking')S.p={x:30,y:H-80,w:42,h:65,a:0};on=1;O.classList.add('hide');t0=performance.now();requestAnimationFrame(loop)}
function gridInit(){let n=KIND==='mines'?8:5;S.n=n;for(let i=0;i<n*n;i++)S.grid.push({v:KIND==='lights'?Math.random()<.5?1:0:Math.floor(R(0,5)),open:0,mine:0});if(KIND==='mines'){for(let k=0;k<9;k++){let q=Math.floor(R(0,n*n));S.grid[q].mine=1}}}function food(){S.food={x:Math.floor(R(0,18)),y:Math.floor(R(0,22))}}
function press(px,py){if(!on)return;if(KIND==='meter'){let z=(Math.sin(S.time*4)+1)/2;if(z>.43&&z<.57)add(3);else if(z>.3&&z<.7)add();else end('타이밍 바가 초록색일 때 눌러보세요.')}else if(KIND==='aim'){let z=Math.abs((Math.sin(S.time*2)*W*.35+W/2)-W/2);add(z<20?5:z<60?2:1)}else if(KIND==='dial'){let v=Math.floor(((S.time*45)%100));let target=(score*37+17)%100;if(Math.abs(v-target)<6)add();else end(`목표 숫자 ${target} 근처에서 멈춰야 해요.`)}else if(KIND==='flap')S.p.vy=-280;else if(KIND==='orbit'){if(Math.abs(Math.sin(S.a))>.82)add();else end('행성과 가까워지는 순간 이동하세요.')}else if(['mines','lights','pipes','match','laser'].includes(KIND)){let n=S.n,i=Math.floor(px/W*n),j=Math.floor(py/H*n),q=j*n+i;if(q<0||q>=n*n)return;if(KIND==='mines'){let c=S.grid[q];if(c.mine)return end('지뢰를 밟았어요!');if(!c.open){c.open=1;add();if(score>=n*n-9)end('모든 안전 칸을 찾았습니다!')}}else if(KIND==='lights'){[q,q-1,q+1,q-n,q+n].forEach(v=>{if(v>=0&&v<n*n)S.grid[v].v^=1});add();if(S.grid.every(c=>!c.v))end('모든 전구를 껐어요!')}else if(KIND==='match'){if(S.sel==null)S.sel=q;else{if(Math.abs(S.sel-q)==1||Math.abs(S.sel-q)==n){let z=S.grid[S.sel].v;S.grid[S.sel].v=S.grid[q].v;S.grid[q].v=z;let gain=matches();if(gain)add(gain);else{z=S.grid[S.sel].v;S.grid[S.sel].v=S.grid[q].v;S.grid[q].v=z}}S.sel=null}}else{S.grid[q].v=(S.grid[q].v+1)%4;add();if(score>=15)end('퍼즐을 완성했습니다!')}}else if(KIND==='slice'){for(let a of S.items)if(Math.hypot(px-a.x,py-a.y)<35&&!a.cut){a.cut=1;a.bomb?end('폭탄은 베면 안 돼요!'):add()}}else if(KIND==='hockey'){S.ball.vx+=(S.ball.x-px)*2;S.ball.vy=-Math.abs(S.ball.vy)-80}}
function matches(){let n=S.n,c=0;for(let j=0;j<n;j++)for(let i=0;i<n-2;i++){let q=j*n+i;if(S.grid[q].v===S.grid[q+1].v&&S.grid[q].v===S.grid[q+2].v)c++}return c}
function update(dt){S.time+=dt;let speed=210;if(keys.ArrowLeft||keys.a)S.p.x-=speed*dt;if(keys.ArrowRight||keys.d)S.p.x+=speed*dt;if(keys.ArrowUp||keys.w)S.p.y-=speed*dt;if(keys.ArrowDown||keys.s)S.p.y+=speed*dt;S.p.x=Math.max(0,Math.min(W-S.p.w,S.p.x));S.p.y=Math.max(0,Math.min(H-S.p.h,S.p.y));
if(['dodge','catch','slice'].includes(KIND)){if(S.time>(S.next||0)){S.next=S.time+Math.max(.35,1-score*.015);S.items.push({x:R(15,W-30),y:-30,w:KIND==='dodge'?42:28,h:KIND==='dodge'?55:28,vy:R(130,230),bomb:KIND==='slice'&&Math.random()<.2})}S.items.forEach(a=>{a.y+=a.vy*dt;if(KIND==='dodge'&&hit(S.p,a))end('장애물에 부딪혔어요!');if(KIND==='catch'&&hit(S.p,a)){a.got=1;add()}if(a.y>H){if(KIND==='dodge')add();if(KIND==='catch'&&!a.got)end('공을 놓쳤어요!')}});S.items=S.items.filter(a=>a.y<H+50&&!a.got)}
if(KIND==='break'){let b=S.ball;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<7||b.x>W-7)b.vx*=-1;if(b.y<7)b.vy=Math.abs(b.vy);if(hit({x:b.x-7,y:b.y-7,w:14,h:14},S.p))b.vy=-Math.abs(b.vy);for(let a of S.items)if(!a.dead&&hit({x:b.x-7,y:b.y-7,w:14,h:14},a)){a.dead=1;b.vy*=-1;add()}if(b.y>H)end('공을 놓쳤어요!');if(S.items.every(a=>a.dead))end('모든 벽돌을 깼습니다!')}
if(KIND==='snake'&&S.time>(S.next||0)){S.next=S.time+.13;let h=S.sn[0],q={x:h.x+S.dir.x,y:h.y+S.dir.y};if(q.x<0||q.x>=18||q.y<0||q.y>=22||S.sn.some(a=>a.x===q.x&&a.y===q.y))return end('꼬리나 벽에 부딪혔어요!');S.sn.unshift(q);if(q.x===S.food.x&&q.y===S.food.y){add();food()}else S.sn.pop()}
if(KIND==='flap'){S.p.vy+=720*dt;S.p.y+=S.p.vy*dt;if(S.time>(S.next||0)){S.next=S.time+1.7;S.items.push({x:W,gap:R(100,H-100),w:55})}S.items.forEach(a=>a.x-=150*dt);for(let a of S.items)if(S.p.x+S.p.w>a.x&&S.p.x<a.x+a.w&&(S.p.y>a.gap+65||S.p.y+S.p.h<a.gap-65))end('동굴 기둥에 부딪혔어요!');S.items=S.items.filter(a=>{if(a.x+a.w<0){add();return 0}return 1});if(S.p.y<0||S.p.y>H)end('비행 고도를 놓쳤어요!')}
if(KIND==='orbit')S.a+=dt*(2+score*.08);if(KIND==='lander'){S.p.vy+=(keys.ArrowUp||keys.w?-120:90)*dt;S.p.y+=S.p.vy*dt;if(S.p.y+S.p.h>H-25){S.p.vy<75?end('부드러운 착륙 성공!'):end('착륙 속도가 너무 빨랐어요!')}}if(KIND==='balance'){S.ang+=(Math.random()-.5)*dt*2+(keys.ArrowLeft?-.8:0)+(keys.ArrowRight?.8:0);S.ang*=.995;if(Math.abs(S.ang)>1.1)end('화물이 균형을 잃었어요!');if(Math.floor(S.time)>score)add()}
if(KIND==='jump'){S.p.vy=(S.p.vy||0)+700*dt;S.p.y+=S.p.vy*dt;if(S.p.y>H-45){S.p.y=H-45;S.p.vy=-390;add()}if(S.p.y<80){S.p.y=80;add()}}if(KIND==='parking'&&hit(S.p,{x:W-90,y:35,w:70,h:110}))end('주차 성공!')}
function draw(){x.clearRect(0,0,W,H);let bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#07152e');bg.addColorStop(1,'#182454');x.fillStyle=bg;x.fillRect(0,0,W,H);x.fillStyle='#ffffff15';for(let i=0;i<25;i++)x.fillRect(i*73%W,i*47%H,2,2);if(['mines','lights','pipes','match','laser'].includes(KIND)){let n=S.n||5,cw=W/n,ch=H/n;S.grid.forEach((c,i)=>{let px=i%n*cw,py=Math.floor(i/n)*ch;x.fillStyle=KIND==='lights'?(c.v?'#fde047':'#172554'):KIND==='mines'?(c.open?'#334155':'#64748b'):colors[c.v%colors.length];x.strokeStyle='#ffffff30';x.fillRect(px+3,py+3,cw-6,ch-6);x.strokeRect(px+3,py+3,cw-6,ch-6);if(KIND==='mines'&&c.open){let count=0;x.fillStyle='white';x.font='bold 18px sans-serif';x.fillText(count,px+cw/2,py+ch/2)}});return}x.fillStyle='#67e8f9';x.fillRect(S.p.x,S.p.y,S.p.w,S.p.h);if(KIND==='break'){S.items.forEach(a=>{if(!a.dead){x.fillStyle='#fb7185';x.fillRect(a.x,a.y,a.w,a.h)}});x.beginPath();x.arc(S.ball.x,S.ball.y,7,0,7);x.fill()}if(['dodge','catch','slice'].includes(KIND)){S.items.forEach(a=>{x.font='28px sans-serif';x.fillText(a.bomb?'💣':KIND==='dodge'?'🚧':KIND==='catch'?'⚽':'🍉',a.x,a.y+26)})}if(KIND==='meter'){x.fillStyle='#334155';x.fillRect(W*.1,H*.48,W*.8,28);x.fillStyle='#22c55e';x.fillRect(W*.43,H*.48,W*.14,28);x.fillStyle='white';x.fillRect(W*.1+(Math.sin(S.time*4)+1)/2*W*.8,H*.45,5,50)}if(KIND==='aim'){let q=Math.sin(S.time*2)*W*.35+W/2;x.strokeStyle='#fb7185';x.lineWidth=8;x.beginPath();x.arc(q,H/2,45,0,7);x.stroke();x.fillStyle='white';x.beginPath();x.arc(W/2,H-70,6,0,7);x.fill()}if(KIND==='dial'){x.font='bold 70px monospace';x.textAlign='center';x.fillStyle='white';x.fillText(Math.floor(S.time*45%100).toString().padStart(2,'0'),W/2,H/2);x.font='18px sans-serif';x.fillText('목표 '+((score*37+17)%100),W/2,H/2+50)}if(KIND==='snake'){let z=W/18;x.fillStyle='#34d399';S.sn.forEach(a=>x.fillRect(a.x*z,a.y*z,z-2,z-2));x.fillStyle='#fbbf24';x.fillRect(S.food.x*z,S.food.y*z,z-2,z-2)}if(KIND==='flap'){x.font='28px sans-serif';x.fillText('🐦',S.p.x,S.p.y+24);x.fillStyle='#34d399';S.items.forEach(a=>{x.fillRect(a.x,0,a.w,a.gap-65);x.fillRect(a.x,a.gap+65,a.w,H)})}if(KIND==='orbit'){let qx=W/2+Math.cos(S.a)*W*.3,qy=H/2+Math.sin(S.a)*130;x.font='45px sans-serif';x.fillText('🪐',W/2-25,H/2+15);x.font='25px sans-serif';x.fillText('🚀',qx,qy)}if(KIND==='balance'){x.save();x.translate(W/2,H/2);x.rotate(S.ang);x.fillStyle='#fbbf24';x.fillRect(-W*.3,-8,W*.6,16);x.fillStyle='#fb7185';x.fillRect(-20,-48,40,40);x.restore()}if(KIND==='lander'){x.font='35px sans-serif';x.fillText('🚀',S.p.x,S.p.y+35);x.fillStyle='#94a3b8';x.fillRect(0,H-25,W,25)}if(KIND==='parking'){x.strokeStyle='#f8fafc';x.lineWidth=4;x.strokeRect(W-90,35,70,110);x.font='38px sans-serif';x.fillText('🚗',S.p.x,S.p.y+38)}if(['pipes','laser'].includes(KIND)){} }
const colors=['#67e8f9','#a78bfa','#fb7185','#fbbf24','#34d399'];function loop(t){if(!on)return;let dt=Math.min(.032,(t-t0)/1000);t0=t;update(dt);draw();requestAnimationFrame(loop)}G.addEventListener('pointerdown',e=>{let r=C.getBoundingClientRect();press(e.clientX-r.left,e.clientY-r.top)});addEventListener('keydown',e=>{keys[e.key]=1;if(KIND==='snake'){if(e.key==='ArrowLeft'&&S.dir.x!==1)S.dir={x:-1,y:0};if(e.key==='ArrowRight'&&S.dir.x!==-1)S.dir={x:1,y:0};if(e.key==='ArrowUp'&&S.dir.y!==1)S.dir={x:0,y:-1};if(e.key==='ArrowDown'&&S.dir.y!==-1)S.dir={x:0,y:1}}if(e.code==='Space')press(W/2,H/2)});addEventListener('keyup',e=>keys[e.key]=0);document.querySelector('#start').onclick=e=>{e.stopPropagation();init()};addEventListener('resize',resize);resize()})();
</script></body></html>
