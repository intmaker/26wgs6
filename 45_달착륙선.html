<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🚀 달 착륙선</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 70% 15%,#312e81,#090d21 48%,#02040b);color:#fff;font-family:system-ui,"Noto Sans KR",sans-serif;user-select:none}.app{width:min(94vw,700px);height:min(95vh,840px);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;align-items:end}.tag{font-size:10px;letter-spacing:.2em;color:#a5b4fc;font-weight:900}h1{margin:2px 0;font-size:clamp(26px,5vw,38px)}.stats{display:flex;gap:7px}.stat{min-width:67px;padding:8px;text-align:center;border:1px solid #ffffff22;border-radius:14px;background:#111735cc}.stat small{display:block;color:#a5b4fc;font-size:9px}.stat b{font-size:18px}.game{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff22;border-radius:25px;background:#080d20;box-shadow:0 25px 70px #0009;touch-action:none}canvas{display:block;width:100%;height:100%}.pad{position:absolute;left:50%;bottom:16px;z-index:3;transform:translateX(-50%);display:flex;gap:7px}.pad button{width:58px;height:48px;padding:0;border:1px solid #ffffff42;border-radius:11px;color:#fff;background:#171f43c7;font-size:21px;touch-action:none}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#050918e8}.overlay.hide{display:none}.card{max-width:390px;padding:28px 24px;text-align:center;border:1px solid #ffffff24;border-radius:23px;background:#151c40}.ico{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{color:#dbeafe;font-size:14px;line-height:1.7}.good{color:#86efac}.bad{color:#fda4af}.card>button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#a5b4fc,#67e8f9);color:#10153c;font-weight:900;font-size:15px;cursor:pointer}.tip{text-align:center;color:#a5b4fc;font-size:12px}@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.game{border-radius:20px}}
</style></head><body><main class="app"><header class="top"><div><div class="tag">LUNAR LANDER</div><h1>🚀 달 착륙선</h1></div><div class="stats"><div class="stat"><small>수직속도</small><b id="speed">0</b></div><div class="stat"><small>연료</small><b id="fuel">100</b></div><div class="stat"><small>점수</small><b id="score">0</b></div></div></header><section class="game" id="game"><canvas id="canvas"></canvas><div class="pad"><button data-k="ArrowLeft">◀</button><button data-k="ArrowUp">🔥</button><button data-k="ArrowRight">▶</button></div><div class="overlay" id="over"><div class="card"><div class="ico" id="ico">🚀</div><h2 id="title">달에 부드럽게 착륙하세요</h2><p id="desc">중력 때문에 착륙선은 계속 빨라집니다.<br><b>↑</b> 주 엔진과 <b>← →</b> 측면 추진기를 사용하세요.<br><span class="good">수직속도 45 이하</span>로 초록 착륙장에 내려야 합니다.</p><button id="start">착륙 시작</button></div></div></section><div class="tip">↑ 주 엔진 · ←→ 좌우 추진 · 연료를 아껴 착륙</div></main><script>
(()=>{const C=document.querySelector('#canvas'),X=C.getContext('2d'),G=document.querySelector('#game'),O=document.querySelector('#over'),VE=document.querySelector('#speed'),FE=document.querySelector('#fuel'),SE=document.querySelector('#score');let W,H,D=1,on=false,last=0,ship,pad,keys={},stars=[];
function resize(){const r=G.getBoundingClientRect();D=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);pad={x:W*.62,y:H-45,w:Math.min(125,W*.23),h:8};stars=Array.from({length:55},(_,i)=>({x:i*97%W,y:i*53%H,s:1+i%2}));draw()}
function start(){ship={x:W*.25,y:65,vx:35,vy:0,w:34,h:44,fuel:100};on=true;O.classList.add('hide');last=performance.now();requestAnimationFrame(loop)}function update(dt){ship.vy+=36*dt;if(ship.fuel>0){if(keys.ArrowUp){ship.vy-=92*dt;ship.fuel-=18*dt}if(keys.ArrowLeft){ship.vx-=48*dt;ship.fuel-=7*dt}if(keys.ArrowRight){ship.vx+=48*dt;ship.fuel-=7*dt}}ship.fuel=Math.max(0,ship.fuel);ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;if(ship.x<0){ship.x=0;ship.vx=Math.abs(ship.vx)*.5}if(ship.x+ship.w>W){ship.x=W-ship.w;ship.vx=-Math.abs(ship.vx)*.5}VE.textContent=Math.round(ship.vy);VE.className=ship.vy<=45?'good':'bad';FE.textContent=Math.round(ship.fuel);if(ship.y+ship.h>=H-42){const centered=ship.x+ship.w>pad.x&&ship.x<pad.x+pad.w,safe=ship.vy<=45&&Math.abs(ship.vx)<=35&&centered;ship.y=H-42-ship.h;finish(safe,centered)}if(ship.y>H+60)finish(false,false)}
function draw(){X.clearRect(0,0,W,H);let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05091b');g.addColorStop(1,'#171a35');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle='#fff';stars.forEach(s=>X.fillRect(s.x,s.y,s.s,s.s));X.fillStyle='#4b5563';X.beginPath();X.moveTo(0,H-35);for(let x=0;x<=W;x+=35)X.lineTo(x,H-35-Math.sin(x*.037)*12-Math.random()*2);X.lineTo(W,H);X.lineTo(0,H);X.fill();X.fillStyle='#22c55e';X.shadowColor='#22c55e';X.shadowBlur=15;X.fillRect(pad.x,pad.y,pad.w,pad.h);X.shadowBlur=0;if(ship){X.save();X.translate(ship.x+ship.w/2,ship.y+ship.h/2);X.font='42px sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText('🚀',0,0);if(on&&keys.ArrowUp&&ship.fuel>0){X.font='25px sans-serif';X.fillText('🔥',0,33)}X.restore()}}
function finish(ok,centered){if(!on)return;on=false;const score=ok?Math.max(100,Math.round(1000+ship.fuel*8-ship.vy*8-Math.abs(ship.vx)*5)):0;SE.textContent=score;document.querySelector('#ico').textContent=ok?'🏆':'💥';document.querySelector('#title').textContent=ok?'착륙 성공!':'착륙 실패';document.querySelector('#desc').innerHTML=ok?`수직 ${Math.round(ship.vy)}, 수평 ${Math.round(Math.abs(ship.vx))}의 속도로 착륙했어요.<br>남은 연료 ${Math.round(ship.fuel)}% · ${score}점`:centered?'착륙장에는 도착했지만 속도가 너무 빨랐어요.':'초록색 착륙장 중앙을 목표로 조종하세요.';document.querySelector('#start').textContent='다시 착륙';setTimeout(()=>O.classList.remove('hide'),450)}function loop(t){if(!on)return;const dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){keys[e.key]=true;e.preventDefault()}});addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{keys[k]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[k]=false});document.querySelector('#start').onclick=start;addEventListener('resize',resize);resize()})();</script></body></html>
