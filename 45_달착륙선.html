<section class="game" id="game">

</div>

<script>
(()=>{
const C=document.querySelector('#canvas');
const X=C.getContext('2d');
const G=document.querySelector('#game');
const O=document.querySelector('#over');

const VE=document.querySelector('#speed');
const FE=document.querySelector('#fuel');
const SE=document.querySelector('#score');
const ST=document.querySelector('#stage');
const toast=document.querySelector('#toast');

let W,H,D=1;
let on=false;
let last=0;

let ship;
let pad;
let keys={};
let stars=[];
let skyStars=[];
let meteors=[];
let particles=[];
let craters=[];

let score=0;
let stage=1;
let difficulty=1;

const difficultyNames=['쉬움','보통','어려움'];

function resize(){
  const r=G.getBoundingClientRect();

  D=Math.min(2,devicePixelRatio||1);
  W=r.width;
  H=r.height;

  C.width=W*D;
  C.height=H*D;

  X.setTransform(D,0,0,D,0,0);

  makeWorld();
  draw();
}

function makeWorld(){
  pad={
    x:W*(.58+Math.min(stage,5)*.025),
    y:H-44,
    w:Math.max(85,Math.min(135,W*.23)),
    h:8
  };

  skyStars=Array.from({length:70},(_,i)=>({
    x:(i*97)%W,
    y:(i*53)%Math.max(100,H-70),
    s:1+(i%3===0?1:0),
    a:.3+(i%7)/10
  }));

  craters=[
    {x:W*.17,r:18},
    {x:W*.39,r:11},
    {x:W*.78,r:23},
    {x:W*.91,r:13}
  ];

  stars=[
    {x:W*.24,y:H*.28,taken:false},
    {x:W*.50,y:H*.52,taken:false},
    {x:W*.74,y:H*.31,taken:false}
  ];

  meteors=[];

  if(stage>=2){
    meteors.push({
      x:W*.88,
      y:H*.25,
      vx:-38-stage*5,
      vy:13,
      r:11
    });
  }

  if(stage>=3){
    meteors.push({
      x:W*.12,
      y:H*.45,
      vx:46+stage*4,
      vy:8,
      r:9
    });
  }

  if(stage>=5){
    meteors.push({
      x:W*.70,
      y:H*.15,
      vx:-28,
      vy:30,
      r:8
    });
  }
}

function start(){
  makeWorld();

  score=0;
  particles=[];

  ship={
    x:W*.18,
    y:58,
    vx:30+difficulty*8,
    vy:0,
    w:36,
    h:46,
    fuel:100,
    alive:true
  };

  VE.textContent='0';
  FE.textContent='100';
  SE.textContent='0';
  ST.textContent=stage;

  on=true;
  O.classList.add('hide');

  last=performance.now();
  requestAnimationFrame(loop);
}

function showToast(text){
  toast.textContent=text;

  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');

  clearTimeout(showToast.timer);

  showToast.timer=setTimeout(()=>{
    toast.classList.remove('show');
  },700);
}

function burst(x,y,color='#fde047',count=14){
  for(let i=0;i<count;i++){
    particles.push({
      x,
      y,
      vx:(Math.random()-.5)*150,
      vy:(Math.random()-.5)*150,
      life:1,
      color,
      size:2+Math.random()*4
    });
  }
}

function meteorHit(){
  G.classList.remove('shake');
  void G.offsetWidth;
  G.classList.add('shake');

  burst(
    ship.x+ship.w/2,
    ship.y+ship.h/2,
    '#fb7185',
    20
  );

  finish(false,'운석 충돌!');
}

function update(dt){
  const gravity=34+difficulty*5+stage*1.2;

  ship.vy+=gravity*dt;

  if(ship.fuel>0){
    if(keys.ArrowUp){
      ship.vy-=(94+difficulty*4)*dt;
      ship.fuel-=18*dt;
    }

    if(keys.ArrowLeft){
      ship.vx-=52*dt;
      ship.fuel-=7*dt;
    }

    if(keys.ArrowRight){
      ship.vx+=52*dt;
      ship.fuel-=7*dt;
    }
  }

  ship.fuel=Math.max(0,ship.fuel);

  ship.vx*=Math.pow(.992,dt*60);

  ship.x+=ship.vx*dt;
  ship.y+=ship.vy*dt;

  if(ship.x<0){
    ship.x=0;
    ship.vx=Math.abs(ship.vx)*.55;
  }

  if(ship.x+ship.w>W){
    ship.x=W-ship.w;
    ship.vx=-Math.abs(ship.vx)*.55;
  }

  const absVy=Math.abs(ship.vy);

  VE.textContent=Math.round(ship.vy);

  if(absVy<=30){
    VE.className='good';
  }else if(absVy<=45){
    VE.className='warn';
  }else{
    VE.className='bad';
  }

  FE.textContent=Math.round(ship.fuel);

  for(const m of meteors){
    m.x+=m.vx*dt;
    m.y+=m.vy*dt;

    if(m.x<-30) m.x=W+30;
    if(m.x>W+30) m.x=-30;

    if(m.y>H-80){
      m.y=40;
    }

    const dx=
      ship.x+ship.w/2-m.x;

    const dy=
      ship.y+ship.h/2-m.y;

    if(
      Math.hypot(dx,dy)<
      m.r+ship.w*.36
    ){
      meteorHit();
      return;
    }
  }

  for(const s of stars){
    if(s.taken) continue;

    const dx=
      ship.x+ship.w/2-s.x;

    const dy=
      ship.y+ship.h/2-s.y;

    if(Math.hypot(dx,dy)<27){
      s.taken=true;

      score+=100;
      SE.textContent=score;

      showToast('⭐ 우주별 +100');
      burst(s.x,s.y);
    }
  }

  for(const p of particles){
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vx*=.98;
    p.vy*=.98;
    p.life-=dt*1.6;
  }

  particles=
    particles.filter(p=>p.life>0);

  if(ship.y+ship.h>=H-39){
    const shipCenter=
      ship.x+ship.w/2;

    const onPad=
      shipCenter>
        pad.x+ship.w*.15 &&
      shipCenter<
        pad.x+pad.w-ship.w*.15;

    const safeVertical=
      ship.vy<=45;

    const safeHorizontal=
      Math.abs(ship.vx)<=32;

    ship.y=H-39-ship.h;

    finish(
      onPad &&
      safeVertical &&
      safeHorizontal,
      onPad
        ? '착륙 속도가 너무 빠릅니다!'
        : '착륙장을 벗어났습니다!'
    );
  }
}

function drawBackground(){
  const g=X.createLinearGradient(0,0,0,H);

  g.addColorStop(0,'#05091b');
  g.addColorStop(.65,'#10132b');
  g.addColorStop(1,'#24243b');

  X.fillStyle=g;
  X.fillRect(0,0,W,H);

  X.fillStyle='#fff';

  for(const s of skyStars){
    X.globalAlpha=s.a;
    X.fillRect(s.x,s.y,s.s,s.s);
  }

  X.globalAlpha=1;

  X.fillStyle='#e5e7eb';
  X.beginPath();
  X.arc(
    W*.82,
    H*.14,
    Math.min(45,W*.075),
    0,
    Math.PI*2
  );
  X.fill();

  X.fillStyle='#cbd5e1';

  X.beginPath();
  X.arc(
    W*.80,
    H*.13,
    8,
    0,
    Math.PI*2
  );
  X.fill();

  X.beginPath();
  X.arc(
    W*.85,
    H*.16,
    5,
    0,
    Math.PI*2
  );
  X.fill();
}

function drawGround(){
  X.fillStyle='#4b5563';

  X.beginPath();
  X.moveTo(0,H-34);

  for(let x=0;x<=W;x+=25){
    const y=
      H-34-
      Math.sin(x*.035)*8-
      Math.cos(x*.08)*4;

    X.lineTo(x,y);
  }

  X.lineTo(W,H);
  X.lineTo(0,H);
  X.fill();

  X.fillStyle='#374151';

  for(const c of craters){
    X.beginPath();
    X.ellipse(
      c.x,
      H-21,
      c.r,
      c.r*.35,
      0,
      0,
      Math.PI*2
    );
    X.fill();
  }
}

function drawPad(){
  X.shadowColor='#22c55e';
  X.shadowBlur=18;

  X.fillStyle='#22c55e';
  X.fillRect(
    pad.x,
    pad.y,
    pad.w,
    pad.h
  );

  X.shadowBlur=0;

  X.strokeStyle='#86efac';
  X.lineWidth=2;
  X.strokeRect(
    pad.x,
    pad.y-5,
    pad.w,
    pad.h+10
  );

  X.fillStyle='#bbf7d0';
  X.font='bold 10px sans-serif';
  X.textAlign='center';

  X.fillText(
    'LAND HERE',
    pad.x+pad.w/2,
    pad.y-10
  );
}

function drawStars(){
  for(const s of stars){
    if(s.taken) continue;

    const pulse=
      1+
      Math.sin(
        performance.now()/180
      )*.14;

    X.save();
    X.translate(s.x,s.y);
    X.scale(pulse,pulse);
    X.font='25px sans-serif';
    X.textAlign='center';
    X.fillText('⭐',0,9);
    X.restore();
  }
}

function drawMeteors(){
  for(const m of meteors){
    X.save();
    X.translate(m.x,m.y);

    X.shadowColor='#f97316';
    X.shadowBlur=9;

    X.fillStyle='#92400e';

    X.beginPath();
    X.arc(
      0,
      0,
      m.r,
      0,
      Math.PI*2
    );
    X.fill();

    X.fillStyle='#451a03';

    X.beginPath();
    X.arc(
      -m.r*.2,
      -m.r*.15,
      m.r*.25,
      0,
      Math.PI*2
    );
    X.fill();

    X.shadowBlur=0;
    X.restore();
  }
}

function drawShip(){
  if(!ship) return;

  const cx=
    ship.x+ship.w/2;

  const cy=
    ship.y+ship.h/2;

  X.save();
  X.translate(cx,cy);

  X.font='43px sans-serif';
  X.textAlign='center';
  X.textBaseline='middle';

  X.fillText('🚀',0,0);

  if(
    on &&
    keys.ArrowUp &&
    ship.fuel>0
  ){
    const flame=
      24+
      Math.random()*7;

    X.font=`${flame}px sans-serif`;
    X.fillText('🔥',0,34);
  }

  if(
    on &&
    keys.ArrowLeft &&
    ship.fuel>0
  ){
    X.font='15px sans-serif';
    X.fillText('💨',23,4);
  }

  if(
    on &&
    keys.ArrowRight &&
    ship.fuel>0
  ){
    X.font='15px sans-serif';
    X.fillText('💨',-23,4);
  }

  X.restore();
}

function drawParticles(){
  for(const p of particles){
    X.globalAlpha=p.life;
    X.fillStyle=p.color;

    X.beginPath();
    X.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );
    X.fill();
  }

  X.globalAlpha=1;
}

function draw(){
  X.clearRect(0,0,W,H);

  drawBackground();
  drawStars();
  drawMeteors();
  drawGround();
  drawPad();
  drawParticles();
  drawShip();
}

function finish(ok,reason=''){
  if(!on) return;

  on=false;

  if(ok){
    const fuelBonus=
      Math.round(ship.fuel*8);

    const speedBonus=
      Math.max(
        0,
        Math.round(
          500-
          Math.abs(ship.vy)*6-
          Math.abs(ship.vx)*5
        )
      );

    score+=
      800+
      fuelBonus+
      speedBonus;

    SE.textContent=score;

    let starsWon=1;

    if(
      ship.vy<=35 &&
      Math.abs(ship.vx)<=22
    ){
      starsWon=2;
    }

    if(
      ship.vy<=25 &&
      Math.abs(ship.vx)<=15 &&
      ship.fuel>=25
    ){
      starsWon=3;
    }

    const rating=
      '⭐'.repeat(starsWon)+
      '☆'.repeat(3-starsWon);

    document.querySelector('#ico')
      .textContent='🏆';

    document.querySelector('#title')
      .textContent='달 착륙 성공!';

    document.querySelector('#desc')
      .innerHTML=
      `${rating}<br><br>`+
      `수직속도 <b>${Math.round(ship.vy)}</b><br>`+
      `수평속도 <b>${Math.round(Math.abs(ship.vx))}</b><br>`+
      `남은 연료 <b>${Math.round(ship.fuel)}%</b><br>`+
      `최종 점수 <b>${score}점</b><br><br>`+
      `다음 스테이지에서는 운석이 더 많아집니다.`;

    document.querySelector('#start')
      .textContent='다음 스테이지';

    document.querySelector('#start')
      .onclick=()=>{
        stage++;
        start();
      };

    burst(
      ship.x+ship.w/2,
      ship.y,
      '#86efac',
      25
    );

  }else{

    document.querySelector('#ico')
      .textContent='💥';

    document.querySelector('#title')
      .textContent='착륙 실패';

    document.querySelector('#desc')
      .innerHTML=
      `${reason}<br><br>`+
      `수직속도 ${Math.round(ship.vy)}<br>`+
      `수평속도 ${Math.round(Math.abs(ship.vx))}<br>`+
      `남은 연료 ${Math.round(ship.fuel)}%<br><br>`+
      `🔥 엔진을 짧게 여러 번 사용하면<br>`+
      `더 안정적으로 착륙할 수 있습니다.`;

    document.querySelector('#start')
      .textContent='다시 착륙';

    document.querySelector('#start')
      .onclick=start;

    G.classList.remove('shake');
    void G.offsetWidth;
    G.classList.add('shake');
  }

  setTimeout(()=>{
    O.classList.remove('hide');
  },500);
}

function loop(t){
  if(!on) return;

  const dt=
    Math.min(
      .035,
      (t-last)/1000
    );

  last=t;

  update(dt);
  draw();

  if(on){
    requestAnimationFrame(loop);
  }
}

addEventListener(
  'keydown',
  e=>{
    if(e.key.startsWith('Arrow')){
      keys[e.key]=true;
      e.preventDefault();
    }
  }
);

addEventListener(
  'keyup',
  e=>{
    keys[e.key]=false;
  }
);

document
.querySelectorAll('.pad button')
.forEach(b=>{

  const k=b.dataset.k;

  b.onpointerdown=e=>{
    keys[k]=true;

    try{
      b.setPointerCapture(
        e.pointerId
      );
    }catch{}
  };

  const off=()=>{
    keys[k]=false;
  };

  b.onpointerup=off;
  b.onpointercancel=off;
  b.onpointerleave=off;
});

document
.querySelector('#start')
.onclick=start;

document
.querySelector('#levelBtn')
.onclick=()=>{
  difficulty=
    (difficulty+1)%3;

  document
  .querySelector('#levelBtn')
  .textContent=
    `난이도 : ${difficultyNames[difficulty]}`;
};

addEventListener(
  'resize',
  resize
);

resize();
})();
</script>
</body>
</html>
