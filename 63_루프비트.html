<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>루프 비트</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#312e81,#111827);color:#fff;font-family:system-ui,sans-serif}.app{max-width:900px;margin:auto;padding:16px;text-align:center}h1{margin:8px}.concept{color:#c4b5fd}.card{padding:16px;border:1px solid #ffffff33;border-radius:22px;background:#ffffff12;backdrop-filter:blur(8px)}.target,.track{min-height:76px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px;margin:12px 0;border-radius:16px;background:#111827}.beat{display:grid;place-items:center;width:50px;height:50px;border-radius:13px;background:#4f46e5;font-size:25px}.track .beat.active{outline:4px solid #facc15;transform:scale(1.12)}.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}button,select{min-height:44px;border:0;border-radius:12px;padding:8px 14px;font:800 16px system-ui}.add{background:#22d3ee}.loop{background:#a78bfa}.run{background:#22c55e}.gray{background:#e5e7eb}.code{margin:14px auto;max-width:560px;text-align:left}.block{display:flex;align-items:center;gap:8px;margin:7px;padding:10px;border-radius:12px;background:#4338ca}.block span{flex:1}.msg{min-height:48px;padding:12px;font-weight:800}.stats{display:flex;gap:10px;justify-content:center}.stats b{background:#ffffff18;padding:7px 13px;border-radius:99px}@media(max-width:520px){.app{padding:9px}.beat{width:42px;height:42px}.card{padding:10px}}
</style></head><body><main class="app"><h1>🎵 루프 비트</h1><p class="concept">오늘의 코딩 개념: 반복되는 패턴은 반복문으로 짧게 표현해요.</p><div class="stats"><b>LEVEL <span id="lv">1</span>/5</b><b>코드 제한 <span id="limit">3</span></b></div><section class="card"><h2>DJ가 원하는 리듬</h2><div class="target" id="target"></div><h2>나의 코드</h2><div class="controls"><button class="add" data-b="👏">👏 박수</button><button class="add" data-b="🥁">🥁 북</button><button class="add" data-b="🔔">🔔 벨</button><select id="count" aria-label="반복 횟수"><option>2</option><option>3</option><option>4</option></select><button class="loop" id="loop">🔁 마지막 패턴 반복</button></div><div class="code" id="code"></div><div class="controls"><button class="run" id="run">▶ 비트 실행</button><button class="gray" id="undo">↶ 취소</button><button class="gray" id="clear">↺ 초기화</button></div><div class="track" id="track">코드를 실행하면 비트가 연주돼요.</div><div class="msg" id="msg">반복 블록은 바로 앞의 비트 묶음을 다시 연주해요.</div></section></main><script>
const levels=[{p:['👏','👏','👏'],l:2},{p:['👏','🥁','👏','🥁'],l:3},{p:['🔔','👏','🔔','👏'],l:3},{p:['🥁','🥁','👏','🥁','🥁','👏'],l:4},{p:['👏','🔔','🥁','👏','🔔','🥁'],l:4}];let lv=0,code=[],running=false;const $=s=>document.querySelector(s),flat=()=>{let out=[];for(const b of code)b.t==='beat'?out.push(b.v):out.push(...Array.from({length:b.pattern-1},()=>b.seq).flat());return out};
function load(){code=[];let x=levels[lv];$('#lv').textContent=lv+1;$('#limit').textContent=x.l;$('#target').innerHTML=x.p.map(v=>`<i class="beat">${v}</i>`).join('');$('#msg').textContent='같은 부분을 찾아 짧은 코드로 만들어 보세요.';render()}
function render(){$('#code').innerHTML=code.length?code.map((b,i)=>`<div class="block"><span>${b.t==='beat'?b.v+' 비트':`🔁 [${b.seq.join(' ')}] ${b.pattern}번 반복`}</span><button data-i="${i}">×</button></div>`).join(''):'<div class="block"><span>블록을 추가하세요</span></div>'}
document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{if(code.length<levels[lv].l){code.push({t:'beat',v:b.dataset.b});render()}});$('#loop').onclick=()=>{if(code.length>=levels[lv].l)return;let beats=code.filter(x=>x.t==='beat').slice(-2).map(x=>x.v);if(!beats.length)return;code.push({t:'loop',seq:beats,pattern:+$('#count').value});render()};$('#code').onclick=e=>{if(e.target.dataset.i!==undefined){code.splice(+e.target.dataset.i,1);render()}};$('#undo').onclick=()=>{code.pop();render()};$('#clear').onclick=()=>{code=[];render()};
// 반복 블록을 실제 비트 배열로 펼쳐 연주
$('#run').onclick=async()=>{if(running)return;let song=flat();if(!song.length)return;running=true;$('#track').innerHTML=song.map(v=>`<i class="beat">${v}</i>`).join('');for(let i=0;i<song.length;i++){let els=$('#track').children;els[i].classList.add('active');await new Promise(r=>setTimeout(r,300));els[i].classList.remove('active')}let ok=JSON.stringify(song)===JSON.stringify(levels[lv].p)&&code.length<=levels[lv].l;$('#msg').textContent=ok?'✨ 루프 그루브 성공!':'🎧 리듬 또는 코드 블록 수를 확인해 보세요.';if(ok&&lv<4)setTimeout(()=>{lv++;load()},900);else if(ok)try{localStorage.setItem('loopBeatClear','5')}catch(e){};running=false};load();
</script></body></html>
