<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🐊 복불복 악어 이빨 뽑기!</title>

<style>
:root{
  --green:#4caf50;
  --green-dark:#216c35;
  --green-light:#7ed957;
  --mouth:#9f294f;
  --gum:#ef6684;
  --cream:#fff7de;
  --yellow:#ffd84d;
  --brown:#5b3526;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:
    "Arial Rounded MT Bold",
    "Pretendard",
    "Noto Sans KR",
    sans-serif;
  background:linear-gradient(#7fd8f4,#d9f8b3);
  overflow-x:hidden;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

button{
  font-family:inherit;
}

#game{
  position:relative;
  width:min(100vw,760px);
  min-height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 12%,rgba(255,255,255,.8) 0 3%,transparent 4%),
    radial-gradient(circle at 82% 18%,rgba(255,255,255,.65) 0 2.5%,transparent 3.5%),
    linear-gradient(#85dbf5 0 45%,#a7df68 45% 100%);
}

/* 배경 장식 */
#game::before,
#game::after{
  content:"";
  position:absolute;
  left:-10%;
  width:120%;
  height:180px;
  border-radius:50% 50% 0 0;
  pointer-events:none;
}

#game::before{
  bottom:110px;
  background:#72b64b;
}

#game::after{
  bottom:-10px;
  height:160px;
  background:#58a93f;
}

/* 상단 HUD */
#hud{
  position:relative;
  z-index:20;
  padding:12px;
}

.hudRow{
  display:flex;
  gap:8px;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}

.panel{
  background:rgba(255,255,255,.88);
  border:3px solid rgba(62,101,52,.32);
  box-shadow:0 4px 0 rgba(0,0,0,.12);
  border-radius:17px;
  padding:8px 12px;
  font-weight:900;
  color:#294332;
}

#turnBox{
  flex:1;
  text-align:center;
  font-size:clamp(18px,4vw,28px);
  background:#fff9c4;
}

#remainingBox{
  font-size:clamp(14px,3vw,18px);
}

#soundBtn{
  cursor:pointer;
  border:0;
  font-size:14px;
}

/* 대사 상자 */
#speech{
  position:relative;
  z-index:15;
  width:88%;
  margin:8px auto 0;
  min-height:55px;
  background:white;
  border:4px solid #3d753d;
  border-radius:24px;
  padding:12px 20px;
  text-align:center;
  font-size:clamp(16px,4vw,23px);
  font-weight:900;
  color:#3c3c3c;
  box-shadow:0 6px 0 rgba(0,0,0,.12);
}

#speech::after{
  content:"";
  position:absolute;
  bottom:-17px;
  left:50%;
  transform:translateX(-50%);
  border-left:16px solid transparent;
  border-right:16px solid transparent;
  border-top:18px solid #3d753d;
}

/* 악어 영역 */
#crocArea{
  position:relative;
  z-index:10;
  width:100%;
  height:min(68vh,620px);
  min-height:500px;
  display:flex;
  justify-content:center;
  align-items:center;
  padding-top:10px;
}

#crocodile{
  position:relative;
  width:min(94vw,650px);
  height:min(75vw,520px);
  max-height:520px;
  min-height:430px;
  animation:crocFloat 2.5s ease-in-out infinite;
}

@keyframes crocFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}

/* 눈 */
.eye{
  position:absolute;
  z-index:9;
  top:3%;
  width:19%;
  aspect-ratio:1/1;
  background:var(--green-light);
  border:7px solid var(--green-dark);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.eye.left{left:22%}
.eye.right{right:22%}

.eyeball{
  position:relative;
  width:70%;
  height:70%;
  background:#fff;
  border-radius:50%;
  border:4px solid #173f28;
  overflow:hidden;
  animation:blink 4.5s infinite;
}

@keyframes blink{
  0%,45%,49%,100%{transform:scaleY(1)}
  47%{transform:scaleY(.08)}
}

.pupil{
  position:absolute;
  width:34%;
  height:43%;
  border-radius:50%;
  background:#222;
  left:33%;
  top:30%;
}

.highlight{
  position:absolute;
  width:23%;
  height:23%;
  border-radius:50%;
  background:white;
  left:18%;
  top:14%;
}

/* 악어 머리 */
#head{
  position:absolute;
  width:82%;
  height:55%;
  left:9%;
  top:14%;
  background:linear-gradient(#6ed455,#46aa45);
  border:8px solid var(--green-dark);
  border-radius:48% 48% 42% 42%;
  box-shadow:inset 0 -15px 0 rgba(0,0,0,.08);
}

/* 코 */
.nostril{
  position:absolute;
  top:23%;
  width:6%;
  aspect-ratio:1;
  border-radius:50%;
  background:#265b32;
}

.nostril.left{left:40%}
.nostril.right{right:40%}

/* 볼 점 */
.cheek{
  position:absolute;
  width:11%;
  height:6%;
  border-radius:50%;
  background:rgba(255,164,147,.48);
  top:45%;
}
.cheek.left{left:9%}
.cheek.right{right:9%}

/* 입 전체 */
#mouthWrap{
  position:absolute;
  z-index:11;
  left:8%;
  top:34%;
  width:84%;
  height:62%;
  transform-origin:50% 55%;
}

#mouth{
  position:absolute;
  inset:0;
  background:var(--mouth);
  border:9px solid #265d32;
  border-radius:48% 48% 52% 52%;
  overflow:hidden;
  box-shadow:
    inset 0 0 0 12px rgba(94,9,39,.25),
    0 12px 0 rgba(0,0,0,.14);
  transition:height .15s ease,transform .15s ease;
}

#mouth::before{
  content:"";
  position:absolute;
  left:13%;
  right:13%;
  bottom:4%;
  height:38%;
  border-radius:50%;
  background:#d84266;
  box-shadow:inset 0 10px 0 rgba(255,255,255,.12);
}

/* 잇몸 */
.gumTop,
.gumBottom{
  position:absolute;
  z-index:2;
  left:8%;
  width:84%;
  height:18%;
  background:var(--gum);
  border-radius:50%;
}

.gumTop{top:-7%}
.gumBottom{bottom:-7%}

/* 이빨 영역 */
#teeth{
  position:absolute;
  inset:8% 7%;
  z-index:5;
}

/* 개별 이빨 */
.tooth{
  position:absolute;
  width:clamp(36px,7vw,56px);
  height:clamp(48px,9vw,68px);
  border:0;
  cursor:pointer;
  background:transparent;
  padding:0;
  transform-origin:50% 20%;
}

.toothShape{
  width:100%;
  height:100%;
  background:linear-gradient(#fff,#fff9e8);
  border:4px solid #cfc8b5;
  border-radius:45% 45% 34% 34%;
  box-shadow:
    inset 0 -7px 0 rgba(220,213,190,.32),
    0 4px 0 rgba(0,0,0,.18);
  position:relative;
  transition:.15s;
}

.toothShape::after{
  content:"";
  position:absolute;
  width:25%;
  height:20%;
  border-radius:50%;
  background:rgba(255,255,255,.95);
  left:17%;
  top:12%;
}

.tooth:hover .toothShape{
  animation:hoverWiggle .24s infinite alternate;
  filter:brightness(1.08);
}

@keyframes hoverWiggle{
  from{transform:rotate(-5deg) translateY(-2px)}
  to{transform:rotate(5deg) translateY(1px)}
}

.tooth.gold .toothShape{
  background:
    radial-gradient(circle at 30% 22%,#fff9a1,#ffd221 46%,#e8a800);
  border-color:#bf8600;
  box-shadow:
    0 0 16px #ffe647,
    inset 0 -7px 0 rgba(182,113,0,.18),
    0 4px 0 rgba(0,0,0,.18);
  animation:goldGlow .7s infinite alternate;
}

@keyframes goldGlow{
  from{filter:brightness(1)}
  to{filter:brightness(1.3)}
}

.tooth.pull .toothShape{
  animation:pullTooth .6s forwards;
}

@keyframes pullTooth{
  0%{transform:rotate(0) translateY(0) scale(1)}
  15%{transform:rotate(-10deg) translateY(-2px)}
  28%{transform:rotate(10deg) translateY(-3px)}
  40%{transform:rotate(-11deg) translateY(-5px)}
  55%{transform:rotate(7deg) translateY(-11px)}
  100%{
    opacity:0;
    transform:translateY(-80px) rotate(25deg) scale(.45);
  }
}

.tooth.bottom.pull .toothShape{
  animation:pullBottom .6s forwards;
}

@keyframes pullBottom{
  0%{transform:rotate(0) translateY(0)}
  20%{transform:rotate(-10deg)}
  35%{transform:rotate(10deg)}
  50%{transform:translateY(5px)}
  100%{
    opacity:0;
    transform:translateY(80px) rotate(-25deg) scale(.45);
  }
}

/* 안전하게 빠진 자리 */
.tooth.removed{
  pointer-events:none;
  visibility:hidden;
}

/* 전체 이빨 장난 */
#teeth.mischief .tooth:not(.removed){
  animation:allTeethShake .11s 8 alternate;
}

@keyframes allTeethShake{
  from{transform:translateX(-4px) rotate(-4deg)}
  to{transform:translateX(4px) rotate(4deg)}
}

/* 섞기 */
#teeth.shuffle .tooth:not(.removed){
  animation:shuffleTeeth .8s ease-in-out;
}

@keyframes shuffleTeeth{
  0%{transform:translate(0,0) rotate(0)}
  30%{transform:translate(calc(var(--randX) * 1px),calc(var(--randY) * 1px)) rotate(15deg)}
  65%{transform:translate(calc(var(--randX) * -.5px),calc(var(--randY) * -.5px)) rotate(-12deg)}
  100%{transform:translate(0,0)}
}

/* 긴장도 */
#game.medium::after{
  background:#4f873a;
}

#game.medium{
  box-shadow:inset 0 0 120px rgba(0,0,0,.26);
}

#game.danger{
  animation:dangerFrame .6s infinite alternate;
}

@keyframes dangerFrame{
  from{box-shadow:inset 0 0 30px rgba(255,0,0,.25)}
  to{box-shadow:inset 0 0 100px rgba(255,0,0,.82)}
}

#crocodile.nervous .pupil{
  transform:scaleY(.8);
}

#crocodile.angry .eye{
  animation:eyeShake .1s infinite alternate;
}

@keyframes eyeShake{
  from{transform:translateX(-3px) rotate(-2deg)}
  to{transform:translateX(3px) rotate(2deg)}
}

#crocodile.angry .eyeball{
  background:#fff1d5;
}

#crocodile.angry #head{
  filter:saturate(1.25);
}

/* 꽝 애니메이션 */
#crocodile.shocked .eye{
  transform:scale(1.25);
}

#crocodile.shocked .pupil{
  width:24%;
  height:50%;
}

#crocodile.bite{
  animation:biteShake .1s 6 alternate;
}

#crocodile.bite #mouthWrap{
  animation:closeMouth .42s cubic-bezier(.3,1.7,.5,1) forwards;
}

@keyframes closeMouth{
  0%{transform:scaleY(1)}
  70%{transform:scaleY(.12)}
  100%{transform:scaleY(.05)}
}

@keyframes biteShake{
  from{transform:translate(-8px,4px) rotate(-1deg)}
  to{transform:translate(8px,-4px) rotate(1deg)}
}

#game.screenShake{
  animation:screenShake .08s 8 alternate;
}

@keyframes screenShake{
  from{transform:translate(-7px,4px)}
  to{transform:translate(7px,-5px)}
}

/* 메시지 */
#centerMessage{
  position:absolute;
  z-index:80;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  width:95%;
  text-align:center;
  font-size:clamp(31px,8vw,65px);
  font-weight:1000;
  color:white;
  text-shadow:
    0 5px 0 #6a2e00,
    0 0 16px #ff9f1c;
  pointer-events:none;
  opacity:0;
}

#centerMessage.pop{
  animation:popMsg 1.1s ease forwards;
}

@keyframes popMsg{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-70%) scale(1)}
}

#heartbeat{
  position:absolute;
  z-index:60;
  top:23%;
  left:50%;
  transform:translateX(-50%);
  color:#ff3454;
  font-size:clamp(25px,6vw,42px);
  font-weight:1000;
  text-shadow:0 3px white;
  opacity:0;
  pointer-events:none;
}

#heartbeat.show{
  animation:heartBeat .8s ease;
}

@keyframes heartBeat{
  0%{opacity:0;transform:translateX(-50%) scale(.7)}
  25%{opacity:1;transform:translateX(-50%) scale(1.3)}
  50%{transform:translateX(-50%) scale(.9)}
  75%{transform:translateX(-50%) scale(1.2)}
  100%{opacity:0}
}

/* 오버레이 */
.overlay{
  position:absolute;
  inset:0;
  z-index:200;
  padding:25px 18px;
  background:
    linear-gradient(rgba(64,143,88,.88),rgba(24,80,53,.94));
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
}

.overlay.hidden{
  display:none;
}

.title{
  font-size:clamp(37px,9vw,70px);
  line-height:1.08;
  font-weight:1000;
  text-shadow:
    0 5px 0 #1b562e,
    0 0 12px rgba(255,255,255,.25);
  margin-bottom:15px;
  animation:titleBounce 1.5s infinite ease-in-out;
}

@keyframes titleBounce{
  0%,100%{transform:rotate(-1deg) translateY(0)}
  50%{transform:rotate(1deg) translateY(-8px)}
}

.subtitle{
  font-size:clamp(17px,4vw,25px);
  font-weight:900;
  margin-bottom:22px;
  color:#fff8bc;
}

.selectBox{
  width:min(90%,470px);
  background:rgba(255,255,255,.15);
  border:3px solid rgba(255,255,255,.35);
  padding:18px;
  border-radius:24px;
  margin-bottom:18px;
}

.selectTitle{
  font-size:20px;
  margin-bottom:12px;
  font-weight:900;
}

.playerButtons{
  display:flex;
  gap:7px;
  justify-content:center;
  flex-wrap:wrap;
}

.countBtn{
  border:3px solid white;
  border-radius:14px;
  background:#60b952;
  color:white;
  width:52px;
  height:48px;
  font-size:20px;
  font-weight:1000;
  cursor:pointer;
}

.countBtn.selected{
  background:#ffd946;
  color:#503900;
  transform:scale(1.1);
  box-shadow:0 4px 0 #b67c00;
}

.mainBtn{
  border:0;
  cursor:pointer;
  border-radius:25px;
  background:linear-gradient(#ffe86e,#ffac2d);
  color:#5b3500;
  font-size:clamp(23px,5vw,34px);
  font-weight:1000;
  padding:16px 30px;
  box-shadow:0 7px 0 #b95c00,0 11px 18px rgba(0,0,0,.3);
}

.mainBtn:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #b95c00;
}

.smallBtn{
  border:2px solid rgba(255,255,255,.8);
  color:white;
  background:rgba(0,0,0,.25);
  border-radius:15px;
  padding:8px 13px;
  cursor:pointer;
  margin-top:12px;
}

#recordStart{
  margin-top:17px;
  background:rgba(0,0,0,.17);
  padding:10px 18px;
  border-radius:18px;
  line-height:1.55;
  max-width:470px;
}

.gameOverTitle{
  font-size:clamp(38px,9vw,68px);
  font-weight:1000;
  color:#ffea69;
  text-shadow:0 6px 0 #68180c,0 0 18px red;
}

#loserText{
  font-size:clamp(21px,5vw,34px);
  font-weight:1000;
  margin:12px 0;
}

.result{
  width:min(92%,470px);
  background:rgba(0,0,0,.27);
  border:3px solid rgba(255,255,255,.36);
  border-radius:22px;
  padding:16px;
  font-size:clamp(16px,4vw,21px);
  line-height:1.75;
  margin-bottom:16px;
}

/* 하단 잔디 장식 */
.grass{
  position:absolute;
  z-index:4;
  bottom:0;
  left:0;
  width:100%;
  height:100px;
  pointer-events:none;
  overflow:hidden;
}

.grass span{
  position:absolute;
  bottom:-10px;
  font-size:50px;
}

/* 모바일 */
@media(max-width:520px){
  #crocArea{
    min-height:440px;
    height:61vh;
  }

  #crocodile{
    min-height:400px;
    transform:scale(.96);
  }

  .tooth{
    width:42px;
    height:53px;
  }

  #speech{
    min-height:48px;
    padding:9px 15px;
  }

  #hud{
    padding:7px;
  }

  .panel{
    padding:6px 8px;
  }
}
</style>
</head>

<body>
<div id="game">

  <div id="hud">
    <div class="hudRow">
      <div class="panel" id="remainingBox">🦷 남은 이빨 : 0</div>
      <div class="panel" id="turnBox">👉 PLAYER 1 차례!</div>
      <button class="panel" id="soundBtn">🔊 소리 ON</button>
    </div>
  </div>

  <div id="speech">🐊 오늘은 누가 걸릴까~?</div>

  <div id="heartbeat"></div>
  <div id="centerMessage"></div>

  <main id="crocArea">
    <div id="crocodile">

      <div class="eye left">
        <div class="eyeball">
          <div class="pupil"></div>
          <div class="highlight"></div>
        </div>
      </div>

      <div class="eye right">
        <div class="eyeball">
          <div class="pupil"></div>
          <div class="highlight"></div>
        </div>
      </div>

      <div id="head">
        <div class="nostril left"></div>
        <div class="nostril right"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
      </div>

      <div id="mouthWrap">
        <div id="mouth">
          <div class="gumTop"></div>
          <div class="gumBottom"></div>
          <div id="teeth"></div>
        </div>
      </div>

    </div>
  </main>

  <div class="grass">
    <span style="left:2%">🌿</span>
    <span style="left:15%">🌱</span>
    <span style="left:29%">🌿</span>
    <span style="left:48%">🌱</span>
    <span style="left:70%">🌿</span>
    <span style="left:88%">🌱</span>
  </div>

  <!-- 시작 화면 -->
  <section id="startScreen" class="overlay">
    <div class="title">
      🐊 복불복<br>
      악어 이빨 뽑기! 🦷
    </div>

    <div class="subtitle">
      꽝 이빨을 피해서 살아남아라!
    </div>

    <div class="selectBox">
      <div class="selectTitle">👤 플레이 인원</div>

      <div class="playerButtons">
        <button class="countBtn selected" data-count="2">2</button>
        <button class="countBtn" data-count="3">3</button>
        <button class="countBtn" data-count="4">4</button>
        <button class="countBtn" data-count="5">5</button>
        <button class="countBtn" data-count="6">6</button>
      </div>
    </div>

    <button id="startBtn" class="mainBtn">
      🎮 게임 시작
    </button>

    <div id="recordStart"></div>

    <button id="resetRecordStart" class="smallBtn">
      🧹 기록 초기화
    </button>
  </section>

  <!-- 게임 오버 -->
  <section id="gameOverScreen" class="overlay hidden">

    <div class="gameOverTitle">
      🐊💥 꽝!!!
    </div>

    <div id="loserText">
      😂 PLAYER 1 당첨!
    </div>

    <div class="result">
      🦷 뽑은 이빨 :
      <b id="resultPulled">0</b>개<br>

      👥 참가자 :
      <b id="resultPlayers">2</b>명<br>

      🍀 마지막까지 살아남을 확률 :
      <b id="resultChance">50</b>%<br><br>

      <div id="recordResult"></div>
    </div>

    <button id="restartBtn" class="mainBtn">
      🔄 한 판 더!
    </button>

    <button id="resetRecordOver" class="smallBtn">
      🧹 기록 초기화
    </button>

  </section>

</div>

<script>
/* ======================================================
   DOM
====================================================== */

const game = document.getElementById("game");
const crocodile = document.getElementById("crocodile");
const teethBox = document.getElementById("teeth");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");

const turnBox = document.getElementById("turnBox");
const remainingBox = document.getElementById("remainingBox");
const speech = document.getElementById("speech");

const soundBtn = document.getElementById("soundBtn");

const centerMessage = document.getElementById("centerMessage");
const heartbeat = document.getElementById("heartbeat");

const loserText = document.getElementById("loserText");
const resultPulled = document.getElementById("resultPulled");
const resultPlayers = document.getElementById("resultPlayers");
const resultChance = document.getElementById("resultChance");

const recordStart = document.getElementById("recordStart");
const recordResult = document.getElementById("recordResult");

const resetRecordStart = document.getElementById("resetRecordStart");

/* ======================================================
   게임 상태
====================================================== */

let playerCount = 2;

let remainingTeeth = 14;

let bombToothId = null;
let goldToothId = null;

let teethData = [];

let gameRunning = false;
let inputLocked = false;

let pulledCount = 0;

let tensionTimer = null;
let heartbeatTimer = null;

let soundOn = true;


/* ======================================================
   기록
====================================================== */

let records = JSON.parse(
  localStorage.getItem("crocodileGameRecords") || "{}"
);

function ensureRecords(){
  for(let i=1;i<=6;i++){
    const key = `PLAYER ${i}`;
    if(records[key] === undefined){
      records[key] = 0;
    }
  }
}

ensureRecords();


function saveRecords(){
  localStorage.setItem(
    "crocodileGameRecords",
    JSON.stringify(records)
  );
}


function getRecordHTML(count){

  let minimum = Infinity;

  for(let i=1;i<=count;i++){
    minimum = Math.min(
      minimum,
      records[`PLAYER ${i}`] || 0
    );
  }

  let html =
    "<b>🏆 오늘의 복불복 기록</b><br>";

  for(let i=1;i<=count;i++){

    const value =
      records[`PLAYER ${i}`] || 0;

    const crown =
      value === minimum ? " 👑" : "";

    html +=
      `PLAYER ${i} 😭 ${value}회${crown}<br>`;
  }

  return html;
}


function updateRecordsUI(){

  recordStart.innerHTML =
    getRecordHTML(playerCount);

  recordResult.innerHTML =
    getRecordHTML(playerCount);
}


/* ======================================================
   인원 선택
====================================================== */

document.querySelectorAll(".countBtn")
.forEach(btn=>{

  btn.addEventListener("click",()=>{

    playerCount =
      Number(btn.dataset.count);

    document.querySelectorAll(".countBtn")
    .forEach(b=>b.classList.remove("selected"));

    btn.classList.add("selected");

    updateRecordsUI();
  });

updateRecordsUI();


/* ======================================================
   효과음
====================================================== */

let audioContext = null;

function getAudio(){

  if(!soundOn) return null;

  if(!audioContext){

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }

  if(audioContext.state === "suspended"){
    audioContext.resume();
  }

  return audioContext;
}


function tone(
  frequency,
  duration=.1,
  type="sine",
  volume=.05,
  endFrequency=null
){

  const ac = getAudio();

  if(!ac) return;

  const osc =
    ac.createOscillator();

  const gain =
    ac.createGain();

  osc.type = type;

  osc.frequency.setValueAtTime(
    frequency,
    ac.currentTime
  );

  if(endFrequency){
    osc.frequency.exponentialRampToValueAtTime(
      endFrequency,
      ac.currentTime + duration
    );
  }

  gain.gain.setValueAtTime(
    volume,
    ac.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    ac.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(ac.destination);

  osc.start();
  osc.stop(
    ac.currentTime + duration
  );
}


/* 이빨 흔들기 */
function soundWiggle(){
  tone(260,.06,"square",.025,340);
}


/* 이빨 빠짐 */
function soundPull(){

  tone(520,.08,"triangle",.045,820);

  setTimeout(()=>{

  },55);
}


/* 안전 */

  setTimeout(()=>{

}

  },80);

  setTimeout(()=>{
    tone(1200,.15,"square",.035,1600);
  },160);
}


/* 심장 */
function soundHeartbeat(){

  tone(100,.08,"sine",.06,75);

  setTimeout(()=>{
    tone(90,.08,"sine",.05,70);

}


/* 쾅 */
function soundBite(){

  tone(110,.3,"sawtooth",.14,45);

  setTimeout(()=>{

  },100);
}


/* 꽝 */
function soundFail(){

  tone(390,.16,"sawtooth",.065,230);

  setTimeout(()=>{
    tone(230,.22,"sawtooth",.075,120);
  },140);

  setTimeout(()=>{
    tone(120,.35,"sawtooth",.09,50);
  },300);

soundBtn.addEventListener("click",()=>{

/* ======================================================

====================================================== */

function showCenter(text,duration=1100){

  centerMessage.classList.remove("pop");

  void centerMessage.offsetWidth;

  centerMessage.textContent = text;
  centerMessage.classList.add("pop");

  setTimeout(()=>{
    centerMessage.classList.remove("pop");
  },duration);
}


function showHeartbeat(text){

  heartbeat.classList.remove("show");

  void heartbeat.offsetWidth;

  heartbeat.textContent = text;

  heartbeat.classList.add("show");
}

====================================================== */

const crocMessages = [

  "거긴 아닌 것 같은데~ 🐊",
  "나는 아무것도 모른다~ 😗",

];

function randomFrom(array){
  return array[
    Math.floor(Math.random()*array.length)
  ];
}


/* ======================================================
   게임 시작
====================================================== */

function startGame(){

  getAudio();

  clearTimers();

  gameRunning = true;
  inputLocked = false;

  currentPlayer = 0;
  pulledCount = 0;

  totalTeeth =
    Math.floor(Math.random()*5)+12;

  remainingTeeth =
    totalTeeth;

  crocodile.className = "";

  game.classList.remove(
    "medium",
    "danger",
    "screenShake"
  );

  teethBox.className = "";

  startScreen.classList.add("hidden");
  gameOverScreen.classList.add("hidden");

  createTeeth();

  updateHUD();

  speech.textContent =
    "과연 누가 악어에게 물릴까요? 😈";

  showCenter(
    "🐊 게임 시작!"
  );
}


/* ======================================================
   이빨 만들기
====================================================== */

function createTeeth(){

  teethBox.innerHTML = "";
  teethData = [];

  /*
    위쪽과 아래쪽 이빨을 반반 배치한다.
  */

  const topCount =
    Math.ceil(totalTeeth/2);

  const bottomCount =
    totalTeeth-topCount;

  let id = 0;


  for(let i=0;i<topCount;i++){

    const position =
      calculatePosition(
        i,
        topCount,
        "top"
      );

    teethData.push(
      createToothData(
        id++,
        position,
        "top"
      )
    );
  }


  for(let i=0;i<bottomCount;i++){

    const position =
      calculatePosition(
        i,
        bottomCount,
        "bottom"
      );

    teethData.push(
      createToothData(
        id++,
        position,
        "bottom"
      )
    );
  }


  /* 꽝 하나 지정 */
  bombToothId =
    teethData[
      Math.floor(
        Math.random()*
        teethData.length
      )
    ].id;


  /*
    일정 확률로 황금 이빨 생성.
    꽝과 겹치지 않는다.
  */
  goldToothId = null;

  if(Math.random() < .55){

    const candidates =
      teethData.filter(
        t=>t.id !== bombToothId
      );

    goldToothId =
      randomFrom(candidates).id;
  }


  teethData.forEach(
    renderTooth
  );
}


function createToothData(id,position,row){

  return {
    id,
    row,
    x:position.x,
    y:position.y,
    removed:false
  };
}


/*
  악어 입 안에 부채꼴 느낌으로 이빨 배치
*/
function calculatePosition(index,count,row){

  const percent =
    count === 1
    ? .5
    : index/(count-1);

  let x =
    11 + percent*78;

  const centerDistance =
    Math.abs(percent-.5)*2;

  let y;

  if(row === "top"){
    y =
      7 +
      centerDistance*8;
  }else{
    y =
      66 -
      centerDistance*6;
  }

  return{x,y};
}


/* 실제 버튼 생성 */
function renderTooth(data){

  const btn =
    document.createElement("button");

  btn.className =
    "tooth " +
    (
      data.row === "bottom"
      ? "bottom"
      : "top"
    );

  btn.dataset.id = data.id;

  btn.style.left =
    `${data.x}%`;

  btn.style.top =
    `${data.y}%`;

  btn.style.transform =
    "translateX(-50%)";

  btn.style.setProperty(
    "--randX",
    Math.floor(Math.random()*100-50)
  );

  btn.style.setProperty(
    "--randY",
    Math.floor(Math.random()*70-35)
  );


  const shape =
    document.createElement("div");

  shape.className =
    "toothShape";


  if(data.id === goldToothId){
    btn.classList.add("gold");
  }


  btn.appendChild(shape);


  btn.addEventListener(
    "pointerdown",
    ()=>{

      if(
        !gameRunning ||
        inputLocked ||
        data.removed
      ){
        return;
      }

      soundWiggle();
    }
  );


  btn.addEventListener(
    "click",
    ()=>handleToothClick(
      data,
      btn
    )
  );


  teethBox.appendChild(btn);
}


/* ======================================================
   이빨 클릭
====================================================== */

function handleToothClick(data,element){

  if(
    !gameRunning ||
    inputLocked ||
    data.removed
  ){
    return;
  }


  inputLocked = true;


  /*
    먼저 악어가 괜히 겁을 준다.
  */
  speech.textContent =
    randomFrom(crocMessages);


  soundWiggle();


  element.classList.add("pull");


  setTimeout(()=>{
    soundPull();
  },250);


  const isBomb =
    data.id === bombToothId;

  const isGold =
    data.id === goldToothId;


  setTimeout(()=>{

    data.removed = true;

    element.classList.add("removed");

    remainingTeeth--;
    pulledCount++;

    updateHUD();


    if(isBomb){

      triggerBomb();

      return;
    }


    if(isGold){

      showCenter(
        "✨ 행운의 황금 이빨! ✨"
      );

      speech.textContent =
        "오오! 그 이빨은 무조건 안전했어! 👑";

      soundGold();

    }else{

      const message =
        randomFrom(safeMessages);

      showCenter(message);

      speech.textContent =
        message;

      soundSafe();
    }


    updateTension();


    /*
      게임이 아직 살아 있으면
      다음 플레이어로 넘어간다.
    */

    setTimeout(()=>{

      if(!gameRunning) return;

      currentPlayer =
        (currentPlayer+1) %
        playerCount;

      updateHUD();


      maybeSpecialEvent();

    },650);


  },600);
}


/* ======================================================
   꽝
====================================================== */

function triggerBomb(){

  gameRunning = false;

  crocodile.classList.add(
    "shocked"
  );

  speech.textContent =
    "......";


  showCenter(
    "😳 어...?"
  );


  setTimeout(()=>{

    crocodile.classList.remove(
      "shocked"
    );

    crocodile.classList.add(
      "bite"
    );

    game.classList.add(
      "screenShake"
    );

    soundBite();

    showCenter(
      "🐊💥 쾅!!!"
    );


    setTimeout(()=>{

      soundFail();

      showCenter(
        "💀 꽝!!!"
      );

    },400);


    setTimeout(()=>{

      endGame();

    },1250);

  },550);
}


/* ======================================================
   게임 종료
====================================================== */

function endGame(){

  clearTimers();

  const loser =
    currentPlayer + 1;

  const key =
    `PLAYER ${loser}`;

  records[key] =
    (records[key] || 0)+1;

  saveRecords();


  loserText.textContent =
    `😂 PLAYER ${loser} 악어에게 물렸습니다!`;

  resultPulled.textContent =
    pulledCount;

  resultPlayers.textContent =
    playerCount;

  /*
    단순 재미용 확률 표시
  */
  resultChance.textContent =
    Math.round(
      100/playerCount
    );


  updateRecordsUI();


  gameOverScreen.classList.remove(
    "hidden"
  );
}


/* ======================================================
   HUD
====================================================== */

function updateHUD(){

  turnBox.textContent =
    `👉 PLAYER ${currentPlayer+1} 차례!`;

  remainingBox.textContent =
    `🦷 남은 이빨 : ${remainingTeeth}`;
}


/* ======================================================
   긴장도 시스템
====================================================== */

function updateTension(){

  const ratio =
    remainingTeeth /
    totalTeeth;


  crocodile.classList.remove(
    "nervous",
    "angry"
  );


  if(ratio <= .5){

    game.classList.add(
      "medium"
    );

    crocodile.classList.add(
      "nervous"
    );
  }


  if(remainingTeeth <= 3){

    game.classList.add(
      "danger"
    );

    crocodile.classList.add(
      "angry"
    );

    startHeartbeatLoop(true);
  }
  else if(ratio <= .5){

    startHeartbeatLoop(false);
  }


  if(remainingTeeth === 2){

    showCenter(
      "🚨 둘 중 하나다!!! 🚨"
    );

    speech.textContent =
      "으하하... 이제 둘 중 하나야! 😈";
  }
}


/* ======================================================
   두근두근
====================================================== */

function startHeartbeatLoop(fast){

  if(heartbeatTimer){
    clearInterval(heartbeatTimer);
  }

  const delay =
    fast ? 1250 : 2600;

  heartbeatTimer =
    setInterval(()=>{

      if(!gameRunning){
        return;
      }

      if(fast){

        showHeartbeat(
          "두근! 두근! 💓💓"
        );

      }else{

        showHeartbeat(
          "두근... 💓"
        );
      }

      soundHeartbeat();

    },delay);
}


/* ======================================================
   특별 이벤트
====================================================== */

function maybeSpecialEvent(){

  if(
    remainingTeeth <= 2 ||
    !gameRunning
  ){

    inputLocked = false;

    return;
  }


  const rand =
    Math.random();


  /*
    약 20% 악어 장난
  */
  if(rand < .20){

    crocodileMischief();

    return;
  }


  /*
    약 8% 자리 바꾸기
  */
  if(rand < .28){

    shuffleTeeth();

    return;
  }


  inputLocked = false;
}


/* 악어의 장난 */
function crocodileMischief(){

  inputLocked = true;

  speech.textContent =
    "어디가 꽝이게~? 😜";

  showCenter(
    "😈 악어의 장난!"
  );

  teethBox.classList.add(
    "mischief"
  );

  soundWiggle();

  setTimeout(()=>{

    teethBox.classList.remove(
      "mischief"
    );

    inputLocked = false;

  },1000);
}


/* 자리 바꾸기 */
function shuffleTeeth(){

  inputLocked = true;

  speech.textContent =
    "으하하! 이빨 자리를 바꿔버리지! 🐊";

  showCenter(
    "🔀 악어가 이빨을 섞었다!"
  );

  teethBox.classList.add(
    "shuffle"
  );


  /*
    남은 이빨 중 꽝 위치를 실제로 변경한다.
  */
  const remaining =
    teethData.filter(
      t=>!t.removed
    );


  if(remaining.length > 1){

    /*
      황금 이빨은 꽝이 되면 안 된다.
    */
    const possibleBombs =
      remaining.filter(
        t=>t.id !== goldToothId
      );


    if(possibleBombs.length){

      bombToothId =
        randomFrom(
          possibleBombs
        ).id;
    }
  }


  /*
    남은 이빨의 위치 자체도 섞는다.
  */

  const positions =
    remaining.map(
      t=>({
        x:t.x,
        y:t.y,
        row:t.row
      })
    );


  shuffleArray(
    positions
  );


  remaining.forEach(
    (tooth,index)=>{

      tooth.x =
        positions[index].x;

      tooth.y =
        positions[index].y;

      tooth.row =
        positions[index].row;


      const el =
        teethBox.querySelector(
          `[data-id="${tooth.id}"]`
        );


      if(el){

        el.style.left =
          `${tooth.x}%`;

        el.style.top =
          `${tooth.y}%`;

        el.classList.toggle(
          "bottom",
          tooth.row === "bottom"
        );
      }
    }
  );


  setTimeout(()=>{

    teethBox.classList.remove(
      "shuffle"
    );

    inputLocked = false;

  },950);
}


function shuffleArray(arr){

  for(
    let i=arr.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [
      arr[i],
      arr[j]
    ] =
    [
      arr[j],
      arr[i]
    ];
  }
}


/* ======================================================
   기록 초기화
====================================================== */

function resetRecords(){

  records = {};

  ensureRecords();

  saveRecords();

  updateRecordsUI();

  showCenter(
    "🧹 기록 초기화!"
  );
}


resetRecordStart.addEventListener(
  "click",
  resetRecords
);

resetRecordOver.addEventListener(
  "click",
  resetRecords
);


/* ======================================================
   타이머 정리
====================================================== */

function clearTimers(){

  if(tensionTimer){
    clearTimeout(tensionTimer);
  }

  if(heartbeatTimer){

    clearInterval(
      heartbeatTimer
    );

    heartbeatTimer = null;
  }
}


/* ======================================================
   버튼
====================================================== */

startBtn.addEventListener(
  "click",
  startGame
);

restartBtn.addEventListener(
  "click",
  startGame
);


/* ======================================================
   requestAnimationFrame
   악어 눈동자가 마우스/터치 방향을 살짝 바라본다.
====================================================== */

let pointerX =
  window.innerWidth/2;

let pointerY =
  window.innerHeight/2;


window.addEventListener(
  "pointermove",
  e=>{

    pointerX = e.clientX;
    pointerY = e.clientY;
  }
);


function animate(){

  const rect =
    crocodile.getBoundingClientRect();

  const centerX =
    rect.left +
    rect.width/2;

  const centerY =
    rect.top +
    rect.height*.25;

  let dx =
    (pointerX-centerX) /
    Math.max(
      1,
      window.innerWidth
    );

  let dy =
    (pointerY-centerY) /
    Math.max(
      1,
      window.innerHeight
    );


  dx =
    Math.max(
      -.12,
      Math.min(
        .12,
        dx
      )
    );

  dy =
    Math.max(
      -.10,
      Math.min(
        .10,
        dy
      )
    );


  document.querySelectorAll(
    ".pupil"
  )
  .forEach(pupil=>{

    pupil.style.transform =
      `translate(${dx*55}px,${dy*45}px)`;

  });


  requestAnimationFrame(
    animate
  );
}

requestAnimationFrame(
  animate
);


/* 초기 표시 */
updateRecordsUI();

</script>
