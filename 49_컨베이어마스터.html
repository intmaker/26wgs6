<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"><title>🏭 컨베이어 마스터</title><style>
:root{--c1:#334155;--c2:#fbbf24}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;display:grid;place-items:center;color:#f8fafc;font-family:system-ui,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 18% 10%,var(--c1),#11162e 52%,#030712);user-select:none;-webkit-user-select:none}.app{width:min(95vw,720px);height:min(95vh,860px);display:flex;flex-direction:column;gap:11px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:2px 4px}.brand small{display:block;color:#cbd5e1;font-size:10px;font-weight:900;letter-spacing:.2em}.brand h1{margin:2px 0 0;font-size:clamp(25px,5vw,38px);letter-spacing:-.05em}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:67px;padding:7px 10px;text-align:center;border:1px solid #ffffff25;border-radius:14px;background:#0f172ac7}.stat small{display:block;color:#cbd5e1;font-size:9px}.stat b{font-size:19px}.stage{position:relative;flex:1;min-height:400px;overflow:hidden;border:1px solid #ffffff27;border-radius:25px;background:linear-gradient(145deg,#14203b,#090e21);box-shadow:0 25px 70px #0009;touch-action:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#050916e9}.overlay.hide{display:none}.card{width:min(100%,410px);padding:28px 24px;text-align:center;border:1px solid #ffffff25;border-radius:23px;background:#111a36ee;box-shadow:0 20px 55px #0008}.card .emoji{font-size:55px}.card h2{margin:8px;font-size:28px}.card p{margin:0 0 19px;color:#cbd5e1;font-size:14px;line-height:1.72;word-break:keep-all}.primary{min-height:48px;width:100%;padding:12px 18px;border:0;border-radius:13px;color:#08111f;background:linear-gradient(135deg,var(--c2),#fef3c7);font:900 15px system-ui;cursor:pointer}.tip{min-height:18px;text-align:center;color:#aebbd0;font-size:12px}.hidden{display:none!important}button{font-family:inherit}.factory{height:100%;position:relative;display:flex;flex-direction:column;padding:16px;background:linear-gradient(#263445,#111827)}.belt{position:relative;flex:1;overflow:hidden;border:5px solid #475569;border-radius:18px;background:repeating-linear-gradient(90deg,#1f2937 0 36px,#374151 36px 72px);box-shadow:inset 0 0 30px #0008}.belt::after{content:"";position:absolute;inset:auto 0 8px;height:10px;background:repeating-linear-gradient(90deg,#94a3b8 0 18px,#334155 18px 36px)}.part{position:absolute;width:62px;height:62px;display:grid;place-items:center;border:3px solid #fff8;border-radius:15px;color:#fff;font-size:38px;font-weight:900;cursor:grab;box-shadow:0 8px 16px #0007;transition:transform .15s}.part.selected{outline:5px solid #fde047;transform:scale(1.12)}.bins{height:100px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding-top:10px}.bin{min-height:70px;border:2px solid #ffffff25;border-radius:15px;color:#fff;background:#ffffff0d;font-size:30px;font-weight:900;cursor:pointer}.bin:nth-child(1){color:#67e8f9}.bin:nth-child(2){color:#f9a8d4}.bin:nth-child(3){color:#fde047}.bin small{display:block;font-size:11px;color:#cbd5e1}.factory-msg{text-align:center;min-height:22px;color:#cbd5e1;font-weight:800}
@media(max-width:520px){.app{width:100%;height:100%;padding:9px}.stage{min-height:0;border-radius:20px}.brand h1{font-size:25px}.stat{min-width:61px;padding:6px 8px}.card{padding:24px 19px}.tip{font-size:11px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><small>SMART FACTORY</small><h1>🏭 컨베이어 마스터</h1></div><div class="hud" id="hud"></div></header><section class="stage" id="stage"><div class="factory"><div class="belt" id="belt"></div><div class="bins"><button class="bin" data-type="circle">●<small>원형</small></button><button class="bin" data-type="square">■<small>사각</small></button><button class="bin" data-type="triangle">▲<small>삼각</small></button></div><div class="factory-msg" id="message">부품을 선택한 뒤 같은 모양 상자를 누르세요.</div></div><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="resultEmoji">🏭</div><h2 id="resultTitle">컨베이어 마스터</h2><p id="resultText">움직이는 부품을 선택해 모양에 맞는 상자로 빠르게 분류하세요.</p><button class="primary" id="startBtn">게임 시작</button></div></div></section><div class="tip">움직이는 부품을 선택해 모양에 맞는 상자로 빠르게 분류하세요.</div></main><script>
const $=s=>document.querySelector(s),stage=$('#stage'),overlay=$('#overlay'),startBtn=$('#startBtn');
const safeGet=(k,d=0)=>{try{return Number(localStorage.getItem(k))||d}catch(e){return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function showResult(icon,title,text,button='다시 하기'){ $('#resultEmoji').textContent=icon;$('#resultTitle').textContent=title;$('#resultText').innerHTML=text;startBtn.textContent=button;overlay.classList.remove('hide') }
const belt=$('#belt'),message=$('#message'),hud=$('#hud');let parts=[],selected=null,running=false,last=0,elapsed=0,nextSpawn=0,score=0,lives=3,combo=0,raf;const types=[['circle','●','#06b6d4'],['square','■','#ec4899'],['triangle','▲','#eab308']];hud.innerHTML='<div class="stat"><small>점수</small><b id="score">0</b></div><div class="stat"><small>콤보</small><b id="combo">0</b></div><div class="stat"><small>목숨</small><b id="lives">3</b></div>';
function startGame(){parts=[];selected=null;running=true;elapsed=0;nextSpawn=.3;score=0;lives=3;combo=0;belt.innerHTML='';updateHud();overlay.classList.add('hide');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function updateHud(){$('#score').textContent=score;$('#combo').textContent=combo;$('#lives').textContent=lives}
function spawnPart(){const [type,symbol,color]=types[Math.floor(Math.random()*types.length)],el=document.createElement('button'),y=25+Math.random()*Math.max(20,belt.clientHeight-115),p={type,symbol,color,x:-70,y,speed:80+elapsed*2.2,el};el.className='part';el.textContent=symbol;el.style.background=color;el.onclick=()=>selectPart(p);belt.appendChild(el);parts.push(p)}function selectPart(p){if(!running)return;if(selected)selected.el.classList.remove('selected');selected=p;p.el.classList.add('selected');message.textContent=`${p.symbol} 부품을 어느 상자에 넣을까요?`}
function sort(type){if(!running||!selected)return;const p=selected;selected=null;if(p.type===type){combo++;score+=10+Math.min(50,combo*2);message.textContent=`정확한 분류! ${combo} 콤보`;removePart(p)}else{combo=0;lives--;message.textContent='잘못된 상자입니다!';p.el.classList.remove('selected');updateHud();if(lives<=0)endGame()}updateHud()}
function removePart(p){p.el.remove();parts=parts.filter(x=>x!==p)}function update(dt){elapsed+=dt;if(elapsed>nextSpawn){nextSpawn=elapsed+Math.max(.45,1.25-elapsed*.009);spawnPart()}for(const p of[...parts]){p.x+=p.speed*dt;p.el.style.transform=`translate(${p.x}px,${p.y}px)`;if(p.x>belt.clientWidth){if(selected===p)selected=null;removePart(p);combo=0;lives--;message.textContent='부품이 컨베이어 끝으로 떨어졌어요!';updateHud();if(lives<=0)endGame()}}}
function loop(t){if(!running)return;const dt=Math.min(.035,(t-last)/1000);last=t;update(dt);raf=requestAnimationFrame(loop)}function endGame(){if(!running)return;running=false;cancelAnimationFrame(raf);showResult(score>=250?'🏆':'🏭','공장 운영 종료',`최종 점수 ${score}점 · 최고 콤보 ${combo}<br>빠르게 선택하되 모양을 확인하고 분류하세요.`)}document.querySelectorAll('.bin').forEach(b=>b.onclick=()=>sort(b.dataset.type));startBtn.onclick=startGame;
</script></body></html>
